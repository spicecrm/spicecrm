<div class="slds-p-around--x-small">
    <div class="slds-grid slds-p-vertical--x-small slds-grid--vertical-align-center">
        <div class="slds-p-right--small">
            {{language.getLabel('LBL_SHOW_ATTRIBUTES')}}:
        </div>
        <system-checkbox [(ngModel)]="showrequired">{{language.getLabel('LBL_REQUIRED')}}</system-checkbox>
        <system-checkbox [(ngModel)]="showoptional">{{language.getLabel('LBL_OPTIONAL')}}</system-checkbox>
        <system-checkbox [(ngModel)]="showreadonly">{{language.getLabel('LBL_READONLY')}}</system-checkbox>
        <div class="slds-p-right--small slds-col_bump-left">
            {{language.getLabel('LBL_FILTER')}}:
        </div>
        <div class="slds-form-element">
            <div class="slds-form-element__control">
                <div class="slds-select_container">
                    <select class="slds-select" [(ngModel)]="displaygroup" [disabled]="displaygroups?.length == 0">
                        <option value="all">{{language.getLabel('LBL_ALL')}}</option>
                        <option *ngFor="let displaygroup of displaygroups" [value]="displaygroup">{{displaygroup}}</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
    <div>
        <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-table--fixed-layout">
            <thead>
            <tr class="slds-text-title_caps">
                <th scope="col" width="50%"><div class="slds-truncate">{{language.getLabel('LBL_ATTRIBUTE')}}</div></th>
                <th scope="col" width="50%"><div class="slds-truncate">{{language.getLabel('LBL_VALUE')}}</div></th>
            </tr>
            </thead>
            <tbody>
                <tr *ngFor="let attribute of displayAttributes">
                    <td>
                        <div class="slds-truncate">
                            <label class="slds-form-element__label"><abbr *ngIf="required(attribute)" class="slds-required">*</abbr> {{attribute.name}}</label>
                        </div>
                    </td>
                    <td>
                        <div class="slds-truncate" [ngSwitch]="attribute.prat_datatype?.toLowerCase()">
                            <product-variants-attribute-di *ngSwitchCase="'di'" [attribute]="attribute"></product-variants-attribute-di>
                            <product-variants-attribute-s *ngSwitchCase="'s'" [attribute]="attribute"></product-variants-attribute-s>
                            <product-variants-attribute-n *ngSwitchCase="'n'" [attribute]="attribute"></product-variants-attribute-n>
                            <product-variants-attribute-f *ngSwitchCase="'f'" [attribute]="attribute"></product-variants-attribute-f>
                            <product-variants-attribute-vc *ngSwitchDefault [attribute]="attribute"></product-variants-attribute-vc>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
