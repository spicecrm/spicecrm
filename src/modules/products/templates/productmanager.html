<div class="slds-page-header">
    <div class="slds-grid">
        <div class="slds-col slds-has-flexi-truncate">
            <div class="slds-media slds-no-space slds-grow">
                <system-icon [module]="'Products'"></system-icon>
                <div class="slds-media__body">
                    <p class="slds-text-title--caps slds-line-height--reset">{{language.getModuleName('Products')}}</p>
                    <h1 class="slds-page-header__title slds-m-right--small slds-align-middle slds-truncate"><system-label label="LBL_PRODUCT_MANAGER', 'Products"></system-label></h1>
                </div>
            </div>
        </div>
        <div class="slds-col slds-no-flex slds-grid slds-align-top">
            <button class="slds-button slds-button_neutral" [disabled]="!canAddVariant" (click)="addVariant()"><system-label label="ProductVariants', 'LBL_NEW_FORM_TITLE"></system-label></button>
        </div>
    </div>
</div>
<div tobottom>
    <product-browser (selectionchanged)="selectionChanged($event)"></product-browser>
</div>
