<div class="slds-box_border slds-m-bottom--xx-small">
    <article class="slds-card">
        <div class="slds-card__header slds-grid slds-grid--align-spread">
            <header class="slds-media slds-media--center slds-has-flexi-truncate">
                <object-icon [module]="model.module" [size]="'small'"></object-icon>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <a href="javascript:void(0);" class="slds-card__header-link slds-truncate" (click)="goDetails()">
                            {{attribute.summary_text}}
                        </a>
                    </h2>
                </div>
            </header>
            <system-utility-icon class="slds-m-horizontal--xx-small" icon="up" size="x-small" (click)="toggleOpen()" [ngStyle]="iconStyle" style="transition: .5s;"></system-utility-icon>
        </div>
        <div [class.slds-hidden]="!isOpen" [style.height]="!isOpen ? '0':'initial'" class="slds-card__body">
            <div #detailscontainer></div>
        </div>
    </article>
</div>
