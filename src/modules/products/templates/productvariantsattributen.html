<div *ngIf="editmode" class="slds-form-element__control">
    <div class="slds-grid">
        <div class="slds-form-element slds-size--3-of-4">
            <input type="number" class="slds-input" [(ngModel)]="value" [disabled]="attribute.attr_usage == 'none'">
        </div>
        <div class="slds-form-element slds-p-left--x-small slds-size--1-of-4">
            <input type="text" class="slds-input" [value]="uom" disabled>
        </div>
    </div>
</div>
<div *ngIf="!editmode">
    <div class="slds-p-vertical--xx-small slds-grid slds-grid--vertical-align-center slds-grid--align-spread">
        <div style="line-height: 20px">{{displayvalue}} {{uom}}</div>
        <button *ngIf="editable" class="slds-button slds-button--icon slds-m-left--xx-small" (click)="setEditMode()">
            <system-button-icon [icon]="'edit'"></system-button-icon>
        </button>
    </div>
</div>
