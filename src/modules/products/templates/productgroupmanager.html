<div class="slds-page-header">
    <div class="slds-grid">
        <div class="slds-col slds-has-flexi-truncate">
            <div class="slds-media slds-no-space slds-grow">
                <system-icon [module]="'ProductGroups'"></system-icon>
                <div class="slds-media__body">
                    <p class="slds-text-title--caps slds-line-height--reset"><system-label-modulename module="ProductGroups"></system-label-modulename></p>
                    <h1 class="slds-page-header__title slds-m-right--small slds-align-middle slds-truncate"><system-label label="LBL_PRODUCT_GROUP_MANAGER', 'ProductGroups"></system-label></h1>
                </div>
            </div>
        </div>
        <object-action-container [actionset]="actionSet"></object-action-container>
    </div>
</div>
<div class="slds-grid">
    <div system-to-bottom class="slds-size--1-of-4 slds-border--right spice-scrollbar">
        <product-group-manager-tree (selectionchanged)="selectionChanged($event)"></product-group-manager-tree>
    </div>
    <div system-to-bottom class="slds-size--3-of-4 spice-scrollbar">
        <product-group-manager-details [groupid]="selectedGroupId"></product-group-manager-details>
    </div>
</div>
