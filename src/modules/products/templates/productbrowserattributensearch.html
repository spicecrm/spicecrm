<label class="slds-form-element__label">{{attribute.name}}</label>
<div class="slds-grid">
    <div class="slds-form-element slds-p-right--x-small slds-size--2-of-5">
        <div class="slds-form-element__control">
            <input type="number" class="slds-input" [(ngModel)]="fromValue" (keyup)="keyUp($event)">
        </div>
    </div>
    <div class="slds-form-element slds-p-left--x-small slds-size--2-of-5">
        <div class="slds-form-element__control">
            <input type="number" class="slds-input" [(ngModel)]="toValue"(keyup)="keyUp($event)">
        </div>
    </div>
    <div class="slds-form-element slds-p-left--x-small slds-size--1-of-5">
        <div class="slds-form-element__control">
            <input type="text" class="slds-input" disabled [value]="uom">
        </div>
    </div>
</div>
