<div class="slds-form-element slds-p-vertical--x-small">
    <div class="slds-form-element__control">
    <span class="slds-checkbox">
      <input type="checkbox" name="options" [id]="attribute.id" [(ngModel)]="value">
      <label class="slds-checkbox__label" [for]="attribute.id">
        <span class="slds-checkbox_faux"></span>
        <span class="slds-form-element__label">{{attribute.name}}</span>
      </label>
    </span>
    </div>
</div>
