<div class="slds-section" [ngClass]="{'slds-is-open': requiredopen}">
    <h3 class="slds-section__title">
        <button aria-controls="expando-unique-id" aria-expanded="true" class="slds-button slds-section__title-action" (click)="togglerequired()">
            <system-utility-icon [icon]="'switch'" [size]="'x-small'" [addclasses]="'slds-section__title-action-icon slds-button__icon slds-button__icon_left'"></system-utility-icon>
            <span class="slds-truncate" title="Section Title">Attributes</span>
        </button>

    </h3>
    <div class="slds-form slds-p-around--x-small" [ngStyle]="getRequiredStyle()">

        <product-variants-attributes-table></product-variants-attributes-table>
    </div>
</div>
