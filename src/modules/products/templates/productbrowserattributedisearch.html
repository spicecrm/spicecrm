    <label class="slds-form-element__label">{{attribute.name}}</label>
    <div class="slds-select_container">
        <select class="slds-select" [(ngModel)]="value">
            <option></option>
            <option *ngFor="let attributevalue of attributeValues">{{attributevalue}}</option>
        </select>
    </div>
</div>
