<section role="dialog" class="slds-modal slds-fade-in-open">
    <div class="slds-modal__container">
        <header class="slds-modal__header slds-theme_shade">
            <button class="slds-button slds-modal__close slds-button--icon-inverse" (click)="close()">
                <system-button-icon [icon]="'close'"></system-button-icon>
            </button>
            <h2 class="slds-text-heading--medium"><system-label label="LBL_CHANGE_PWD"></system-label></h2>
        </header>
        <div class="slds-modal__content slds-p-around--medium">
            <div class="slds-form--stacked slds-text-align--left" (submit)="save()">
                <div class="slds-form-element">
                    <label class="slds-form-element__label"><system-label label="LBL_OLD_PWD"></system-label></label>
                    <system-input-password autocomplete="off" [disabled]="posting" [(ngModel)]="currentPassword"></system-input-password>
                </div>
                <div *ngIf="pwdGuideline" class="slds-m-vertical--medium">
                    <system-label label="LBL_PWD_GUIDELINE"></system-label>:{{pwdGuideline}}<br>
                </div>
                <div class="slds-form-element" [ngClass]="{'slds-has-error':pwderror}">
                    <label class="slds-form-element__label"><system-label label="LBL_NEW_PWD"></system-label></label>
                    <system-input-password autocomplete="off" [(ngModel)]="newPassword"></system-input-password>
                    <div *ngIf="pwderror" class="slds-form-element__help">{{pwderror}}</div>
                </div>
                <div class="slds-form-element" [ngClass]="{'slds-has-error':repFieldVisited && pwdreperror}">
                    <label class="slds-form-element__label"><system-label label="LBL_NEW_PWD_REPEATED"></system-label></label>
                    <system-input-password autocomplete="off" [(ngModel)]="repeatPassword"></system-input-password>
                </div>
                <div *ngIf="pwdreperror" class="slds-form-element__help">{{pwdreperror}}</div>
            </div>
        </div>
        <div class="slds-modal__footer">
            <button class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CANCEL"></system-label></button>
            <button class="slds-button slds-button--brand" [disabled]="!canSave()" (click)="save()"><system-label label="LBL_SAVE"></system-label></button>
        </div>
    </div>
</section>
