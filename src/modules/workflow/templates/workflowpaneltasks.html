<div class="slds-p-vertical--x-small">
    <table class="slds-table slds-table_bordered slds-table_cell-buffer">
        <thead>
            <tr class="slds-text-title_caps">
                <th class="slds-cell-shrink slds-p-around--none"></th>
                <th width="45%" scope="col">
                    <div class="slds-truncate">name</div>
                </th>
                <th width="45%" scope="col">
                    <div class="slds-truncate">username</div>
                </th>
                <th class="slds-cell-shrink slds-p-around--none"></th>
            </tr>
        </thead>
        <tbody>
            <ng-container *ngFor="let workflowtask of workflowtasks" [system-model-provider]="{module:'WorkflowTasks', id: workflowtask.id, data: workflowtask}">
                <tr workflow-panel-tasks-item><tr>
            </ng-container>
        </tbody>
    </table>
</div>
