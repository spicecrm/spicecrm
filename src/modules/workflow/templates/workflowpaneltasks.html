<div class="slds-p-vertical--x-small">
    <table class="slds-table slds-table_bordered slds-table_cell-buffer">
        <thead>
            <tr class="slds-text-title_caps">
                <th class="slds-cell-shrink slds-p-around--none"></th>
                <th width="45%" scope="col">
                    <div class="slds-truncate"><system-label label="LBL_NAME"></system-label></div>
                </th>
                <th width="45%" scope="col">
                    <div class="slds-truncate"><system-label label="LBL_USER"></system-label></div>
                </th>
                <th width="45%" scope="col">
                    <div class="slds-truncate"><system-label label="LBL_DATE_COMPLETED"></system-label></div>
                </th>
                <th width="45%" scope="col">
                    <div class="slds-truncate"><system-label label="LBL_DECISION"></system-label></div>
                </th>
                <th class="slds-cell-shrink slds-p-around--none"></th>
            </tr>
        </thead>
        <tbody>
            <ng-container #modelProvider="system-model-provider" *ngFor="let workflowtask of workflowtasks" [system-model-provider]="{module:'WorkflowTasks', id: workflowtask.id, data: workflowtask}">
                <tr workflow-panel-tasks-item><tr>
                <tr *ngIf="modelProvider.model.data._displayComments" workflow-panel-tasks-comments [comments]="workflowtask.comments"></tr>
            </ng-container>
        </tbody>
    </table>
</div>
