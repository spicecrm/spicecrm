<div class="slds-p-around--medium slds-theme--shade">
    <div class="slds-page-header__row">
        <div class="slds-page-header__col-title">
            <div class="slds-media">
                <system-icon module="Workflows"></system-icon>
                <div class="slds-media__body">
                    <div class="slds-page-header__name">
                        <div class="slds-page-header__name-title">
                            <h1>
                                <span class="slds-page-header__title slds-truncate">{{language.getLabel('LBL_WORKFLOW_MANAGER')}}</span>
                            </h1>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="slds-grid slds-form--inline slds-p-around--small slds-border--bottom">
    <div class="slds-form-element">
        <div class="slds-form-element__control" style="min-width:250px;">
            <div class="slds-select_container">
                <select class="slds-select" [(ngModel)]="current_module">
                    <option></option>
                    <option *ngFor="let m of modules" [value]="m">{{m}}</option>
                </select>
            </div>
        </div>
    </div>
    <div *ngIf="workflowdefinitions.length > 0" class="slds-form-element">
        <div class="slds-form-element__control" style="min-width:250px;">
            <div class="slds-select_container">
                <select class="slds-select" [(ngModel)]="current_workflow">
                    <option></option>
                    <option *ngFor="let wfd of workflowdefinitions" [value]="wfd.id">{{wfd.name}}</option>
                </select>
            </div>
        </div>
    </div>
    <div *ngIf="current_module" class="slds-form-element slds-col--bump-left">
        <div class="slds-button-group" role="group">
            <button type="button" class="slds-button slds-button--neutral" (click)="addWorkflow()">{{language.getLabel('LBL_ADD')}}</button>
            <!--button type="button" class="slds-button slds-button--neutral" [disabled]="!current_workflow" (click)="deleteWorkflow()">{{language.getLabel('LBL_DELETE')}}</button-->
        </div>
    </div>
</div>
<div *ngIf="current_workflow">
    <workflow-manager-detail  [modeldata]="_current_workflow_data"></workflow-manager-detail>
    <div *ngIf="current_module" class="slds-form-element slds-grid slds-grid--align-center slds-theme--default slds-p-around--x-small">
        <div class="slds-button-group" role="group">
            <button type="button" class="slds-button slds-button--neutral" [disabled]="!current_workflow" (click)="cancel()">{{language.getLabel('LBL_CANCEL')}}</button>
            <button type="button" class="slds-button slds-button--brand" [disabled]="!current_workflow" (click)="save()">{{language.getLabel('LBL_SAVE')}}</button>
        </div>
    </div>
</div>
