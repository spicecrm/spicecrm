<div class="slds-p-around--medium slds-theme--shade">
    <div class="slds-page-header__row">
        <div class="slds-page-header__col-title">
            <div class="slds-media">
                <system-icon module="Workflows"></system-icon>
                <div class="slds-media__body">
                    <div class="slds-page-header__name">
                        <div class="slds-page-header__name-title">
                            <h1>
                                <span class="slds-page-header__title slds-truncate"><system-label label="LBL_WORKFLOW_MANAGER"></system-label></span>
                            </h1>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="slds-grid slds-form--inline slds-p-around--small slds-border--bottom">
    <div class="slds-form-element">
        <div class="slds-form-element__control" style="min-width:250px;">
            <div class="slds-select_container">
                <select class="slds-select" [(ngModel)]="currentModule">
                    <option></option>
                    <option *ngFor="let m of modules" [value]="m">{{m}}</option>
                </select>
            </div>
        </div>
    </div>
    <div *ngIf="currentWorkflowDefinitions?.length > 0" class="slds-form-element">
        <div class="slds-form-element__control" style="min-width:250px;">
            <div class="slds-select_container">
                <select class="slds-select" [(ngModel)]="currentWorkflowId" [disabled]="isLoading">
                    <option></option>
                    <option *ngFor="let wfd of currentWorkflowDefinitions" [value]="wfd.id">{{wfd.name}}</option>
                </select>
            </div>
        </div>
    </div>
    <div *ngIf="currentModule" class="slds-form-element slds-col--bump-left">
        <system-checkbox-toggle [(ngModel)]="model.data.is_active" label="LBL_ACTIVE"></system-checkbox-toggle>
        <div *ngIf="currentWorkflowId" class="slds-button-group" role="group">
            <button (click)="openEditModal()" type="button" class="slds-button slds-button--neutral slds-button--icon">
                <system-button-icon icon="edit"></system-button-icon>
            </button>
            <button (click)="cancel()" type="button" class="slds-button slds-button--neutral"><system-label label="LBL_CANCEL"></system-label></button>
            <button (click)="deleteWorkflow()" [disabled]="currentWorkflow.data.isNew" type="button" class="slds-button slds-button--neutral"><system-label label="LBL_DELETE"></system-label></button>
            <button (click)="save()" type="button" class="slds-button slds-button--brand"><system-label label="LBL_SAVE"></system-label></button>
        </div>
        <div class="slds-button-group" role="group">
            <button type="button" class="slds-button slds-button--neutral" (click)="addWorkflow()"><system-label label="LBL_NEW"></system-label></button>
        </div>
    </div>
</div>
<div *ngIf="currentWorkflowId" system-to-bottom>
    <workflow-manager-detail [modelData]="currentWorkflow.data" class="slds-height_full spice-display-block"></workflow-manager-detail>
</div>
