<td>
    <div class="slds-form-element__control">
        <div class="slds-select_container">
            <select class="slds-select" [(ngModel)]="systemaction.field">
                <option *ngFor="let field of workflowManagerService.currentModule.fields"
                        [value]="field.name">{{field.label}} ({{field.name}})
                </option>
            </select>
        </div>
    </div>
</td>
<td>
    <input type="text" [(ngModel)]="systemaction.field_value" class="slds-input">
</td>
<td role="gridcell" class="slds-cell-shrink">
    <button class="slds-button slds-button_icon" (click)="removeDecision()">
        <system-button-icon icon="delete"></system-button-icon>
    </button>
</td>
