<system-modal>
    <system-modal-header (close)="cancel()"><system-label label="LBL_TASK"></system-label>({{tasktype}})
        <system-icon-help-text *ngIf="tasktypehelptext" [helpText]="tasktypehelptext"></system-icon-help-text>
    </system-modal-header>
    <system-modal-content margin="none" [grow]="true">
        <workflow-manager-detail-task [task]="task"></workflow-manager-detail-task>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="cancel()"><system-label label="LBL_CANCEL"></system-label></button>
        <button class="slds-button slds-button--brand" (click)="confirm()"><system-label label="LBL_CONFIRM"></system-label></button>
    </system-modal-footer>
</system-modal>
