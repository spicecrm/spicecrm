<div class="slds-form-element__control">
    <div class="slds-select_container">
        <select class="slds-select" [(ngModel)]="value">
            <option *ngFor="let field of workflowManagerService.currentModule.fields"
                    [value]="field.name">{{field.label + ' (' + field.name + ')'}}</option>
        </select>
    </div>
</div>
