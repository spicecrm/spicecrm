<div>
    <field-label fieldname="name"></field-label>
    <field-container field="name"></field-container>
</div>
<div>
    <field-label fieldname="description"></field-label>
    <field-container field="description" [fieldconfig]="{minheight: '150px'}"></field-container>
</div>
<div class="slds-p-vertical--x-small slds-grid slds-grid--align-spread">
    <system-checkbox [(ngModel)]="model.data.ishidden"><system-label label="LBL_HIDDEN"></system-label><system-icon-help-text [helpText]="language.getLabel('LBL_HELP_WORKFLOWTASK_ISHIDDEN')"></system-icon-help-text></system-checkbox>
    <system-checkbox [(ngModel)]="model.data.allowcomment"><system-label label="LBL_ALLOW_COMMENT"></system-label><system-icon-help-text [helpText]="language.getLabel('LBL_HELP_WORKFLOWTASK_ALLOWCOMMENT')"></system-icon-help-text></system-checkbox>
    <system-checkbox [(ngModel)]="model.data.prevclosedreq"><system-label label="LBL_PREVIOUS_CLOSED_REQUIRED"></system-label><system-icon-help-text [helpText]="language.getLabel('LBL_HELP_WORKFLOWTASK_PREVIOUS_CLOSED_REQUIRED')"></system-icon-help-text></system-checkbox>
</div>
<system-collapsable-tab *ngIf="hasTiming" [collapsible]="false" tabtitle="LBL_TASKTIMING" tabhelptext="LBL_HELP_WORKFLOWTASK_TIMING">
    <div class="slds-grid slds-gutters_direct-xx-small">
        <div class="slds-grid slds-col slds-size--1-of-3 slds-p-right--xx-small">
            <div class="slds-grow">
                <field-label fieldname="timetostart"></field-label>
                <field-container field="timetostart"></field-container>
            </div>
        </div>
        <div class="slds-col slds-size--2-of-3 slds-p-right--xx-small">
            <field-label fieldname="timetostart_method"></field-label>
            <field-container field="timetostart_method"></field-container>
        </div>
    </div>
    <div class="slds-grid slds-gutters_direct-xx-small">
        <div class="slds-col slds-size--1-of-3 slds-p-right--xx-small">
            <field-label fieldname="timetocomplete"></field-label>
            <field-container field="timetocomplete"></field-container>
        </div>
        <div class="slds-col slds-size--1-of-3 slds-p-right--xx-small">
            <field-label fieldname="timetoalert"></field-label>
            <field-container field="timetoalert"></field-container>
        </div>
        <div class="slds-col slds-size--1-of-3 slds-p-right--xx-small">
            <field-label fieldname="timetoescalate"></field-label>
            <field-container field="timetoescalate"></field-container>
        </div>
    </div>
    <div class="slds-gutters_direct-xx-small">
        <field-label fieldname="servicecalendar_name"></field-label>
        <system-icon-help-text [helpText]="language.getLabel('LBL_HELP_WORKFLOWTASK_SERVICECALENDAR')"></system-icon-help-text>
        <field-container field="servicecalendar_name"></field-container>
    </div>
</system-collapsable-tab>
