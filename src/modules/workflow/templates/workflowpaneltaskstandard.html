<div *ngIf="showComment" class="slds-form-element slds-p-around--x-small">
    <label class="slds-form-element__label"><system-label label="LBL_COMMENT"></system-label></label>
    <div class="slds-form-element__control">
        <textarea class="slds-textarea" [disabled]="posting" [(ngModel)]="comment"></textarea>
    </div>
</div>
<div class="slds-p-around--x-small slds-grid">
    <button class="slds-button slds-button_neutral slds-col--bump-right" [ngClass]="{'slds-hidden': !showComment}" [disabled]="posting" (click)="addComment()">
        <system-label label="LBL_ADD_COMMENT"></system-label>
    </button>
    <button *ngFor="let action of taskData.actions" class="slds-button slds-button_neutral" [disabled]="posting" (click)="setStatus(action.value)">
        <system-label [label]="action.name"></system-label>
    </button>
</div>
