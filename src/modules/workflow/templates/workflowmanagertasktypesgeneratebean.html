<system-collapsable-tab [collapsible]="false" tabtitle="LBL_MAPPING" >
    <workflow-manager-task-next-tasks *ngIf="!workflowManager.displayDiagram"></workflow-manager-task-next-tasks>
    <ng-container>
        <div class="slds-form-element">
            <label class="slds-form-element__label"><system-label label="LBL_MODULE"/></label>
            <div class="slds-form-element__control">
                <system-input-module [(ngModel)]="model.data.type_config.module" (ngModelChange)="onModuleChange()"/>
            </div>
        </div>
        <div *ngIf="!!model.data.type_config.module">
            <div class="slds-m-vertical--x-small">
                <system-label label="LBL_FIELDS" />
                <button *ngIf="requiredAdded < requiredFields.size" (click)="addRequiredFields()" class="slds-button slds-button--brand slds-m-left--x-small slds-p-horizontal--small" style="line-height: 1.6">
                    <system-label label="LBL_ADD_REQUIRED_FIELDS"/>
                </button>
                <div class="slds-m-top--x-small slds-grid slds-border--bottom">
                    <label class="slds-form-element__label slds-size--1-of-2">
                        <system-label-modulename [singular]="true" [module]="model.data.type_config.module"/> <system-label class="slds-m-left--xx-small" label="LBL_FIELDS"/>
                    </label>
                    <label class="slds-form-element__label">
                        <system-label-modulename [singular]="true" [module]="workflowManager.currentModule.name"/> <system-label class="slds-m-left--xx-small" label="LBL_FIELDS"/>/<system-label label="LBL_FIXED_VALUE"/>
                    </label>
                </div>
            </div>
            <div *ngFor="let fieldObj of mappingFields; let i = index; trackBy: trackByFn" class="slds-grid slds-grid--vertical-align-start">
                <div class="slds-grid slds-size--1-of-2">
                    <div class="slds-m-vertical--xx-small slds-align--absolute-center" style="width: 8px">
                        <abbr *ngIf="requiredFields.get(fieldObj.toField)" class="slds-required slds-text-title_bold">*</abbr>
                    </div>
                    <div class="slds-form-element slds-grow slds-m-horizontal--xx-small">
                        <system-input-module-field [(ngModel)]="fieldObj.toField" [omittedFields]="addedToFields" (ngModelChange)="onToFieldChange()" [module]="model.data.type_config.module" class="slds-m-vertical--xx-small spice-display-block" />
                    </div>
                </div>
                <div class="slds-grid slds-grow slds-grid--vertical-align-start">
                    @switch(fieldObj.type){
                        @case ('copy'){
                            <div class="slds-form-element slds-m-horizontal--xx-small slds-grow">
                                <system-input-module-field [(ngModel)]="fieldObj.fromField" [omittedFields]="addedFromFields" (ngModelChange)="onFromFieldChange()" [module]="workflowManager.currentModule.name" class="slds-m-vertical--xx-small spice-display-block" />
                            </div>
                        }
                        @case ('fixed'){
                            <div class="slds-form-element slds-m-horizontal--xx-small slds-grow">
                                <div [system-model-provider]="{module: workflowManager.currentModule.name, id: null, data: generateFixedFieldModelData(fieldObj)}" (data$)="setFromFieldFixedValue($event, fieldObj)" class="slds-form-element__control slds-m-vertical--xxx-small">
                                    <field-container [field]="fieldObj.toField"></field-container>
                                </div>
                            </div>
                        }
                        @case ('eval'){
                            <div class="slds-grid slds-grid--vertical slds-grow">
                                <system-input-module-field [(ngModel)]="fieldObj.fromField" (ngModelChange)="onFromFieldChange()" [module]="workflowManager.currentModule.name" class="slds-grow slds-m-vertical--xx-small" />
                                <system-input-text class="slds-grow slds-m-around--xx-small" [(ngModel)]="fieldObj.evalValue"/>
                            </div>
                        }
                    }
                    <button (click)="switchType(i)"  [disabled]="!fieldObj.toField" [system-title]="fieldObj.isFixed ? 'LBL_FIXED_VALUE' : 'LBL_FIELD'" class="slds-button slds-m-around--xx-small">
                        <system-button-icon [icon]="getTypeIcon(fieldObj.type)" size="large"></system-button-icon>
                    </button>
                    <button (click)="remove(i)" class="slds-button slds-m-around--xx-small" system-title="LBL_DELETE">
                        <system-button-icon icon="delete" size="large"></system-button-icon>
                    </button>
                </div>
            </div>
            <div class="slds-p-around--small">
                <button (click)="add()" class="slds-button slds-button--icon-small slds-button--icon-border slds-align--absolute-center" system-title="LBL_NEW">
                    <system-button-icon icon="add"></system-button-icon>
                </button>
            </div>
        </div>
        <div class="slds-m-left--xx-small">
            <system-label label="LBL_METHOD" class="spice-display-block slds-m-vertical--x-small" />
            <system-input-backend-method [(ngModel)]="model.data.type_config.method"></system-input-backend-method>
        </div>
    </ng-container>
</system-collapsable-tab>
