<system-modal>
    <system-modal-header (close)="close()">
        <system-label label="LBL_CONDITIONS"/>
    </system-modal-header>
    <system-modal-content>
        <system-collapsable-tab [collapsible]="false" tabtitle="LBL_WORKFLOWTASK_CONDITION" tabhelptext ="LBL_HELP_WORKFLOWTASK_CONDITION">
            <div class="slds-p-around--x-small">

                <div class="slds-expression">
                    <ul>
                        <system-filter-builder [(ngModel)]="conditions" [showToggleDisplayAllField]="true" [module]="module"></system-filter-builder>
                    </ul>
                </div>
            </div>
        </system-collapsable-tab>
        <system-collapsable-tab [collapsible]="false" tabtitle="LBL_SYSTEM_CONDITION" tabhelptext="LBL_HELP_WORKFLOWTASK_SYSTEM_CONDITION">
            <div class="slds-p-around--x-small">
                <div>
                    <label class="slds-truncate">
                        <system-label label="LBL_CLASS"></system-label>
                    </label>
                    <system-input-backend-method [(ngModel)]="method"></system-input-backend-method>
                </div>
                <div>
                    <label class="slds-truncate">
                        <system-label label="LBL_PARAMS"></system-label>
                        <system-icon-help-text helpText="LBL_HELP_WORKFLOWTASK_PARAMETERS"></system-icon-help-text>
                    </label>
                    <div class="slds-form-element__control">
                        <textarea [(ngModel)]="methodParams" class="slds-textarea"></textarea>
                    </div>
                </div>
            </div>
        </system-collapsable-tab>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CANCEL"></system-label></button>
        <button class="slds-button slds-button--brand" (click)="confirm()"><system-label label="LBL_CONFIRM"></system-label></button>
    </system-modal-footer>
</system-modal>
