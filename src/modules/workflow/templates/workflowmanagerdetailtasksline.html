<td class="slds-p-around--none">
    <system-utility-icon class="slds-p-horizontal--x-small" cdkDragHandle style="cursor: move" icon="drag_and_drop" size="x-small"></system-utility-icon>
</td>
<td>
    <field-container [fieldname]="'name'" [fielddisplayclass]="'slds-truncate slds-p-horizontal--x-small'"></field-container>
</td>
<td>
    <ng-container *ngFor="let type of workflowManagerService.types">
        <div *ngIf="type.id == model.data.tasktype" class="slds-truncate">
            {{type.name}}
        </div>
    </ng-container>
</td>
<td>
    <field-container [fieldname]="'primarytask'" [fielddisplayclass]="'slds-truncate slds-p-horizontal--x-small'"></field-container>
</td>
<td>
    <field-container [fieldname]="'closetask'" [fielddisplayclass]="'slds-truncate slds-p-horizontal--x-small'"></field-container>
</td>
<td role="gridcell" class="slds-cell-shrink">
    <button class="slds-button slds-button_icon slds-m-right--x-small" (click)="addTask()">
        <system-button-icon icon="add"></system-button-icon>
    </button>
    <button class="slds-button slds-button_icon" (click)="removeTask()">
        <system-button-icon icon="delete"></system-button-icon>
    </button>
</td>
