<td class="slds-p-around--none">
    <system-utility-icon class="slds-p-horizontal--x-small" cdkDragHandle style="cursor: move" icon="drag_and_drop" size="x-small"></system-utility-icon>
</td>
<td>
    {{task.name}}
</td>
<td>
    {{type.name}}
</td>
<td role="gridcell" class="slds-cell-shrink">
    <div class="slds-grid slds-grid--align-end">
        <button *ngIf="type.type != 'end'" class="slds-button slds-button_icon slds-m-right--x-small" (click)="addTask()">
            <system-button-icon icon="add"></system-button-icon>
        </button>
        <button class="slds-button slds-button_icon" (click)="removeTask()">
            <system-button-icon icon="delete"></system-button-icon>
        </button>
    </div>
</td>
