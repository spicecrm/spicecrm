<div class="slds-tabs_default">
    <ul class="slds-tabs_default__nav" role="tablist">
        <li class="slds-tabs_default__item " [ngClass]="{'slds-is-active': activaTab=='D'}" role="presentation"><a class="slds-tabs_default__link" href="javascript:void(0);" role="tab" (click)="activaTab='D'">Details</a></li>
        <li class="slds-tabs_default__item " [ngClass]="{'slds-is-active': activaTab=='T'}" role="presentation"><a class="slds-tabs_default__link" href="javascript:void(0);" role="tab" (click)="activaTab='T'">Tasks</a></li>
        <li class="slds-tabs_default__item " [ngClass]="{'slds-is-active': activaTab=='C'}" role="presentation"><a class="slds-tabs_default__link" href="javascript:void(0);" role="tab" (click)="activaTab='C'">Conditions</a></li>
    </ul>
    <div class="slds-tabs_default__content slds-hide" [ngClass]="{'slds-show' : activaTab=='D'}" role="tabpanel">
        <object-record-fieldset [fieldset]="fieldset" [direction]="'vertical'"></object-record-fieldset>
    </div>
    <div class="slds-tabs_default__content slds-hide" [ngClass]="{'slds-show' : activaTab=='T'}" role="tabpanel">
        <workflow-manager-detail-tasks [tasks]="model.data.tasks"></workflow-manager-detail-tasks>
    </div>
    <div class="slds-tabs_default__content slds-hide" [ngClass]="{'slds-show' : activaTab=='C'}" role="tabpanel">
        <workflow-manager-detail-conditions></workflow-manager-detail-conditions>
    </div>
</div>
