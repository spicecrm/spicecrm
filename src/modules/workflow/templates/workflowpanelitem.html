<article class="slds-card slds-card_boundary slds-m-bottom--medium">
    <div class="slds-card__header slds-grid">
        <header class="slds-media slds-media_center slds-has-flexi-truncate">
            <system-icon [module]="'Workflows'" [size]="'small'"></system-icon>
            <div class="slds-media__body">
                <h2>
                    <a href="javascript:void(0);" class="slds-card__header-link slds-truncate">
                        <span class="slds-text-heading_x-small">{{workflow.name}}</span>
                    </a>
                </h2>
                {{startdate}}
            </div>
            <div (click)="toggleHidden()">
                <system-utility-icon [icon]="toggleicon" [size]="'x-small'"></system-utility-icon>
            </div>
        </header>
    </div>
    <div class="slds-card__body" [ngClass]="{'slds-hide': hidebody}">
        <workflow-panel-tasks [workflowtasks]="workflow.worflowtasks"></workflow-panel-tasks>
        <workflow-panel-task *ngFor="let workflowtask of workflow.worflowtasks|workflowmyopentaskspipe" [workflowtask]="workflowtask" [workflow]="workflow"></workflow-panel-task>
    </div>
</article>
