<article class="slds-card slds-card_boundary slds-m-bottom--medium">
    <div class="slds-card__header slds-grid">
        <header class="slds-media slds-media_center slds-has-flexi-truncate">
            <system-icon [module]="'Workflows'" [size]="'small'"></system-icon>
            <div class="slds-media__body">
                <h2>
                    <a href="javascript:void(0);" class="slds-card__header-link slds-truncate">
                        <span class="slds-text-heading_x-small">{{workflow.name}}</span>
                    </a>
                </h2>
                <system-display-datetime [date]="workflow.date_entered"></system-display-datetime>
            </div>
            <div (click)="toggleCollapsed()">
                <system-utility-icon [icon]="toggleicon" [size]="'x-small'"></system-utility-icon>
            </div>
        </header>
    </div>
    <div class="slds-card__body" [ngClass]="{'slds-hide': collapsed}">
        <div *ngIf="loading" class="slds-p-around--large slds-align--absolute-center">
            <system-spinner size="20" message="LBL_LOADING"></system-spinner>
        </div>
        <div *ngIf="!loading && workflow.workflowtasks">
            <workflow-panel-tasks [workflowtasks]="workflow.workflowtasks"></workflow-panel-tasks>
            <workflow-panel-task *ngFor="let workflowtask of workflow.workflowtasks|workflowmyopentaskspipe" [workflowtask]="workflowtask" [workflow]="workflow"></workflow-panel-task>
        </div>
    </div>
</article>
