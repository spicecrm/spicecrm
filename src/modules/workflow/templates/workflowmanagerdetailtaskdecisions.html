<div class="slds-p-vertical--x-small">
    <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-border--right slds-border--left">
        <thead>
            <tr class="slds-text-title_caps">
                <th>
                    <div class="slds-truncate">
                        <field-label [fieldname]="'name'"
                                     [fieldconfig]="{label:'WorkflowDefinitions:LBL_TASK_DECISION_HEADER_NAME'}"></field-label>
                    </div>
                </th>
                <th>
                    <div class="slds-truncate">
                        <field-label [fieldname]="'nextworkflowtaskdefinition_id'"
                                     [fieldconfig]="{label:'WorkflowDefinitions:LBL_TASK_DECISION_HEADER_NEXT_KWORKFLOWTASKDEFINITION_ID'}"></field-label>
                    </div>
                </th>
                <th class="slds-cell-shrink"></th>
            </tr>
        </thead>
        <tbody>
        <tr>
            <td *ngIf="model.data.decisions == 0" colspan="3">
                <div class="slds-align--absolute-center slds-p-around--small">... no Decisions defined ...</div>
            </td>
        </tr>
            <tr *ngFor="let decision of model.data.decisions|notdeleted" workflow-manager-detail-taskdecisions-line [decision]="decision" [decisions]="model.data.decisions" [tasks]="tasks"></tr>
        </tbody>
        <tfoot class="slds-border--top slds-theme--shade">
        <tr>
            <td align="center" colspan="3">
                <div class="slds-align--absolute-center slds-p-around--xx-small">
                    <button class="slds-button slds-button_icon" (click)="addDecision()">
                        <system-button-icon [icon]="'add'"></system-button-icon>
                    </button>
                </div>
            </td>
        </tr>
        </tfoot>
    </table>
</div>
