<div class="slds-m-horizontal--x-small slds-p-top--xxx-small">
    <system-collapsable-tab *ngIf="workflow.manualDefinitions.length > 0" tabtitle="LBL_MANUAL_WORKFLOWS">
        <div *ngIf="!workflow.loading" class="slds-grid slds-p-vertical--small">
            <span *ngFor="let definition of workflow.manualDefinitions" class="slds-pill slds-pill_link">
                <span class="slds-pill__icon_container">
                    <span class="slds-icon_container">
                        <system-icon module="Workflows"></system-icon>
                    </span>
                </span>
                <a class="slds-pill__action" [system-title]="definition.name">
                    <span class="slds-pill__label">{{definition.name}}</span>
                </a>
                <button (click)="processWorkflow(definition.id)" [disabled]="workflow.processing" class="slds-button slds-button_icon slds-button_icon slds-pill__remove" system-title="LBL_PROCESS">
                    <system-button-icon *ngIf="workflow.processing != definition.id" icon="play"></system-button-icon>
                    <system-spinner *ngIf="workflow.processing == definition.id" size="14"></system-spinner>
                </button>
            </span>
        </div>
        <div *ngIf="workflow.loading" class="slds-p-vertical--small">
            <system-stencil></system-stencil>
        </div>
    </system-collapsable-tab>
    <div class="slds-section slds-is-open">
        <h3 class="slds-section__title">
            <div class="slds-grid slds-grid--vertical-align-center slds-section__title-action" style="cursor: default">
                <system-icon  module="Workflows" size="x-small"></system-icon>
                <span class="slds-truncate">{{workflow.activeCount}} <system-label label="LBL_OPEN_WORKFLOWS"></system-label></span>
            </div>
            <button *ngIf="workflow.activeCount > 0" (click)="reloadWorkflows($event)" class="slds-button slds-button_icon slds-button_icon slds-button--icon-border-filled" style="color:#706e6b">
                <system-button-icon [icon]="'refresh'"></system-button-icon>
            </button>
        </h3>
        <div *ngIf="workflow.activeCount == 0 || workflow.loading; else loadedWorkflows" class="slds-box slds-align--absolute-center slds-p-around--medium slds-m-bottom--medium" [system-overlay-loading-spinner]="workflow.loading">
            <system-illustration-no-records><system-label [label]="workflow.loading ? 'LBL_LOADING' : 'LBL_NO_ACTIVE_WORKFLOWS'"></system-label></system-illustration-no-records>
        </div>
        <ng-template #loadedWorkflows>
            <div class="slds-p-vertical--x-small">
                <workflow-panel-item *ngFor="let thisworkflow of workflow.workflows|workflowpenworkflowspipe" [workflow]="thisworkflow"></workflow-panel-item>
            </div>
        </ng-template>
    </div>
    <div class="slds-section slds-is-open" *ngIf="workflow.completeCount > 0">
        <h3 class="slds-section__title">
            <div class="slds-grid slds-grid--vertical-align-center slds-section__title-action" style="cursor: default">
                <system-icon  module="Workflows" size="x-small"></system-icon>
                <span class="slds-truncate">{{workflow.completeCount}} <system-label label="LBL_COMPLETED_WORKFLOWS"></system-label></span>
            </div>
        </h3>
        <div class="slds-p-vertical--x-small">
            <workflow-panel-item *ngFor="let thisworkflow of workflow.workflows|workflowcompletedworkflowspipe" [workflow]="thisworkflow" [collapsed]="true"></workflow-panel-item>
        </div>
    </div>
</div>
