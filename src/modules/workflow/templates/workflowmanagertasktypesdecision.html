<system-collapsable-tab tabtitle="LBL_CONFIGURATIONS" class="slds-m-top--large spice-display-block">
    <div class="slds-p-vertical--x-small">
        <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-border--right slds-border--left">
            <thead>
            <tr class="slds-text-title_caps">
                <th>
                    <div class="slds-truncate">
                        <system-label label="LBL_NAME"></system-label>
                    </div>
                </th>
                <th>
                    <div class="slds-truncate">
                        <system-label label="LBL_NEXTTASK"></system-label>
                    </div>
                </th>
                <th class="slds-cell-shrink"></th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td *ngIf="(model.data.type_config.decisions|workflowmanagernotdeletedpipe).length == 0" colspan="3">
                    <system-label label="MSG_NO_RECORDS_FOUND"></system-label>
                </td>
            </tr>
            <tr *ngFor="let decision of model.data.type_config.decisions|workflowmanagernotdeletedpipe" workflow-manager-detail-taskdecisions-line [decision]="decision" [decisions]="model.data.type_config.decisions"></tr>
            </tbody>
            <tfoot class="slds-border--top slds-theme--shade">
            <tr>
                <td align="center" colspan="3">
                    <div class="slds-align--absolute-center slds-p-around--xx-small">
                        <button class="slds-button slds-button_icon" (click)="addDecision()">
                            <system-button-icon [icon]="'add'"></system-button-icon>
                        </button>
                    </div>
                </td>
            </tr>
            </tfoot>
        </table>
    </div>

</system-collapsable-tab>
