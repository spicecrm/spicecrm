<div class="slds-p-around--x-small">
    <fieldset class="slds-form-element slds-form-element_compound slds-m-top--small slds-has-divider--top-space">
            <system-label label="LBL_TEMPLATE"></system-label>
            <div class="slds-form-element__row">
                <select class="slds-select" [disabled]="templates.length == 0" [(ngModel)]="kpdfexport.outputtemplate_id">
                    <ng-container *ngFor="let o of templates">
                        <option [value]="o.id" >{{o.name}}</option>
                    </ng-container>
                </select>
            </div>
    </fieldset>
</div>
