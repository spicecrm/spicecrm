<div class="slds-p-around--xx-small">
    <system-collapsable-tab tabtitle="LBL_GEO_COORDINATES" [collapsible]="false" style="height: calc(100% / 5); display: block">
        <div class="slds-grid slds-p-vertical--x-small">
            <div class="slds-size--1-of-2 slds-form-element slds-p-horizontal--x-small">
                <label class="slds-form-element__label">
                    <system-label label="LBL_LONGITUDE"></system-label>
                </label>
                <div class="slds-form-element__control slds-grow">
                    <div class="slds-select_container">
                        <select class="slds-select" [(ngModel)]="properties.googlemaps.kreportgooglemapslongitude">
                            <option></option>
                            <option *ngFor="let listField of listFields; trackBy: trackByFn" [value]="listField.fieldid">
                                <system-label [label]="listField.name"></system-label>
                            </option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="slds-size--1-of-2 slds-form-element slds-p-horizontal--x-small">
                <label class="slds-form-element__label">
                    <system-label label="LBL_LATITUDE"></system-label>
                </label>
                <div class="slds-form-element__control slds-grow">
                    <div class="slds-select_container">
                        <select class="slds-select" [(ngModel)]="properties.googlemaps.kreportgooglemapstatitude">
                            <option></option>
                            <option *ngFor="let listField of listFields; trackBy: trackByFn" [value]="listField.fieldid">
                                <system-label [label]="listField.name"></system-label>
                            </option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </system-collapsable-tab>
    <system-collapsable-tab tabtitle="LBL_PIN_INFO" [collapsible]="false" style="height: calc(100% / 5); display: block">
        <div class="slds-grid slds-grid--vertical-align-end slds-p-vertical--x-small">
            <div class="slds-size--1-of-4 slds-form-element slds-p-horizontal--x-small">
                <label class="slds-form-element__label">
                    <system-label label="LBL_TITLE"></system-label>
                </label>
                <div class="slds-form-element__control slds-grow">
                    <div class="slds-select_container">
                        <select class="slds-select" [(ngModel)]="properties.googlemaps.kreportgooglemapstitle">
                            <option></option>
                            <option *ngFor="let listField of listFields; trackBy: trackByFn" [value]="listField.fieldid">
                                <system-label [label]="listField.name"></system-label>
                            </option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="slds-size--1-of-4 slds-form-element slds-p-horizontal--x-small">
                <label class="slds-form-element__label">
                    <system-label label="LBL_PIN_INFO"></system-label>
                </label>
                <div class="slds-form-element__control slds-grow">
                    <div class="slds-select_container">
                        <select class="slds-select" [(ngModel)]="properties.googlemaps.kreportgooglemapsinfo">
                            <option></option>
                            <option *ngFor="let listField of listFields; trackBy: trackByFn" [value]="listField.fieldid">
                                <system-label [label]="listField.name"></system-label>
                            </option>
                        </select>
                    </div>
                </div>
            </div>
            <system-checkbox [(ngModel)]="properties.googlemaps.kreportgooglemapscluster" class="slds-m-left--x-small">
                <system-label label="LBL_CLUSTER_PINS"></system-label>
            </system-checkbox>
            <system-checkbox [(ngModel)]="properties.googlemaps.kreportgooglemapsspiderfy" class="slds-m-left--xx-small">
                <system-label label="LBL_SPIDERFY_PINS"></system-label>
            </system-checkbox>
        </div>
    </system-collapsable-tab>
    <system-collapsable-tab tabtitle="LBL_COLORS" [collapsible]="false" style="height: calc(100% / 5); display: block">
        <div class="slds-grid slds-grid--vertical-align-end slds-p-vertical--x-small">
            <div class="slds-size--1-of-4 slds-form-element slds-p-horizontal--x-small">
                <label class="slds-form-element__label">
                    <system-label label="LBL_COLORS"></system-label>
                </label>
                <div class="slds-form-element__control slds-grow">
                    <div class="slds-select_container">
                        <select class="slds-select" [(ngModel)]="properties.googlemaps.kreportgooglemapscolorset">
                            <option *ngFor="let colorOption of colorOptions; trackBy: trackByFnIndex" [value]="colorOption.id">
                                {{colorOption.name}}
                            </option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="slds-size--1-of-4 slds-form-element slds-p-horizontal--x-small">
                <label class="slds-form-element__label">
                    <system-label label="LBL_COLOR_BY"></system-label>
                </label>
                <div class="slds-form-element__control slds-grow">
                    <div class="slds-select_container">
                        <select class="slds-select" [(ngModel)]="properties.googlemaps.kreportgooglemapscolorcriteria">
                            <option></option>
                            <option *ngFor="let listField of listFields; trackBy: trackByFn" [value]="listField.fieldid">
                                <system-label [label]="listField.name"></system-label>
                            </option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="slds-size--1-of-4 slds-grid slds-grid--vertical-align-center">
                <system-checkbox [(ngModel)]="properties.googlemaps.kreportgooglemapslegend" class="slds-size--1-of-2 slds-m-left--xx-small">
                    <system-label label="LBL_DISPLAY_LEGEND"></system-label>
                </system-checkbox>
            </div>
            <div class="slds-size--1-of-4 slds-p-horizontal--x-small">
                <label class="slds-form-element__label">
                    <system-label label="LBL_PREVIEW"></system-label>
                </label>
                <div class="slds-color-picker slds-color-picker_swatches-only slds-grid slds-grid--vertical-align-center slds-grow" style="padding: .15rem 0;">
                    <div class="slds-color-picker__selector">
                        <ul class="slds-color-picker__swatches" role="menu">
                            <li *ngFor="let color of themeColors; trackBy: trackByFnIndex" class="slds-color-picker__swatch" role="presentation">
                        <span class="slds-color-picker__swatch-trigger slds-is-selected" role="menuitem">
                            <span class="slds-swatch" [style.background-color]="color">
                                <span class="slds-assistive-text">{{color}}</span>
                            </span>
                        </span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </system-collapsable-tab>
</div>
