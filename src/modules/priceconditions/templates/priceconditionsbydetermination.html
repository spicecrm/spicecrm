<div class="slds-vertical-tabs slds-m-around--x-small" style="min-height: 300px;">
    <ul class="slds-vertical-tabs__nav" role="tablist" aria-orientation="vertical">
        <li *ngFor="let determinationtype of determinationtypes" class="slds-vertical-tabs__nav-item" role="presentation" [ngClass]="{'slds-is-active': determinationtype.id == activedeterminationtype}" (click)="setDeterminationType(determinationtype.id)">
            <a class="slds-vertical-tabs__link" href="javascript:void(0)" role="tab" tabindex="0"
               aria-selected="true" aria-controls="slds-vertical-tabs-0" id="slds-vertical-tabs-0__nav">
                <span class="slds-vertical-tabs__left-icon"></span>
                <span class="slds-truncate"><system-label [label]="determinationtype.label"></system-label>&nbsp;({{determinationtype.name}})</span>
                <span class="slds-vertical-tabs__right-icon"></span>
            </a>
        </li>
    </ul>
    <div class="slds-vertical-tabs__content slds-show slds-p-around--xx-small" role="tabpanel" aria-labelledby="slds-vertical-tabs-0__nav">
        <price-conditions-by-determination-list [determinationid]="activedeterminationtype" [conditions]="conditonsForDeterminationId(activedeterminationtype)"></price-conditions-by-determination-list>
    </div>
</div>
