<h2 class="slds-text-heading_small slds-p-horizontal--xx-small slds-p-vertical--x-small">
    <system-label [label]="determinationname"></system-label>
</h2>
<table class="slds-table slds-table_cell-buffer slds-table_bordered">
    <thead>
    <tr class="slds-line-height_reset">
        <th *ngFor="let determinationfield of determinationfields" class="" scope="col">
            <div class="slds-truncate">{{determinationfield.name}}</div>
        </th>
        <th class="" scope="col">
            <div class="slds-truncate slds-text-align--right"><system-label label="LBL_AMOUNT"></system-label></div>
        </th>
        <th class="" scope="col">
            <div class="slds-truncate"><system-label label="LBL_VALID_FROM"></system-label></div>
        </th>
        <th class="" scope="col">
            <div class="slds-truncate"><system-label label="LBL_VALID_TO"></system-label></div>
        </th>
    </tr>
    </thead>
    <tbody [system-view-provider]="{editable: false, displayLabels: false}">
    <tr *ngFor="let condition of conditions" class="slds-hint-parent" [system-model-provider]="{module: 'PriceConditions', data: condition}">
        <td *ngFor="let determinationfield of determinationfields">
            <div class="slds-truncate">{{getValueFromKey(condition.pricecondition_key, determinationfield)}}</div>
        </td>
        <td>
            <div *ngIf="conditiontype == 'P'" class="slds-truncate slds-grid slds-grid--align-end">
                <field-container field="amount" [fieldconfig]="{fieldtype: 'int'}" fielddisplayclass="slds-truncate"></field-container>%
            </div>
            <div *ngIf="conditiontype == 'A'" class="slds-truncate">
                <field-container field="amount" fielddisplayclass="slds-truncate"></field-container>
            </div>
        </td>
        <td>
            <div class="slds-truncate">
                <field-container field="valid_from" fielddisplayclass="slds-truncate"></field-container>
            </div>
        </td>
        <td>
            <div class="slds-truncate">
                <field-container field="valid_to" fielddisplayclass="slds-truncate"></field-container>
            </div>
        </td>
    </tr>
    </tbody>
</table>
