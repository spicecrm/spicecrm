<system-modal>
    <system-modal-header (close)="closeModal()">
        <ng-container *ngIf="loaded">
            <ng-container *ngIf="isNewUser">{{lang.getLabel('LBL_CREATE_PORTAL_USER')}}</ng-container>
            <ng-container *ngIf="!isNewUser">{{lang.getLabel('LBL_EDIT_PORTAL_USER')}}</ng-container>
            <span class="slds-text-heading_small slds-p-top_x-small" style="display:block">
                <span class="slds-p-horizontal--x-small slds-theme--info slds-text-color--inverse" style="opacity:0.66">{{model.data.name}}</span>
            </span>
        </ng-container>
        <ng-container *ngIf="!loaded">
            {{lang.getLabel('LBL_PORTAL_USER')}}
        </ng-container>
    </system-modal-header>
    <system-modal-content>
        <system-spinner *ngIf="!loaded"></system-spinner>
        <div *ngIf="loaded" class="slds-form slds-form_horizontal">
            <div class="slds-form-element">
                <label class="slds-form-element__label">{{lang.getLabel('LBL_ACTIVE')}}</label>
                <div class="slds-form-element__control">
                    <label class="slds-checkbox_toggle slds-grid">
                        <input type="checkbox" name="active" [(ngModel)]="user.active">
                        <span class="slds-checkbox_faux_container" aria-live="assertive">
                            <span class="slds-checkbox_faux"></span>
                          </span>
                    </label>
                </div>
            </div>
            <div class="slds-form-element" [ngClass]="{'slds-has-error':usernameAlreadyExists}">
                <label class="slds-form-element__label"><abbr class="slds-required" title="required">*  </abbr>{{lang.getLabel('LBL_USER_NAME')}}</label>
                <div class="slds-form-element__control">
                    <input type="text" class="slds-input" [(ngModel)]="user.name" (change)="testUsername()" [disabled]="usernameTesting">
                    <div *ngIf="usernameAlreadyExists" class="slds-form-element__help">{{lang.getLabel('MSG_USERNAME_ALREADY_EXISTS')}}</div>
                </div>
            </div>
            <div class="slds-form-element" [ngClass]="{'slds-has-error':pwdError}">
                <label class="slds-form-element__label">
                    <ng-container *ngIf="isNewUser"><abbr class="slds-required" title="required">*  </abbr>{{lang.getLabel('LBL_PASSWORD')}}</ng-container>
                    <ng-container *ngIf="!isNewUser">{{lang.getLabel('LBL_NEW_PWD')}}?</ng-container>
                </label>
                <div class="slds-form-element__control">
                    <input type="text" class="slds-input" [(ngModel)]="user.password" [ngClass]="{'slds-has-error':pwdError}">
                    <div *ngIf="pwdError" class="slds-form-element__help">{{pwdError}}</div>
                    <div *ngIf="pwdGuideline" class="slds-m-top--xx-small slds-form-element__help" style="color:inherit">
                        {{lang.getLabel('LBL_PWD_GUIDELINE')}}:<br>
                        {{pwdGuideline}}
                    </div>
                </div>
            </div>
            <div class="slds-form-element">
                <label class="slds-form-element__label"><abbr class="slds-required" title="required">*  </abbr>{{lang.getLabel('LBL_ACL_ROLE')}}</label>
                <div class="slds-form-element__control">
                    <div class="slds-select_container">
                        <select class="slds-select" [(ngModel)]="user.aclRole">
                            <option *ngFor="let aclRole of aclRoles" [value]="aclRole.id" [selected]="user.aclRole === aclRole.id">{{aclRole.name}}</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="slds-form-element">
                <label class="slds-form-element__label"><abbr class="slds-required" title="required">*  </abbr>{{lang.getLabel('LBL_PORTAL_ROLE')}}</label>
                <div class="slds-form-element__control">
                    <div class="slds-select_container">
                        <select class="slds-select" [(ngModel)]="user.portalRole">
                            <option *ngFor="let portalRole of portalRoles" [value]="portalRole.id" [selected]="user.portalRole === portalRole.id">{{portalRole.name}}</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="slds-form-element">
                <label *ngIf="isNewUser" class="slds-form-element__label">{{lang.getLabel('LBL_SET_DATE_TIME_PREFS')}} <system-icon-help-text [helpText]="lang.getLabel('HLP_SET_DATE_TIME_PREFS')"></system-icon-help-text></label>
                <label *ngIf="!isNewUser" class="slds-form-element__label">{{lang.getLabel('LBL_RESET_DATE_TIME_PREFS')}} <system-icon-help-text [helpText]="lang.getLabel('HLP_RESET_DATE_TIME_PREFS')"></system-icon-help-text></label>
                <div class="slds-form-element__control">
                    <label class="slds-checkbox_toggle slds-grid">
                        <input type="checkbox" name="active" [(ngModel)]="user.setDateTimePrefsWithSystemDefaults">
                        <span class="slds-checkbox_faux_container" aria-live="assertive">
                            <span class="slds-checkbox_faux"></span>
                          </span>
                    </label>
                </div>
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="closeModal()">{{lang.getLabel('LBL_CANCEL')}}</button>
        <button *ngIf="loaded" class="slds-button slds-button--brand" (click)="save()" [disabled]="!canSave">{{lang.getLabel('LBL_SAVE')}}</button>
    </system-modal-footer>
</system-modal>
