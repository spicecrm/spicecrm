<div class="slds-height_full">
    <div class="slds-scrollable--y" [ngStyle]="getContainerStyle()" [overlayLoadingSpinner]="isLoading">
        <table class="slds-table slds-table_bordered slds-table--fixed-layout slds-table--header-fixed spice-table_footer-fixed">
            <thead>
            <tr class="slds-text-title--caps">
                <th *ngFor="let field of getFields()" [ngClass]="displayClasses(field)" scope="col" class="slds-resizable" [width]="getFieldWidth(field.fieldid)" (click)="toggleSort(field)" (systemresize)="onresize()" [resizeid]="field.fieldid">
                    <a *ngIf="isSortable(field); else notsortable" href="javascript:void(0);" class="slds-th__action slds-text-link--reset slds-grid " [ngClass]="displayClasses(field)">
                        <div class="slds-truncate slds-p-vertical--xx-small"><system-label [label]="field.name"></system-label></div>
                        <system-utility-icon [icon]="getSortIcon(field.fieldid)" addclasses="slds-is-sortable__icon" size="x-small"></system-utility-icon>
                    </a>
                    <ng-template #notsortable>
                        <div class="slds-th__action"><system-label [label]="field.name"></system-label></div>
                    </ng-template>
                </th>
            </tr>
            </thead>
            <tbody>
                <ng-container *ngFor="let groupByValue of groupByValues">
                    <tr>
                        <td [attr.colspan]="getFields().length" class="slds-theme--shade slds-text-title_bold">
                            <div class="slds-grid slds-grid--align-spread slds-grid_vertical-align-center">
                                <div>
                                    <button class="slds-button slds-button_icon slds-button_icon-x-small slds-m-right_x-small" (click)="groupByValue.expanded = !groupByValue.expanded">
                                        <system-button-icon [icon]="groupByValue.expanded ? 'chevrondown' : 'chevronright'"></system-button-icon>
                                    </button>
                                    <label>{{groupByValue.value}}</label>
                                </div>
                                <label>{{groupByValue.count}} <system-label label="LBL_RECORDS"></system-label></label>
                            </div>
                        </td>
                    </tr>
                    <ng-container *ngIf="groupByValue.expanded">
                        <tr *ngFor="let record of getRecords(groupByValue.value)"  style="vertical-align: top;">
                            <td scope="row" *ngFor="let field of getFields()" [width]="getFieldWidth(field.fieldid)">
                                <reporter-field-container [field]="field" [record]="record"></reporter-field-container>
                            </td>
                        </tr>
                    </ng-container>
                    <tr *ngIf="hasSummary">
                        <td scope="row" *ngFor="let field of getFields()" [width]="getFieldWidth(field.fieldid)" class="slds-text-title_bold">
                            <reporter-field-container [field]="field" [record]="groupByValue.totalRecord"></reporter-field-container>
                        </td>
                    </tr>
                </ng-container>
            </tbody>
            <tfoot>
                <tr class="slds-theme--info">
                    <td scope="row" *ngFor="let field of getFields()"  class="slds-text-title_bold slds-theme--info">
                        <reporter-field-container [field]="field" [record]="getRecordTotals()"></reporter-field-container>
                    </td>
                </tr>
            </tfoot>
        </table>
    </div>
    <div #tablefooter class="slds-border--top">
        <div class="slds-p-vertical--x-small slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
            <div class="slds-grid slds-grid_vertical-align-center slds-p-left--x-small">
                <label class="slds-form-element__label"><system-label label="LBL_GROUPDBY"></system-label></label>
                <div class="slds-form-element">
                    <div class="slds-form-element__control">
                        <div class="slds-select_container">
                            <select class="slds-select" [(ngModel)]="groupById">
                                <option *ngFor="let reportField of reportFields" [value]="reportField.fieldid"><system-label [label]="reportField.name"></system-label></option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="slds-p-horizontal--medium slds-grid slds-grid--vertical-align-center">
                <div class="slds-p-horizontal--xx-small">{{totalRecords}} <system-label label="LBL_RECORDS"></system-label></div>
                <button class="slds-button slds-button_icon" (click)="selectFields()" [title]="language.getLabel('LBL_CHOOSE_FIELDS')">
                    <system-button-icon icon="settings" ></system-button-icon>
                </button>
                <button class="slds-button slds-button_icon" *ngIf="canSave" (click)="saveLayout()" [title]="language.getLabel('LBL_SAVE_LAYOUT')">
                    <system-button-icon icon="save" ></system-button-icon>
                </button>
            </div>
        </div>
    </div>
</div>
