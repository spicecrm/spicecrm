<li *ngIf="canExport" class="slds-dropdown__item" role="presentation" >
    <a href="javascript:void(0);" role="menuitem" tabindex="0" (click)="exportPDF()">
        <system-icon sprite="doctype" icon="pdf" size="x-small"></system-icon>
        <span class="slds-truncate"><system-label label="LBL_PDF"></system-label></span>
    </a>
    <a #downloadlink style="display:none" [href]="loadUrl" [download]="fileName"></a>
</li>
