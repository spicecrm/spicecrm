<div class="slds-p-around--x-small slds-heihgt_full">
    <div class="slds-grid slds-grid--vertical-align-center slds-p-bottom--x-small">
        <system-icon [module]="'KPIs'" [size]="'small'"></system-icon>
        <h2 class="slds-text-heading--medium slds-p-bottom--xx-small slds-col--bump-right">
            <system-label label="LBL_MY_KPIS"></system-label>
        </h2>
        <div *ngIf="reportees.length > 0" style="width: 300px;" class=" slds-m-horizontal--xx-small slds-form-element__control">
            <system-select system-select-id-only [(ngModel)]="parentId">
                <system-select-option *ngFor="let reportee of reportees" [value]="reportee.id" [display]="reportee.first_name + ' ' + reportee.last_name"></system-select-option>
            </system-select>
        </div>
    </div>
    <kpis-container [parentId]="parentId" [parentType]="parentType"/>
</div>
