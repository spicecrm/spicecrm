<div class="slds-p-around--x-small slds-height_full slds-scrollable--x">
    <div class="slds-grid slds-grid--vertical-align-center slds-p-bottom--x-small">
        <system-icon [module]="'KPIs'" [size]="'small'"></system-icon>
        <h2 class="slds-text-heading--medium slds-p-bottom--xx-small slds-col--bump-right">
            <system-label label="LBL_MY_KPIS"></system-label>
        </h2>
        <div *ngIf="isAdmin" class=" slds-m-horizontal--xx-small slds-form-element__control">
            <div class="slds-combobox_container">
                <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click" aria-expanded="false" aria-haspopup="listbox" role="combobox">
                    <div class="slds-form-element__control slds-box--border">
                        <div *ngIf="selectedItem" class="slds-form-element__control">
                            <div class="slds-pill_container">
                          <span class="slds-pill slds-size--1-of-1">
                            <span class="slds-icon_container slds-icon-standard-account slds-pill__icon_container">
                              <system-icon module="Users" size="small"></system-icon>
                            </span>
                            <span class="slds-pill__label">{{selectedItem.summary_text}}</span>
                            <button class="slds-button slds-button--icon slds-pill__remove" (click)="clearField()">
                              <system-button-icon [icon]="'close'"></system-button-icon>
                            </button>
                          </span>
                            </div>
                        </div>
                        <div *ngIf="!selectedItem" class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right">
                            <input  type="text" class="slds-input slds-combobox__input"  (focus)="searchWithModal()" placeholder="LBL_SELECT_USER" autocomplete="none" role="combobox"/>
                            <button (click)="searchWithModal()" class="slds-button slds-button_icon slds-input__icon slds-input__icon_right"><system-button-icon [icon]="'search'"></system-button-icon></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!--button class="slds-button slds-button--icon slds-button--icon-border" [disabled]="loading || !parentId" (click)="loadKPIs()" system-title="LBL_RELOAD">
            <system-button-icon icon="refresh"/>
        </button-->
    </div>
    <kpis-container [parentId]="parentId" [parentType]="parentType"/>
</div>
