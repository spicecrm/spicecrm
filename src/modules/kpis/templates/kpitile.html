<article class="slds-card slds-height_full">
    <header class="slds-media slds-media_center slds-has-flexi-truncate">
        <div class="slds-media__body">
            <h2 class="slds-text-heading--small slds-theme--shade">
                <div class="slds-card__header slds-truncate slds-m-bottom--none slds-p-around--xx-small">
                    <span>{{ kpi.name }}</span>
                </div>
            </h2>
        </div>
    </header>
    <div class="slds-card__body slds-card__body_inner slds-m-vertical--none slds-p-horizontal--xx-small  slds-p-bottom--xx-small">
        <div class="slds-tile__detail">
            <div class="slds-grid">
                <div class="slds-truncate slds-text-heading_large" [ngClass]="kpiColor">
                    @if(!loading) {
                        <system-display-number [number]="kpiTargetValue.kpi_value" precision="0"/>
                    } @else {
                        <div class="slds-p-around--xx-small">
                            <system-spinner size="28"/>
                        </div>
                    }
                </div>
                <div class="slds-truncate slds-text-heading_small slds-p-horizontal--xx-small slds-m-top--small">
                        {{ this.kpi.metric }}
                </div>
                <div class="slds-truncate slds-text-heading_small slds-p-horizontal--xx-small slds-m-top--small">
                    <system-utility-icon [colorclass]="iconColor" [icon]="arrowIcon"
                                         [size]="'x-small'"></system-utility-icon>
                    <span>2 (8%) better</span>
                </div>
            </div>
            <div class="slds-text-body--small slds-text-color--inverse-weak">
                @if(!loading) {
                    <system-display-datetime [date]="kpiTargetValue.date_entered"></system-display-datetime>
                } @else {
                    <system-stencil></system-stencil>
                }
            </div>
            <div class="slds-line-clamp_x-small slds-truncate" style="min-height: 39px;">
                <span>{{ kpi.description }}</span>
            </div>
        </div>
    </div>
    <!--
        <kpi-dashlet-item-footer></kpi-dashlet-item-footer>
    -->
</article>
