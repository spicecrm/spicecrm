<div class="slds-grid slds-grid--vertical" tobottomnoscroll>
    <div class="slds-border--bottom slds-p-around--small slds-grid">
        <div class="slds-form-element slds-grid slds-grid--vertical-align-center slds-m-left--x-small">
            <label class="slds-form-element__label">
                {{language.getLabel('LBL_GROUP_UNTIL')}}
            </label>
            <div class="slds-form-element__control">
                <div class="slds-select_container">
                    <select class="slds-select" [(ngModel)]="pluginData.stopTreeAt">
                        <option></option>
                        <option *ngFor="let listField of listFields" [value]="listField.fieldid">
                            {{language.getLabel(listField.name)}}
                        </option>
                    </select>
                </div>
            </div>
        </div>
    </div>
    <div class="slds-grow slds-scrollable--y">
        <reports-designer-present-item-table></reports-designer-present-item-table>
    </div>
</div>
