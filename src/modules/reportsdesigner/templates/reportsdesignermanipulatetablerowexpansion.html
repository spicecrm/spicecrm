<ng-container *ngIf="reportsDesignerService.manipulateExpandedItemId == this.listItem.fieldid && reportsDesignerService.expertMode">
    <td colspan="8">
        <fieldset class="slds-form-element slds-form-element_compound slds-p-vertical--x-small">
            <div class="slds-form-element__control">
                <div class="slds-grid">
                    <div class="slds-form-element slds-size--1-of-2">
                        <label class="slds-form-element__label">{{language.getLabel('LBL_FIXED_VALUE')}}</label>
                        <div class="slds-form-element__control">
                            <input type="text" [(ngModel)]="listItem.fixedvalue" class="slds-input" tabindex="1" autofocus>
                        </div>
                    </div>
                    <div class="slds-form-element slds-size--1-of-2">
                        <label class="slds-form-element__label">{{language.getLabel('LBL_GROUPING')}}</label>
                        <div class="slds-form-element__control">
                            <input type="text" [(ngModel)]="listItem.grouping" class="slds-input">
                        </div>
                    </div>
                </div>
                <div class="slds-grid">
                    <div class="slds-form-element slds-size--1-of-2">
                        <label class="slds-form-element__label">{{language.getLabel('LBL_VALUE_TYPE')}}</label>
                        <div class="slds-form-element__control">
                            <div class="slds-select_container">
                                <select class="slds-select" [(ngModel)]="listItem.valuetype">
                                    <option></option>
                                    <option value="TOFSUM">{{language.getLabel('LBL_VALUE_TYPE_TOFSUM')}}</option>
                                    <option value="POFSUM">{{language.getLabel('LBL_VALUE_TYPE_POFSUM')}}</option>
                                    <option value="POFCOUNT">{{language.getLabel('LBL_VALUE_TYPE_POFCOUNT')}}</option>
                                    <option value="POFAVG">{{language.getLabel('LBL_VALUE_TYPE_POFAVERAGE')}}</option>
                                    <option value="DOFSUM">{{language.getLabel('LBL_VALUE_TYPE_DOFSUM')}}</option>
                                    <option value="DOFCOUNT">{{language.getLabel('LBL_VALUE_TYPE_DOFCOUNT')}}</option>
                                    <option value="DOFAVG">{{language.getLabel('LBL_VALUE_TYPE_DOFAVERAGE')}}</option>
                                    <option value="C">{{language.getLabel('LBL_VALUE_TYPE_C')}}</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="slds-form-element slds-size--1-of-2">
                        <label class="slds-form-element__label">{{language.getLabel('LBL_STORE')}}</label>
                        <div class="slds-form-element__control">
                            <input type="text" [(ngModel)]="listItem.assigntovalue" class="slds-input">
                        </div>
                    </div>
                </div>
                <div class="slds-grid">
                    <div class="slds-form-element slds-size--1-of-2">
                        <label class="slds-form-element__label">{{language.getLabel('LBL_SEQUENCE')}}</label>
                        <div class="slds-form-element__control">
                            <input type="text" [(ngModel)]="listItem.formulasequence" class="slds-input">
                        </div>
                    </div>
                </div>
                <div class="slds-form-element">
                    <label class="slds-form-element__label">{{language.getLabel('LBL_CUSTOM_FUNCTION')}}</label>
                    <system-input-base64 [(ngModel)]="listItem.customsqlfunction"></system-input-base64>
                </div>
                <div class="slds-form-element">
                    <label class="slds-form-element__label">{{language.getLabel('LBL_FORMULA')}}</label>
                    <system-input-base64 [(ngModel)]="listItem.formulavalue"></system-input-base64>
                </div>
            </div>
        </fieldset>
    </td>
</ng-container>
