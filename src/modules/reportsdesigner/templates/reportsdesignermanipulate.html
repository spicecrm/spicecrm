<div class="slds-grid" style="height: 100%">
    <div cdkDropList #dropList="cdkDropList" [cdkDropListData]="listItems" [cdkDropListConnectedTo]="[dragList]" (cdkDropListDropped)="onDrop($event)" class="slds-size--1-of-1 slds-border--left" style="height: 100%">
        <table class="slds-table slds-table--cell-buffer spice-table_header-fixed slds-table--fixed-layout slds-no-row-hover reports-designer-manipulate-table">
            <thead>
            <tr class="slds-text-title--caps slds-theme--shade">
                <th class="slds-cell-shrink"></th>
                <th>
                    <div class="slds-truncate">{{language.getLabel('LBL_PATH')}}</div>
                </th>
                <th scope="col">
                    <div class="slds-truncate">{{language.getLabel('LBL_NAME')}}</div>
                </th>
                <th scope="col">
                    <div class="slds-truncate">{{language.getLabel('LBL_FUNCTION')}}</div>
                </th>
                <th scope="col">
                    <div class="slds-truncate">{{language.getLabel('LBL_GROUP_BY')}}</div>
                </th>
                <th scope="col">
                    <div class="slds-truncate">{{language.getLabel('LBL_REQUIRED')}}</div>
                </th>
                <th class="slds-cell-shrink"></th>
                <th class="slds-cell-shrink"></th>
            </tr>
            </thead>
            <tbody>
                <ng-container *ngFor="let listItem of listItems; trackBy: trackByFn">
                    <tr reports-designer-manipulate-table-row
                        [listItem]="listItem" (onDelete)="deleteField(listItem.fieldid)"
                        cdkDrag [cdkDragData]="listItem" cdkDragBoundary=".reports-designer-manipulate-table"
                        class="slds-border--bottom slds-drag--preview">
                    </tr>
                    <tr reports-designer-manipulate-table-row-expansion [listItem]="listItem" class="slds-theme--shade" style="box-shadow: inset -1px 1px 6px 0 #aaa"></tr>
                </ng-container>
            </tbody>
        </table>
    </div>
</div>
