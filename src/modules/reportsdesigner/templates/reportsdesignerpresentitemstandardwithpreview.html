<div class="slds-grid slds-grid--vertical" tobottomnoscroll>
    <div class="slds-border--bottom slds-p-around--small slds-grid">
        <div class="slds-form-element slds-grid slds-grid--vertical-align-center">
            <label class="slds-form-element__label">
                {{language.getLabel('LBL_PROCESS_COUNT')}}
            </label>
            <div class="slds-form-element__control">
                <div class="slds-select_container">
                    <select class="slds-select" [(ngModel)]="pluginData.processCount">
                        <option value="Synchronous">{{language.getLabel('LBL_SYNCHRONOUS')}}</option>
                        <option value="Asynchronous">{{language.getLabel('LBL_ASYNCHRONOUS')}}</option>
                        <option value="None">{{language.getLabel('LBL_NONE')}}</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="slds-form-element slds-grid slds-grid--vertical-align-center slds-m-left--x-small">
            <label class="slds-form-element__label">
                {{language.getLabel('LBL_PREVIEW_FOR')}}
            </label>
            <div class="slds-form-element__control">
                <div class="slds-select_container">
                    <select class="slds-select" [(ngModel)]="pluginData.previewId">
                        <option></option>
                        <option *ngFor="let listField of listFields" [value]="listField.fieldid">
                            {{language.getLabel(listField.name)}}
                        </option>
                    </select>
                </div>
            </div>
        </div>
        <div class="slds-form-element slds-grid slds-grid--vertical-align-center slds-m-left--x-small">
            <label class="slds-form-element__label">
                {{language.getLabel('LBL_RECORDS_PER_PAGE')}}
            </label>
            <div class="slds-form-element__control">
                <div class="slds-form-element">
                    <div class="slds-form-element__control">
                        <input type="text" [(ngModel)]="pluginData.listEntries" class="slds-input">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="slds-grow slds-scrollable--y">
        <reports-designer-present-item-table></reports-designer-present-item-table>
    </div>
</div>
