<div class="slds-border--bottom" style="height: 50%">
    <div class="slds-tabs--default slds-grid slds-grid--vertical" style="height: 100%">
        <div class="slds-grid">
            <ul class="slds-tabs--default__nav slds-scrollable--x slds-grow spice-horizontal-scrollbar-position-top" role="tablist">
                <li (click)="setActiveModule()" [class.slds-active]="activeModule.unionid == 'root'"
                    class="slds-tabs--default__item slds-grid slds-grid_vertical-align-center" role="presentation">
                    <a class="slds-tabs--default__link slds-grid" href="javascript:void(0);" role="tab" aria-selected="false">
                        <system-icon [module]="model.getField('report_module')" size="small" divClass="slds-m-right--x-small"></system-icon>
                        <span class="slds-truncate">
                        {{language.getModuleName(model.getField('report_module'))}}
                    </span>
                    </a>
                </li>
                <li *ngFor="let unionModule of unionModules" (click)="setActiveModule(unionModule)" [class.slds-active]="unionModule.unionid == activeModule.unionid"
                    class="slds-tabs--default__item slds-grid slds-grid_vertical-align-center" role="presentation">
                    <a class="slds-tabs--default__link slds-grid" href="javascript:void(0);" role="tab" aria-selected="false">
                        <system-icon [module]="unionModule.module" size="small" divClass="slds-m-right--x-small"></system-icon>
                        <span class="slds-truncate">
                        {{language.getModuleName(unionModule.module)}}
                    </span>
                    </a>
                    <div class="slds-col_bump-left slds-p-left_none slds-p-right_none">
                        <button (click)="deleteUnionModule(unionModule.unionid)" class="slds-button slds-button_icon slds-button_icon-container slds-button_icon-x-small">
                            <system-button-icon icon="close"></system-button-icon>
                        </button>
                    </div>
                </li>
            </ul>
            <div class="slds-p-around--x-small slds-border--left slds-border--bottom">
                <button (click)="addUnionModule()" [disabled]="!canAdd" class="slds-button slds-button_icon">
                    <system-button-icon icon="add"></system-button-icon>
                </button>
            </div>
        </div>
        <div class="slds-grow" style="height: 0">
            <div [class.slds-hide]="activeModule.unionid != 'root'" class="slds-scrollable--y" style="height: 100%">
                <system-module-tree [module]="model.getField('report_module')" (itemSelected)="onItemSelection($event)"></system-module-tree>
            </div>
            <ng-container *ngFor="let unionModule of unionModules; trackBy: trackByFn">
                <div [class.slds-hide]="activeModule.unionid == 'root' || activeModule.unionid != unionModule.unionid" class="slds-scrollable--y" style="height: 100%">
                    <system-module-tree [module]="activeModule.module" (itemSelected)="onItemSelection($event)"></system-module-tree>
                </div>
            </ng-container>
        </div>
    </div>
</div>
<div class="slds-grid slds-grid--vertical" style="height: 50%">
    <div class=" slds-input-has-icon slds-input-has-icon_left" role="none">
        <system-utility-icon icon="search" addclasses="slds-input__icon slds-input__icon--left"></system-utility-icon>
        <input class="slds-input" type="search" [placeholder]="language.getLabel('LBL_SEARCH')" [(ngModel)]="filterKey"/>
    </div>
   <div class="slds-grow slds-scrollable--y">
       <table class="slds-table slds-table_cell-buffer slds-table_bordered">
           <thead>
           <tr class="slds-line-height_reset">
               <th class="slds-cell-shrink"></th>
               <th scope="col">
                   <div class="slds-truncate">{{language.getLabel('LBL_FIELD')}}</div>
               </th>
               <th scope="col">
                   <div class="slds-truncate">{{language.getLabel('LBL_NAME')}}</div>
               </th>
           </tr>
           </thead>
           <tbody [class.slds-hide]="isLoadingModuleFields" cdkDropList #dragList="cdkDropList" (cdkDropListExited)="dropExited($event)" (cdkDropListEntered)="dropEntered($event)" cdkDropListSortingDisabled [cdkDropListData]="reportFields" [cdkDropListConnectedTo]="dropLists">
           <tr cdkDrag [cdkDragData]="reportField" *ngFor="let reportField of filteredReportFields; trackBy: trackByFn" class="slds-hint-parent slds-drag--preview">
               <td class="slds-p-around--none slds-cell-shrink">
                   <system-utility-icon class="slds-p-horizontal--x-small" cdkDragHandle style="cursor: move" icon="drag_and_drop" size="x-small"></system-utility-icon>
               </td>
               <td data-label="Account Name">
                   <div class="slds-truncate" [title]="reportField.name">{{reportField.name}}</div>
               </td>
               <td>
                   <div class="slds-truncate" [title]="language.getLabel(reportField.label)">{{language.getLabel(reportField.label)}}</div>
               </td>
           </tr>
           </tbody>
           <tbody system-table-stencils *ngIf="isLoadingModuleFields" [columns]="2" [rows]="5" [select]="true"></tbody>
       </table>
   </div>
</div>
