<div class="slds-p-around--x-small">
    <fieldset class="slds-form-element slds-form-element_compound slds-m-bottom--medium">
        <legend class="slds-form-element__legend slds-form-element__label slds-text-title--caps">{{language.getLabel('LBL_UPDATE_TARGET_LIST')}}</legend>
        <div class="slds-form-element__control slds-p-left--small slds-p-top--small">
            <div class="slds-form-element__row">
                <div class="slds-form-element slds-size--1-of-1">
                    <label class="slds-form-element__label">
                        {{language.getLabel('LBL_PROSPECTLIST')}}
                    </label>
                    <system-input-relate module="ProspectLists" [(ngModel)]="targetList" class="slds-grow" style="display: block; margin: 0 -5px;"></system-input-relate>
                </div>
            </div>
            <div class="slds-form-element__row">
                <div class="slds-form-element slds-size--1-of-1">
                    <label class="slds-form-element__label">
                        {{language.getLabel('LBL_ACTION')}}
                    </label>
                    <div class="slds-select_container slds-grow">
                        <select class="slds-select" [(ngModel)]="properties.targetlist_update_action">
                            <option></option>
                            <option value="rep">{{language.getLabel('LBL_UPDATE')}}</option>
                            <option value="add">{{language.getLabel('LBL_ADD')}}</option>
                            <option value="sub">{{language.getLabel('LBL_SUBTRACT')}}</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </fieldset>
    <fieldset class="slds-form-element slds-form-element_compound slds-m-top--small slds-has-divider--top-space">
        <legend class="slds-form-element__legend slds-form-element__label slds-text-title--caps">{{language.getLabel('LBL_PERFORMANCE_SETTINGS')}}</legend>
        <div class="slds-form-element__control slds-p-left--small slds-p-top--small">
            <div class="slds-form-element__row">
                <div class="slds-form-element">
                    <system-checkbox [(ngModel)]="properties.targetlist_create_direct">
                        {{language.getLabel('LBL_CREATE_DIRECT')}}
                    </system-checkbox>
                </div>
            </div>
        </div>
    </fieldset>
</div>
