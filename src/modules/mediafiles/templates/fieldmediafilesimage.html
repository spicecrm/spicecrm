<field-label *ngIf="displayLabel" [fieldname]="fieldname" [fieldconfig]="fieldconfig"></field-label>
<field-generic-display *ngIf="!isEditMode()" [editable]="isEditable()" [fieldconfig]="fieldconfig" [title]="value" [fieldid]="fieldid">
    <div class="slds-align--absolute-center slds-box--border slds-theme--shade">
        <div class="slds-p-around--x-small">
            <img *ngIf="value" [src]="'data:image/jpg;base64,'+value">
        </div>
    </div>
</field-generic-display>
<div *ngIf="isEditable() && isEditMode()" class="slds-form-element__control slds-m-vertical--xx-small" [ngClass]="css_classes">
    <div class="slds-box--border">
        <system-input-media [(ngModel)]="value" class="slds-height_full" [mimetype]="'image/jpeg'"></system-input-media>
    </div>
</div>
