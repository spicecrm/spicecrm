<div class="slds-modal slds-fade-in-open slds-modal_large">
    <div class="slds-modal__container">
        <div *ngIf="!isLoading" class="slds-modal__header slds-theme_shade">
            <h2 class="slds-text-heading--medium">{{language.getLabel('LBL_MEDIAFILE_PICKER')}}</h2>
        </div>

        <div class="slds-modal__content slds-p-around--medium" style="height:100%">

            <system-spinner *ngIf="pickerIsLoading"></system-spinner>

            <ng-container *ngIf="!pickerIsLoading">

                <div class="slds-form-element slds-m-bottom--medium">
                    <label class="slds-form-element__label" for="select-mediacategory">{{language.getLabel('LBL_FILTER')}}: {{language.getLabel('LBL_CATEGORY')}}</label>
                    <div class="slds-form-element__control">
                        <div class="slds-select_container">
                            <select class="slds-select" id="select-mediacategory" (change)="onChangeCategory($event)">
                                <option *ngIf="dropdownUnused" value="" style="font-style: italic" selected>{{language.getLabel('LBL_MAKE_SELECTION')}} …</option>
                                <option value="*" style="font-style: italic">{{language.getLabel('LBL_ALL_FILES')}}</option>
                                <option value="-" style="font-style: italic">{{language.getLabel('LBL_FILES_WITHOUT_CATEGORIES')}}</option>
                                <option *ngFor="let category of mediafiles.categoriesSorted" value="{{category.id}}">{{category.fullName}}</option>
                            </select>
                        </div>
                    </div>
                </div>

                <fieldset class="slds-form-element slds-m-vertical--medium">
                    <legend class="slds-form-element__legend slds-form-element__label">File Formats:</legend>
                    <div class="slds-form-element__control">
                        <div class="slds-checkbox_button-group">
                            <span *ngFor="let format of fileformatList" class="slds-button slds-checkbox_button">
                                <input type="checkbox" [id]="componentInstanceId+'-fmt-'+format.format" [(ngModel)]="format.checked" />
                                <label class="slds-checkbox_button__label" [for]="componentInstanceId+'-fmt-'+format.format">
                                    <span class="slds-checkbox_faux">{{format.name}}</span>
                                </label>
                            </span>
                        </div>
                    </div>
                </fieldset>

                <fieldset class="slds-form-element">
                    <legend class="slds-form-element__legend slds-form-element__label">Direction</legend>
                    <div class="slds-form-element__control">
                        <div class="slds-radio_button-group">
                            <span class="slds-button slds-radio_button">
                                <input type="radio" name="radio" [id]="componentInstanceId+'-dir-a'" [name]="componentInstanceId+'-dir'" value="d" [(ngModel)]="sortDirection" />
                                <label class="slds-radio_button__label" [for]="componentInstanceId+'-dir-a'">
                                    <span class="slds-radio_faux">ASC</span>
                                </label>
                            </span>
                        </div>
                    </div>
                    <div class="slds-form-element__control">
                        <div class="slds-radio_button-group">
                            <span class="slds-button slds-radio_button">
                                <input type="radio" name="radio" [id]="componentInstanceId+'-dir-d'" [name]="componentInstanceId+'-dir'" value="d" [(ngModel)]="sortDirection"/>
                                <label class="slds-radio_button__label" [for]="componentInstanceId+'-dir-d'">
                                    <span class="slds-radio_faux">DESC</span>
                                </label>
                            </span>
                        </div>
                    </div>
                </fieldset>

                <div class="slds-form-element">
                    <label class="slds-form-element__label" [for]="componentInstanceId+'order-by'">Order by:</label>
                    <div class="slds-form-element__control">
                        <div class="slds-select_container">
                            <select class="slds-select" [id]="componentInstanceId+'order-by'" [(ngModel)]="sortBy">
                                <option value="name">Name</option>
                                <option value="filesize">File Size</option>
                                <option value="date_entered">Date</option>
                            </select>
                        </div>
                    </div>
                </div>

                <ul class="media-file-picker">
                    <ng-container *ngFor="let file of files; let i=index">
                        <li *ngIf="(( file.mediacategory_id == '' && selectedCategoryID === '-' ) || selectedCategoryID === '*' || ( file.mediacategory_id && selectedCategory && mediafiles.fileIsInCategory( file.mediacategory_id, selectedCategory ))) && fileformats[file.filetype] && fileformats[file.filetype].checked" class="slds-m-right--small slds-m-bottom--small">
                            <a class="slds-theme_shade" href="javascript:void(0);" (click)="pick(i)"><img [src]="sanitizer.bypassSecurityTrustResourceUrl( 'data:image/jpg;base64,'+file.thumbnail )" style="max-width:150px;max-height:150px"></a>
                        </li>
                    </ng-container>
                </ul>

            </ng-container>

        </div>

        <div class="slds-modal__footer slds-modal__footer_directional">
            <button class="slds-button slds-button--brand" (click)="changeToUploadDialog()">{{language.getLabel('LBL_UPLOAD_NEW_FILE')}} …</button>
            <button class="slds-button slds-button--neutral" (click)="cancel()">{{language.getLabel('LBL_CLOSE')}}</button>
        </div>

    </div>
</div>
