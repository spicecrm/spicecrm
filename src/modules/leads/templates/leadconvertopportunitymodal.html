<system-modal size="large">
    <system-modal-header (close)="close()">{{language.getLabel('LBL_CONVERT_TO_OPPORTUNITY')}}</system-modal-header>
    <system-modal-content>
        <div #detailcontainer></div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()">{{language.getLabel('LBL_CLOSE')}}</button>
        <button class="slds-button slds-button--brand" (click)="convert()">{{language.getLabel('LBL_CONVERT_LEAD')}}</button>
    </system-modal-footer>
</system-modal>
