<div role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
    <div class="slds-modal__container">
        <div class="slds-modal__header">
            <button class="slds-button slds-modal__close slds-button--icon-inverse" title="Close">
                <svg class="slds-button__icon slds-button__icon--large" aria-hidden="true" (click)="close()">
                    <use xlink:href="./sldassets/icons/utility-sprite/svg/symbols.svg#close"></use>
                </svg>
            </button>
            <h2 class="slds-text-heading--medium">{{language.getModuleLabel('Leads', 'LBL_CONVERT_LEAD')}}</h2>
        </div>
        <div class="slds-modal__content slds-p-around--medium">
            <div class="slds-grid slds-grid--align-spread slds-p-vertical--small " *ngFor="let saveaction of saveactions; let i = index ;" [ngClass]="{'slds-border--bottom' : itemBorder(i)}">
                <div class="slds-truncate">{{language.getLabel(saveaction.label)}}</div>
                <div>{{saveaction.status}}</div>
            </div>
        </div>
    </div>
</div>
