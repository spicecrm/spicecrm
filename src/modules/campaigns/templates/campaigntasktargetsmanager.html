<div class="slds-page-header slds-grid slds-grid--align-spread">
    <div class="slds-col">
        <nav role="navigation" aria-label="Breadcrumbs">
            <ol class="slds-breadcrumb slds-list_horizontal slds-wrap">
                <li class="slds-breadcrumb__item slds-text-title_caps">
                    <a href="javascript:void(0);" (click)="goModule()"><system-label-modulename [module]="parent.module"></system-label-modulename></a>
                </li>
                <li class="slds-breadcrumb__item slds-text-title_caps">
                    <a href="javascript:void(0);" (click)="goModel()">{{parent.data.summary_text}}</a>
                </li>
                <li class="slds-breadcrumb__item slds-text-title_caps">
                    <span class="slds-p-horizontal--x-small"><system-label label="LBL_MANAGE_TARGETS"></system-label></span>
                </li>
            </ol>
        </nav>
    </div>
    <div class="slds-page-header__col-actions slds-grid">
        <div class="slds-grid slds-gutters_direct-xx-small">
            <div class="slds-form-element slds-col">
                <div class="slds-form-element__control">
                    <div class="slds-select_container">
                        <select class="slds-select">
                            <option *ngFor="let pl of prospectLists" [ngValue]="pl.id">{{pl.name}}</option>
                        </select>
                    </div>
                </div>
            </div>
            <system-input-delayed class="slds-col" [(ngModel)]="searchterm" placeholder="LBL_SEARCHTERM" delay="1000"></system-input-delayed>
        </div>
        <div class="slds-page-header__controls">
            <div class="slds-page-header__control">
                <button class="slds-button slds-button--icon slds-button--icon-border-filled">
                    <system-button-icon icon="refresh" (click)="reload()"></system-button-icon>
                </button>
            </div>
            <div class="slds-page-header__control">
                <button class="slds-button slds-button--icon slds-button--icon-border-filled">
                    <system-button-icon icon="add" (click)="add()"></system-button-icon>
                </button>
            </div>
        </div>
    </div>
</div>
<div class="slds-theme--default" (system-to-bottom)="onScroll()" style="min-height: 100px">
    <table  class="slds-table slds-table--fixed-layout slds-max-medium-table--stacked-horizontal slds-table--header-fixed"  role="grid">
        <thead>
            <tr class="slds-text-title--caps">
                <th scope="col" style="width: 2rem"></th>
                <th scope="col"><div class="slds-th__action"><system-label label="LBL_NAME"></system-label></div></th>
                <th scope="col" style="width: 15rem"><div class="slds-th__action"><system-label label="LBL_PROSPECTLISTS"></system-label></div></th>
                <th scope="col" style="width: 5rem"></th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let prospect of prospects" class="slds-hint-parent">
                <td class="slds-text-align--center"><system-icon [module]="prospect.module" size="xx-small"></system-icon></td>
                <td><campaigntask-target-manager-details [module]="prospect.module" [data]="prospect.data"></campaigntask-target-manager-details></td>
                <td>{{getProspectListsDisplay(prospect.prospectlists)}}</td>
                <td class="slds-text-align--right">
                    <button class="slds-button slds-button--icon">
                        <system-utility-icon class="slds-col" icon="success" size="xx-small" [colorclass]="prospect.status == 'ok' ? 'slds-icon-text-success' : 'slds-icon-text-light'"></system-utility-icon>
                    </button>
                    <button class="slds-button slds-button--icon">
                        <system-utility-icon class="slds-col" icon="error" size="xx-small" [colorclass]="prospect.status == 'error' ? 'slds-icon-text-error' : 'slds-icon-text-light'"></system-utility-icon>
                    </button>
                </td>
            </tr>
        </tbody>
        <tbody system-table-stencils columns="4" rows="20" *ngIf="loading"></tbody>
    </table>
    <!--div class="slds-size--1-of-1 slds-p-around--small slds-align--absolute-center" *ngIf="noAutoLoad && canLoadMore">
        <button class="slds-button slds-button--neutral" (click)="loadMore()">
            <system-button-icon class="slds-p-right--x-small" icon="skip_forward"></system-button-icon>
            <system-label label="LBL_LOAD_MORE"></system-label>
        </button>
    </div-->
    <div *ngIf="!loading && prospects.length == 0" class="slds-align--absolute-center" style="height: calc(100% - 35px)">
        <system-illustration-no-records><system-label label="MSG_NO_RECORDS_FOUND"></system-label></system-illustration-no-records>
    </div>
</div>
