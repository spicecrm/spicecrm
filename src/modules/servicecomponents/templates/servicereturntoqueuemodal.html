<system-modal>
    <system-modal-header (close)="cancel()">
        <system-label label="RETURN_TO_QUEUE"></system-label>
    </system-modal-header>
    <system-modal-content>
        <div *ngIf="displaynote" class="slds-form-element slds-p-top--small">
            <label class="slds-form-element__label">
                <system-label label="LBL_NOTE"></system-label>
            </label>
            <div class="slds-form-element__control">
                <textarea class="slds-textarea" [(ngModel)]="note"></textarea>
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="cancel()">
            <system-label label="LBL_CANCEL"></system-label>
        </button>
        <button class="slds-button slds-button--brand" (click)="save()">
            <system-label label="LBL_SAVE"></system-label>
        </button>
    </system-modal-footer>
</system-modal>
