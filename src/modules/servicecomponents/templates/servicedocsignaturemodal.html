<system-modal size="large">
    <system-modal-header (close)="close()">{{modalTitle}}</system-modal-header>
    <system-modal-content margin="none">
        <div class="slds-modal__content" >
            <div class="slds-form-element__control slds-grid slds-grid--vertical-align-center slds-p-around--small">
                <label class="slds-col slds-p-right--x-small"><system-label label="LBL_TEMPLATE"></system-label></label>
                <select class="slds-col slds-select slds-grow" [(ngModel)]="selected_template" [disabled]="templates.length == 0">
                    <option *ngFor="let templ of templates" [ngValue]="templ">{{templ.name}} ({{templ.language}})</option>
                </select>
                <ng-container *ngIf="!forcedFormat">
                    <label class="slds-p-left--small slds-col slds-p-right--x-small"><system-label label="LBL_DISPLAY"></system-label></label>
                </ng-container>
                <button *ngIf="this.metadata.checkModuleAcl(model.module, 'create')" [disabled]="!selected_template || loading_output || selected_format === 'html'" class="slds-button slds-button--icon slds-button--icon-border slds-m-left--small slds-is-selected" [ngClass]="{'slds-is-selected' : expanded == 'open' || expanded == 'open_mobile'}" (click)="openContentArea()"><system-button-icon icon="edit_form"></system-button-icon></button>
            </div>
            <div class="slds-grid" style="height: 70vh;">
                <div class="slds-p-around--small" [ngStyle]="{ 'width': mobile? '0%' : '50%' }" style="height: 100%" [@slideInOut]="expanded">
                    <div class="slds-m-top--small slds-border--top slds-border--right slds-border--left slds-border--bottom" style="width: 100%; height: calc(100% - 50px);">
                        <object *ngIf="selected_format === 'pdf' && !loading_output && blobUrl" [data]="blobUrl" type="application/pdf" width="100%" height="100%"></object>
                        <!-- a spinner when the template is loading-->
                        <div *ngIf="loading_output" class="slds-align--absolute-center" style="height: 100%;">
                            <system-spinner></system-spinner>
                        </div>
                        <!-- display label to prompt the user to select a template -->
                        <div *ngIf="!selected_template && !loading_output" class="slds-align--absolute-center" style="height: 100%;">
                            <system-label label="LBL_SELECT_TEMPLATE"></system-label>
                        </div>
                    </div>
                </div>
                <div class="slds-scrollable" style="height: 100%;" [ngStyle]="{ 'width': mobile? '100%' : '50%' }" [@slideInOut2]="expanded" (@slideInOut2.done)="onAnimationDone()">
                    <service-docs-signature-content #emailcontent [fieldset]="fieldset" [parent]="model" (rendertemplate)="rendertemplate()"></service-docs-signature-content>
                </div>
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CLOSE"></system-label></button>
        <button [disabled]="!selected_template || loading_output" class="slds-button slds-button--brand" (click)="saveSignature()">{{language.getLabel('LBL_SAVE_SIGNATURE')}}</button>
    </system-modal-footer>
</system-modal>
