<field-label *ngIf="displayLabel" [fieldname]="fieldname" [fieldconfig]="fieldconfig"></field-label>
<div [ngClass]="fielddisplayclass">
    <system-stencil *ngIf="model.isLoading; else displaycontent"></system-stencil>
    <ng-template #displaycontent>
        <div class="slds-grid slds-grid--vertical-align-center slds-grid--align-spread">
            <div class="slds-truncate" (click)="goRecord()" style="min-height: 20px;">
                {{value}}
            </div>
            <div *ngIf="!model.getField('return_to_servicequeue_id'); else returnQueue">
                <button style="float: right" class="slds-button slds-button--icon slds-m-left--xx-small"
                        [disabled]="!canChange" (click)="selectQueue()">
                    <system-button-icon [icon]="'change_record_type'"></system-button-icon>
                </button>
            </div>
            <ng-template #returnQueue>
                <button style="float: right" class="slds-button slds-button--icon slds-m-left--xx-small" [disabled]="!model.checkAccess('edit')"
                        (click)="returnToQueue()">
                    <system-button-icon [icon]="'skip_back'"></system-button-icon>
                </button>
            </ng-template>
        </div>
    </ng-template>
</div>
