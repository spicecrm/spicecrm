<system-modal>
    <system-modal-header (close)="cancel()">
        {{language.getLabel('LBL_SELECT_QUEUE')}}
    </system-modal-header>
    <system-modal-content>
        <div *ngIf="loading; else queuelist" class="slds-align--absolute-center slds-p-around--medium">
            <system-spinner></system-spinner>
        </div>
        <ng-template #queuelist>
            <fieldset class="slds-form-element">
                <legend class="slds-form-element__legend slds-form-element__label">{{language.getLabel('LBL_AVAILABLE_QUEUES')}}</legend>
                <div class="slds-form-element__control">
                    <span class="slds-radio" *ngFor="let queue of queues">
                      <input type="radio" [id]="queue.id" [value]="queue.id" name="queue" [(ngModel)]="selectedqueueid"/>
                      <label class="slds-radio__label" [attr.for]="queue.id">
                        <span class="slds-radio_faux"></span>
                        <span class="slds-form-element__label">{{queue.name}}</span>
                      </label>
                    </span>
                </div>
            </fieldset>
            <div *ngIf="displaynote" class="slds-form-element slds-p-top--small">
                <label class="slds-form-element__label">{{language.getLabel('LBL_NOTE')}}</label>
                <div class="slds-form-element__control">
                    <textarea class="slds-textarea" [(ngModel)]="note"></textarea>
                </div>
            </div>
        </ng-template>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="cancel()">{{language.getLabel('LBL_CANCEL')}}</button>
        <button class="slds-button slds-button--brand" (click)="save()">{{language.getLabel('LBL_SAVE')}}</button>
    </system-modal-footer>
</system-modal>
