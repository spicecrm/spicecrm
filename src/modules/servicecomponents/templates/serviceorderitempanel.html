<table class="slds-table slds-table_bordered">
    <thead>
        <th style="width: 60px"></th>
        <th *ngFor="let fieldsetField of fieldsetFields">
            <field-label class="slds-truncate" addclasses="slds-truncate" [fieldname]="fieldsetField.field" [fieldconfig]="fieldsetField.fieldconfig"></field-label>
        </th>
    </thead>
    <tbody *ngIf="itemcount > 0">
    <ng-container *ngFor="let item of items|serviceorderitempipe">
        <tr serviceorder-item-item [item]="item" [parentview]="view" [serviceorder]="model" ></tr>
    </ng-container>
    </tbody>
    <tbody *ngIf="itemcount == 0">
        <div class="slds-p-around--medium slds-align--;absolute-center">
            <system-label label="LBL_NO_ENTRIES"></system-label>
        </div>
    </tbody>
    <tfoot>
        <tr align="center">
            <td [ngStyle]="{'visibility': editing == '1' ? 'visible' : 'hidden'}">
                <div class="slds-p-around--medium slds-align--absolute-center">
                    <button type="button" class="slds-button slds-button--neutral" (click)="addItem()"><system-label label="LBL_ADD"></system-label></button>
                </div>
            </td>
        </tr>
    </tfoot>
</table>
