<system-modal>
    <system-modal-header (close)="close()"><system-label label="LBL_CONFIRM_SERVICEORDER"></system-label></system-modal-header>
    <system-modal-content [grow]="true" margin="none">
        <system-componentset [componentset]="componentset"></system-componentset>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CLOSE"></system-label></button>
        <button class="slds-button slds-button--brand" (click)="confirm()"><system-label label="LBL_SAVE"></system-label></button>
    </system-modal-footer>
</system-modal>
