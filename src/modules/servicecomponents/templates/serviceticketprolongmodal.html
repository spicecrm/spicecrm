<system-modal>
    <system-modal-header (close)="cancel()">
        <system-label label="LBL_PROLONG"></system-label>
    </system-modal-header>
    <system-modal-content margin="none">
        <div class="slds-grid slds-gutters_direct-x-small">
            <div class=" slds-col slds-size--1-of-2">
                <system-input-date-picker [setDate]="prolongDate" [minDate]="minDate" [maxDate]="maxDate" (datePicked)="setDate($event)"></system-input-date-picker>
            </div>
            <div class="slds-col slds-size--1-of-2">
                <div class="slds-form-element slds-p-horizontal--x-small">
                    <div *ngIf="componentset!=''">
                        <system-componentset [componentset]="componentset"></system-componentset>
                    </div>
                    <!-- for backward compatiblity before fieldset rendering introduction in 2022.03.001 -->
                    <div *ngIf="!componentset || componentset==''" class="slds-form-element slds-p-horizontal--x-small">
                        <label class="slds-form-element__label"><system-label label="LBL_REASON"></system-label></label>
                        <div class="slds-form-element__control">
                            <textarea rows="15" style="resize: none" class="slds-textarea" [(ngModel)]="prolongReason"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" [disabled]="saving"  (click)="cancel()"><system-label label="LBL_CANCEL"></system-label></button>
        <button class="slds-button slds-button--brand" [disabled]="saving" (click)="save()"><system-label label="LBL_SAVE"></system-label></button>
    </system-modal-footer>
</system-modal>
