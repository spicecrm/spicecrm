<system-modal size="large">
    <system-modal-header (close)="close()"><system-label label="LBL_ASSIGN_TICKET_TO"></system-label></system-modal-header>
    <system-modal-content grow="true">
        <object-record-fieldset [fieldset]="fieldset" direction="vertical"></object-record-fieldset>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral"  (click)="close()"><system-label label="LBL_CANCEL"></system-label></button>
        <button class="slds-button slds-button--brand"  (click)="setAssign()" [disabled]="!canSave"><system-label label="LBL_ASSIGN"></system-label></button>
    </system-modal-footer>
</system-modal>
