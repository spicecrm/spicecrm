<div style="height: 100%; overflow: hidden;">
    <div class="slds-grid slds-grid--vertical-align-center slds-border--bottom slds-p-around--x-small">
        <system-icon module="ServiceTickets" size="small"></system-icon>
        <h2 class="slds-text-heading--medium slds-p-bottom--xx-small"><system-label label="LBL_UNASSGINED_TICKETS"></system-label> ({{totalcount}})</h2>
    </div>
    <div #ticketcontainer class="slds-scrollable--y" [ngStyle]="containerStyle">
        <div *ngIf="tickets.length==0 && !isLoading;else itemscontainer" style="height: 100%; width:100%;" class="slds-align--absolute-center">
            <span class="slds-text-heading_medium"><system-label label="MSG_NO_RECORDS_FOUND"></system-label></span>
        </div>
        <ng-template #itemscontainer>
            <service-myqueues-tickets-dashlet-item *ngFor="let ticket of tickets" [ticket]="ticket"></service-myqueues-tickets-dashlet-item>
            <div *ngIf="isLoading" class="slds-p-around--small slds-align--absolute-center">
                <system-spinner></system-spinner>
            </div>
        </ng-template>
    </div>
</div>
