<div class="slds-grid slds-grid--vertical">
    <div class="slds-grid slds-p-vertical--xx-small">
        <div class="slds-size--1-of-2 slds-p-right--xx-small">
            <system-label label="LBL_DEFAULT_QUEUE"></system-label>
            <div class="slds-form-element__control">
                <div class="slds-select_container">
                    <select [disabled]="queues.length == 0" class="slds-select" [(ngModel)]="addParams.servicequeue_id">
                        <option value=""></option>
                        <option *ngFor="let queue of queues" [value]="queue.id">{{queue.name}}</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="slds-size--1-of-2 slds-p-left--xx-small">
            <system-label label="LBL_QUESTIONNAIRE"></system-label>
            <div class="slds-form-element__control">
                <div class="slds-select_container">
                    <select [disabled]="questionnaires.length == 0" class="slds-select" [(ngModel)]="addParams.questionnaire_id">
                        <option value=""></option>
                        <option *ngFor="let questionnaire of questionnaires" [value]="questionnaire.id">{{questionnaire.name}}</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
</div>
