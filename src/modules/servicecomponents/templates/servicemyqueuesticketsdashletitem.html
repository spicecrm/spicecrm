<div class="slds-p-around--x-small slds-grid">
    <div class="slds-media">
        <div class="slds-media__figure slds-m-right--none">
            <system-icon module="ServiceTickets" [size]="'small'"></system-icon>
        </div>
        <div class="slds-media__body">
            <div class="slds-text-title_caps slds-text-link_reset">
                <object-record-fieldset-horizontal-list [fieldset]="headerfieldset"></object-record-fieldset-horizontal-list>
            </div>
            <div class="slds-text-body_small slds-line-height_reset">
                <object-record-fieldset-horizontal-list [fieldset]="detailfieldset"></object-record-fieldset-horizontal-list>
            </div>
        </div>
    </div>
</div>
