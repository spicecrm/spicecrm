<system-modal>
    <system-modal-header (close)="close()">Close Ticket</system-modal-header>
    <system-modal-content>
        <object-record-fieldset [fieldset]="fieldset" direction="vertical"></object-record-fieldset>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral"  (click)="close()">{{language.getLabel('LBL_CANCEL')}}</button>
        <button class="slds-button slds-button--brand"  (click)="setStatus()" [disabled]="!canSave">{{language.getLabel('LBL_CLOSE')}}</button>
    </system-modal-footer>
</system-modal>
