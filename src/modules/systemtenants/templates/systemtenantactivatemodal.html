<system-modal>
    <system-modal-header (close)="close()"><system-label label="LBL_ACTIVATE"></system-label></system-modal-header>
    <system-modal-content>
        activate
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CANCEL"></system-label></button>
        <button class="slds-button slds-button--brand" (click)="initialize()"><system-label label="LBL_OK"></system-label></button>
    </system-modal-footer>
</system-modal>
