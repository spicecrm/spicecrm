<div class="slds-tile slds-tile--board slds-m-horizontal_xx-small slds-p-around_xx-small slds-border_bottom"
     [ngClass]="{'slds-theme_shade':telecockpitservice.selectedLogId == model.id}">
    <div class="slds-grid slds-grid--vertical-align-center slds-m-bottom--small">
        <div class="slds-media__figure slds-m-right--none">
                <span class="slds-icon_container" title="{{ model.model }}">
                    <system-icon [module]="model.module" size="x-small"></system-icon>
                </span>
        </div>

        <h3 class="slds-truncate slds-text-heading--small">
            <a (click)="setselectedLogId()" href="javascript:void(0);">
                {{ model.data.name }}
            </a>
        </h3>
        <div class="slds-col--bump-left">
            <span *ngIf="item.related_id" class="slds-icon_container" title="{{ model.model }}">
                        <system-icon icon="outbound_call" [sprite]="'utility'" [size]="'x-small'" divClass="slds-p-right--xxx-small"
                                     [addclasses]="'slds-m-vertical--xxx-small slds-m-horizontal--xx-small'"></system-icon>
            </span>
            <span *ngIf="item.hits > 0" class="slds-box slds-box_xx-small slds-theme--error"
                  [ngStyle]="getHitsStyle()">
                {{ item.hits }}
            </span>
        </div>
    </div>
    <div class="slds-tile__detail slds-text-body--small">
        <div class="slds-grid" *ngFor="let componentField of componentFields">
            <field-label class="slds-truncate" [fieldname]="componentField.field"
                         [fieldconfig]="componentField.fieldconfig"></field-label>
            <field-container class="slds-col--bump-left slds-truncate" [field]="componentField.field"
                             [fieldconfig]="componentField.fieldconfig"
                             [fielddisplayclass]="'slds-truncate'"></field-container>
        </div>
        <div *ngIf="item.planned_activity_date" class="slds-grid">
            <label class="slds-truncate">{{language.getLabel('LBL_PLANNED_ACTIVITY_DATE')}}</label>
            <div class="slds-col--bump-left slds-truncate slds-text-color_error">{{ item.planned_activity_date | slice:0:16 }}</div>
        </div>
    </div>
</div>
