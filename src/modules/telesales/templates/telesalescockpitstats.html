<div class="slds-p-around--small slds-border--top slds-grid slds-grid--vertical-align-center">
    <div class="slds-is-relative slds-grow slds-m-horizontal--x-small" [title]="getTitle">
        <div *ngFor="let status of statSequence" class="slds-is-absolute" [ngClass]="statColorClass[status]" style="height: 5px;" [ngStyle]="getstatStyle(status)"></div>
        <!--div style="width: 100%; height: 5px" class="slds-theme--shade slds-is-absolute" title="open"></div>
        <div style="width: 30%; height: 5px;" class="slds-theme--success slds-is-absolute" title="completed"></div>
        <div style="width: 20%; height: 5px;; left: 30%;" class="slds-theme--warning slds-is-absolute" title="attempting"></div>
        <div style="width: 15%; height: 5px; left: 50%;" class="slds-theme--error slds-is-absolute" title="maxattempts"></div-->
    </div>
    <button class="slds-button slds-button--icon" (click)="refresh()">
        <system-button-icon icon="refresh"/>
    </button>
</div>
