<div class="slds-grid slds-page-header slds-p-around--none slds-grid--vertical-align-center">
    <div class="slds-p-right--xx-small slds-size--1-of-4 slds-grid">
        <div class="slds-p-around--xx-small slds-grow">
            <select [ngModel]="selectedCampaignTask" (ngModelChange)="selectCampaignTask($event)" [disabled]="campaignTasks.length == 0" class="slds-select">
                <option *ngFor="let campaigntask of campaignTasks; trackBy: trackByFn" [ngValue]="campaigntask">
                    {{getCampaigntaskDisplay(campaigntask)}}
                </option>
            </select>
        </div>
        <button [disabled]="!telecockpitservice.selectedcampaigntask" class="slds-m-left--xx-small slds-button slds-button--icon" (click)="telecockpitservice.loadData(telecockpitservice.selectedcampaigntask.id)">
            <system-button-icon icon="refresh"/>
        </button>
    </div>
    <div *ngIf="model.id" class="slds-grid slds-grid--vertical-align-center slds-size--3-of-4 slds-border--left" style="margin-left: -2px;">
        <div class="slds-col slds-has-flexi-truncate slds-p-around--small">
            <div class="slds-media slds-no-space slds-grow">
                <system-icon [module]="model.module"></system-icon>
                <div class="slds-media__body">
                    <p class="slds-text-title--caps slds-line-height--reset">
                        <a href="javascript:void(0);"><system-label-modulename [module]="model.module"></system-label-modulename></a>
                    </p>
                    <div>
                        <div class="slds-page-header__title slds-m-right--small slds-align-middle slds-truncate">
                            <ng-container *ngIf="!fieldset">{{model.data.summary_text}}</ng-container>
                            <div *ngIf="fieldset" class="slds-grid">
                                <field-container *ngFor="let fieldsetItem of fieldsetItems"
                                                 [field]="fieldsetItem.field" [fieldconfig]="fieldsetItem.fieldconfig"
                                                 fielddisplayclass="slds-p-right--small"></field-container>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="slds-p-around--small slds-col--bump-left">
            <tele-sales-cockpit-module-actions [module]="model.module"></tele-sales-cockpit-module-actions>
            <object-action-container [disabled]="telecockpitservice.isLocked(undefined, true)" class="slds-m-left--small" [actionset]="getActionsetId"></object-action-container>
        </div>
    </div>
</div>
