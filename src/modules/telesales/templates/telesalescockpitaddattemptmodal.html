<system-modal size="medium">
    <system-modal-header (close)="cancel()"><system-label label="LBL_ADD_ATTEMPT"></system-label></system-modal-header>
    <system-modal-content>
            <object-record-fieldset [fieldset]="fieldset" [direction]="'vertical'"></object-record-fieldset>
    </system-modal-content>
    <system-modal-footer>
        <system-checkbox [(ngModel)]="reserved">
            <system-label label="LBL_RESERVE_FOR_USER"></system-label></system-checkbox>
        <button *ngIf="model.data.hits >= maxAttempts" class="slds-button slds-button--neutral" (click)="remove()">
            <system-label label="LBL_REMOVE"></system-label>
        </button>
        <button class="slds-button slds-button--brand" (click)="save()"><system-label label="LBL_SAVE"></system-label></button>
    </system-modal-footer>
</system-modal>
