<system-modal size="medium">
    <system-modal-header (close)="cancel()">{{language.getLabel('LBL_ADD_ATTEMPT')}}</system-modal-header>
    <system-modal-content>
            <object-record-fieldset [fieldset]="fieldset" [direction]="'vertical'"></object-record-fieldset>
    </system-modal-content>
    <system-modal-footer>
        <button *ngIf="model.data.hits >= maxAttempts" class="slds-button slds-button--neutral" (click)="remove()">
            {{language.getLabel('LBL_REMOVE')}}
        </button>
        <button class="slds-button slds-button--brand" (click)="save()">{{language.getLabel('LBL_SAVE')}}</button>
    </system-modal-footer>
</system-modal>
