<system-modal>
    <system-modal-header (close)="close()">
        <system-label label="LBL_ADD_TERRITORY"></system-label>
    </system-modal-header>
    <system-modal-content>
        <div>
            <field-label fieldname="name"></field-label>
            <field-container field="name"></field-container>
        </div>
        <div>
            <field-label fieldname="assigned_user_name"></field-label>
            <field-container field="assigned_user_name"></field-container>
        </div>
        <aclterritorries-manager-territory-values [territorrytypedetails]="territorrytypedetails"></aclterritorries-manager-territory-values>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CANCEL"></system-label></button>
        <button class="slds-button slds-button--brand" [disabled]="addDisabled" (click)="save()"><system-label label="LBL_SAVE"></system-label></button>
    </system-modal-footer>
</system-modal>
