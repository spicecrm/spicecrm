<system-modal>
    <system-modal-header (close)="close()">
        {{language.getLabel('LBL_ADD_VALUE')}}
    </system-modal-header>
    <system-modal-content>
        <div class="slds-form-element">
            <label class="slds-form-element__label" >{{language.getLabel('LBL_VALUE')}}</label>
            <div class="slds-form-element__control">
                <input type="text"  class="slds-input" [(ngModel)]="elementvalue"/>
            </div>
        </div>
        <div class="slds-form-element">
            <label class="slds-form-element__label" >{{language.getLabel('LBL_NAME')}}</label>
            <div class="slds-form-element__control">
                <input type="text"  class="slds-input" [(ngModel)]="elementname"/>
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()">{{language.getLabel('LBL_CANCEL')}}</button>
        <button class="slds-button slds-button--brand" (click)="save()">{{language.getLabel('LBL_SAVE')}}</button>
    </system-modal-footer>
</system-modal>
