<system-modal>
    <system-modal-header (close)="close()">
        <system-label label="LBL_ADD_VALUE"></system-label>
    </system-modal-header>
    <system-modal-content>
        <div class="slds-form-element">
            <label class="slds-form-element__label" ><system-label label="LBL_VALUE"></system-label></label>
            <div class="slds-form-element__control">
                <input type="text"  class="slds-input" [(ngModel)]="elementvalue"/>
            </div>
        </div>
        <div class="slds-form-element">
            <label class="slds-form-element__label" ><system-label label="LBL_NAME"></system-label></label>
            <div class="slds-form-element__control">
                <input type="text"  class="slds-input" [(ngModel)]="elementname"/>
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CANCEL"></system-label></button>
        <button class="slds-button slds-button--brand" (click)="save()"><system-label label="LBL_SAVE"></system-label></button>
    </system-modal-footer>
</system-modal>
