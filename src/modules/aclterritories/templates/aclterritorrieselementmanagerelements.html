<div class="slds-scrollable" style="height: 100%;">
    <div class="slds-p-around--small slds-border--bottom">
        <h2 class="slds-text-heading_medium"><system-label label="LBL_ELEMENTS"></system-label></h2>
    </div>
    <div *ngIf="loading; else elementsdisplay" class="slds-p-around--medium slds-align--absolute-center">
        <system-spinner></system-spinner>
    </div>
    <ng-template #elementsdisplay>
        <div class="slds-grid slds-grid--vertical-align-center slds-p-around--medium slds-border--bottom" [ngClass]="{'slds-theme--shade': _selectedElement.id == element.id}" *ngFor="let element of elements" >
            <div class="slds-text-link_faux" (click)="selectElement(element)">{{element.name}}</div>
            <system-button-icon class="slds-col--bump-left" icon="delete" (click)="deleteElement(element)"></system-button-icon>
        </div>
        <div class="slds-p-around--medium slds-align--absolute-center">
            <button class="slds-button slds-button--neutral" (click)="addElement()"><system-label label="LBL_ADD"></system-label>
            </button>
        </div>
    </ng-template>
</div>
