<system-modal>
    <system-modal-header (close)="close()">
        {{language.getLabel('LBL_ADD_MODULE')}}
    </system-modal-header>
    <system-modal-content>
        <div class="slds-form-element">
            <label class="slds-form-element__label">{{language.getLabel('LBL_MODULE')}}</label>
            <div class="slds-form-element__control">
                <div class="slds-select_container">
                    <select class="slds-select" [(ngModel)]="module">
                        <option *ngFor="let availablemodule of availablemodules" [value]="availablemodule">{{language.getModuleName(availablemodule)}}</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="slds-form-element">
            <label class="slds-form-element__label">{{language.getLabel('LBL_TYPE')}}</label>
            <div class="slds-form-element__control">
                <div class="slds-select_container">
                    <select class="slds-select" [disabled]="relatefrom != ''" [(ngModel)]="spiceaclterritorytype_id">
                        <option *ngFor="let type of types" [value]="type.id">{{type.name}}</option>
                    </select>
                </div>
            </div>
        </div>
        <div *ngIf="module" class="slds-form-element">
            <label class="slds-form-element__label">{{language.getLabel('LBL_RELATEFROM')}}</label>
            <div class="slds-form-element__control">
                <div class="slds-select_container">
                    <select class="slds-select" [(ngModel)]="relatefrom" (change)="setRelated()">
                        <option value=""></option>
                        <option *ngFor="let linkedfield of linkedfields" [value]="linkedfield.name">{{linkedfield.display}}</option>
                    </select>
                </div>
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()">{{language.getLabel('LBL_CANCEL')}}</button>
        <button class="slds-button slds-button--brand" (click)="save()">{{language.getLabel('LBL_SAVE')}}</button>
    </system-modal-footer>
</system-modal>
