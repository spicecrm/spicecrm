<div class="slds-form-element slds-p-vertical--xx-small" *ngFor="let element of territorrytypedetails.elements">
    <label class="slds-form-element__label" [attr.for]="element.id">{{element.name}}</label>
    <div class="slds-form-element__control">
        <div class="slds-select_container">
            <select class="slds-select" [disabled]="!editing" [id]="element.id" [(ngModel)]="this.model.data.elementvalues[element.id].elementvalue">
                <option *ngFor="let elementValue of elementValues(element.id)" [value]="elementValue.elementvalue">{{elementValue.elementdescription}}</option>
            </select>
        </div>
    </div>
</div>
