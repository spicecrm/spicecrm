<div class="slds-scrollable" style="height: 100%;">
    <div class="slds-p-around--small slds-border--bottom slds-grid slds-grid--vertical-align-center">
        <h2 class="slds-text-heading_medium"><system-label label="LBL_SPICEACLTERRITORY"></system-label></h2>
        <button class="slds-col--bump-left slds-button slds-button--neutral" *ngIf="model.data.inactive == 1" [disabled]="!(modelid && modelid != '')" (click)="activateTerritory()"><system-label label="LBL_ACTIVATE"></system-label></button>
        <button class="slds-col--bump-left slds-button slds-button--neutral" *ngIf="model.data.inactive == 0" [disabled]="!(modelid && modelid != '')" (click)="deactivateTerritory()"><system-label label="LBL_DEACTIVATE"></system-label></button>
    </div>
    <div *ngIf="modelid && modelid != ''" class="slds-p-around--small">
        <div>
            <field-container field="name" [fielddisplayclass]="'slds-has-divider--bottom slds-p-vertical--x-small spice-fieldminheight'"></field-container>
        </div>
        <div>
            <field-container field="assigned_user_name" [fielddisplayclass]="'slds-has-divider--bottom slds-p-vertical--x-small spice-fieldminheight'"></field-container>
        </div>
        <div class="slds-p-vertical--small">
            <h2 class="slds-text-heading--small">Territory Values</h2>
        <aclterritorries-manager-territory-values [territorrytypedetails]="territorrytypedetails" [editable]="false"></aclterritorries-manager-territory-values>
        </div>
        <div class="slds-align--absolute-center" *ngIf="isEditMode">
            <div class="slds-p-around--small slds-align--absolute-center">
                <button class="slds-col--bump-left slds-button slds-button--neutral" (click)="cancelEdit()"><system-label label="LBL_CANCEL"></system-label></button>
                <button class="slds-col--bump-left slds-button slds-button--brand" (click)="saveTerritory()"><system-label label="LBL_SAVE"></system-label></button>
            </div>
        </div>
    </div>
</div>
