<div class="slds-scrollable" style="height: 100%;">
    <div class="slds-p-around--small slds-border--bottom slds-grid slds-grid--vertical-align-center">
        <h2 class="slds-text-heading_medium">{{language.getLabel('LBL_SPICEACLTERRITORY')}}</h2>
        <button class="slds-col--bump-left slds-button slds-button--neutral" *ngIf="model.data.inactive == 1" [disabled]="!(modelid && modelid != '')" (click)="activateTerritory()">{{language.getLabel('LBL_ACTIVATE')}}</button>
        <button class="slds-col--bump-left slds-button slds-button--neutral" *ngIf="model.data.inactive == 0" [disabled]="!(modelid && modelid != '')" (click)="deactivateTerritory()">{{language.getLabel('LBL_DEACTIVATE')}}</button>
    </div>
    <div *ngIf="modelid && modelid != ''" class="slds-p-around--small">
        <div>
            <field-container field="name" [fielddisplayclass]="'slds-has-divider--bottom slds-p-vertical--x-small spicecrm-fieldminheight'"></field-container>
        </div>
        <div>
            <field-container field="assigned_user_name" [fielddisplayclass]="'slds-has-divider--bottom slds-p-vertical--x-small spicecrm-fieldminheight'"></field-container>
        </div>
        <div class="slds-p-vertical--small">
            <h2 class="slds-text-heading--small">Territory Values</h2>
        <aclterritorries-manager-territory-values [territorrytypedetails]="territorrytypedetails" [editable]="false"></aclterritorries-manager-territory-values>
        </div>
        <div class="slds-align--absolute-center" *ngIf="isEditMode">
            <div class="slds-p-around--small slds-align--absolute-center">
                <button class="slds-col--bump-left slds-button slds-button--neutral" (click)="cancelEdit()">{{language.getLabel('LBL_CANCEL')}}</button>
                <button class="slds-col--bump-left slds-button slds-button--brand" (click)="saveTerritory()">{{language.getLabel('LBL_SAVE')}}</button>
            </div>
        </div>
    </div>
</div>
