<div class="slds-scrollable" style="height: 100%;">
    <div class="slds-p-around--small slds-border--bottom">
        <h2 class="slds-text-heading_medium"><system-label label="LBL_TYPES"></system-label></h2>
    </div>
    <div *ngIf="loading; else typesdisplay" class="slds-p-around--medium slds-align--absolute-center">
        <system-spinner></system-spinner>
    </div>
    <ng-template #typesdisplay>
        <div class="slds-p-around--medium slds-border--bottom slds-grid slds-grid--vertical-align-center" [ngClass]="{'slds-theme--shade': _selectedType.id == type.id}" *ngFor="let type of types">
            <div class="slds-text-link_faux" (click)="selectType(type)">{{type.name}}</div>
            <system-button-icon class="slds-col--bump-left" icon="delete" (click)="deleteType(type)"></system-button-icon>
        </div>
        <div class="slds-p-around--medium slds-align--absolute-center">
            <button class="slds-button slds-button--neutral" (click)="addType()"><system-label label="LBL_ADD"></system-label></button>
        </div>
    </ng-template>
</div>
