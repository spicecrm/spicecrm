<div class="slds-p-around--x-small">
    <div class="slds-form-element" (click)="onFocus()">
        <field-container field="name"></field-container>
    </div>
    <ng-container *ngIf="isExpanded">
        <div class="slds-form-element">
            <div class="slds-form-element">
                <field-container [field]="'mailbox_id'" [fieldconfig]="{scope: 'outboundsingle'}"></field-container>
            </div>
        </div>
        <div class="slds-form-element">
            <field-container field="to_addrs_names" [fieldconfig]="{fieldtype:'emailrecipients', addresstype: 'to'}"></field-container>
        </div>
        <div class="slds-form-element">
            <field-container field="cc_addrs_names" [fieldconfig]="{fieldtype:'emailrecipients', addresstype: 'cc'}"></field-container>
        </div>
        <div class="slds-form-element">
            <div class="slds-form-element">
                <field-container field="emailtemplate_id" [fieldconfig]="{fieldtype:'emailtemplate'}"></field-container>
            </div>
        </div>
        <div class="slds-form-element">
            <div class="slds-form-element__control">
                <field-html [fieldname]="'body'"></field-html>
            </div>
        </div>
        <div class="slds-form-element">
            <field-container [field]="'parent_name'"></field-container>
        </div>
        <object-relatedlist-files></object-relatedlist-files>
        <div class="slds-form-element">
            <button class="slds-button slds-button--neutral" (click)="cancel()">{{language.getLabel('LBL_CANCEL')}}
            </button>
            <button class="slds-button slds-button--brand .slds-button-space-left slds-float--right" (click)="send()">{{language.getLabel('LBL_SEND')}}</button>
        </div>
    </ng-container>
</div>
