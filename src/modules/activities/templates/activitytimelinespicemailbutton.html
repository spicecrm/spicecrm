@if(tokenconfig) {
    <system-spinner *ngIf="tokenLoading" [size]="12"></system-spinner>
    <div *ngIf="!tokenLoading" (click)="getToken($event)">
        <system-utility-icon icon="number_input" size="x-small">
            <system-label label="LBL_COPY"></system-label>
        </system-utility-icon>
    </div>
}
