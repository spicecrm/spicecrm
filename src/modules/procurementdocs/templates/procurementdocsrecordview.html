<ng-container *ngIf="initialized; else loading">
    <system-componentset [componentset]="headerComponentset"></system-componentset>
    <system-componentset *ngIf="itemsComponentset" [componentset]="itemsComponentset"></system-componentset>
    <!-- fallback if no itemcomponentset has been defined yet: for backwards compatibility -->
    <procurement-docs-items-container *ngIf="!itemsComponentset"></procurement-docs-items-container>
    <system-componentset [componentset]="footerComponentset"></system-componentset>
</ng-container>
<ng-template #loading>
    <div system-to-bottom class="slds-align--absolute-center">
        <system-spinner></system-spinner>
    </div>
</ng-template>
