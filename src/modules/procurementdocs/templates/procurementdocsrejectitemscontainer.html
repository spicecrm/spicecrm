<table class="slds-table slds-table_bordered">
    <thead>
        <tr procurement-docs-item-header></tr>
    </thead>
    <tbody *ngIf="itemcount > 0">
        <ng-container *ngFor="let item of items|procurementdocsitemsdeletedpipe">
            <tr procurement-docs-item-container [item]="item" [parentview]="view" [procurementdoc]="model" (recalculated)="recalculate()"></tr>
            <tr *ngIf="item.expanded">
                <td colspan="2" class="slds-cell-shrink">
                <td [attr.colspan]="fieldsetItems.length">
                    <procurement-docs-item-details-container [item]="item"></procurement-docs-item-details-container>
                </td>
            </tr>
            <tr>
                <td colspan="2" class="slds-cell-shrink">
                <td [attr.colspan]="fieldsetItems.length">
                    <procurement-docs-item-reject-container [item]="item"></procurement-docs-item-reject-container>
                </td>
            </tr>
        </ng-container>
    </tbody>
</table>
