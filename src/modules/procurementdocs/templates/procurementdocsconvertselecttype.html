<system-modal size="prompt">
    <system-modal-header (close)="close()"><system-label label="LBL_CONVERT_PROCUREMENTDOC"></system-label></system-modal-header>
    <system-modal-content>
        <div class="slds-grid slds-grid--vertical">
            <system-input-radio *ngFor="let targetType of targetTypes" name="targetType" [value]="targetType.type" [(ngModel)]="selectedType"><system-label [label]="targetType.label"></system-label></system-input-radio>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CANCEL"></system-label></button>
        <button class="slds-button slds-button--brand" (click)="convert()"><system-label label="LBL_OK"></system-label></button>
    </system-modal-footer>
</system-modal>
