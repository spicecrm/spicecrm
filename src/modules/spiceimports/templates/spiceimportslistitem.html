<div class="slds-box slds-box--border slds-m-around--x-small">
    <div class="slds-p-around--small slds-grid slds-theme--shade" (click)="spiceimportsservice.activeImportData = {id: item.id, name: item.name}" [ngClass]="{'slds-theme_shade':spiceimportsservice.activeImportData?.id == item.id}" style="cursor: pointer">
        <div class="slds-icon_container" title="{{ item.model }}">
            <system-icon [module]="item.module" size="medium"></system-icon>
        </div>
        <div class="slds-grow">
            <div class="slds-grid slds-grid--align-spread">
                <div class="slds-text-title_caps">{{ item.name }}</div>
                <div class="slds-col--bump-left slds-truncate">
                    <system-display-datetime [date]="item.date_entered"/>
                </div>
            </div>
            <div class="slds-grid slds-grid--align-spread">
                <div class="slds-truncate">{{ language.getLabel(item.statusdisplay) }}</div>
                <div class="slds-col--bump-left slds-truncate">{{ item.created_by_name }}</div>
            </div>
        </div>
    </div>
</div>
