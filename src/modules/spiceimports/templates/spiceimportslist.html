<div class="slds-theme--default" (system-to-bottom)="loadMore()" [system-overlay-loading-spinner]="spiceimportsservice.isloading">
    @if (!spiceimportsservice.isloading && spiceimportsservice.filtereditems.length == 0){
        <div class="slds-height_full slds-align--absolute-center">
            <system-illustration-no-records>
                <system-label label="LBL_NO_ENTRIES"></system-label>
            </system-illustration-no-records>
        </div>
    } @else {
        <spice-imports-list-item *ngFor="let item of spiceimportsservice.filtereditems" [item]="item"/>
    }
</div>
