<div (system-to-bottom)="handleScroll()" [system-overlay-loading-spinner]="modellist.isLoading">
    <spice-imports-view-item *ngFor="let item of modellist.listData.list" [item]="item"/>
    @if (!modellist.isLoading && modellist.listData.list.length == 0){
        <div class="slds-height_full slds-align--absolute-center">
            <system-illustration-no-records><system-label label="LBL_NO_RECORDS"/></system-illustration-no-records>
        </div>
    }
</div>
