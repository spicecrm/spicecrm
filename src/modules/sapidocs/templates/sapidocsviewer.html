<system-modal>
    <system-modal-header (close)="close()"><system-label label="LBL_SAPIDOC"></system-label></system-modal-header>
    <system-modal-content [grow]="true" margin="none" class="slds-scrollable--y">
        <pre class="slds-size--1-of-1 slds-m-around--none slds-p-around--x-small">{{xml}}</pre>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="processIDOC()"><system-label label="LBL_PROCESS"></system-label></button>
        <button class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CANCEL"></system-label></button>
    </system-modal-footer>
</system-modal>
