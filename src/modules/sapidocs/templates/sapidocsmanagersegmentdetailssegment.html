<fieldset class="slds-box">
    <div class="slds-form-element slds-col slds-size--1-of-1">
        <label class="slds-form-element__label"><system-label label="LBL_SAPIDOC_MODULE"></system-label></label>
        <system-icon-help-text [helpText]="language.getLabel('LBL_SAPIDOC_MODULE', '', 'long')"></system-icon-help-text>
        <system-input-module class="slds-p-vertical--xx-small" [(ngModel)]="module"></system-input-module>
    </div>
    <div class="slds-grid slds-grid_vertical-align-center slds-m-top--x-small slds-gutters_direct-xx-small">
        <div class="slds-form-element slds-col slds-size--1-of-2">
            <label class="slds-form-element__label"><system-label label="LBL_SAPIDOC_SPLIT_FIELD"></system-label></label>
            <system-icon-help-text [helpText]="language.getLabel('LBL_SAPIDOC_SPLIT_FIELD', '', 'long')"></system-icon-help-text>
            <div class="slds-form-element__control">
                <input type="text" class="slds-input" [(ngModel)]="segment.split_field"/>
            </div>
        </div><div class="slds-form-element slds-col slds-size--1-of-2">
            <label class="slds-form-element__label"><system-label label="LBL_SAPIDOC_SPLIT_LENGTH"></system-label></label>
            <system-icon-help-text [helpText]="language.getLabel('LBL_SAPIDOC_SPLIT_LENGTH', '', 'long')"></system-icon-help-text>
            <div class="slds-form-element__control">
                <input type="text" class="slds-input" [(ngModel)]="segment.split_length"/>
            </div>
        </div>
    </div>
</fieldset>
