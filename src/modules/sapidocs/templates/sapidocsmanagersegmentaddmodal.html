<system-modal>
    <system-modal-header (close)="close()"></system-modal-header>
    <system-modal-content>
        adds a new segment
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral"><system-label label="LBL_CANCEL"></system-label></button>

</system-modal>
