<system-modal>
    <system-modal-header (close)="close()"><system-label label="LBL_SAPIDOC_ADD_FIELD"></system-label></system-modal-header>
    <system-modal-content>
        <div class="slds-form-element slds-col slds-size--1-of-1">
            <label class="slds-form-element__label"><system-label label="LBL_SAPIDOC_SAP_FIELD"></system-label></label>
            <div class="slds-form-element__control">
                <input type="text" class="slds-input" [(ngModel)]="field.sap_field"/>
            </div>
        </div>
        <div class="slds-form-element slds-col slds-size--1-of-1">
            <label class="slds-form-element__label"><system-label label="LBL_SAPIDOC_MAPPING_FIELD"></system-label></label>
            <div class="slds-form-element__control">
                <input type="text" class="slds-input" [(ngModel)]="field.mapping_field"/>
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CANCEL"></system-label></button>
        <button class="slds-button slds-button--brand" (click)="add()"><system-label label="LBL_ADD"></system-label></button>
    </system-modal-footer>
</system-modal>
