<div class="slds-p-around--medium slds-theme--shade">
    <div class="slds-page-header__row">
        <div class="slds-page-header__col-title">
            <div class="slds-media">
                <system-icon icon="order_item"></system-icon>
                <div class="slds-media__body">
                    <div class="slds-page-header__name">
                        <div class="slds-page-header__name-title">
                            <h1>
                                <span class="slds-page-header__title slds-truncate"><system-label label="LBL_SAP_IDOCS_MANAGER"></system-label></span>
                            </h1>
                        </div>
                    </div>
                    <p class="slds-page-header__name-meta"></p>
                </div>
            </div>
        </div>
        <div class="slds-page-header__col-actions">
            <div class="slds-page-header__controls">
                <div class="slds-page-header__control">
                    <ul class="slds-button-group-list">
                        <li>
                            <button class="slds-button slds-button_neutral"><system-label label="LBL_ADD" (click)="addIdocType()"></system-label></button>
                        </li>
                        <li>
                            <button class="slds-button slds-button_neutral"><system-label label="LBL_SAVE" (click)="sapIdocsManager.getChanges()"></system-label></button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="slds-grid" system-to-bottom-noscroll>
    <sapidocs-manager-segments-tree></sapidocs-manager-segments-tree>
    <sapidocs-manager-segment-details class="slds-grow"></sapidocs-manager-segment-details>
</div>
