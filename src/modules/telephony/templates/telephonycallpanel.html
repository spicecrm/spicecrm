<div class="slds-size_1-of-1 slds-height_full">
    <!-- multiple matches-->
    <div *ngIf="!calldata.relatedid && matchedbeans.length > 1; else recordmatched" system-to-bottom [marginBottom]="50">
        <div *ngFor="let matchedbean of matchedbeans" [system-model-provider]="{module: matchedbean.module, id: matchedbean.id, data: matchedbean.data}" class="slds-m-around--x-small slds-box--border slds-theme--shade">
            <div class="slds-p-around--xx-small slds-grid slds-grid--vertical-align-center">
                <system-icon size="small" class="slds-button" [module]="matchedbean.module"></system-icon>
                <telephony-call-panel-related-compact class="slds-grow"></telephony-call-panel-related-compact>
                <button class="slds-button slds-button--neutral" (click)="selectMatched(matchedbean)"><system-label label="LBL_SELECT"></system-label></button>
            </div>
        </div>
        <div class="slds-box slds-m-around--x-small slds-theme--shade slds-align--absolute-center">
            <ul class="slds-list_horizontal slds-has-dividers_right slds-text-body_small">
                <li class="slds-item "><telephony-call-panel-search-contact-button [calldata]="calldata" (actionemitter)="setReletadeData()"></telephony-call-panel-search-contact-button></li>
                <li class="slds-item "><telephony-call-panel-create-contact-button [calldata]="calldata" (actionemitter)="setReletadeData()"></telephony-call-panel-create-contact-button></li>
            </ul>
        </div>
    </div>
    <!-- found a matching record -->
    <ng-template #recordmatched>
        <div *ngIf="!calldata.start; else callconnected" system-to-bottom [marginBottom]="50">
            <!-- exactly one match-->
            <ng-container *ngIf="calldata.relatedid">
                <div class="slds-height_full slds-align_absolute-center" [system-model-provider]="{module: calldata.relatedmodule, id: calldata.relatedid, data: calldata.relateddata}">
                    <div class="slds-text-align_center slds-align-middle slds-size--1-of-1">
                        <system-icon [module]="calldata.relatedmodule"></system-icon>
                        <telephony-call-panel-related></telephony-call-panel-related>
                    </div>
                </div>
            </ng-container>
            <!-- no match -->
            <ng-container *ngIf="!calldata.relatedid && matchedbeans.length == 0">
                <div class="slds-height_full slds-align_absolute-center">
                    <div class="slds-text-align_center slds-align-middle">
                        <system-icon module="Calls"></system-icon>
                        <div class="slds-text-heading_medium">{{msisdnFormatted}}</div>
                    </div>
                </div>
            </ng-container>
        </div>
        <ng-template #callconnected>
            <div class="slds-docked-composer__lead" [ngClass]="{'slds-theme--shade': fieldset }" [system-model-provider]="{module: calldata.relatedmodule, id: calldata.relatedid, data: calldata.relateddata}">
                <div class="slds-media" style="width: calc(100% - 90px);">
                    <system-icon [module]="calldata.relatedmodule ? calldata.relatedmodule : 'Calls'"></system-icon>
                    <div class="slds-media__body">
                        <ng-container *ngIf="calldata.relatedid; else nocalldata">
                            <telephony-call-panel-related-compact *ngIf="calldata.relatedid"></telephony-call-panel-related-compact>
                        </ng-container>
                        <ng-template #nocalldata>
                            <p class="slds-text-heading_medium">{{msisdnFormatted}}</p>
                            <ul class="slds-list_horizontal slds-has-dividers_right slds-text-body_small">
                                <li class="slds-item "><telephony-call-panel-search-contact-button [calldata]="calldata" (actionemitter)="setReletadeData()"></telephony-call-panel-search-contact-button></li>
                                <li class="slds-item "><telephony-call-panel-create-contact-button [calldata]="calldata" (actionemitter)="setReletadeData()"></telephony-call-panel-create-contact-button></li>
                            </ul>
                        </ng-template>
                    </div>
                </div>
                <div class="slds-col_bump-left slds-text-heading_large">
                    <telephony-call-duration [calldata]="calldata"></telephony-call-duration>
                </div>
            </div>
            <!-- render the fieldset if we have an embedded object otherwise remain backwards compatible with the legacy approach-->
            <div system-to-bottom [marginBottom]="50" *ngIf="fieldset; else noembeddedobject">
                <object-record-fieldset [fieldset]="fieldset" direction="vertical"></object-record-fieldset>
            </div>
            <ng-template #noembeddedobject>
                <div class="slds-docked-composer__toolbar">
                    <telephony-call-panel-save-button [calldata]="calldata"></telephony-call-panel-save-button>
                </div>
                <textarea [disabled]="calldata.call" style="height: 270px" class="slds-docked-composer__input slds-input_bare slds-text-longform slds-grow slds-size--1-of-1" [(ngModel)]="calldata.note" [placeholder]="language.getLabel('LBL_CALL_NOTES')"></textarea>
            </ng-template>
        </ng-template>
    </ng-template>
</div>
