    <div class="slds-media__body">
        <ng-container *ngIf="callData.relatedid; else nocalldata">
            <telephony-call-panel-related-compact [canClear]="true" (unlink)="unsetRelatedData()"></telephony-call-panel-related-compact>
        </ng-container>
        <ng-template #nocalldata>
            <ng-container>
                <p class="slds-text-heading_medium">{{displayValue}}</p>
                <ul class="slds-list_horizontal slds-has-dividers_right slds-text-body_small">
                    <li class="slds-item ">
                        <telephony-call-panel-search-button [calldata]="callData" (actionemitter)="setRelatedData()"></telephony-call-panel-search-button>
                    </li>
                    <li class="slds-item">
                        <telephony-call-panel-create-related-button [calldata]="callData" (actionemitter)="setRelatedData()"></telephony-call-panel-create-related-button>
                    </li>
                    <li *ngIf="heroldRelatedFound.length > 0" class="slds-item">
                        <telephony-call-found-beans-button [foundBeans]="heroldRelatedFound" [calldata]="callData" (actionemitter)="setRelatedData()"></telephony-call-found-beans-button>
                    </li>

                </ul>
            </ng-container>
        </ng-template>
    </div>
</div>
