<system-modal size="large">

    <system-modal-header (close)="cancel()">Template Data Assistant</system-modal-header>

    <system-modal-content margin="none" [grow]="true">

        <div class="slds-grid slds-grid--vertical" cdkDropListGroup system-to-bottom style="height:100%">
            <div class="slds-grid slds-grow">

                <div class="slds-size--2-of-3 slds-border--right slds-grid--vertical" style="height: 100%;">

                    <div class="slds-border--bottom" style="height:50%">
                        <div class="slds-tabs--default slds-grid slds-grid--vertical" style="height: 100%">
                            <div class="slds-grid">
                                <ul class="slds-tabs--default__nav slds-scrollable--x slds-grow" role="tablist">
                                    <li *ngFor="let module of offeredModules; trackBy: trackByFn"
                                        (click)="setActiveModule(module.name)" [class.slds-active]="module.name == activeModule"
                                        class="slds-tabs--default__item slds-grid slds-grid_vertical-align-center" role="presentation">
                                        <a class="slds-tabs--default__link slds-grid" href="javascript:void(0)">
                                            <system-icon [module]="module.name" size="small" divClass="slds-m-right--x-small"></system-icon>
                                            <span class="slds-truncate">
                                                <system-label-modulename [module]="module.name"></system-label-modulename>
                                            </span>
                                        </a>
                                    </li>
                                </ul>
                            </div>
                            <div class="slds-grow" style="height: 0" *ngIf="!!activeModule">
                                <div *ngFor="let module of offeredModules; trackBy: trackByFn" [class.slds-hide]="activeModule != module.name" class="slds-scrollable--y" style="height: 100%">
                                    <system-module-tree [module]="module.name" (itemSelected)="onItemSelection($event, module.name)"></system-module-tree>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="slds-grid slds-grid--vertical" style="height: 50%">
                        <div class=" slds-input-has-icon slds-input-has-icon_left" role="none">
                            <system-utility-icon icon="search" addclasses="slds-input__icon slds-input__icon--left"></system-utility-icon>
                            <input class="slds-input" type="search" [placeholder]="language.getLabel('LBL_SEARCH')" [(ngModel)]="fieldFilter"/>
                        </div>
                        <div class="slds-grow slds-scrollable--y">
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th class="slds-cell-shrink"></th>
                                        <th scope="col">
                                            <div class="slds-truncate"><system-label label="LBL_FIELD"></system-label></div>
                                        </th>
                                        <th scope="col">
                                            <div class="slds-truncate"><system-label label="LBL_NAME"></system-label></div>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody *ngFor="let module of offeredModules; trackBy: trackByFn" [class.slds-hide]="isLoadingModuleFields || activeModule != module.name"
                                       cdkDropList [id]="module.name" (cdkDropListExited)="dropExited($event)" (cdkDropListEntered)="dropEntered($event)" cdkDropListSortingDisabled [cdkDropListData]="moduleFields[module.name]">
                                    <tr  *ngFor="let field of getFilteredFields( moduleFields[module.name] ); trackBy: trackByFn" class="slds-hint-parent slds-drag--preview" cdkDrag [cdkDragData]="field">
                                        <td class="slds-p-around--none slds-cell-shrink">
                                            <system-utility-icon class="slds-p-horizontal--x-small" cdkDragHandle style="cursor: move" icon="drag_and_drop" size="x-small"></system-utility-icon>
                                        </td>
                                        <td data-label="Account Name">
                                            <div class="slds-truncate" [title]="field.name">{{field.name}}</div>
                                        </td>
                                        <td>
                                            <div class="slds-truncate" [title]="language.getLabel(field.label)"><system-label [label]="field.label"></system-label></div>
                                        </td>
                                    </tr>
                                </tbody>
                                <tbody system-table-stencils *ngIf="isLoadingModuleFields" [columns]="2" [rows]="5" [select]="true"></tbody>
                            </table>
                        </div>
                    </div>

                </div>

                <div class="slds-size--1-of-3" style="height: 100%">
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th class="slds-cell-shrink"></th>
                                <th scope="col">
                                    <div class="slds-truncate"><system-label label="LBL_FUNCTION"></system-label></div>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let function of offeredFunctions" class="slds-hint-parent slds-drag--preview" cdkDrag [cdkDragData]="function">
                                <td class="slds-p-around--none slds-cell-shrink">
                                    <system-utility-icon class="slds-p-horizontal--x-small" cdkDragHandle style="cursor: move" icon="drag_and_drop" size="x-small"></system-utility-icon>
                                </td>
                                <td data-label="Function Name">
                                    <div class="slds-truncate" [title]="function">{{function}}</div>
                                </td>
                            </tr>
                        </tbody>
                        <tbody system-table-stencils *ngIf="isLoadingFunctions" [columns]="2" [rows]="5" [select]="true"></tbody>
                    </table>
                    <div *ngIf="resultString"></div>
                    <div *ngIf="!resultString"></div>
                </div>

            </div>

            <div class="slds-p-around--medium slds-border--top">
                <div class="slds-form-element slds-grid slds-grid--vertical-align-center">
                    <label class="slds-form-element__label" for="abc">Ergebnis</label>
                    <div class="slds-form-element__control slds-grow">
                        <input type="text" id="abc" placeholder="Drop field or function here …" class="slds-input" [(ngModel)]="resultString"/>
                    </div>
                </div>
            </div>
        </div>

    </system-modal-content>

    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="cancel()">
            <system-label label="LBL_CANCEL"></system-label>
        </button>
        <button class="slds-button slds-button--brand" (click)="ok()"><system-label label="LBL_OK"></system-label></button>
    </system-modal-footer>

</system-modal>
