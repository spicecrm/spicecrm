<system-modal>
    <system-modal-header (close)="close()"><system-label label="LBL_EXPORT_PDF"></system-label></system-modal-header>
    <system-modal-content margin="none" [scrollable]="false" [system-overlay-loading-spinner]="isLoading">
        <div style="height: 70vh;">
            @if(blobUrl) {
                <object *ngIf="blobUrl" [data]="blobUrl" width="100%" height="100%"></object>
            }
        </div>
    </system-modal-content>
    <system-modal-footer>
        <div class="slds-grid">
            <div class="slds-grid slds-grid--vertical-align-center slds-size--1-of-3" >
                <system-label label="LBL_OUTPUT_TEMPLATE"></system-label>
                <div class="slds-select_container">
                    <select [(ngModel)]="selectedTemplate" class="slds-select slds-m-left--xx-small" style="width: 10rem;">
                        @for (template of outputTemplates; track template.id) {
                            <option [value]="template.id">{{template.name}}</option>
                        }
                    </select>
                </div>
            </div>
            <div class="slds-size--1-of-3 slds-align_absolute-center" *ngIf="blobUrl">
                <button [disabled]="previousDisabled" class="slds-button slds-button_icon" (click)="previousPage()">
                    <system-button-icon icon="chevronleft"></system-button-icon>
                </button>
                <div class="slds-p-horizontal--xx-small slds-grid slds-grid--vertical-align-center slds-gutters_direct-xxx-small">
                    <div class="slds-col">{{numberOfItems}}</div>
                    <system-label class="slds-col" label="LBL_OF"></system-label>
                    <div class="slds-col">{{totalItems}}</div>
                </div>
                <button [disabled]="nextDisabled" class="slds-button slds-button_icon" (click)="nextPage()">
                    <system-button-icon icon="chevronright"></system-button-icon>
                </button>
            </div>
            <div class="slds-size--1-of-3 slds-align_absolute-center" *ngIf="!blobUrl">
                <system-spinner [size]="20" message="click on 'reload' if no content is loaded"></system-spinner>
            </div>
            <div class="slds-size--1-of-3">
                <button class="slds-button slds-button--neutral" (click)="downloadBulk()">
                    <system-label label="LBL_DOWNLOAD"/>
                </button>
                <button class="slds-button slds-button--neutral" (click)="reload()">
                    <system-label label="LBL_RELOAD"/>
                </button>
                <button class="slds-button slds-button--neutral" (click)="close()">
                    <system-label label="LBL_CANCEL"/>
                </button>
            </div>
        </div>
    </system-modal-footer>
</system-modal>
