<div class="slds-button-group">
    <button class="slds-button slds-button--neutral" (click)="createTravelReceipt()">
        <ng-container><system-button-icon *ngIf="view.size == 'small'; else receiptBiggerView" class="slds-button__icon--left" icon="money"></system-button-icon></ng-container>
        <ng-template #receiptBiggerView><system-label label="LBL_ADD_TRAVEL_RECEIPT"/></ng-template>
    </button>
    <button class="slds-button slds-button--neutral" (click)="createTravelMileage()">
        <ng-container><system-button-icon *ngIf="view.size == 'small'; else mileageBiggerView" class="slds-button__icon--left" icon="travel_and_places"></system-button-icon></ng-container>
        <ng-template #mileageBiggerView><system-label label="LBL_ADD_TRAVEL_MILEAGE"/></ng-template>
    </button>
    <button class="slds-button slds-button--neutral" (click)="createTravelSegment()">
        <ng-container><system-button-icon *ngIf="view.size == 'small'; else segmentBiggerView" class="slds-button__icon--left" icon="record_create"></system-button-icon></ng-container>
        <ng-template #segmentBiggerView><system-label label="LBL_ADD_TRAVEL_SEGMENT"/></ng-template>
    </button>
</div>
