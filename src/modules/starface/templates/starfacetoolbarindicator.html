<div class="slds-show--medium slds-dropdown-trigger slds-dropdown-trigger_click slds-p-horizontal--xxx-small" system-dropdown-trigger-simple>
    <div class="slds-p-around--xx-small">
        <system-utility-icon icon="call" size="x-small" [addclasses]="iconClass"></system-utility-icon>
    </div>
    <div class="slds-is-absolute slds-dropdown slds-dropdown_right slds-dropdown--small slds-nubbin_top-right" style="right:-10px;top:25px;">
        <ul class="slds-dropdown__list" role="menu">
            <li class="slds-dropdown__header slds-has-divider--bottom" role="separator">
                <span class="slds-text-title_caps slds-grid slds-grid--vertical-align-center slds-grid--align-spread"><system-label label="LBL_USER"></system-label><span>{{username}}</span></span>
            </li>
            <li class="slds-dropdown__item" role="separator">
                <a href="javascript:void(0);"><system-label label="LBL_CONNECTED"></system-label><system-checkbox [ngModel]="starfacestatus == 'connected'" [disabled]="true"></system-checkbox></a>
            </li>
            <li class="slds-dropdown__item" role="separator">
                <a href="javascript:void(0);"><system-label label="LBL_SUBSCRIBED"></system-label><system-checkbox [ngModel]="starfacesubscription" [disabled]="true"></system-checkbox></a>
            </li>
            <li class="slds-dropdown__item" role="separator">
                <a href="javascript:void(0);"><system-label label="LBL_SOCKET"></system-label><system-checkbox [ngModel]="socketconnected" [disabled]="true"></system-checkbox></a>
            </li>
            <li class="slds-dropdown__item slds-has-divider--top" role="separator" (click)="setPreferences()">
                <a href="javascript:void(0);"><system-label label="LBL_PREFERENCES"></system-label></a>
            </li>
        </ul>
    </div>
</div>
