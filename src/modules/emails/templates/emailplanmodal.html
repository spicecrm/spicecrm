<system-modal size="small">
    <system-modal-header (close)="close()"><system-label label="LBL_EMAIL_SCHEDULE"></system-label></system-modal-header>
    <system-modal-content>
        <field-container field="date_scheduled" fielddisplayclass="slds-has-divider--bottom slds-p-vertical--x-small spice-fieldminheight" [fieldconfig]="{fieldtype:'datetime'}"></field-container>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()">
            <system-label label="LBL_CANCEL"></system-label>
        </button>
        <button  class="slds-button slds-button--brand" (click)="planEmail()">
            <system-label label="LBL_EMAIL_SCHEDULE"></system-label>
        </button>
    </system-modal-footer>
</system-modal>
