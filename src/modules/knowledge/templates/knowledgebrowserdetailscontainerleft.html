<div #headercontainer *ngIf="model.id" class="slds-grid slds-grid--vertical-align-center slds-border--bottom" style="border-radius: 0; height: 52px">
    <nav role="navigation" aria-label="Breadcrumbs" class="slds-grid slds-grid_vertical-align-center slds-p-around--x-small">
        <ol class="slds-breadcrumb slds-list_horizontal slds-wrap">
            <li *ngFor="let breadcrumb of breadcrumbs; trackBy: trackByFn" class="slds-breadcrumb__item slds-text-title--caps">
                <a style="cursor: pointer" (click)="navigateTo(breadcrumb.id)">{{breadcrumb.name}}</a>
            </li>
            <li class="slds-breadcrumb__item slds-text-title--caps">
                <a style="cursor: pointer"><strong>{{model.data.name}}</strong></a>
            </li>
        </ol>
    </nav>
    <div *ngIf="hasContent" class="slds-col_bump-left">
        <button class="slds-button slds-button--icon slds-m-right--xx-small" (click)="print()">
            <system-custom-icon size="x-small" icon="print"></system-custom-icon>
        </button>
    </div>
</div>
<div *ngIf="model.id && hasContent" class="slds-grid">
    <div [innerHTML]="model.data.description" [ngStyle]="iframContainerStyle" class="slds-scrollable--y spicecrm-scrollbar slds-p-around--x-small slds-theme--default slds-rich-text-editor__output"></div>
</div>
<system-spinner *ngIf="model.isloading"></system-spinner>
<div *ngIf="!model.isloading && !hasContent" class="slds-align--absolute-center slds-text-heading--medium" [ngStyle]="iframContainerStyle">
    <span>{{ language.getLabel('MSG_NO_RECORDS_FOUND') }}</span>
</div>
