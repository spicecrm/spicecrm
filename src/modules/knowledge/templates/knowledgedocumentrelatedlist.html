<system-collapsable-tab [title]="panelTitle">
    <ul class="slds-scrollable--y spicecrm-scrollbar" style="max-height: 200px">
        <li *ngFor="let relateditem of relatedmodels.items; trackBy: trackByFn" [title]="relateditem.name" class="slds-m-around--xx-small">
            <a style="cursor: pointer" (click)="navigateTo(relateditem.id)">{{relateditem.name}}</a>
        </li>
    </ul>
    <system-spinner *ngIf="relatedmodels.isloading"></system-spinner>
    <div *ngIf="!relatedmodels.isloading && relatedmodels.items.length == 0" class="slds-align--absolute-center slds-text-body--regular slds-p-around--x-small">
        {{ language.getLabel('MSG_NO_RECORDS_FOUND') }}
    </div>
</system-collapsable-tab>
