<div class="slds-grid slds-height_full">
    <div class="slds-size--1-of-4 slds-border--right slds-grid slds-grid--vertical slds-height_full">
        <knowledge-book-selector></knowledge-book-selector>
        <div class="slds-tabs--default slds-height_full slds-grid slds-grid--vertical">
            <ul class="slds-tabs--default__nav" role="tablist">
                <li class="slds-tabs--default__item slds-text-title--caps" [ngClass]="{'slds-active': activeTab == 'tree'}"
                    role="presentation" (click)="activeTab = 'tree'">
                    <a class="slds-tabs--default__link" style="cursor: pointer" role="tab" aria-selected="false"><system-label label="LBL_CHAPTERS"></system-label></a>
                </li>
                <li class="slds-tabs--default__item slds-text-title--caps" [ngClass]="{'slds-active': activeTab == 'search'}"
                    role="presentation" (click)="activeTab = 'search'">
                    <a class="slds-tabs--default__link" style="cursor: pointer" role="tab" aria-selected="false"><system-label label="LBL_SEARCH"></system-label></a>
                </li>
            </ul>
            <div *ngIf="activeTab == 'tree'" class="slds-tabs--default__content slds-show slds-p-vertical--none slds-grow" role="tabpanel" style="background-color: #fafaf9">
                <div class="slds-scrollable--y slds-height_full">
                    <div *ngIf="selectedBook && documents.length == 0 && !isLoading" class="slds-text-align--center slds-text-heading--small slds-truncate slds-p-top--x-small">
                        <system-label label="MSG_CREATE_FIRST_RECORD"></system-label>
                    </div>
                    <system-tree
                            *ngIf="selectedBook && !isLoading"
                            [config]="config"
                            [sourceList]="documents"
                            [(selectedItem)]="selectedDoc"
                            (onTreeDrop)="handleTreeDrop($event)"
                            (onItemAdd)="handleAddEvent($event)">
                    </system-tree>
                    <div *ngIf="isLoading && selectedBook" class="slds-m-top--small">
                        <system-spinner></system-spinner>
                    </div>
                </div>
            </div>
            <div *ngIf="activeTab == 'search'" class="slds-tabs--default__content slds-show slds-p-vertical--none" role="tabpanel" style="background-color: #fafaf9">
                <knowledge-documents-search></knowledge-documents-search>
            </div>
        </div>
    </div>
    <div class="slds-size--3-of-4 slds-height_full">
        <div class="slds-scrollable--y slds-height_full">
            <knowledge-manager-details [selectedDoc]="selectedDoc"></knowledge-manager-details>
        </div>
    </div>
</div>
