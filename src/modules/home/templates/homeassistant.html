<div class="slds-panel slds-grid slds-grid--vertical slds-nowrap slds-border--left">
    <div class="slds-p-around--small slds-border--bottom">
        <div class="slds-grid slds-grid--align-spread slds-has-flexi-truncate slds-grid--vertical-align-center">
            <h1 class="slds-page-header__title slds-m-right--small slds-align-middle slds-truncate">{{language.getLabel('LBL_ASSISTANT')}}</h1>
            <div class="slds-shrink-none">
                <home-assistant-filter></home-assistant-filter>
                <system-utility-icon [icon]="'refresh'" [size]="'x-small'" (click)="reload()"  [title]="language.getLabel('LBL_REFRESH')"></system-utility-icon>
            </div>
        </div>
    </div>
    <div #itemcontainer class="slds-scrollable_y" [ngStyle]="containerstyle">
        <home-assistant-tile *ngFor="let item of assistant.assitantItems" [item]="item"></home-assistant-tile>
    </div>
    <div *ngIf="loading" class="slds-p-around--medium">
        <system-spinner></system-spinner>
    </div>
    <div *ngIf="noActivities" class="slds-p-around--medium slds-align--absolute-center">
        <h2 class="slds-text-heading--small">{{language.getLabel('LBL_NO_ACTIVITIES')}}</h2>
    </div>
    <div class="slds-form--stacked slds-grow slds-scrollable--y slds-grid slds-grid--vertical"></div>
</div>
