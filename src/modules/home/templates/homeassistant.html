<div class="slds-grid slds-theme--default slds-grid--vertical slds-nowrap slds-border--left">
    <div class="slds-p-around--small">
        <div class="slds-grid slds-grid--align-spread slds-has-flexi-truncate slds-grid--vertical-align-center">
            <h1 class="slds-page-header__title slds-m-right--small slds-align-middle slds-truncate">{{language.getLabel('LBL_ASSISTANT')}}</h1>
            <div class="slds-shrink-none">
                <home-assistant-filter></home-assistant-filter>
                <system-utility-icon [icon]="'refresh'" [size]="'xx-small'" (click)="reload()"  [title]="language.getLabel('LBL_REFRESH')"></system-utility-icon>
            </div>
        </div>
    </div>
    <div tobottom>
        <div *ngIf="loading" class="slds-p-around--medium slds-height_full">
            <system-spinner></system-spinner>
        </div>
        <div *ngIf="noActivities" class="slds-align--absolute-center slds-height_full">
            <system-illustration-no-task></system-illustration-no-task>
        </div>
        <ul #itemcontainer class="slds-timeline">
            <li *ngFor="let item of assistant.assitantItems" class="slds-p-around--xx-small">
                <object-activitiytimeline-item-container [activity]="item"></object-activitiytimeline-item-container>
            </li>
        </ul>
    </div>
</div>
