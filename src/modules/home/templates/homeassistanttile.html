<div class="slds-tile slds-media slds-m-vertical--medium slds-border--bottom slds-p-bottom--small slds-p-horizontal--xx-small">
    <div class="slds-media__figure">
        <system-icon [module]="item.module" [size]="'small'"></system-icon>
    </div>
    <div class="slds-media__body">
        <div class="slds-grid slds-grid--align-spread slds-has-flexi-truncate slds-p-around--small">
            <h3 class="slds-truncate slds-text-heading--small slds-p-bottom--xx-small"><a href="javascript:void(0);" (click)="goDetail()">{{item.data.summary_text}}</a>
            </h3>
            <div class="slds-shrink-none">
                <object-actionset-menu [buttonsize]="'x-small'" [actionset]="actionset"></object-actionset-menu>
            </div>
        </div>
        <div class="slds-text-body--small">
            <dl class="slds-list--horizontal slds-wrap">
                <ng-container *ngFor="let tileField of tileFields">
                    <dt class="slds-item--label slds-text-color--weak slds-truncate">
                        {{language.getFieldDisplayName(model.module, tileField.field)}}
                    </dt>
                    <dd class="slds-item--detail slds-truncate">
                        <field-container [field]="tileField.field" [fieldconfig]="tileField.fieldconfig" [fielddisplayclass]="'slds-truncate'"></field-container>
                    </dd>
                </ng-container>
            </dl>
        </div>
    </div>
</div>
