<div #sheetContainer class="slds-grid slds-grid--vertical" style="height: 100%; width: 100%">
    <div class="slds-grid slds-border--bottom">
        <div class="slds-align--absolute-center slds-m-around--none slds-p-vertical--x-small slds-text-align--center" [style.width]="sheetTimeWidth + 'px'">
            {{offset}}
        </div>
        <div class="slds-border--right" [style.width]="daysContainerWidthStyle">
            <div class="slds-grid">
                <div *ngFor="let sheetDay of sheetDays; trackBy: trackByIndexFn" class="slds-border--left" [ngStyle]="dayWidthStyle">
                    <div class="slds-p-top--xx-small" [style.color]="isTodayStyle(sheetDay.date)">
                        <div class="slds-text-body--regular slds-p-left--x-small">{{displayDate('ddd', sheetDay.date)}}</div>
                        <div class="slds-p-left--x-small slds-p-bottom--xx-small slds-border--bottom slds-text-heading--large">
                            <a href="javascript:void(0);" class="slds-text-link--reset" (click)="gotoDay(sheetDay.day)">{{displayDate('D',sheetDay.date)}}</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="slds-is-relative">
                <ng-container *ngFor="let event of allMultiEvents; trackBy: trackByItemFn">
                    <calendar-sheet-event [ngStyle]="getMultiEventStyle(event)" [event]="event" class="spice-calendar-event"></calendar-sheet-event>
                </ng-container>
            </div>
            <div class="slds-grid">
                <div *ngFor="let sheetDay of sheetDays; trackBy: trackByIndexFn" [ngStyle]="dayWidthStyle" [style.min-height]="calendar.multiEventHeight + 'px'" class="slds-border--left">
                    <div *ngFor="let event of sheetDay.events; trackBy: trackByItemFn"  [style.height]="calendar.multiEventHeight + 'px'"></div>
                </div>
            </div>
        </div>
        <div #scrollcontainer class="slds-scrollable--y" aria-hidden="true" style="overflow: scroll; visibility: hidden; flex: none"></div>
    </div>
    <div class="slds-scrollable--y slds-is-relative slds-grow calendar-event-drag-boundary" style="overflow-y: scroll;">
        <ng-container>
            <div *ngFor="let sheetHour of sheetHours; let index = index; trackBy: trackByIndexFn" class="slds-grid">
                <div [style.width]="sheetTimeWidth + 'px'">
                    <div class="slds-text-align--center slds-border--bottom" [style.height]="calendar.sheetHourHeight + 'px'">{{sheetHour}}:00</div>
                </div>
                <div class="slds-border--left slds-border--bottom slds-grow slds-grid" [style.height]="calendar.sheetHourHeight + 'px'">
                    <div *ngFor="let sheetDay of sheetDays; trackBy: trackByIndexFn" class="slds-border--right" [ngStyle]="dayWidthStyle">
                        <div style="height: 50%" class="slds-grid slds-grid--vertical">
                            <calendar-sheet-drop-target [day]="sheetDay" [hour]="sheetHour" [hourPart]="0" class="spice-calendar-drop-target"></calendar-sheet-drop-target>
                            <calendar-sheet-drop-target [day]="sheetDay" [hour]="sheetHour" [hourPart]="1" class="spice-calendar-drop-target"></calendar-sheet-drop-target>
                        </div>
                        <div class="slds-border--top slds-grid slds-grid--vertical" style="height: 50%">
                            <calendar-sheet-drop-target [day]="sheetDay" [hour]="sheetHour" [hourPart]="2" class="spice-calendar-drop-target"></calendar-sheet-drop-target>
                            <calendar-sheet-drop-target [day]="sheetDay" [hour]="sheetHour" [hourPart]="3" class="spice-calendar-drop-target"></calendar-sheet-drop-target>
                        </div>
                    </div>
                </div>
            </div>
            <ng-container *ngFor="let event of allEvents; trackBy: trackByItemFn">
                <calendar-sheet-event [ngStyle]="getEventStyle(event)" [event]="event" (eventDrop)="onEventDrop($event)" class="spice-calendar-event"></calendar-sheet-event>
            </ng-container>
        </ng-container>
    </div>
</div>
