<div class="slds-popover slds-popover--panel slds-is-fixed" [ngStyle]="popoverStyle" [ngClass]="nubbinClass" role="dialog" (mouseenter)="onMouseEnter()" (mouseleave)="onMouseOut($event)">
    <button class="slds-button slds-button_icon slds-button_icon slds-button_icon-small slds-float_right slds-popover__close" (click)="closePopover(true)">
        <system-button-icon icon="close"></system-button-icon>
    </button>
    <div #popoverContainer>
        <div class="slds-popover__header" style="padding: .5rem">
            <header class="slds-text-heading--small slds-m-bottom--x-small">{{data.name}}</header>
            <div class="slds-scrollable--y" style="height: 120px">
                <dl class="slds-list_horizontal slds-wrap slds-text-body_small">
                    <dt class="slds-item_label slds-text-color_weak slds-truncate">
                        <system-label label="LBL_DATE"></system-label>
                    </dt>
                    <dd class="slds-item_detail slds-text-color_weak slds-truncate">
                        {{data.date}}
                    </dd>
                </dl>
            </div>
        </div>
    </div>
</div>
