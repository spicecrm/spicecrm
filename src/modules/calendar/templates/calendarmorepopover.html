<div class="slds-popover slds-popover--panel slds-is-fixed" [ngStyle]="popoverStyle" [ngClass]="getNubbinClass()" role="dialog" (mouseenter)="onMouseOver()" (mouseleave)="onMouseOut()">
    <button class="slds-button slds-button_icon slds-button_icon slds-button_icon-small slds-float_right slds-popover__close" (click)="closePopover(true)">
        <system-button-icon icon="close"></system-button-icon>
    </button>
    <div #popover>
        <div class="slds-popover__header" style="padding: .5rem">
            <header class="slds-text-heading--small slds-m-bottom--x-small">{{events.length}} {{language.getLabel('LBL_EVENTS')}}</header>
            <div class="slds-scrollable--y" style="height: 120px">
                <calendar-more-popover-event *ngFor="let event of events"  [event]="event" (action$)="closePopover(true)"></calendar-more-popover-event>
            </div>
        </div>
    </div>
</div>
