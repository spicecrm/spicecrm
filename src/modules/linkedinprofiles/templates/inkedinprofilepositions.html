<article class="slds-card slds-m-bottom--small">
    <div class="slds-card__header slds-grid">
        <header class="slds-media slds-media_center slds-has-flexi-truncate">
            <div class="slds-media__figure">
                <system-icon icon="job_position" size="small"></system-icon>
            </div>
            <div class="slds-media__body">
                <h2 class="slds-card__header-title">
                    <system-label label="LBL_JOB_POSITIONS"/>
                </h2>
            </div>
        </header>
    </div>
    <div class="slds-card__body slds-card__body_inner">
        <div *ngIf="isLoading; else contentLoaded">
            <system-spinner></system-spinner>
        </div>
        <ng-template #contentLoaded>
            <div *ngIf="jobPositions; else noInformation" >
                <div *ngFor="let position of jobPositions; let i = index;">
                    <div [ngClass]="{'slds-border--bottom': i < jobPositions.length - 1}">
                        <div class="slds-grid slds-p-vertical--x-small slds-grid_vertical-align-center">
                            <div style="width: 50px; height: 50px;">
                                <img [src]="position.company_logo_base64" alt="company logo" style="width: 100%; height: auto; max-width: 100%;">
                            </div>
                            <div class="slds-m-left--medium">
                                <div class="slds-text-heading--small">{{position.position_title}}</div>
                                <div><a target="_blank" [href]="position.company_url">{{ position.company_name }}</a></div>
                                <div class="slds-text-color_weak">
                                    <span>{{formatYearMonthName(position.date_start)}} - </span>
                                    <span *ngIf="position.date_end">{{formatYearMonthName(position.date_end)}} &middot; </span>
                                    <span *ngIf="!position.date_end">present &middot; </span>
                                    <span>{{calculateDuration(position.date_start, position.date_end)}}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <ng-template #noInformation>
                <system-illustration-no-records>
                    no records
                </system-illustration-no-records>
            </ng-template>
        </ng-template>
    </div>
</article>
