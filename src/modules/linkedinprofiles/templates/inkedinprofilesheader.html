<div *ngIf="model.data.profile_background_image_base64 || model.data.profile_picture_base64; else loading">
    <div class="slds-align_absolute-center" (click)="handleClick()" [ngStyle]="getStyle()">
        <div class="slds-is-relative slds-p-around--xx-small" style="max-width: 800px">
            <img [src]="model.data.profile_background_image_base64">
            <img *ngIf="model.data.profile_picture_base64" [ngStyle]="cssStyles()" [src]="model.data.profile_picture_base64">
            <svg *ngIf="!model.data.profile_picture_base64" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" id="person-accent-4"
                 style="border-radius: 50%; margin-top: -100px; margin-left: 30px; width: 150px; border-width: 5px; border-color: white; border-style: solid;">
                <path fill="#e7e2dc" d="M0 0h128v128H0z"/>
                <path d="M88.41 84.67a32 32 0 10-48.82 0 66.13 66.13 0 0148.82 0z" fill="#788fa5"/>
                <path d="M88.41 84.67a32 32 0 01-48.82 0A66.79 66.79 0 000 128h128a66.79 66.79 0 00-39.59-43.33z" fill="#9db3c8"/>
                <path d="M64 96a31.93 31.93 0 0024.41-11.33 66.13 66.13 0 00-48.82 0A31.93 31.93 0 0064 96z" fill="#56687a"/>
            </svg>
        </div>
    </div>
</div>
<ng-template #loading>
    <system-spinner></system-spinner>
</ng-template>
