<div class="slds-grid slds-gutters_direct-x-small">
    <div class="slds-col slds-form-element">
        <label class="slds-form-element__label"><abbr class="slds-required" title="required">* </abbr><system-label label="LBL_QUESTION_TEXT"></system-label></label>
        <input type="text" class="slds-input" [(ngModel)]="questiontext" (blur)="questiontextBlurred()">
    </div>
    <div class="slds-col slds-form-element" [ngClass]="{'slds-has-error':nameMissing}">
        <label class="slds-form-element__label" ><system-label label="LBL_NAME"></system-label></label>
        <input type="text" class="slds-input" [(ngModel)]="name" (blur)="nameBlurred()" (change)="nameChanged()">
    </div>
</div>

<div class="slds-m-top--medium">
    <system-checkbox [(ngModel)]="answerRequired"><system-label label="LBL_ANSWER_REQUIRED"></system-label></system-checkbox>
</div>

<system-spinner *ngIf="model.isLoading"></system-spinner>

<table *ngIf="options.length" class="slds-table slds-table_bordered slds-m-vertical--medium">
    <thead>
        <tr>
            <th scope="col" width="25%">
                <div class="slds-truncate"><system-label label="LBL_VALUE"></system-label></div>
            </th>
            <th scope="col" width="25%">
                <div class="slds-truncate"><system-label label="LBL_OPTIONS"></system-label></div>
            </th>
            <th scope="col" width="25%">
                <div class="slds-truncate"><system-label label="LBL_CATEGORIES"></system-label></div>
            </th>
            <th scope="col" width="25%">
                <div class="slds-truncate"><system-label label="LBL_POINTS"></system-label></div>
            </th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        <tr questions-manager-edit-option-ist *ngFor="let option of options; let i = index;" [categorypool]="categorypool" [option]="option" [isFirstRow]="i === 0" [isLastRow]="i === options.length-1" (event)="optionEventHappened($event,i)"></tr>
    </tbody>
</table>

<div *ngIf="!model.isLoading" class="slds-text-align_center slds-m-top--medium">
    <button class="slds-button slds-button--neutral" (click)="addOptions()" [disabled]="!canAddOption">
        <system-button-icon [icon]="'add'" [position]="'left'"></system-button-icon>
        <system-label label="LBL_ADD_ANSWER_OPTION"></system-label>
    </button>
</div>
