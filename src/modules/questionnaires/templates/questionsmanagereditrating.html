<div class="slds-grid slds-m-bottom--large">
    <div class="slds-p-right--medium" style="width:100%">
        <label class="slds-form-element__label" >{{language.getLabel('LBL_QUESTION')}}</label>
        <input type="text" class="slds-input" [(ngModel)]="model.data.name">
    </div>
    <div style="width:4rem">
        <label class="slds-form-element__label slds-m-horizontal--none">{{language.getLabel('LBL_IMAGE')}}</label><br>
        <field-container [field]="'image_id'" [fieldconfig]="{fieldtype:'mediafile'}" [fielddisplayclass]="''" (change)="change()"></field-container>
    </div>
</div>

<table class="slds-table slds-table_bordered">
    <thead>
        <tr>
            <th scope="col">
                <div class="slds-text-align_right slds-p-right--x-small">{{language.getLabel('LBL_VALUE')}}</div>
            </th>
            <th scope="col" width="100%">
                <div>{{language.getLabel('LBL_CATEGORIES')}}</div>
            </th>
            <th scope="col">
                <div class="slds-text-align_right">{{language.getLabel('LBL_POINTS')}}</div>
            </th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let entry of entries; let i = index;">
            <td>
                <div class="slds-text-align_right  slds-p-right--x-small">{{entry.value}}</div>
            </td>
            <td>
                <div><questions-manager-edit-categories [option]="options[i]" [categorypool]="categorypool"></questions-manager-edit-categories></div>
            </td>
            <td>
                <div class="slds-text-align_right"><input type="text" class="slds-input slds-text-align_right" [(ngModel)]="options[i].points" (change)="change()" style="width:unset" size="4"></div>
            </td>
        </tr>
    </tbody>
</table>
