<div class="slds-grid slds-gutters_direct-x-small">
    <div class="slds-col slds-form-element">
        <label class="slds-form-element__label"><system-label label="LBL_QUESTION_TEXT"></system-label></label>
        <input type="text" class="slds-input" [(ngModel)]="questiontext" (blur)="questiontextBlurred()">
    </div>
    <div class="slds-col slds-form-element" [ngClass]="{'slds-has-error':nameMissing}">
        <label class="slds-form-element__label" ><abbr class="slds-required" title="required">* </abbr><system-label label="LBL_NAME"></system-label></label>
        <input type="text" class="slds-input" [(ngModel)]="name" (blur)="nameBlurred()" (change)="nameChanged()">
    </div>
    <div class="slds-col slds-grow-none slds-form-element">
        <label class="slds-form-element__label slds-m-horizontal--none"><system-label label="LBL_IMAGE"></system-label></label><br>
        <field-container [field]="'image_id'" [fieldconfig]="{fieldtype:'mediafileimage'}" [fielddisplayclass]="''"></field-container>
    </div>
</div>

<div class="slds-grid slds-grid--align-spread slds-m-top_xx-small">
    <div class="slds-form-element slds-size--1-of-2 slds-p-right--x-small">
        <label class="slds-form-element__label" for="questionsmanagereditnps-val-for-0">Text for Value 0</label>
        <div class="slds-form-element__control">
            <input type="text" id="questionsmanagereditnps-val-for-0" class="slds-input" [(ngModel)]="textForScore0"/>
        </div>
    </div>
    <div class="slds-form-element slds-size--1-of-2 slds-p-left--x-small">
        <label class="slds-form-element__label" for="questionsmanagereditnps-val-for-10">Text for Value 10</label>
        <div class="slds-form-element__control">
            <input type="text" id="questionsmanagereditnps-val-for-10" class="slds-input" [(ngModel)]="textForScore10"/>
        </div>
    </div>
</div>

<div class="slds-m-top_xx-small">
    <questions-manager-edit-categories [showLabel]="true" [option]="forCategories" id="questionsmanagereditnps-categories" [categorypool]="categorypool" (change)="categoriesChanged()"></questions-manager-edit-categories>
</div>

<div class="slds-m-top--medium">
    <system-checkbox [(ngModel)]="answerRequired"><system-label label="LBL_ANSWER_REQUIRED"></system-label></system-checkbox>
</div>
