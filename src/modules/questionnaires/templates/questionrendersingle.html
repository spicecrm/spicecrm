<ng-container *ngIf="qp.isLoaded">
    <ng-container *ngIf="!hideFinishedQuestions || !questionMeta.finished">
        <div class="slds-box slds-p-around_none question-render-question" [ngStyle]="questionMeta.parameter.formatOptionsHorizontal ? styleQuestionMerging() : null">
            <!-- Options vertical aligned -->
            <ng-container *ngIf="!questionMeta.parameter.formatOptionsHorizontal && !questionMeta.parameter.asDropDown">
                <div *ngIf="hasTitleTextOrImage" class="slds-p-around_small slds-border_bottom">
                    <h3 *ngIf="question.questiontext && ( !question.image_id || questionset.showonlyimages !== '1' )">{{question.questiontext}}</h3>
                    <media-file-image *ngIf="question.image_id" [media_id]="question.image_id" [variant]="'mw'" [frameWidth]="imageWidthQuestion" [classOuter]="'slds-m-vertical_small'"></media-file-image>
                </div>
                <div class="slds-p-vertical--x-small">
                    <div *ngFor="let option of qp.questionoptionsArray[question.id];let j=index; let isLast=last" class="slds-grid slds-grid--vertical-align-center slds-scrollable--none slds-p-around--xx-small question-hover">
                        <div class="slds-p-around--xx-small">
                            <system-input-radio [value]="option.id" [(ngModel)]="value" [disabled]="isDisabled()"></system-input-radio>
                            <!--input id="{{option.id}}" type="radio" [checked]="isChecked(option.id)" (click)="qp.clickAnswerOption(option.id,$event)" [disabled]="isDisabled()"-->
                        </div>
                        <div class="slds-p-around--xx-small">
                            <media-file-image *ngIf="option.image_id" [media_id]="option.image_id" [variant]="'mw'" [frameWidth]="imageWidthOption" [classOuter]="'slds-m-bottom_small'"></media-file-image>
                            <label *ngIf="!( option.image_id && questionset.showonlyimages === '1' )"><system-wrapped-text [text]="option.text || option.name"></system-wrapped-text></label>
                        </div>
                    </div>
                </div>
            </ng-container>
            <!-- Options horizontal aligned -->
            <div *ngIf="questionMeta.parameter.formatOptionsHorizontal" class="slds-grid">
                <div *ngIf="hasTitleTextOrImage" class="slds-p-around_small slds-border_bottom">
                    <h3 *ngIf="question.questiontext && ( !question.image_id || questionset.showonlyimages !== '1' )">{{question.questiontext}}</h3>
                    <media-file-image *ngIf="question.image_id" [media_id]="question.image_id" [variant]="'mw'" [frameWidth]="imageWidthQuestion" [classOuter]="'slds-m-vertical_small'"></media-file-image>
                </div>
                <div *ngFor="let option of qp.questionoptionsArray[question.id];let j=index; let isFirst=first" class="slds-size_1-of-1 slds-scrollable--none slds-text-align_center slds-p-horizontal_small slds-p-vertical_x-small question-hover" [ngClass]="{'slds-border_left':!isFirst}" [ngStyle]="{'width':100/qp.questionoptionsArray[question.id].length+'%'}"  (click)="qp.clickAnswerOption(option.id,$event)">
                    <div class="slds-m-bottom_xxx-small">
                        <system-input-radio [(ngModel)]="value" [disabled]="isDisabled()"></system-input-radio>
                        <!--input type="radio" [checked]="isChecked(option.id)" (click)="qp.clickAnswerOption(option.id,$event)" [disabled]="isDisabled()"-->
                    </div>
                    <media-file-image *ngIf="option.image_id" [media_id]="option.image_id" [variant]="'mw'" [classOuter]="'slds-m-vertical_small'" [align]="'center'"></media-file-image>
                    <label *ngIf="!( option.image_id && questionset.showonlyimages === '1' )"><system-wrapped-text [text]="option.text || option.name"></system-wrapped-text></label>
                </div>
            </div>
            <!-- Options horizontal aligned -->
            <div *ngIf="questionMeta.parameter.asDropDown" class="slds-grid slds-grid--vertical-align-center slds-grid--align-spread">
                <div *ngIf="hasTitleTextOrImage" class="slds-p-around--x-small">
                    <h3 *ngIf="question.questiontext && ( !question.image_id || questionset.showonlyimages !== '1' )">{{question.questiontext}}</h3>
                    <media-file-image *ngIf="question.image_id" [media_id]="question.image_id" [variant]="'mw'" [frameWidth]="imageWidthQuestion" [classOuter]="'slds-m-vertical_small'"></media-file-image>
                </div>
                <div class="slds-form-element__control slds-p-around--x-small">
                    <div class="slds-select_container">
                        <select class="slds-select" [(ngModel)]="value" [disabled]="isDisabled()">
                            <option *ngFor="let option of qp.questionoptionsArray[question.id]" [ngValue]="option.id">{{option.text || option.name}}</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </ng-container>
</ng-container>
