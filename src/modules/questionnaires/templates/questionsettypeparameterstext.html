<h4>{{language.getLabel('LBL_QUESTIONSTYPE_SETTINGS')}}</h4>
<div class="slds-grid slds-grid_vertical-align-end slds-grid--align-spread">
    <div class="slds-col slds-form-element slds-p-vertical--small slds-text-align--left">
        <span class="slds-checkbox">
              <input type="checkbox" name="options" id="checkbox-questions-sequenced" [checked]="sequenced" (change)="click()" [disabled]="!editing" />
              <label class="slds-checkbox__label" for="checkbox-questions-sequenced">
                <span class="slds-checkbox_faux"></span>
                <span class="slds-form-element__label">Fragetext als Sequenz darstellen</span>
              </label>
        </span>
    </div>
</div>
