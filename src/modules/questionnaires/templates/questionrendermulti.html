<ng-container *ngIf="showQuestion">

    <div class="slds-box slds-p-around_none question-render-question" [ngStyle]="questionMeta.parameter.formatOptionsHorizontal ? styleQuestionMerging() : null" [ngClass]="{'slds-has-error':showError}">
        <question-render-header [question]="question" [showError]="showError" addclasses="slds-p-around_small slds-border_bottom"></question-render-header>
        <!-- Options vertical -->
        <ng-container *ngIf="!questionMeta.parameter.formatOptionsHorizontal">
            <div class="slds-p-around--x-small">
                <div *ngFor="let option of qp.questionoptionsArray[question.id];let j=index; let isLast=last" class="slds-scrollable--none slds-grid slds-grid--vertical-align-center slds-gutters_direct-x-small slds-p-around--x-small question-hover" (click)="qp.clickAnswerOption(option.id,$event)">
                    <question-render-checkbox class="slds-col slds-grow-none" [option]="option"></question-render-checkbox>
                    <div class="slds-col">
                        <media-file-image *ngIf="option.image_id" [media_id]="option.image_id" [variant]="'mw'" [frameWidth]="imageWidthOption" [classOuter]="'slds-m-bottom_small'"></media-file-image>
                        <label *ngIf="!( option.image_id && questionset.showonlyimages === '1' )"><system-wrapped-text [text]="option.text || option.name"></system-wrapped-text></label>
                    </div>
                </div>
            </div>
        </ng-container>
        <!-- Options horizontal -->
        <ng-container *ngIf="questionMeta.parameter.formatOptionsHorizontal">
            <div *ngFor="let option of qp.questionoptionsArray[question.id];let j=index" class="slds-grid slds-grid_pull-padded-x-small slds-scrollable--none slds-size_1-of-1 slds-text-align_center slds-p-horizontal_small" [ngClass]="{'slds-border_left':j>0}" [ngStyle]="{'width':100/qp.questionoptionsArray[question.id].length+'%'}" (click)="qp.clickAnswerOption(option.id,$event)">
                <div class="slds-m-bottom_xxx-small">
                    <question-render-checkbox [option]="option"></question-render-checkbox>
                    <media-file-image *ngIf="option.image_id" [media_id]="option.image_id" [variant]="'mw'" [classOuter]="'slds-m-vertical_small'" [align]="'center'"></media-file-image>
                </div>
                <label *ngIf="!( option.image_id && questionset.showonlyimages === '1' )"><system-wrapped-text [text]="option.text || option.name"></system-wrapped-text></label>
            </div>
        </ng-container>
    </div>

</ng-container>
