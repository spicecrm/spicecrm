<div *ngIf="qp.showQuestionHeader(question)" [ngClass]="addclasses">
    <h3 *ngIf="question.questiontext && ( !question.image_id || question.parentQuestionset.showonlyimages !== '1' )" [ngClass]="{'slds-text-color_error':showError}">
        <abbr *ngIf="!isDisabled() && question.answer_required" class="slds-required">*</abbr>
        {{question.questiontext}}
    </h3>
    <media-file-image *ngIf="question.image_id" [media_id]="question.image_id" [variant]="'mw'" [frameWidth]="qp.imageWidthQuestion" [classOuter]="'slds-m-vertical_small'"></media-file-image>
</div>
