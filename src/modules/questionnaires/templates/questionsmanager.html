<div>
    <div class="slds-grid slds-grid_align-spread slds-grid--vertical-align-start x-slds-p-bottom--medium">
        <div *ngIf="!noTitle">
            <h2 *ngIf="!ref.innerHTML.trim()" class="slds-text-heading--medium">{{language.getLabel('LBL_QUESTION_MANAGER')}}</h2>
            <div #ref><ng-content></ng-content></div>
        </div>
        <div *ngIf="!isLoading">
            <button class="slds-button slds-button--icon slds-button--icon-border slds-button--icon-border-filled" *ngIf="showQuestionsetButtons" (click)="questionsetAction.emit('edit')" [disabled]="changeOrderMode"><system-button-icon [icon]="'edit'" title="{{language.getLabel('LBL_EDIT')}}"></system-button-icon></button>
            <button class="slds-button slds-button--icon slds-button--icon-border slds-button--icon-border-filled slds-m-right--small" *ngIf="showQuestionsetButtons" (click)="questionsetAction.emit('delete')" [disabled]="changeOrderMode"><system-button-icon [icon]="'delete'" title="{{language.getLabel('LBL_DELETE')}}"></system-button-icon></button>
            <button class="slds-button slds-button--neutral slds-button--brand" *ngIf="changeOrderMode" (click)="changeOrderSave()">{{language.getLabel('LBL_SAVE_ORDER')}}</button>
            <button class="slds-button slds-button--icon slds-button--icon-border slds-button--icon-border-filled" *ngIf="changeOrderMode" (click)="changeOrderCancel()" title="{{language.getLabel('LBL_CANCEL')}}"><system-button-icon [icon]="'close'" title="{{language.getLabel('LBL_CANCEL')}}"></system-button-icon></button>
            <button class="slds-button slds-button--neutral" *ngIf="!changeOrderMode && questions.length" (click)="changeOrderStart()" [disabled]="questions.length < 2">{{language.getLabel('LBL_CHANGE_ORDER')}}</button>
            <button class="slds-button slds-button--neutral" (click)="addQuestion()" [disabled]="changeOrderMode"><system-button-icon [icon]="'add'" [position]="'left'"></system-button-icon>{{language.getLabel('LBL_QUESTION')}}</button>
        </div>
    </div>
    <ng-container *ngIf="!isLoading">
        <div *ngFor="let question of questions; let i = index;" class="slds-box slds-box_xx-small slds-m-top_small">
            <div class="slds-grid slds-grid--vertical-align-center">
                <div style="white-space: nowrap" *ngIf="changeOrderMode">
                    <button class="slds-button slds-button_icon slds-button_icon-border slds-button--icon-border-filled" (click)="questionUp(i)" title="{{language.getLabel('LBL_HOCH')}}" [disabled]="i == 0">
                        <system-button-icon [icon]="'arrowup'"></system-button-icon>
                        <span class="slds-assistive-text">{{language.getLabel('LBL_UP')}}</span>
                    </button>
                    <button class="slds-button slds-button_icon slds-button_icon-border slds-button--icon-border-filled" (click)="questionDown(i)" title="{{language.getLabel('LBL_DOWN')}}" [disabled]="i >= questions.length-1">
                        <system-button-icon [icon]="'arrowdown'"></system-button-icon>
                        <span class="slds-assistive-text">{{language.getLabel('LBL_DOWN')}}</span>
                    </button>
                </div>
                <p class="slds-truncate slds-p-left_x-small">{{question.name}}</p>
                <div class="slds-col_bump-left" style="white-space:nowrap">
                    <button class="slds-button slds-button--icon slds-button--icon-border slds-button--icon-border-filled" (click)="editQuestion(question.id)" [disabled]="changeOrderMode"><system-button-icon [icon]="'edit'" title="{{language.getLabel('LBL_EDIT')}}"></system-button-icon></button>
                    <button class="slds-button slds-button--icon slds-button--icon-border slds-button--icon-border-filled" (click)="deleteQuestion(question.id)" [disabled]="changeOrderMode"><system-button-icon [icon]="'delete'" title="{{language.getLabel('LBL_DELETE')}}"></system-button-icon></button>
                </div>
            </div>
        </div>
    </ng-container>
    <system-spinner *ngIf="isLoading" style="display:block" class="slds-m-top--x-small"></system-spinner>
</div>
