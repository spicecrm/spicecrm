<span class="slds-form-element__control">
    <span class="slds-radio">
        <input type="radio" id="{{id}}" [checked]="isChecked(option.id)" [disabled]="isDisabled()" (click)="this.qp.clickAnswerOption( option.id, $event )">
        <label class="slds-radio__label" for="{{id}}" (click)="$event.stopPropagation()">
            <span class="slds-radio_faux slds-m-right--none"></span>
        </label>
    </span>
</span>
