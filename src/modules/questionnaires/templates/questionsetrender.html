<system-spinner *ngIf="isLoading"></system-spinner>

<ng-container *ngIf="!isLoading">

    <div class="questionset-render slds-text-heading_small" [ngClass]="{'in-modal':inModal}">

        <div class="questionset-render-header">
            <div class="slds-grid slds-grid--vertical-align-center">

                <h3 class="slds-size--3-of-5 slds-text-heading--medium">{{questionset.name}}</h3>

                <div class="slds-size--2-of-5" *ngIf="!previewMode && questions.length">
                    <div class="slds-grid slds-grid_vertical-align-center">
                        <div *ngIf="timerText" class="slds-box_border slds-m-left_medium" [class.slds-theme--warning]="timerWarning">
                            <span class="slds-p-left--xx-small slds-p-right--xx-small">{{timerText}}</span>
                        </div>
                        <div *ngIf="inModal" class="slds-col slds-m-left_medium">
                            <div class="slds-progress-bar slds-progress-bar_large slds-progress-bar_circular" style="height:1rem">
                                <span class="slds-progress-bar__value" [style.width]="(numOfFinishedQuestions/questions.length*100)+'%'">
                                    <span class="slds-assistive-text">Progress: {{numOfFinishedQuestions/questions.length*100}}%</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div *ngIf="questionset.textbefore && inModal" class="slds-grid slds-m-top_medium slds-box slds-theme_shade questionset-render-text" [class.collapsed]="textIsCollapsed" [class.slds-p-bottom--medium]="!textIsCollapsed" [class.slds-p-bottom--none]="textIsCollapsed">
                <div class="slds-col_bump-right">
                    <div [innerHTML]="questionset.textbefore" class="slds-p-right_medium html-text"></div>
                    <div *ngIf="textIsCollapsed" class="questionset-render-transition"></div>
                </div>
                <div>
                    <button *ngIf="!textIsCollapsed" title="reduzieren"
                            class="slds-button slds-button_icon slds-button_icon-container slds-button_icon-border-filled" (click)="toggleText()">
                        <system-button-icon [icon]="'collapse_all'"></system-button-icon>
                    </button>
                    <button *ngIf="textIsCollapsed" title="expandieren"
                            class="slds-button slds-button_icon slds-button_icon-container slds-button_icon-border-filled" (click)="toggleText()">
                        <system-button-icon [icon]="'expand_all'"></system-button-icon>
                    </button>
                </div>
            </div>
            <div *ngIf="questionset.textbefore && !inModal" [innerHTML]="questionset.textbefore" class="slds-m-vertical--medium"></div>

        </div>

        <div class="questionset-render-questions slds-m-top--medium" [ngClass]="{'slds-p-right--medium':inModal}">

            <div *ngIf="questions.length; else noQuestionsTemplate">

                <p *ngIf="hideFinishedQuestions && numOfFinishedQuestions === questions.length" class="slds-text-align--center">Alle Fragen sind beantwortet – und ausgeblendet.</p>

                <ng-container [ngSwitch]="questionset.questiontype">

                    <div *ngSwitchCase="'rating'">
                        <questionset-render-rating [questions]="questions" [(numOfFinishedQuestions)]="numOfFinishedQuestions" [questionsMeta]="questionsMeta" [options]="options" [answers]="answers" [questionset]="questionset" [noEdit]="noEdit" [participation_id]="participation_id" [previewMode]="previewMode" [hideFinishedQuestions]="hideFinishedQuestions"></questionset-render-rating>
                    </div>

                    <div *ngSwitchCase="'text'">
                        <questionset-render-text [questions]="questions" [(numOfFinishedQuestions)]="numOfFinishedQuestions" [questionsMeta]="questionsMeta" [options]="options" [answers]="answers" [questionset]="questionset" [noEdit]="noEdit" [participation_id]="participation_id" [previewMode]="previewMode" [hideFinishedQuestions]="hideFinishedQuestions"></questionset-render-text>
                    </div>

                    <div *ngSwitchCase="'ist'">
                        <questionset-render-ist [questions]="questions" [(numOfFinishedQuestions)]="numOfFinishedQuestions" [questionsMeta]="questionsMeta" [options]="options" [answers]="answers" [questionset]="questionset" [noEdit]="noEdit" [participation_id]="participation_id" [previewMode]="previewMode" [hideFinishedQuestions]="hideFinishedQuestions"></questionset-render-ist>
                    </div>

                </ng-container>

                <questionset-render-binary-single-multi
                        *ngIf="questionset.questiontype === 'binary' || questionset.questiontype === 'single' || questionset.questiontype === 'multi'"
                        [questions]="questions" [(numOfFinishedQuestions)]="numOfFinishedQuestions" [questionsMeta]="questionsMeta"
                        [options]="options" [answers]="answers" [questionset]="questionset" [noEdit]="noEdit" [participation_id]="participation_id"
                        [previewMode]="previewMode" [hideFinishedQuestions]="hideFinishedQuestions"
                ></questionset-render-binary-single-multi>

            </div>

            <ng-template #noQuestionsTemplate>
                <p>{{language.getLabel('LBL_NO_QUESTIONS_TO_DISPLAY')}}</p>
            </ng-template>

        </div>

        <div class="questionset-render-header">
            <div *ngIf="questionset.textafter" [innerHTML]="questionset.textafter" class="slds-m-top_medium html-text"></div>
        </div>

    </div>

</ng-container>
