<system-modal size="large">

    <system-modal-header (close)="cancel()">
        <system-label label="LBL_FILL_OUT_QUESTIONNAIRE"></system-label>
    </system-modal-header>

    <system-modal-content [grow]="true">

        <questionnaire-render *ngIf="parentId !== undefined && parentType !== undefined" [parentId]="parentId" [parentType]="parentType" editMode="questionnaire" (questionnaireParticipation$)="qp = $event"></questionnaire-render>
        <!--system-spinner *ngIf="!questionnaireId"></system-spinner-->

    </system-modal-content>

    <system-modal-footer>
        <button [disabled]="!qpIsDirty || qpIsSaving" class="slds-button slds-button--brand" (click)="saveAndClose()"><system-label label="LBL_SAVE"></system-label></button>
        <button [disabled]="qpIsSaving" class="slds-button slds-button--neutral" (click)="cancel()"><system-label label="LBL_CANCEL"></system-label></button>
    </system-modal-footer>

</system-modal>
