<div class="slds-grid">
    <div class="slds-p-right--medium" style="width:100%">
        <label class="slds-form-element__label" >{{language.getLabel('LBL_QUESTION_TEXT')}}</label>
        <input type="text" class="slds-input" [(ngModel)]="model.data.name">
    </div>
    <div style="width:4rem">
        <label class="slds-form-element__label slds-m-horizontal--none">{{language.getLabel('LBL_IMAGE')}}</label><br>
        <field-container [field]="'image_id'" [fieldconfig]="{fieldtype:'mediafile'}" [fielddisplayclass]="'bottom'" (change)="change()"></field-container>
    </div>
    <div class="slds-p-left_medium slds-text-align_center" style="white-space:nowrap">
        <!--<label class="slds-form-element__label slds-m-horizontal--none"><abbr>R/F</abbr>
        </label><br>-->
        <!--input type="checkbox" class="slds-input slds-m-right--xx-small" style="width:unset" [checked]="hasInfosCorrectness" (change)="onChange_hasInfosCorrectness($event)" size="3"-->

        <span class="slds-checkbox slds-checkbox_stacked">
                    <input id="checkbox-rf" type="checkbox" [checked]="hasInfosCorrectness" (change)="onChange_hasInfosCorrectness($event)"/>
                    <label class="slds-checkbox__label" for="checkbox-rf">
                        <span class="slds-checkbox_faux"></span>
                        <span class="slds-form-element__label">R/F</span>
                    </label>
                </span>


    </div>
    <div class="slds-p-left_medium slds-text-align_center" style="white-space:nowrap">
        <label class="slds-form-element__label slds-m-horizontal--none">{{language.getLabel('LBL_MIN_MAX_ANSWERS')}}</label><br>
        <input type="text" class="slds-input slds-text-align--right slds-m-right--xx-small" style="width:unset" [(ngModel)]="minAnswers" (change)="onChangeNumAnswers()" size="3"><input type="text" class="slds-input slds-text-align--right" style="width:unset" [(ngModel)]="maxAnswers" (change)="onChangeNumAnswers()" size="3">
    </div>
</div>

<system-spinner *ngIf="model.isLoading"></system-spinner>

<table *ngIf="options.length" class="slds-table slds-table_bordered slds-m-vertical--medium">
    <thead>
        <tr>
            <th *ngIf="hasInfosCorrectness" class="slds-text-align--center">
                R
            </th>
            <th scope="col" width="50%">
                <div class="slds-truncate">{{language.getLabel('LBL_TEXT')}}</div>
            </th>
            <th scope="col" width="4rem">
                <div class="slds-truncate">{{language.getLabel('LBL_IMAGE')}}</div>
            </th>
            <th scope="col" width="50%">
                <div class="slds-truncate">{{language.getLabel('LBL_CATEGORIES')}}</div>
            </th>
            <th scope="col">
                <div class="slds-truncate slds-text-align_right">{{language.getLabel('LBL_POINTS')}}</div>
            </th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        <tr questions-manager-edit-option-single-multi *ngFor="let option of options; let i = index;" [hasInfosCorrectness]="hasInfosCorrectness" [categorypool]="categorypool" [option]="option" [isFirstRow]="i === 0" [isLastRow]="i === options.length-1" (event)="eventHappened($event,i)"></tr>
    </tbody>
</table>

<div *ngIf="!model.isLoading" class="slds-text-align_right slds-m-top--medium">
    <button class="slds-button slds-button--neutral" (click)="addOption()">
        <system-button-icon [icon]="'add'" [position]="'left'"></system-button-icon>
        {{language.getLabel('LBL_ADD_ANSWER_OPTION')}}
    </button>
</div>
