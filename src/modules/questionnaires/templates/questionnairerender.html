<system-spinner *ngIf="!qp.isLoaded" class="slds-m-vertical--large" style="display:block"></system-spinner>

<ng-container *ngIf="questionnaireIsToBeDisplayed()">
    <div *ngIf="showQuestionnaireTitle" class="slds-text-heading--medium slds-m-bottom_medium">{{qp.questionnaire.name}}</div>
    <div *ngIf="showQuestionnaireTextBefore && qp.questionnaire.textbefore" [innerHTML]="qp.questionnaire.textbefore" class="slds-m-bottom--medium questionnaire-some-words"></div>
    <div *ngIf="qp.questionsetsArray.length; else noQuestionsetsTemplate">
        <div *ngFor="let questionset of qp.questionsetsArray; last as isLast">
            <div *ngIf="qp.editMode === 'preview' || qp.editMode == 'postview'" class="slds-box" [ngClass]="{'slds-m-bottom_medium': !isLast}" [ngStyle]="{'border-width':this.qp.sizeSmall?'1px':'3px'}">
                <questionset-render [questionsetId]="questionset.id" [showProgress]="showProgress" [hideFinishedQuestions]="hideFinishedQuestions" [imageWidthOption]="imageWidthOption" [imageWidthQuestion]="imageWidthQuestion"></questionset-render>
            </div>
        </div>
    </div>
    <ng-template #noQuestionsetsTemplate>
        <p><system-label label="LBL_NO_QUESTIONSETS_TO_DISPLAY"></system-label></p>
    </ng-template>
    <div *ngIf="showQuestionnaireTextAfter && qp.questionnaire.textafter" [innerHTML]="qp.questionnaire.textafter" class="slds-m-top--medium questionnaire-some-words"></div>
</ng-container>
