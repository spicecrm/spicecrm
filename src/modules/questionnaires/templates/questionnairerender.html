<div *ngIf="questionnaireParticipation.showQuestionnaireTitle" class="slds-text-heading--medium slds-m-bottom--x-small">{{questionnaireParticipation.questionnaire.name}}</div>

<system-spinner *ngIf="questionnaireParticipation.isLoading" class="slds-m-top--large" style="display:block"></system-spinner>

<div *ngIf="!questionnaireParticipation.isLoading">
    <div *ngIf="questionnaireParticipation.questionnaire.textbefore" [innerHTML]="questionnaireParticipation.questionnaire.textbefore" class="slds-m-bottom--medium questionnaire-some-words"></div>
    <div *ngIf="questionnaireParticipation.questionsets.length; else noQuestionsetsTemplate">
        <div *ngFor="let questionset of questionnaireParticipation.questionsets; last as isLast">
            <div class="slds-box" [ngClass]="{'slds-m-bottom--x-small': !isLast}">
                <questionset-render [questionsetIdOrObject]="questionset"></questionset-render>
            </div>
        </div>
    </div>
    <ng-template #noQuestionsetsTemplate>
        <p><system-label label="LBL_NO_QUESTIONSETS_TO_DISPLAY"></system-label></p>
    </ng-template>
    <div *ngIf="questionnaireParticipation.questionnaire.textafter" [innerHTML]="questionnaireParticipation.questionnaire.textafter" class="slds-m-top--medium questionnaire-some-words"></div>
</div>
