<system-spinner *ngIf="!qp.isLoaded" class="slds-m-top--large" style="display:block"></system-spinner>

<div *ngIf="qp.isLoaded">
    <div *ngIf="qp.showQuestionnaireTitle" class="slds-text-heading--medium slds-m-bottom--x-small">{{qp.questionnaire.name}}</div>
    <div *ngIf="qp.questionnaire.textbefore" [innerHTML]="qp.questionnaire.textbefore" class="slds-m-bottom--medium questionnaire-some-words"></div>
    <div *ngIf="qp.questionsetsArray.length; else noQuestionsetsTemplate">
        <div *ngFor="let questionset of qp.questionsetsArray; last as isLast">
            <div class="slds-box" [ngClass]="{'slds-m-bottom--x-small': !isLast}">
                <questionset-render [questionsetId]="questionset.id"></questionset-render>
            </div>
        </div>
    </div>
    <ng-template #noQuestionsetsTemplate>
        <p><system-label label="LBL_NO_QUESTIONSETS_TO_DISPLAY"></system-label></p>
    </ng-template>
    <div *ngIf="qp.questionnaire.textafter" [innerHTML]="qp.questionnaire.textafter" class="slds-m-top--medium questionnaire-some-words"></div>
</div>
