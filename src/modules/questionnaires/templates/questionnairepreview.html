<system-modal size="large">
    <system-modal-header (close)="closePopup()">
        <!--<div *ngIf="!isLoading" class="slds-modal__header slds-theme_shade">-->
            <h2 class="slds-text-heading--medium">{{questionnaire.name}}</h2>
        <!--</div>-->
    </system-modal-header>
    <system-modal-content>
        <!-- <div class="slds-p-around--medium slds-theme--default">-->
            <questionnaire-render *ngIf="!isLoading" [questionnaire]="questionnaire"></questionnaire-render>
            <system-spinner *ngIf="isLoading"></system-spinner>
        <!--</div>-->
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="closePopup()">{{language.getLabel('LBL_CLOSE')}}</button>
    </system-modal-footer>
</system-modal>
