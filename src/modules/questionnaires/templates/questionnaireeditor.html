<div class="slds-grid">

    <div tobottom class="slds-size--1-of-2 slds-p-horizontal--medium slds-m-bottom--medium">
        <div *ngFor="let questionset of questionsets; let i=index; trackBy: trackBy" class="slds-m-bottom--medium">
            <questionset-manager [questionset]="questionset" (positionChanged)="sortQuestionsets()" (deleted)="removeQuestionset(i)"></questionset-manager>
        </div>
        <div class="">
            <questionnaire-editor-questionset-add [questionnaire]="this.model" (newQuestionset)="addQuestionset($event)"></questionnaire-editor-questionset-add>
        </div>
    </div>

    <div class="slds-size--1-of-2 slds-p-horizontal--medium">
        <div class="slds-grid slds-grid--align-spread slds-p-bottom--medium">
            <div class="slds-border--bottom slds-grow slds-m-right--medium">{{lang.getLabel('LBL_PREVIEW')}}</div>
            <div><button class="slds-button slds-button_icon" (click)="reloadPreview()"><system-button-icon [icon]="'refresh'"></system-button-icon></button></div>
        </div>
        <div tobottom class="slds-m-bottom--medium">
            <questionnaire-render *ngIf="!isLoading" [questionnaire]="this.model.data" [inModal]="false" [showQuestionnaireTitle]="false" class="slds-p-right--medium" style="display:block"></questionnaire-render>
        </div>
    </div>

    <system-spinner *ngIf="isLoading"></system-spinner>

</div>
