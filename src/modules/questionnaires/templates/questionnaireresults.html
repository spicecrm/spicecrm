<div class="slds-grid slds-grid--align-spread">
    <div><span *ngIf="noParticipation">No questionnaire participation (yet).</span></div>
    <div><button *ngIf="!isLoading" class="slds-button slds-button_icon" (click)="reload()"><system-button-icon [icon]="'refresh'"></system-button-icon></button></div>
</div>

<system-spinner *ngIf="isLoading"></system-spinner>

<div *ngIf="!isLoading" class="slds-p-bottom--medium">
    <div *ngFor="let questionset of questionsets; first as isFirst" [class.slds-p-top--medium]="!isFirst">
        <questionset-render [questionsetIdOrObject] = "questionset.id" [participation_id] = "questionset.participationId" [noEdit] = "true" [inModal] = "false"></questionset-render>
    </div>
</div>
