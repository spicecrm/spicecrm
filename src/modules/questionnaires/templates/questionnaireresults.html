<div class="slds-grid slds-grid--align-spread">
    <div *ngIf="noParticipation" class="slds-text-align--center slds-grow">
        <div class="slds-text-heading--small slds-p-top--small"><system-label [label]="'MSG_NO_QUESTIONNAIRE_PARTICIPATION_YET'"></system-label></div>
        <button class="slds-button slds-button_neutral slds-m-top_medium" (click)="fillOut()"><system-label label="LBL_FILL_IN_QUESTIONNAIRE"></system-label>&nbsp;&hellip;</button>
    </div>
    <div *ngIf="questionnaireParticipation && questionnaireParticipation.isLoaded" class="slds-col--bump-left"><button class="slds-button slds-button_icon" (click)="reload()"><system-button-icon [icon]="'refresh'"></system-button-icon></button></div>
</div>

<questionnaire-render [parentType]="model.module" [parentId]="model.id" [editMode]="'off'" (questionnaireParticipation$)="questionnaireParticipation=$event" [showQuestionnaireTextBefore]="false" [showQuestionnaireTextAfter]="false"></questionnaire-render>
