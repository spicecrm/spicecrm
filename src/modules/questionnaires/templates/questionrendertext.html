<ng-container *ngIf="!sequenced">
    <ng-container *ngFor="let question of questionset.questions;let i = index">
        <div *ngIf="!qp.hideFinishedQuestions || !questionMeta[question.id].finished" class="slds-box slds-m-bottom--medium questionset-render-question">
            <div>
                <h3 *ngIf="!question.image_id || questionset.showonlyimages !== '1'" class="slds-text-heading_medium" [class.slds-m-bottom_xx-small]="question.image_id">{{question.name}}</h3>
                <media-file-image *ngIf="question.image_id" [media_id]="question.image_id" [variant]="'mw'" [frameWidth]="qp.imageWidthQuestion"></media-file-image>
            </div>
            <div class="slds-p-top--x-small">
                <textarea *ngIf="qp.editMode === 'preview'" class="slds-scrollable--y slds-textarea"></textarea>
                <textarea class="slds-scrollable--y slds-textarea"
                          *ngIf="qp.editMode !== 'preview'"
                          [ngModel]="answerValue"
                          (change)="onTextChange()"
                          [attr.disabled]="questionMeta[question.id].tempReadonly || qp.editMode === 'off' ? '':null"></textarea><!-- (focus)="onTextFocus(question.id)" -->
            </div>
        </div>
    </ng-container>
</ng-container>

<ng-container *ngIf="!qp.hideFinishedQuestions || !questionMeta.finished"> <!-- brauchen wir dieses ngIf ? -->
    <table *ngIf="sequenced" class="sequenced slds-text-align--right slds-table--bordered" style="border-top:none">
        <ng-container *ngFor="let question of questionset.questions;let i = index">
            <tr *ngIf="!qp.hideFinishedQuestions || !questionMeta.finished">
                <td *ngFor="let item of forLoopArray(lengthLongestSequence); let j=index" class="slds-p-right--large slds-p-vertical--small slds-text-align--right slds-text-heading--small">
                    {{questionNamesSplitted[i][j]}}
                </td>
                <td class="slds-text-align--right slds-p-vertical--small" width="100%">
                    <input type="text" *ngIf="qp.editMode === 'preview'" size="5" class="slds-input">
                    <input type="text" *ngIf="qp.editMode !== 'preview'"
                           [ngModel]="qp.answers[question.id].optionlessAnswerValue"

                           (change)="onTextChange()"
                           [attr.disabled]="questionMeta[question.id].tempReadonly || qp.editMode === 'off' ? '':null"
                           size="5" style="width:auto"
                           class="slds-input"><!-- (focus)="onTextFocus(question.id)" -->
                </td>
            </tr>
        </ng-container>
    </table>
</ng-container>
