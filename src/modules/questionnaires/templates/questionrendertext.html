<ng-container *ngIf="!questionMeta.parameter.sequenced">
    <div *ngIf="1 || !qp.hideFinishedQuestions || !questionMeta.finished" class="slds-box questionset-render-question">
        <div *ngIf="question.questiontext || question.image_id" class="slds-m-bottom_medium">
            <h3 *ngIf="!question.image_id || questionset.showonlyimages !== '1'" class="slds-text-heading_medium" [class.slds-m-bottom_xx-small]="question.image_id">{{question.questiontext}}</h3>
            <media-file-image *ngIf="question.image_id" [media_id]="question.image_id" [variant]="'mw'" [frameWidth]="qp.imageWidthQuestion"></media-file-image>
        </div>
        <textarea *ngIf="qp.editMode === 'preview'" class="slds-scrollable--y slds-textarea" style="display:block"></textarea>
        <textarea class="slds-scrollable--y slds-textarea" style="display:block"
              *ngIf="qp.editMode !== 'preview'"
              [(ngModel)]="qp.answers[question.id].optionlessAnswerValue"
              (change)="onTextChange()"
              [attr.disabled]="questionMeta.tempReadonly || qp.editMode === 'off' ? '':null"></textarea>
    </div>
</ng-container>

<ng-container *ngIf="!qp.hideFinishedQuestions || !questionMeta.finished">
    <table *ngIf="questionMeta.parameter.sequenced" class="sequenced slds-text-align--right slds-table--bordered" style="border-top:none">
        <tr>
            <td *ngFor="let item of forLoopArray(lengthLongestSequence); let j=index" class="slds-p-right--large slds-p-vertical--small slds-text-align--right slds-text-heading--small">
                {{questionNameSplitted[j]}}
            </td>
            <td class="slds-text-align--right slds-p-vertical--small" width="100%">
                <input type="text" *ngIf="qp.editMode === 'preview'" size="5" class="slds-input">
                <input type="text" *ngIf="qp.editMode !== 'preview'"
                       [ngModel]="qp.answers[question.id].optionlessAnswerValue"
                       (change)="onTextChange()"
                       [attr.disabled]="questionMeta.tempReadonly || qp.editMode === 'off' ? '':null"
                       size="5" style="width:auto"
                       class="slds-input">
            </td>
        </tr>
    </table>
</ng-container>
