<div role="dialog" class="slds-modal slds-fade-in-open slds-modal_large">
    <div class="slds-modal__container">
        <header *ngIf="qp.isLoaded" class="slds-modal__header slds-theme_shade">
            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="{{language.getLabel('LBL_CLOSE')}}" (click)="closePopup()">
                <system-button-icon [size]="'large'" [icon]="'close'" ></system-button-icon>
            </button>
            <h2 class="slds-text-heading--medium"><system-label label="LBL_QUESTIONSET_PREVIEW"></system-label></h2>
        </header>
        <div class="slds-modal__content slds-p-around--medium" style="height:100%">
            <questionset-render *ngIf="qp.isLoaded"></questionset-render>
        </div>
        <div class="slds-modal__footer">
            <button class="slds-button slds-button--neutral" (click)="closePopup()"><system-label label="LBL_CLOSE"></system-label></button>
        </div>
    </div>
</div>
