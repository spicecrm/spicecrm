<section role="dialog" tabindex="-1"  class="slds-modal slds-fade-in-open slds-modal_large">
    <div class="slds-modal__container">
        <header class="slds-modal__header slds-theme_shade">
            <button class="slds-button slds-button_icon slds-modal__close slds-button--icon-inverse" title="{{language.getLabel('xLBL_CLOSE')}}" (click)="cancelModal()">
                <system-button-icon [icon]="'close'" [size]="'large'"></system-button-icon>
            </button>
            <h2 *ngIf="!questionid" class="slds-text-heading_medium slds-hyphenate"><system-label label="LBL_ADD_QUESTION"></system-label></h2>
            <h2 *ngIf="questionid" class="slds-text-heading_medium slds-hyphenate"><system-label label="LBL_EDIT_QUESTION"></system-label></h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium">
            <system-spinner *ngIf="isLoading"></system-spinner>
            <div *ngIf="!isLoading" [ngSwitch]="questiontype">
                <questions-manager-edit-rating *ngSwitchCase="'rating'" [categorypool]="categorypool"></questions-manager-edit-rating>
                <questions-manager-edit-rating-group *ngSwitchCase="'ratinggroup'" [questionset]="questionset" [categorypool]="categorypool"></questions-manager-edit-rating-group>
                <questions-manager-edit-binary *ngSwitchCase="'binary'" [categorypool]="categorypool"></questions-manager-edit-binary>
                <questions-manager-edit-single *ngSwitchCase="'single'" [categorypool]="categorypool"></questions-manager-edit-single>
                <questions-manager-edit-multi *ngSwitchCase="'multi'" [categorypool]="categorypool"></questions-manager-edit-multi>
                <questions-manager-edit-text *ngSwitchCase="'text'" [categorypool]="categorypool"></questions-manager-edit-text>
                <questions-manager-edit-ist *ngSwitchCase="'ist'" [categorypool]="categorypool"></questions-manager-edit-ist>
                <questions-manager-edit-nps *ngSwitchCase="'nps'" [categorypool]="categorypool"></questions-manager-edit-nps>
                <div *ngSwitchDefault><system-label label="MSG_NO_QUESTIONTYPE_NO_QUESTION"></system-label></div>
            </div>
        </div>
        <footer class="slds-modal__footer slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
            <div><ng-container *ngIf="!isLoading">
                <system-label label="LBL_QUESTIONTYPE" style="display:inline-block"></system-label>: {{questiontypes_dom[questiontype]}}
            </ng-container></div>
            <div>
                <button class="slds-button slds-button--neutral" (click)="cancelModal()"><system-label label="LBL_CANCEL"></system-label></button>
                <button class="slds-button slds-button--brand" (click)="saveQuestion()" [disabled]="!savingAllowed"><system-label label="LBL_SAVE"></system-label></button>
            </div>
        </footer>
    </div>
</section>
