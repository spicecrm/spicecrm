<system-collapsable-tab tabtitle="LBL_EVALUATION" [collapsible]="true">
    <div class="slds-m-horizontal_xx-small slds-m-vertical_small">
        <system-stencil *ngIf="isLoading"></system-stencil>
        <div *ngIf="!isLoading">
            <span *ngIf="!noParticipation">
                <span *ngFor="let value of evaluationValues" class="slds-badge slds-badge_lightest slds-text-body_regular quest-eval-catname">{{value.name}} <span class="slds-badge slds-badge slds-text-body_regular quest-eval-points">{{value.points}}</span></span>
            </span>
            <span *ngIf="noParticipation" class="slds-m-horizontal--x-small">
                <system-label label="MSG_NO_QUESTIONNAIRE_PARTICIPATION_YET"></system-label>
            </span>
        </div>
    </div>
</system-collapsable-tab>
