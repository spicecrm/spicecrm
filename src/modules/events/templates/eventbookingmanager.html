<article class="slds-card slds-card_boundary slds-m-bottom--medium">
    <div class="slds-card__body slds-card__body_inner">
        <div class="slds-tabs_default slds-grid slds-grid--vertical-align-center slds-grid--align-spread">
            <ul class="slds-tabs_default__nav" role="tablist">
                <li *ngFor="let capacityType of eventData.capacityTypes; let tabindex = index" class="slds-tabs--default__item slds-text-title--caps" [ngClass]="{'slds-active': tabindex === activeTab, 'slds-hide': isHidden(capacityType)}"
                    role="presentation" (click)="setActiveTab(tabindex, capacityType)">
                    <a class="slds-tabs--default__link" href="javascript:void(0);" role="tab" aria-selected="false">
                        <system-label [label]="capacityType.name"></system-label>
                    </a>
                </li>
            </ul>
            <div *ngIf="isLoaded" class="slds-m-left--x-small">
                <button class="slds-button slds-button_icon x-slds-m-right--medium" (click)="reload()">
                    <system-button-icon icon="refresh"></system-button-icon>
                </button>
            </div>
        </div>
        <ng-container *ngFor="let capacityType of this.eventData.capacityTypes; let tabindex = index">
            <div *ngIf="checkRenderTab(tabindex)" class="slds-tabs--default__content" role="tabpanel" [ngClass]="{'slds-show': tabindex == activeTab, 'slds-hide': tabindex != activeTab, 'slds-p-bottom--none': componentconfig?.noBottomPadding }">
                <event-booking-table *ngIf="isLoaded" [fieldset]="componentconfig.fieldset" [allowOverflow]="allowOverflow" [tableData]="activeCapacityType.getField('tableData')"></event-booking-table>
            </div>
        </ng-container>
        <div *ngIf="isLoaded && this.eventData.capacityTypes.length == 0" class="slds-align--absolute-center" style="height: calc(100% - 35px)">
            <system-illustration-no-records><system-label label="MSG_NO_RECORDS_FOUND"></system-label></system-illustration-no-records>
        </div>
    </div>
    <footer class="slds-card__footer"></footer>
    <system-spinner *ngIf="!isLoaded" class="slds-m-vertical--large" style="display:block"></system-spinner>
</article>
