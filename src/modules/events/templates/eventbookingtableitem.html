<div [system-overlay-loading-spinner]="isSavingParticipation" class="slds-size--1-of-1 slds-height_full slds-box_border" *ngIf="cell.status != 'empty'" [style.background-color]="getItemBackground">
    <div class="slds-p-around--xx-small">
        <div *ngIf="model.id">
            <div class="slds-p-horizontal--small slds-size--1-of-1 slds-p-bottom--x-small" *ngFor="let field of fields">
                <dl>
                    <dd>
                        <field-container [field]="field.field" [fieldconfig]="field.fieldconfig" [fielddisplayclass]="'slds-truncate'"></field-container>
                    </dd>
                </dl>
            </div>
            <div class="slds-is-absolute slds-m-around--x-small slds-align_absolute-center" style="top:0px;right:5px">
                <div system-dropdown-trigger-simple class="slds-dropdown-trigger slds-dropdown-trigger_click">
                    <button class="slds-button slds-button_icon slds-button_icon-border-filled slds-button--icon-xx-small" aria-haspopup="true" title="Show More">
                        <system-button-icon icon="down"></system-button-icon>
                    </button>
                    <div class="slds-dropdown slds-dropdown--right">
                        <ul class="slds-dropdown__list" role="menu" aria-label="Show More">
                            <li *ngIf="!model.getFieldValue('participated')" class="slds-dropdown__item" role="presentation" (click)="setParticipated(true)">
                                <a href="javascript:void(0);" role="menuitem">
                                    <span class="slds-truncate" [title]="1"><system-label [label]="'LBL_SET_PARTICIPATED'"></system-label></span>
                                </a>
                            </li>
                            <li *ngIf="model.getFieldValue('participated')" class="slds-dropdown__item" role="presentation" (click)="setParticipated(false)">
                                <a href="javascript:void(0);" role="menuitem">
                                    <span class="slds-truncate" [title]="1"><system-label [label]="'LBL_UNSET_PARTICIPATED'"></system-label></span>
                                </a>
                            </li>
                            <li class="slds-dropdown__item" role="presentation" (click)="delete()">
                                <a href="javascript:void(0);" role="menuitem">
                                    <span class="slds-truncate" [title]="2"><system-label [label]="'LBL_DELETE'"></system-label></span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div *ngIf="model.getFieldValue('participated')" class="slds-is-absolute slds-m-around--x-small slds-align_absolute-center" style="bottom:0;right:-7px">
                <system-icon icon="success" sprite="utility" size="x-small"></system-icon>
            </div>
        </div>
    </div>
</div>
