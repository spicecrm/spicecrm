<div class="slds-page-header">
    <div class="slds-grid">
        <div class="slds-col slds-has-flexi-truncate">
            <div class="slds-media slds-no-space slds-grow">
                <system-icon [module]="parent.module"></system-icon>
                <div class="slds-media__body">
                    <p class="slds-text-title--caps slds-line-height--reset">
                        <system-label label="LBL_SETTLEMENT"></system-label>
                    </p>
                    <div>
                        <h1 class="slds-page-header__title slds-m-right--small slds-align-middle slds-truncate">
                            <ng-container>{{parent.data.summary_text}}</ng-container>
                        </h1>
                    </div>
                </div>
            </div>
        </div>
        <div class="slds-m-horizontal--x-small slds-show--medium">
            <button [disabled]="!canSettle" class="slds-button slds-button_neutral" (click)="settle()"><system-label label="LBL_SETTLE"></system-label></button>
            <button [disabled]="!canSettle" class="slds-button slds-button--icon slds-button--icon-border" (click)="loadUnsettledActivities()"><system-button-icon icon="refresh"></system-button-icon></button>
        </div>
        <!--object-action-container [actionset]="actionSet"></object-action-container-->
    </div>
</div>
<div system-to-bottom [system-overlay-loading-spinner]="loading">
    <div *ngFor="let projectWBS of projectWBSs">
        <h2 class="slds-text-heading--small slds-p-around--small">{{projectWBS.name}}</h2>
        <table class="slds-table slds-table--fixed-layout slds-no-row-hover slds-table_bordered">
            <thead>
                <tr class="slds-line-height_reset">
                    <th scope="col" style="width: 1.5rem"></th>
                    <th style="width: 50%" scope="col">
                        <div class="slds-truncate"><system-label-fieldname module="ProjectActivities" field="name"></system-label-fieldname></div>
                    </th>
                    <th style="width: 50%" scope="col">
                        <div class="slds-truncate"><system-label-fieldname module="ProjectActivities" field="projectplannedactivity_name"></system-label-fieldname></div>
                    </th>
                    <th style="width: 120px" scope="col">
                        <div class="slds-truncate"><system-label-fieldname module="ProjectActivities" field="created_by_name"></system-label-fieldname></div>
                    </th>
                    <th style="width: 130px" scope="col">
                        <div class="slds-truncate"><system-label-fieldname module="ProjectActivities" field="activity_start"></system-label-fieldname></div>
                    </th>
                    <th style="width: 100px" scope="col">
                        <div class="slds-truncate"><system-label-fieldname module="ProjectActivities" field="settlement_type"></system-label-fieldname></div>
                    </th>
                    <th style="width: 80px" class="slds-text-align--center" scope="col">
                        <div class="slds-truncate"><system-label-fieldname module="ProjectActivities" field="activity_duration"></system-label-fieldname></div>
                    </th>
                    <th style="width: 120px" class="slds-text-align--center" scope="col">
                        <div class="slds-truncate"><system-label-fieldname module="ProjectActivities" field="corrected_duration"></system-label-fieldname></div>
                    </th>
                    <th style="width: 2rem" class="" scope="col"></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let projectActivity of projectWBSActivities(projectWBS); trackBy: trackByFn" project-settlement-line [projectactivitiy]="projectActivity"></tr>
                <tr>
                    <td colspan="7"></td>
                    <td class="slds-text-align--center">{{projectWBSTotalSettlmentEffort(projectWBS).display}}</td>
                    <td></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
