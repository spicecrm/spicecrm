<system-modal>
    <system-modal-header (close)="close()"><system-label-modulename [singular]="true" module="ProjectActivities"></system-label-modulename></system-modal-header>
    <system-modal-content>
        <object-record-fieldset [fieldset]="componentconfig.fieldset" direction="vertical"></object-record-fieldset>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button_neutral" (click)="close()"><system-label label="LBL_CANCEL"></system-label></button>
        <button class="slds-button slds-button_brand" (click)="save()"><system-label label="LBL_SAVE"></system-label></button>
    </system-modal-footer>
</system-modal>
