<td>
    <system-checkbox [ngModel]="isSelected()" (ngModelChange)="toggleSelect.emit()"/>
</td>
@for(field of listFields(); track $index) {
    <td>
        <field-container [field]="field.field" [fieldname]="field.field" [fieldconfig]="field.fieldconfig" fielddisplayclass="slds-truncate"/>
    </td>
}
<td>
    <button class="slds-button slds-button--icon-border" title="LBL_EDIT" (click)="goDetail.emit()">
        <system-button-icon icon='expand' size='small'/>
    </button>
</td>
