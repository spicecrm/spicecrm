<system-modal size="large">
    <system-modal-header-empty (close)="close()"></system-modal-header-empty>
    <system-modal-content system-modal-content-grow margin="none" [scrollable]="false">
        <!--        <div #gantt_here style="width: 100%;height: 100%;"></div>-->
        <spice-gantt [items]="items" [milestones]="milestones" [zoomLevel]="zoomLevel">
            <!--            <spice-gantt-item *ngFor="let item of items"-->
            <!--                              [id]="item.id"-->
            <!--                              [name]="item.name"-->
            <!--                              [start]="item.start"-->
            <!--                              [end]="item.end"-->
            <!--                              [type]="item.type"-->
            <!--                              [parent]="item.parent"-->
            <!--                              [items]="item.items"-->
            <!--                              [progress]="item.progress"-->
            <!--                              expanded="true"-->
            <!--            />-->
            <!--            <spice-gantt-milestone *ngFor="let milestone of milestones"-->
            <!--                                   [id]=""-->
            <!--                                   [name]=""-->
            <!--                                   [date]=""-->
            <!--            />-->

            <spice-gantt-item id="1" name="my item1" start="2023-11-04 12:00:00" end="2023-11-06 12:00:00" type="wbs"
                              expanded="true" progress="22">
                <spice-gantt-item id="11" name="my item1.1" start="2023-11-04 12:00:00" end="2023-11-05 12:00:00"
                                  type="wbs" progress="12">
                    <spice-gantt-item id="111" name="my item1.1.1" start="2023-11-08 12:00:00" end="2023-11-20 12:00:00"
                                      type="task" progress="8">
                        <spice-gantt-item id="1111" name="my item1.1.2" start="2023-11-08 12:00:00"
                                          end="2023-11-20 12:00:00" type="task" progress="2"/>
                    </spice-gantt-item>
                    <spice-gantt-item id="112" name="my item2" start="2023-12-08 12:00:00" end="2023-12-18 12:00:00"
                                      type="wbs" progress="85">
                        <spice-gantt-item id="1121" name="my item2.1" start="2023-12-06 12:00:00"
                                          end="2023-12-10 12:00:00" type="task" progress="60"/>
                        <spice-gantt-item id="1122" name="my item2.1" start="2023-12-11 12:00:00"
                                          end="2023-12-18 12:00:00" type="task" progress="25"/>
                    </spice-gantt-item>
                </spice-gantt-item>
            </spice-gantt-item>
            <spice-gantt-milestone id="ms123456789" name="Milestone 1" date="2023-12-13"/>
            <spice-gantt-milestone id="ms234567890" name="Milestone 2" date="2023-12-08"/>
        </spice-gantt>
    </system-modal-content>
    <system-modal-footer>
        <div class="slds-grid">
            <div class="slds-col slds-size--1-of-4">
                <select [(ngModel)]="zoomLevel" class="slds-select slds-m-left--xx-small">
                    <option *ngFor="let item of spiceGanttService.zoomLevels" [value]="item.id">
                        <system-label [label]="item.label"></system-label>
                    </option>
                </select>
            </div>
            <div class="slds-col slds-size--3-of-4">
                <button class="slds-button slds-button--neutral" (click)="close()">
                    <system-label label="LBL_CLOSE"></system-label>
                </button>
            </div>
        </div>
    </system-modal-footer>
</system-modal>
