<div class="slds-grid slds-height_full">
    <div class="slds-p-around--x-small slds-size--1-of-5 slds-scrollable--y">
        @if (!modellist.isLoading && modellist.listData.list.length > 0) {
            @for (wbsElement of modellist.listData.list; track $index) {
                <project-wbs-element [element]="wbsElement" [index]="$index"/>
            }
        } @else if (modellist.listData.list.length == 0 && !modellist.isLoading) {
            <div class="slds-height_full slds-grid slds-align_absolute-center">
                <system-illustration-no-data>
                    <system-label label="LBL_NO_DATA"/>
                </system-illustration-no-data>
            </div>
        } @else if (modellist.isLoading) {
            <div class="slds-height_full slds-grid slds-align_absolute-center">
                <system-spinner/>
            </div>
        }
    </div>
    <project-activity-elements class="slds-size--4-of-5"/>
</div>
