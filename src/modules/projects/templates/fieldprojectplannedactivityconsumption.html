<field-label *ngIf="displayLabel" [fieldname]="fieldname" [fieldconfig]="fieldconfig"></field-label>
<field-generic-display [fielddisplayclass]="fielddisplayclass" [editable]="isEditable()" [fieldconfig]="fieldconfig" [title]="value" [fieldid]="fieldid">
    <div class="slds-align_absolute-center">
        <ul class="slds-list_horizontal slds-badge slds-has-dividers_left" [ngClass]="{'slds-theme--warning': percentage > 80,'slds-theme--error': percentage > 100}">
            <li class="slds-item">{{duration}}</li>
            <li class="slds-item">{{percentage}}%</li>
        </ul>
    </div>
</field-generic-display>
