<div class="slds-p-around--x-small">
    <div class="slds-grid slds-grid--vertical-align-center slds-p-bottom--x-small">
        <system-icon [module]="'Projects'" [size]="'small'"></system-icon>
        <h2 class="slds-text-heading--medium slds-p-bottom--xx-small">{{language.getLabel('LBL_RECORD_PROJECTACTIVITY')}}</h2>
    </div>
    <div class="slds-grid">
        <div class="slds-form-element slds-size--1-of-2">
            <label class="slds-form-element__label">{{language.getLabel('LBL_WBS_ELEMENT')}}</label>
            <div class="slds-form-element__control slds-p-vertical--xx-small">

                <div *ngIf="selected_wbs" class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right">
                    <div class="slds-pill_container">
                        <span class="slds-pill slds-size--1-of-1">
                            <span class="slds-pill__label">{{selected_wbs.project_name}} / {{selected_wbs.name}} / {{selected_wbs.type}} / {{selected_wbs.level}}</span>
                            <button class="slds-button slds-button--icon slds-pill__remove" (click)="selected_wbs = null">
                              <system-button-icon [icon]="'close'"></system-button-icon>
                            </button>
                        </span>
                    </div>
                </div>

                <div *ngIf="!selected_wbs" class="slds-combobox_container">
                    <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click" aria-haspopup="listbox" role="combobox">
                        <div class="slds-combobox__form-element">
                            <input type="text" class="slds-input slds-combobox__input" aria-autocomplete="list" autocomplete="off" role="textbox" placeholder="{{language.getLabel('LBL_SEARCH_HERE')}}" [(ngModel)]="wbs_search_term" (focus)="show_wbs_results = true" (focusout)="show_wbs_results = false" (keyup.escape)="show_wbs_results = false">
                        </div>
                    </div>
                    <div *ngIf="show_wbs_results" role="listbox">
                        <ul class="slds-listbox slds-listbox_vertical slds-dropdown slds-dropdown_fluid" role="presentation">
                            <li *ngFor="let e of wbss" class="slds-listbox__item" role="presentation">
                                <div class="slds-listbox__option slds-listbox__option_entity" role="option" (mousedown)="selected_wbs = e">
                                    <span class="slds-p-left--medium slds-listbox__option-text slds-listbox__option-text_entity">{{e.project_name}} / {{e.name}} / {{e.type}} / {{e.level}}</span>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
                <!--div class="slds-select_container">
                    <select class="slds-select" [(ngModel)]="wbsitem">
                        <option *ngFor="let myelement of wbss" [value]="myelement.id + '|' + myelement.type + '|' + myelement.level">
                            {{myelement.project_name}} / {{myelement.name}} / {{myelement.type}} / {{myelement.level}}
                        </option>
                    </select>
                </div-->
            </div>
        </div>
        <div class="slds-m-left--xx-small slds-size--1-of-2">
            <field-label fieldname="name"></field-label>
            <field-container fieldname="name"></field-container>
        </div>
    </div>
    <div class="slds-grid slds-m-top--small slds-grid_vertical-align-start">
        <div class="slds-m-left--xx-small  slds-size--2-of-5">
            <field-label fieldname="activity_start"></field-label>
            <field-container fieldname="activity_start"></field-container>
        </div>
        <div class="slds-m-left--xx-small slds-size--1-of-5">
            <field-label fieldname="activity_end"></field-label>
            <field-container fieldname="activity_end" [fieldconfig]="{fieldtype:'time'}"></field-container>
        </div>
        <div class="slds-m-left--xx-small slds-size--1-of-5">
            <field-label fieldname="duration_hours"></field-label>
            <field-container fieldname="activity_end" [fieldconfig]="{fieldtype:'duration', freeentry: true}"></field-container>
        </div>
        <div class="slds-size--1-of-5 slds-form-element slds-col--bump-left slds-p-top--small slds-m-top--x-small slds-p-right--small slds-text-align_right">
            <button class="slds-button slds-button--brand slds-m-left--xx-small" [disabled]="!validate()" (click)="save()">{{language.getLabel('LBL_SAVE')}}</button>
        </div>
    </div>
    <!-- last 5 entries here... -->
    <div *ngIf="recent_project_activities.length > 0" class="slds-m-top--small slds-grid_vertical-align-start">
        <object-table fieldset_id="cd58c77c-899e-8ed9-dd64-539c9b8dfbad" [objects]="recent_project_activities" module="{{model.module}}"></object-table>
        <footer>
            <div class="slds-text-align_center">
                <a href="javascript:void(0);" (click)="model.goModule()">View All</a>
            </div>
        </footer>
    </div>
</div>
