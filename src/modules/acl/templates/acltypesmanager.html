<div style="height: 100%;">
    <div>
        <acl-manager-header displaylabel="LBL_SPICEACLTYPES" displayicon="custom:custom87"></acl-manager-header>
    </div>
    <div #managercontent class="slds-grid" system-to-bottom-noscroll>
        <acltypes-manager-types class="slds-size--1-of-2 slds-border--right" (typeselected)="setType($event)"></acltypes-manager-types>
        <div class="slds-size--1-of-2" system-to-bottom-noscroll>
            <div style="height: 50%;" class="slds-scrollable--y">
                <acltypes-manager-types-fields [aclType]="activeType"></acltypes-manager-types-fields>
            </div>
            <div style="height: 50%;">
                <acltypes-manager-types-actions [aclType]="activeType"/>
            </div>
        </div>
    </div>
</div>
