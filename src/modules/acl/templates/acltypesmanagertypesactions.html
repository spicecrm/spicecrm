<div class="slds-grid slds-grid--vertical-align-center slds-p-around--x-small slds-border--top slds-border--bottom">
    <h2 class="slds-text-heading--small"><system-label label="LBL_ACTIONS"></system-label></h2>
    <button class="slds-col--bump-left slds-button slds-button--brand" [disabled]="changescope == 'none' || !this.aclType.acltype?.id" (click)="addAction()"><system-label label="LBL_ADD"></system-label></button>
</div>
<div system-to-bottom>
    <table class="slds-table slds-table--header-fixed slds-table_bordered slds-table_cell-buffer">
        <thead>
        <tr class="slds-text-title_caps">
            <th style="width:2.5rem" scope="col"></th>
            <th scope="col">
                <div class="slds-truncate slds-th__action"><system-label label="LBL_ACTION"></system-label></div>
            </th>
            <th scope="col">
                <div class="slds-truncate slds-th__action"><system-label label="DESCRIPTION"></system-label></div>
            </th>
            <th scope="col" style="width: 3rem;"></th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let action of aclType.aclactions">
            <td>
                <system-utility-icon class="slds-p-right--xx-small" size="xx-small" [icon]="action.scope == 'g' ? 'world' : 'people'"></system-utility-icon>
            </td>
            <td>
                <div class="slds-truncate">{{action.action}}</div>
            </td>
            <td>
                <div class="slds-truncate">{{action.description}}</div>
            </td>
            <td style="width: 3rem;">
                <button class="slds-button slds-button--icon" [disabled]="!canDelete(action)" (click)="deleteAction(action)">
                    <system-button-icon icon="delete"/>
                </button>
            </td>
        </tr>
        </tbody>
    </table>
</div>
