<system-modal>
    <system-modal-header (close)="close()">
        <system-label label="LBL_ADD_FIELD"></system-label>
    </system-modal-header>
    <system-modal-content>
        <div class="slds-col slds-form-element">
            <label class="slds-form-element__label"><system-label label="LBL_FIELD"/></label>
            <system-input-module-field [module]="model.data.spiceacltype_module" [(ngModel)]="fieldname"></system-input-module-field>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CANCEL"/></button>
        <button class="slds-button slds-button--brand" (click)="add()"><system-label label="LBL_ADD"/></button>
    </system-modal-footer>
</system-modal>
