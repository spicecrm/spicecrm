@if(showFieldControls) {
    <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-border--left slds-border--right">
        <thead>
        <tr class="slds-text-title_caps">
            <th scope="col">
                <div class="slds-truncate">
                    <system-label label="LBL_NAME"></system-label>
                </div>
            </th>
            <th scope="col">
                <div class="slds-truncate">
                    <system-label label="LBL_CONTROL"></system-label>
                </div>
            </th>
            <th scope="col" style="width: 2.5rem;"></th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let field of fields">
            <td>
                <div class="slds-truncate">{{ field.field }}</div>
            </td>
            <td>
                <div class="slds-form-element__control">
                    <div class="slds-select_container">
                        <select class="slds-select" [disabled]="!view.isEditMode()" [value]="getFieldControl(field.field)"
                                (change)="setFieldControl(field.field, $event)">
                            <option value="1">
                                <system-label label="LBL_HIDE"></system-label>
                            </option>
                            <option value="2">
                                <system-label label="LBL_DISPLAY"></system-label>
                            </option>
                            <option value="3">
                                <system-label label="LBL_EDIT"></system-label>
                            </option>
                        </select>
                    </div>
                </div>
            </td>
            <td>
                <button class="slds-button slds-button--icon" [disabled]="!view.isEditMode()" (click)="removeField(field.field)">
                    <system-button-icon icon="clear"/>
                </button>
            </td>
        </tr>
        </tbody>
    </table>
} @else {
    <div class="slds-p-around--medium slds-align_absolute-center slds-p-around--medium">
        <system-illustration-no-records>
            <system-label label="LBL_NOFIELDCONTROLSFORTHISTYPE"></system-label>
        </system-illustration-no-records>
    </div>
}
<div class="slds-align_absolute-center slds-p-top--medium">
    <button class="slds-button slds-button--icon" *ngIf="view.isEditMode()" (click)="addField()">
        <system-button-icon icon="new"/>
    </button>
</div>
