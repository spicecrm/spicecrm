<system-modal>
    <system-modal-header (close)="close()">
        {{language.getLabel('LBL_ADD_ACTION')}}
    </system-modal-header>
    <system-modal-content>
        <div class="slds-form-element">
            <label class="slds-form-element__label">{{language.getLabel('LBL_ACTION')}}</label>
            <div class="slds-form-element__control">
                <input type="text" class="slds-input" [(ngModel)]="action"/>
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()">{{language.getLabel('LBL_CANCEL')}}</button>
        <button [disabled]="adddisabled" class="slds-button slds-button--brand" (click)="add()">{{language.getLabel('LBL_ADD')}}</button>
    </system-modal-footer>
</system-modal>
