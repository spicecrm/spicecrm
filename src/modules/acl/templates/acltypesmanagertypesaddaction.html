<system-modal>
    <system-modal-header (close)="close()">
        <system-label label="LBL_ADD_ACTION"></system-label>
    </system-modal-header>
    <system-modal-content>
        <div class="slds-grid slds-grid--vertical-align-center slds-gutters_direct-xx-small">
            <div class="slds-col slds-form-element__control slds-size--1-of-4">
                <label class="slds-form-element__label"><abbr class="slds-required">* </abbr><system-label label="LBL_SCOPE"/></label>
                <div class="slds-select_container">
                    <select class="slds-select" [(ngModel)]="aclAction.scope" [disabled]="changescope != 'all'">
                        <option *ngIf="changescope == 'all' && aclType.acltype.scope == 'g'" value="g"><system-label label="LBL_GLOBAL"></system-label></option>
                        <option value="c"><system-label label="LBL_CUSTOM"/></option>
                    </select>
                </div>
            </div>
            <div class="slds-col slds-form-element slds-size--3-of-4">
                <label class="slds-form-element__label"><system-label label="LBL_ACTION"></system-label></label>
                <div class="slds-form-element__control">
                    <input type="text" class="slds-input" maxlength="50" [(ngModel)]="aclAction.action"/>
                </div>
            </div>
        </div>
        <div class="slds-form-element">
            <label class="slds-form-element__label"><system-label label="LBL_DESCRIPTION"></system-label></label>
            <div class="slds-form-element__control">
                <input type="text" class="slds-input" maxlength="255" [(ngModel)]="aclAction.description"/>
            </div>
        </div>
        <div class="slds-grid slds-grid--vertical-align-center slds-gutters_direct-xx-small">
            <div class="slds-col slds-form-element__control slds-size--1-of-2">
                <label class="slds-form-element__label"><system-label label="LBL_PACKAGE"/></label>
                <system-input-package [(ngModel)]="aclAction.package"/>
            </div>
            <div class="slds-col slds-form-element__control slds-size--1-of-2">
                <label class="slds-form-element__label"><system-label label="LBL_VERSION"/></label>
                <system-input-version [(ngModel)]="aclAction.version"/>
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CANCEL"></system-label></button>
        <button [disabled]="adddisabled" class="slds-button slds-button--brand" (click)="add()"><system-label label="LBL_ADD"></system-label></button>
    </system-modal-footer>
</system-modal>
