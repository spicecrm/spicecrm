<div class="slds-grid slds-form--inline slds-p-around--small slds-border--bottom">
    <div class="slds-grid slds-grid--vertical-align-center">
        <div class="slds-form-element__control slds-p-right--xx-small">
            <select class="slds-select" [(ngModel)]="mailbox" style="min-width: 250px;" [disabled]="mailboxesEmails.mailboxes.length==0 || isFetching">
                <option *ngFor="let mailbox of mailboxesEmails.mailboxes" value="{{mailbox.id}}">
                    {{mailbox.name}}
                </option>
            </select>
        </div>
        <div class="slds-form-element__control slds-p-horizontal--xx-small">
            <system-checkbox [(ngModel)]="mailboxesEmails.unreadonly"><system-label label="LBL_UNREAD_ONLY"></system-label></system-checkbox>
        </div>
        <div class="slds-form-element__control slds-p-horizontal--xx-small">
            <select class="slds-select" [(ngModel)]="emailopenness">
                <option value="all"><system-label label="LBL_EMAILS_ALL"></system-label></option>
                <option value="open"><system-label label="LBL_EMAILS_OPEN"></system-label></option>
                <option value="user_closed"><system-label label="LBL_EMAILS_USER_CLOSED"></system-label></option>
                <option value="system_closed"><system-label label="LBL_EMAILS_SYSTEM_CLOSED"></system-label></option>
            </select>
        </div>
        <div class="slds-p-horizontal--xx-small">
            <ul class="slds-list_horizontal slds-has-dividers_left slds-has-block-links_space">
                <li class="slds-item"><span>{{mailboxesEmails.emails.length}} <system-label label="LBL_OF"></system-label> {{mailboxesEmails.totalcount}} <system-label label="LBL_ITEMS"></system-label></span></li>
                <li class="slds-item"><system-utility-icon [icon]="mailboxesEmails.source == 'db' ? 'database' : 'feed'" size="xx-small"></system-utility-icon></li>
            </ul>
        </div>
    </div>
    <div class="slds-col--bump-left slds-grid">
        <button *ngIf="mailboxesEmails.activeSplitType.name == 'noSplit' && !!mailboxesEmails.activeMessage" class="slds-button slds-button--neutral" (click)="mailboxesEmails.activeMessage = null">
            <system-button-icon class="slds-button__icon--left" icon="back"></system-button-icon>
            <span><system-label label="LBL_BACK"></system-label></span>
        </button>
        <div class="slds-dropdown-trigger slds-dropdown-trigger--click slds-m-horizontal--xx-small" aria-expanded="false" system-dropdown-trigger-simple>
            <button class="slds-button slds-button--neutral" aria-haspopup="true" [system-title]="mailboxesEmails.activeSplitType.label">
                <span class="slds-m-right--xx-small">
                    <system-label [label]="mailboxesEmails.activeSplitType.label"></system-label>
                </span>
                <system-button-icon [icon]="mailboxesEmails.activeSplitType.icon" size="small"></system-button-icon>
                <system-button-icon class="slds-p-left--xxx-small" icon="down" size="small"></system-button-icon>
            </button>
            <div class="slds-dropdown slds-dropdown--right slds-dropdown--small">
                <ul class="slds-dropdown__list" role="menu">
                    <li class="slds-dropdown__item slds-is-selected" role="presentation" (click)="setActiveSplitType('noSplit')">
                        <a href="javascript:void(0);" role="menuitemcheckbox" aria-checked="true" tabindex="0">
                            <span class="slds-truncate"><system-label label="LBL_NO_SPLIT"></system-label></span>
                            <system-utility-icon icon="picklist_type" size="x-small"></system-utility-icon>
                        </a>
                    </li>
                    <li class="slds-dropdown__item slds-is-selected" role="presentation" (click)="setActiveSplitType('verticalSplit')">
                        <a href="javascript:void(0);" role="menuitemcheckbox" aria-checked="true" tabindex="0">
                            <span class="slds-truncate"><system-label label="LBL_VERTICAL_SPLIT"></system-label></span>
                            <system-utility-icon icon="side_list" size="x-small"></system-utility-icon>
                        </a>
                    </li>
                    <li class="slds-dropdown__item slds-is-selected" role="presentation" (click)="setActiveSplitType('horizontalSplit')">
                        <a href="javascript:void(0);" role="menuitemcheckbox" aria-checked="true" tabindex="0">
                            <span class="slds-truncate"><system-label label="LBL_HORIZONTAL_SPLIT"></system-label></span>
                            <system-utility-icon icon="inspector_panel" size="x-small"></system-utility-icon>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        <div class=" slds-button-group">
            <button class="slds-button slds-button--neutral" [disabled]="!buttonenabled" (click)="reloadList()">
                <system-button-icon class="slds-button__icon--left" icon="refresh"></system-button-icon>
                <span><system-label label="LBL_REFRESH"></system-label></span>
            </button>
            <button class="slds-button slds-button--neutral" [disabled]="!buttonenabled" (click)="fetchEmails()">
                <system-button-icon class="slds-button__icon--left" icon="email"></system-button-icon>
                <span><system-label label="LBL_FETCH_EMAILS"></system-label></span>
            </button>
        </div>
    </div>

</div>
