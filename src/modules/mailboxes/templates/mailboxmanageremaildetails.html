<div class="slds-theme--shade">
    <div [ngClass]="{'slds-hide': !model.id}">
        <div class="slds-p-around--medium slds-border--bottom" *ngIf="model.id">
            <div class="slds-grid">
                <div class="slds-col slds-has-flexi-truncate">
                    <div class="slds-media slds-no-space slds-grow">
                        <system-icon [module]="model.module"></system-icon>
                        <div class="slds-media__body">
                            <ul class="slds-list_horizontal slds-has-dividers_left">
                                <li  class="slds-item">
                                    <field-container field="date_sent" fielddisplayclass="slds-truncate"></field-container>
                                </li>
                                <li  class="slds-item">
                                    <field-container field="status" fielddisplayclass="slds-truncate"></field-container>
                                </li>
                            </ul>
                            <h1 class="slds-page-header__title slds-m-right--small slds-align-middle slds-truncate">
                                <ng-container *ngIf="!fieldset">{{model.data.summary_text}}</ng-container>
                                <object-record-fieldset-horizontal-list *ngIf="fieldset" [fieldset]="fieldset"></object-record-fieldset-horizontal-list>
                            </h1>
                        </div>
                    </div>
                </div>
                <object-action-container [actionset]="actionSet" (actionemitter)="handleAction($event)"></object-action-container>
                <div class="slds-p-left--small slds-button-group">
                    <button class="slds-button slds-button--icon slds-button_icon-border-filled" *ngIf="isRead" (click)="markUnread()" [title]="language.getLabel('LBL_MARK_UNREAD')">
                        <system-button-icon icon="email"></system-button-icon>
                    </button>
                    <button class="slds-button slds-button--icon slds-button_icon-border-filled" *ngIf="!isUserClosed" (click)="completeMail()" [title]="language.getLabel('LBL_MARK_USER_CLOSED')">
                        <system-button-icon icon="lock"></system-button-icon>
                    </button>
                    <button class="slds-button slds-button--icon slds-button_icon-border-filled" *ngIf="isUserClosed" (click)="reopen()" [title]="language.getLabel('LBL_REOPEN')">
                        <system-button-icon icon="unlock"></system-button-icon>
                    </button>
                </div>
            </div>
        </div>
        <div class="slds-m-around--x-small slds-p-around--x-small slds-theme--default" tobottom>
            <div #detailscontent></div>
        </div>
    </div>
    <div *ngIf="!model.id" class="slds-align--absolute-center" tobottomnoscroll>
        <system-label label="LBL_SELECT_EMAIL"></system-label>
    </div>
</div>
