<div class="slds-tree_container">
    <ul *ngFor="let listItem of modellist.listData.list; trackBy: trackbyfn"  aria-labelledby="treeheading" class="slds-tree" role="tree">
       <li aria-level="1" (click)="selectComponent(listItem.id)" [class.slds-is-selected]="focus == listItem.id">
           <scrumtree-node [focus]="focus" [theme]="listItem"></scrumtree-node>
       </li>
    </ul>
</div>
