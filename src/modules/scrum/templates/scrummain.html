<div [overlayLoadingSpinner]="modellist.isLoading" tobottomnoscroll class="slds-grid">
    <div class="slds-border--right slds-theme_shade" style="min-width: 250px;" tobottom>
        <!--div *ngIf="modellist.isLoading" tobottomnoscroll class="slds-align_absolute-center"><system-spinner></system-spinner></div-->
        <scrum-tree role="tree"></scrum-tree>
    </div>
    <div class="slds-grow" tobottom>
        <div class="slds-align_absolute-center" tobottomnoscroll *ngIf="!scrum.selectedObject.id && !modellist.isLoading"><system-illustration-no-data>{{text}}</system-illustration-no-data></div>
        <scrum-tree-detail [focusid]="scrum.selectedObject.id" [focustype]="scrum.selectedObject.type"></scrum-tree-detail>
    </div>
</div>
