<div tobottomnoscroll class="slds-grid">
    <div class="slds-size--1-of-4 slds-border--right slds-theme_shade" style="min-width: 250px;" tobottom>
        <scrumtree role="tree"></scrumtree>
    </div>
    <div class="slds-size--3-of-4" tobottom>
        <scrum-tree-detail [focusid]="scrum.selectedObject.id" [focustype]="scrum.selectedObject.type"></scrum-tree-detail>
    </div>
</div>
