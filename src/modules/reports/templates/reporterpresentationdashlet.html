<div *ngIf="displayheader" class="slds-text-heading--small slds-p-around--x-small slds-grid slds-grid--align-spread">
    <div class="slds-text-link_faux" (click)="openReport()">{{model.data.name}}</div>
    <button class="slds-button slds-button--icon" (click)="reloadReport()">
        <system-button-icon icon="refresh"/>
    </button>
</div>
<div class="slds-scrollable--y" [ngStyle]="containerstyle">
<div #presentationcontainer></div>
</div>
