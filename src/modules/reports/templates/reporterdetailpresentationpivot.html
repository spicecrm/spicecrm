<div tobottom>
    <table #tableheader class="slds-table slds-table--fixed-layout">
        <thead>
        <tr class="slds-text-title--caps">
            <th scope="col" class="slds-border--bottom" width="10%" [rowSpan]="pivotColumnCount + 1">
                {{language.getLabel(dataName)}}
            </th>
            <th class="slds-text-align--center slds-hide" [colSpan]="totalColumnCount">
                Pivot Data
            </th>
        </tr>
        <tr *ngFor="let row of headerTableSet" class="slds-text-title--caps">
            <th class="slds-text-align--center slds-border--bottom slds-border--left" *ngFor="let column of row" [colSpan]="column.span">
                {{column.value}}
            </th>
        </tr>
        </thead>
    </table>
    <div #tablecontent class="slds-scrollable--y" [ngStyle]="getContainerStyle()">
        <table class="slds-table slds-table_col-bordered slds-table_bordered slds-table--fixed-layout">
            <tbody>
            <tr *ngFor="let rowValue of rowValues">
                <td scope="row" width="10%">
                    {{rowValue}}
                </td>
                <td scope="row" *ngFor="let values of getValues(rowValue)" width="10%">
                    <div class="slds-grid">
                        <!--div *ngFor="let value of values">{{value.value}}</div-->
                        <reporter-field-container *ngFor="let value of values" [field]="value.field" [value]="value.value"></reporter-field-container>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
