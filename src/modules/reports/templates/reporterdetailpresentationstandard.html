<div class="slds-height_full">
    <table #tableheader class="slds-table slds-table_bordered slds-table--fixed-layout">
        <thead>
        <tr class="slds-text-title--caps">
            <th *ngFor="let field of getFields()" scope="col" [width]="getFieldWidth(field.fieldid)">
                <a  href="javascript:void(0);" class="slds-th__action slds-text-link--reset slds-grid"  [ngClass]="displayClasses(field)">
                    <div class="slds-truncate slds-p-vertical--xx-small">{{language.getLabel(field.name)}}</div>
                    <system-utility-icon [icon]="getSortIcon(field.fieldid)" addclasses="slds-is-sortable__icon" size="x-small"></system-utility-icon>
                </a>
            </th>
        </tr>
        </thead>
    </table>
    <div #tablecontent class="slds-scrollable--y" [ngStyle]="getContainerStyle()" (scroll)="onScroll($event)">
        <div *ngIf="isLoading" class="slds-align--absolute-center" style="height: 100%;">
            <system-spinner></system-spinner>
        </div>
        <table *ngIf="!isLoading"
               class="slds-table slds-table_col-bordered slds-table_bordered slds-table--fixed-layout">
            <tbody>
            <tr *ngFor="let record of getRecords()">
                <td scope="row" *ngFor="let field of getFields()" [width]="getFieldWidth(field.fieldid)">
                    <reporter-field-container [field]="field" [record]="record"></reporter-field-container>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div #tablefooter>
        <div *ngIf="showFooter" class="slds-p-vertical--x-small slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
            <div class="slds-p-horizontal--medium">
                {{displayRecords}} of {{totalRecords}}
            </div>
            <div class="slds-p-horizontal--medium">
                <button class="slds-button slds-button_icon" (click)="prevPage()" [disabled]="prevDisbaled">
                    <system-button-icon [icon]="'chevronleft'"></system-button-icon>
                </button>
                <button class="slds-button slds-button_icon" (click)="nextPage()" [disabled]="nextDisabled">
                    <system-button-icon [icon]="'chevronright'"></system-button-icon>
                </button>
            </div>
        </div>
    </div>
</div>
