<div #pageheader class="slds-page-header">
    <div class="slds-grid">
        <div class="slds-col slds-has-flexi-truncate">
            <div class="slds-media slds-no-space slds-grow">
                <div class="slds-media__figure">
                    <svg class="slds-icon slds-icon-standard-user" aria-hidden="true">
                        <use xlink:href="./sldassets/icons/standard-sprite/svg/symbols.svg#report"></use>
                    </svg>
                </div>
                <div class="slds-media__body">
                    <p class="slds-text-title--caps slds-line-height--reset">Reports</p>
                    <h1 class="slds-page-header__title slds-m-right--small slds-align-middle slds-truncate">
                        {{model.data.name}}</h1>
                </div>
            </div>
        </div>
        <div class="slds-col slds-no-flex slds-grid slds-align-top">
            <reporter-integration-export-button [integrationParams]="integrationParams" class="slds-m-right--x-small"></reporter-integration-export-button>
            <reporter-integration-tools-button [integrationParams]="integrationParams" class="slds-m-right--x-small"></reporter-integration-tools-button>
            <reporter-filter-button [whereConditions]="whereConditions" (filter)="toggleFilters($event)"></reporter-filter-button>
        </div>
    </div>
</div>
<div *ngIf="hasVisualization" style="width:100%;height:400px;">
    <reporter-detail-visualization></reporter-detail-visualization>
</div>
<div #presentationcontainer [ngStyle]="presentationStyle">
    <div #presentationview></div>
</div>
<reporter-filter-panel @displayfilter *ngIf="showFilters" class="slds-is-absolute" [ngStyle]="filterPanelStyle" [integrationparams]="integrationParams" (filtersaved)="filtersaved()"></reporter-filter-panel>
