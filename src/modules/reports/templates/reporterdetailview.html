<div #pageheader class="slds-page-header">
    <div class="slds-grid">
        <div class="slds-col slds-has-flexi-truncate">
            <div class="slds-media slds-no-space slds-grow">
                <div class="slds-media__figure" (click)="goToModule()">
                    <system-icon [module]="model.module"></system-icon>
                </div>
                <div class="slds-media__body">
                    <a (click)="goToModule()" href="javascript:void(0);" class="slds-text-title--caps slds-line-height--reset">
                        {{language.getModuleName(model.module)}}
                    </a>
                    <h1 class="slds-page-header__title slds-m-right--small slds-align-middle slds-truncate">
                        {{model.data.name}}</h1>
                </div>
            </div>
        </div>
        <div class="slds-col slds-no-flex slds-grid slds-align-top slds-button-group">
            <reporter-integration-export-button [integrationParams]="integrationParams" class="slds-m-right--x-small"></reporter-integration-export-button>
            <reporter-integration-tools-button [integrationParams]="integrationParams" class="slds-m-right--x-small"></reporter-integration-tools-button>
            <reporter-filter-button [whereConditions]="whereConditions" (filter)="toggleFilters($event)"></reporter-filter-button>
            <div class="slds-button-group slds-m-horizontal--x-small">
                <button *ngIf="!view.isEditMode() && view.isEditable" class="slds-button slds-button--neutral" (click)="startEditing()">
                    {{language.getLabel('LBL_EDIT')}}
                </button>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" [title]="language.getLabel('LBL_REFRESH')" (click)="refresh()">
                    <system-button-icon icon="refresh"></system-button-icon>
                </button>
            </div>
        </div>
    </div>
</div>
<div *ngIf="hasVisualization" class="slds-size--1-of-1" [ngStyle]="visualizationStyle">
    <reporter-detail-visualization></reporter-detail-visualization>
</div>
<div #presentationcontainer tobottomnoscroll>
    <div #presentationview></div>
</div>
<reporter-filter-panel @displayfilter *ngIf="showFilters" class="slds-is-absolute" [ngStyle]="filterPanelStyle" [integrationparams]="integrationParams" (filterapplied)="filterapplied()"></reporter-filter-panel>
