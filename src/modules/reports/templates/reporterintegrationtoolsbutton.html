<div class="slds-dropdown-trigger slds-dropdown-trigger_click" [ngClass]="{'slds-is-open':opened}">
    <button class="slds-button slds-button--neutral" aria-haspopup="true" [disabled]="isDisabled" (click)="toggleOpen()" style="border-radius: 0;border-left: 0;border-right: 0;">
        <span>{{language.getLabel('LBL_TOOLS')}}</span>
        <system-button-icon [icon]="'down'"></system-button-icon>
    </button>
    <div class="slds-dropdown slds-dropdown_right">
        <ul class="slds-dropdown__list" role="menu">
            <div #actionitems></div>
        </ul>
    </div>
</div>
