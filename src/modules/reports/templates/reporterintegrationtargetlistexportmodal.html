<system-modal size="large">
    <system-modal-header (close)="closeModal()">{{language.getLabel('LBL_EXPORT_TO_TARGETLIST_BUTTON_LABEL')}}</system-modal-header>
    <system-modal-content>
        <div class="slds-form-element slds-p-around--small">
            <label class="slds-form-element__label">{{language.getLabel('KReports', 'LBL_EXPORT_TO_TARGETLIST_BUTTON_LABEL')}}</label>
            <div class="slds-form-element__control">
                <input type="text" class="slds-input" [(ngModel)]="targetlistname">
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="closeModal()">{{language.getLabel('LBL_CANCEL')}}</button>
        <button class="slds-button slds-button--brand" (click)="exportTargetList()">{{language.getLabel('LBL_OK')}}</button>
    </system-modal-footer>
</system-modal>
