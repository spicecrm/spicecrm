<div tobottom>
    <table #tableheader class="slds-table slds-table_bordered slds-table_edit  slds-tree slds-table_tree slds-table--fixed-layout" role="treegrid">
        <thead>
            <tr>
                <th scope="col">
                    <ul class="slds-p-around--x-small slds-list_horizontal slds-has-dividers_left">
                        <li *ngFor="let groupField of groupFields" class="slds-item">{{language.getLabel(groupField.text)}}</li>
                    </ul>
                </th>
                <th *ngFor="let treeDisplayField of treeDisplayFields" scope="col" [width]="getFieldWidth(treeDisplayField.dataIndex)">
                    <a  href="javascript:void(0);" class="slds-th__action slds-text-link--reset slds-grid"  [ngClass]="displayClasses(treeDisplayField)">
                        <div class="slds-truncate slds-p-around--x-small" [title]="language.getLabel(treeDisplayField.text)">{{language.getLabel(treeDisplayField.text)}}</div>
                    </a>
                </th>
            </tr>
        </thead>
    </table>
    <div #tablecontent class="slds-scrollable--y" [ngStyle]="getContainerStyle()">
        <table #tablecontent class="slds-table slds-table_bordered slds-table_edit  slds-tree slds-table_tree slds-table--fixed-layout" role="treegrid">
            <tbody>
                <ng-container *ngFor="let record of reportRecords">
                    <tr *ngIf="record.visible" [attr.aria-level]="record.depth" [attr.aria-posinset]="record.depth"  class="slds-hint-parent">
                        <td class="slds-tree__item" scope="row">
                            <ng-container *ngIf="record.depth < groupFields.length - 1; else lastgrouped">
                                <button class="slds-button slds-button_icon slds-button_icon-x-small slds-m-right_x-small" (click)="getNode(record.node)">
                                    <system-button-icon [icon]="record.expanded ? 'chevrondown' : 'chevronright'"></system-button-icon>
                                </button>
                                <div class="slds-truncate" >
                                    {{record.text}}
                                </div>
                            </ng-container>
                            <ng-template #lastgrouped>
                                <system-button-icon icon="file" class="slds-p-horizontal--x-small"></system-button-icon>
                                <reporter-field-container [field]="lastGroupField" [record]="record"></reporter-field-container>
                            </ng-template>
                        </td>
                        <td *ngFor="let treeDisplayField of treeDisplayFields" role="gridcell">
                            <div class="slds-truncate" >
                                <reporter-field-container [field]="treeDisplayField" [record]="record"></reporter-field-container>
                            </div>
                        </td>
                    </tr>
                </ng-container>
            </tbody>
        </table>
    </div>
</div>
