<div class="slds-card slds-card_boundary slds-p-bottom--medium slds-m-bottom--medium">
    <div class="slds-card__header slds-grid slds-grid--vertical-align-center">
        <header class="slds-media slds-media--center slds-has-flexi-truncate">
            <object-icon module="KReports" [size]="'small'"></object-icon>
            <div class="slds-media__body slds-truncate slds-grid slds-grid--vertical-align-center">
                <h2>
                    <a href="javascript:void(0);" class="slds-text-link--reset">
                    <span class="slds-text-heading--small">
                        {{title}}
                    </span>
                    </a>
                </h2>
            </div>
        </header>
    </div>
    <reporter-presentation-dashlet [componentconfig]="componentconfig" [parentModule]="model.module" [parentId]="model.id" [displayheader]="false"></reporter-presentation-dashlet>
</div>
