<div class="slds-form-element">
    <div class="slds-form-element__control">
        <div class="slds-select_container">
            <select class="slds-select" [(ngModel)]="whereCondition.referencefieldid">
                <option *ngFor="let referenceField of referenceFields" [value]="referenceField.fieldid">
                    {{language.getLabel(referenceField.name)}}
                </option>
            </select>
        </div>
    </div>
</div>
