<div class="slds-scrollable" style="height: 100%;">
<article class="slds-card slds-m-around--medium" *ngFor="let cockpit of cockpits">
    <div class="slds-card__header slds-grid">
        <header class="slds-media slds-media--center slds-has-flexi-truncate">
            <!--div class="slds-media__figure">
                <system-icon [module]="'KReports'"></system-icon>
            </div-->
            <div class="slds-media__body">
                <h2>
                    <span class="slds-text-heading--medium">{{cockpit.name}}</span>
                </h2>
            </div>
        </header>
    </div>
    <div class="slds-card__body slds-p-horizontal--x-small">
        <div class="slds-card__body--inner slds-grid slds-wrap slds-grid--pull-padded">
            <reporter-cockpit-tile *ngFor="let report of cockpit.items" [report]="report"></reporter-cockpit-tile>
        </div>
    </div>
    <div class="slds-card__footer"><a href="javascript:void(0);">View All</a></div>
</article>
</div>
