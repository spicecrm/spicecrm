<div class="slds-grid" [ngStyle]="viewStyle">
    <div style="height: 100%;" class="slds-border--right slds-theme_shade slds-size--1-of-7">
        <nav class="slds-nav-vertical" aria-label="Sub page">
            <div class="slds-nav-vertical__section">
                <div class="slds-grid slds-grid_align-spread slds-grid--vertical-align-center slds-p-horizontal--medium slds-p-vertical--x-small">
                    <h2 id="entity-header" class="slds-text-heading--small">{{language.getModuleName('Dashboards')}}</h2>
                    <button class="slds-button slds-button_icon slds-button_icon-border" (click)="addDashboard()">
                        <system-button-icon [icon]="'add'"></system-button-icon>
                    </button>
                </div>
                <div class="slds-form-element slds-p-horizontal--medium slds-p-vertical--x-small">
                    <div class="slds-form-element__control">
                        <input type="text" class="slds-input" [(ngModel)]="dashboardFilter">
                    </div>
                </div>
                <ul>
                    <li class="slds-nav-vertical__item" [ngClass]="getActiveClass(dashboard.id)" *ngFor="let dashboard of dashboards" (click)="setDashboard(dashboard.id)">
                        <div class="slds-nav-vertical__action slds-text-link_reset" >{{dashboard.name}}</div>
                    </li>
                </ul>
            </div>
        </nav>
    </div>
    <div  class="slds-size--6-of-7" style="height: 100%;">
        <div #dashboardcontainer></div>
        <div class="slds-align--absolute-center" style="height: 100%;" *ngIf="!currentDashboard">
            <span class="slds-text-heading--small">Please Select a Dashboard</span>
        </div>
    </div>
</div>
