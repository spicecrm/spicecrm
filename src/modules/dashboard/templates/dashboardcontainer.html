<dashboard-container-body *ngIf="dashboardid.length > 0"></dashboard-container-body>
<div *ngIf="dashboardid.length == 0" class="slds-align--absolute-center slds-text-heading--small" tobottom>
    <span>{{language.getLabel('MSG_NO_DASHBOARD_SELECTED')}}</span>
    <a class="slds-m-left--xx-small slds-text-link" style="cursor: pointer" (click)="navigate()">{{language.getLabel('LBL_SELECT_DASHBOARD')}}</a>
</div>
