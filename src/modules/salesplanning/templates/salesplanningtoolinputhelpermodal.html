<system-modal>
    <system-modal-header (close)="cancel()"><system-label label="LBL_INPUT_HELPER"></system-label></system-modal-header>
    <system-modal-content>
        <div class="slds-form-element__control">
            <label class="slds-form-element__label"><system-label label="LBL_PLAN_CODE"></system-label> <system-label label="LBL_FOR"></system-label></label>
            <div class="slds-select_container">
                <select class="slds-select" [(ngModel)]="data.toField">
                    <option *ngFor="let editableField of editableFields" [value]="editableField.id">{{editableField.name}}</option>
                </select>
            </div>
        </div>
        <div class="slds-grid">
            <div class="slds-form-element__control slds-size--1-of-2 slds-p-right--small">
                <label class="slds-form-element__label"><system-label label="LBL_PERIOD"></system-label> <system-label label="LBL_FROM"></system-label></label>
                <div class="slds-select_container">
                    <select class="slds-select" [(ngModel)]="data.startPeriod">
                        <option *ngFor="let period of periods; let index = index" [value]="index">{{period.name}}</option>
                    </select>
                </div>
            </div>
            <div class="slds-form-element__control slds-size--1-of-2">
                <label class="slds-form-element__label"><system-label label="LBL_PERIOD"></system-label> <system-label label="LBL_TO"></system-label></label>
                <div class="slds-select_container">
                    <select class="slds-select" [(ngModel)]="data.endPeriod">
                        <option *ngFor="let period of periods; let index = index" [value]="index">{{period.name}}</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="slds-form-element__control">
            <label class="slds-form-element__label"><system-label label="LBL_PLAN_CODE"></system-label> <system-label label="LBL_FROM"></system-label></label>
            <div class="slds-select_container">
                <select class="slds-select" [(ngModel)]="data.fromField">
                    <option value="fixed"><system-label label="LBL_FIXED"></system-label></option>
                    <option *ngFor="let field of allAvailableFields" [value]="field.id">{{field.name}}</option>
                </select>
            </div>
        </div>
        <div *ngIf="data.fromField == 'fixed'">
            <label class="slds-form-element__label"><system-label label="LBL_VALUE"></system-label></label>
            <system-input-number [(ngModel)]="data.value"></system-input-number>
            <system-checkbox [(ngModel)]="data.evenly" class="slds-m-top--x-small" style="display: block"><system-label label="LBL_SPREAD_EVENLY"></system-label></system-checkbox>
        </div>
        <div *ngIf="!!data.fromField && data.fromField != 'fixed'">
            <label class="slds-form-element__label"><system-label label="LBL_WITH_VALUE_MODIFICATION"></system-label></label>
            <div class="slds-grid slds-grid--vertical-align-center">
                <system-input-number [(ngModel)]="data.percentValue"></system-input-number>
                <span class="slds-m-left--xx-small slds-text-heading--small">%</span>
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <div class="slds-button-group">
            <button class="slds-button-group-item slds-button slds-button--neutral slds-align--absolute-center" (click)="cancel()">
                <system-label label="LBL_CANCEL"></system-label>
            </button>
            <button [disabled]="!data.toField || (data.fromField == 'fixed' && (!data.value || data.value.length == 0))" class="slds-button-group-item slds-button slds-button--brand slds-align--absolute-center" (click)="execute()">
                <system-label label="LBL_APPLY"></system-label>
            </button>
        </div>
    </system-modal-footer>
</system-modal>
