<div class="slds-media slds-no-space slds-grow">
    <system-icon sprite="custom" icon="custom49" class="slds-align--absolute-center"></system-icon>
    <div class="slds-media__body">
        <p class="slds-text-title--caps slds-line-height--reset">{{language.getLabel('LBL_SALES_PLANNING_TOOL')}}</p>
        <div class="slds-grid slds-m-top--xxx-small">
            <span *ngIf="!model.isLoading" class="slds-pill" style="font-weight: bold; height: fit-content">
                <span class="slds-pill__label">
                    {{model.getFieldValue('summary_text')}}
                </span>
                <button *ngIf="canEdit" class="slds-button slds-button_icon slds-pill__remove" (click)="edit()">
                    <system-button-icon icon="edit" size="xx-small"></system-button-icon>
                </button>
            </span>
            <nav role="navigation" aria-label="Breadcrumbs" class="slds-grid slds-grid_vertical-align-center slds-p-around--x-small">
                <ol class="slds-breadcrumb slds-list_horizontal slds-wrap">
                    <li *ngFor="let breadcrumb of breadcrumbs" class="slds-breadcrumb__item slds-text-title--caps">
                        <a>{{breadcrumb.value}}</a>
                    </li>
                </ol>
            </nav>
        </div>
    </div>
</div>
