<div *ngIf="node" class="slds-grid slds-grid--vertical" style="height: inherit">
    <div [class.slds-border--bottom]="nodeContentArray.length == 0 || isLoading" class="slds-grid slds-p-vertical--xx-small" style="min-height: 30px">
        <div class="slds-grow slds-p-horizontal--medium slds-scrollable--x slds-text-heading--small slds-align-middle">
            {{nodeInfo.nodeText}}
        </div>
        <div class="slds-col_bump-left slds-m-right--xx-small">
            <div class="slds-button-group">
                <button *ngIf="isEditMode" [disabled]="isLoading" class="slds-button-group-item slds-button slds-button--neutral" (click)="cancel()">
                    {{language.getLabel('LBL_CANCEL')}}
                </button>
                <button *ngIf="isEditMode" [disabled]="isLoading" class="slds-button-group-item slds-button slds-button--brand" (click)="save()">
                    {{language.getLabel('LBL_SAVE')}}
                </button>
                <button *ngIf="!isEditMode" [disabled]="isLoading || !nodeInfo.leaf || nodeContentArray.length == 0" class="slds-button-group-item slds-button slds-button--neutral" (click)="setEditMode()">
                    {{language.getLabel('LBL_EDIT')}}
                </button>
            </div>
            <div class="slds-button-group slds-m-left--small">
                <button [disabled]="isLoading || !nodeInfo.leaf" class="slds-button-group-item slds-button slds-button--neutral" (click)="viewNote()">
                    {{language.getLabel('LBL_NOTE')}}
                </button>
                <button [disabled]="isClosing || isLoading || !nodeInfo.leaf" [class.slds-is-pressed]="nodeInfo.marked_done && !isClosing" (click)="toggleMarkDone()"
                        class="slds-button-group-item slds-button slds-button--neutral slds-button_dual-stateful slds-align--absolute-center" >
                    <system-button-icon *ngIf="nodeInfo.marked_done && !isClosing" icon="check" addclasses="slds-button__icon_left"></system-button-icon>
                    <system-spinner *ngIf="isClosing" size="14" class="slds-m-right--xxx-small" style="display: inline-block"></system-spinner>
                    {{language.getLabel('LBL_CLOSE')}}
                </button>
            </div>
        </div>
    </div>
    <div class="slds-grow slds-scrollable">
        <table *ngIf="nodeContentArray.length > 0 && !isLoading" class="slds-table slds-table_bordered slds-table_cell-buffer spice-table_header-fixed">
            <thead>
            <tr class="slds-text-title_caps">
                <th scope="col" style="padding: .1rem .1rem">
                    <div [title]="language.getLabel('LBL_PLAN_CODE')">
                        {{language.getLabel('LBL_PLAN_CODE')}}
                    </div>
                </th>
                <th *ngFor="let period of periods; trackBy: trackByFn" scope="col" [title]="period?.name" style="padding: .1rem .1rem">
                    <div class="slds-truncate">
                        {{period?.name}}
                    </div>
                </th>
                <th scope="col" style="padding: .1rem .1rem">
                    <div class="slds-truncate" [title]="language.getLabel('LBL_SUM_PERIODS')">
                        {{language.getLabel('LBL_SUM_PERIODS')}}
                    </div>
                </th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let field of nodeContentArray; trackBy: trackByFn">
                <td style="padding: .1rem .1rem">
                    <div [title]="field.description">
                        {{field.description}}
                    </div>
                </td>
                <td *ngFor="let period of periods; trackBy: trackByFn" [title]="field[period?.key]" style="padding: .1rem .1rem">
                    <div *ngIf="!isEditMode|| !isEditable(field.field_id)" class="slds-truncate slds-text-align--right">
                        {{field[period?.key]}}
                    </div>
                    <div *ngIf="isEditMode && isEditable(field.field_id)" class="slds-form-element__control slds-m-vertical--xx-small">
                        <input type="text" class="slds-input slds-text-align--right" [ngModel]="field[period?.key]" [ngModelOptions]="modelOptions" (ngModelChange)="setPeriodValues($event, field, period?.key)" style="min-height: 20px !important; line-height: 20px; padding: 0 .2rem">
                    </div>
                </td>
                <td style="padding: .1rem .1rem" >
                    <div class="slds-truncate slds-text-align--right" [title]="getFieldSum(field)">
                        {{getFieldSumDisplay(field)}}
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        <div *ngIf="isLoading" class="slds-align_absolute-center slds-m-around--medium" style="height: inherit">
            <system-spinner></system-spinner>
        </div>
    </div>
</div>
<div *ngIf="!isLoading && !node" class="slds-p-around--small slds-align--absolute-center" style="height: inherit">
    {{language.getLabel('LBL_MAKE_SELECTION')}}
</div>
