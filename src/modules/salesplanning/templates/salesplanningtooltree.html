<div class="slds-tree_container slds-scrollable--y" style="max-width: 100%; height: 100%" role="application">
    <ul class="slds-tree" role="tree" aria-labelledby="treeheading" >
        <li *ngFor="let treeItem of treeItems; trackBy: trackByFn" (click)="selectTreeItem(treeItem)" role="treeitem" [attr.aria-level]="treeItem.level" [class.slds-theme--shade]="isSelected(treeItem.id)">
            <div class="slds-tree__item">
                <button [class.slds-hidden]="treeItem.level >= planningService.characteristics.length" class="slds-button slds-button_icon slds-button_icon slds-m-right_x-small" (click)="toggle(treeItem, $event)">
                    <system-button-icon [icon]="'chevronright'"></system-button-icon>
                </button>
                <a href="javascript:void(0);" tabindex="-1" class="slds-truncate" [title]="treeItem.name">
                    {{treeItem.name}}
                </a>
                <system-spinner *ngIf="isLoading == treeItem.id" size="16" class="slds-col_bump-left slds-m-right--x-small"></system-spinner>
            </div>
        </li>
    </ul>
</div>
<div *ngIf="isLoading == '' && treeItems?.length == 0" class="slds-p-around--small slds-align--absolute-center">
    {{language.getLabel('LBL_NO_ENTRIES')}}
</div>
<div *ngIf="isLoading == '*'" class="slds-align_absolute-center slds-m-around--medium">
    <system-spinner></system-spinner>
</div>
