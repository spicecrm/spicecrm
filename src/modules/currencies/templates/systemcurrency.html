<system-spinner *ngIf="loading"></system-spinner>
<div *ngIf="!loading" class="slds-p-around--medium">
    <div >
        <h2 class="slds-text-title--caps">System Currency</h2>
    </div>
    <div *ngIf="!editMode && defaultCurrency">
        {{defaultCurrency.name}} ({{defaultCurrency.symbol}})<system-button-icon icon="edit" class="slds-p-left--small" (click)="edit()"></system-button-icon>
    </div>
    <div *ngIf="editMode">
        <div class="slds-form-element__control slds-grid slds-grid--vertical-align-center">
            <div class="slds-select_container">
                <select class="slds-select" [(ngModel)]="selectedCurrency">
                    <option *ngFor="let currency of currencies" [ngValue]="currency" >{{currency.name}}({{currency.symbol}})</option>
                </select>
            </div>
            <system-button-icon icon="save" class="slds-p-left--small" (click)="savePreference()"></system-button-icon>
        </div>
    </div>

</div>
