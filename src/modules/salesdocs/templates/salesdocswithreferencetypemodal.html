<system-modal size="small">
    <system-modal-header (close)="close()"><system-label label="LBL_SALESDOC_CONVERT"></system-label></system-modal-header>
    <system-modal-content>
        <div class="slds-grid--vertical">
            <div *ngFor="let targetType of targetTypes">
                <system-input-radio name="referencetype" [value]="targetType.to" [(ngModel)]="selectedType">{{salesdoctypeDisplayname(targetType.to)}}</system-input-radio>
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CANCEL"></system-label></button>
        <button class="slds-button slds-button--brand" (click)="create()"><system-label label="LBL_CREATE"></system-label></button>
    </system-modal-footer>
</system-modal>
