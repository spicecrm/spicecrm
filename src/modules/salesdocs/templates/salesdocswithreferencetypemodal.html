<system-modal size="small">
    <system-modal-header (close)="close()">{{language.getLabel('LBL_SALESDOC_CONVERT')}}</system-modal-header>
    <system-modal-content>
        <div class="slds-grid--vertical">
            <div *ngFor="let targetType of targetTypes">
                <system-input-radio name="referencetype" [value]="targetType.to" [(ngModel)]="selectedType">{{salesdoctypeDisplayname(targetType.to)}}</system-input-radio>
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()">{{language.getLabel('LBL_CANCEL')}}</button>
        <button class="slds-button slds-button--brand" (click)="create()">{{language.getLabel('LBL_CREATE')}}</button>
    </system-modal-footer>
</system-modal>
