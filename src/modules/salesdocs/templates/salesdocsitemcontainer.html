<td class="slds-cell-shrink">
    <button class="slds-button slds-button_icon" [disabled]="!editing" (click)="deleteItem()"><system-button-icon [icon]="'close'"></system-button-icon></button>
    <button class="slds-button slds-button--icon slds-col_bump-left"  [disabled]="!hasDetailsView" (click)="toggleDetails()">
        <system-button-icon [icon]="toggleIcon"></system-button-icon>
    </button>
</td>
<td>
    <field-container fieldname="itemnr" fielddisplayclass="slds-truncate slds-p-horizontal--x-small"></field-container>
</td>
<td>
    <field-container fieldname="name" [fieldconfig]="{readonly:true}" fielddisplayclass="slds-truncate slds-p-horizontal--x-small"></field-container>
</td>
<td>
    <field-container fieldname="quantity" fielddisplayclass="slds-truncate slds-p-horizontal--x-small"></field-container>
</td>
<td>
    <field-container fieldname="amount_net_per_uom" [fieldconfig]="{currencyReadonly: true}" fielddisplayclass="slds-truncate slds-p-horizontal--x-small"></field-container>
</td>
<td>
    <field-container fieldname="amount_net" [fieldconfig]="{readonly:true}" fielddisplayclass="slds-truncate slds-p-horizontal--x-small"></field-container>
</td>
<td>
    <field-container fieldname="amount_gross" [fieldconfig]="{readonly:true}" fielddisplayclass="slds-truncate slds-p-horizontal--x-small"></field-container>
</td>
<td>
    <field-container fieldname="tax_category" fielddisplayclass="slds-truncate slds-p-horizontal--x-small"></field-container>
</td>
