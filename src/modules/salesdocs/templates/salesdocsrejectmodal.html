<system-modal>
    <system-modal-header (close)="close()"><system-label label="LBL_REJECT_SALESDOC"></system-label></system-modal-header>
    <system-modal-content margin="none">
        <salesdocs-reject-items-container></salesdocs-reject-items-container>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CANCEL"></system-label></button>
        <button class="slds-button slds-button--brand" (click)="save()"><system-label label="LBL_SAVE"></system-label></button>
    </system-modal-footer>
</system-modal>
