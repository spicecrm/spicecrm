<div class="slds-section" [ngClass]="{'slds-is-open': expanded}">
    <h3 class="slds-section__title">
        <button aria-controls="expando-unique-id" aria-expanded="true" class="slds-button slds-section__title-action">
            <!--global-utility-icon [icon]="'switch'" [size]="'x-small'" [addclasses]="'slds-section__title-action-icon slds-button__icon slds-button__icon_left'"></system-utility-icon-->
            <span class="slds-truncate" title="Section Title">{{language.getLabel('LBL_ITEMS', 'SalesDocItems')}}</span>
        </button>
    </h3>
    <div>
        <salesdocs-items-display *ngIf="!editing"></salesdocs-items-display>
        <salesdocs-items-edit *ngIf="editing"></salesdocs-items-edit>
    </div>
</div>
