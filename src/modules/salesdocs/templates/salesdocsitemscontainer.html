<system-collapsable-tab tabtitle="LBL_ITEMS">
    <table class="slds-table slds-table--fixed-layout slds-table_bordered slds-no-row-hover">
        <thead>
            <tr salesdocs-item-header></tr>
        </thead>
        <tbody *ngIf="itemcount > 0">
            @for(item of items|salesdocsitemsdeletedpipe; track item.id) {
                <tr salesdocs-item-container [ngClass]="{'slds-text-linethrough': item.rejection_reason}" [item]="item" [salesdoc]="model" (recalculated)="recalculate()"></tr>
                <tr *ngIf="item.expanded">
                    <td colspan="2" class="slds-cell-shrink">
                    <td [attr.colspan]="fieldsetItems.length">
                        <salesdocs-item-details-container [item]="item" [salesdoc]="model"></salesdocs-item-details-container>
                    </td>
                    <td></td>
                </tr>
            }
        </tbody>
        <tbody *ngIf="itemcount == 0">
            <td [attr.colspan]="3 + fieldsetItems.length">
                <div class="slds-p-around--medium slds-align--absolute-center">
                    <button [disabled]="!editing" class="slds-button slds-button_neutral" (click)="salesdocrecord.addItem()">
                        <div class="slds-grid">
                            <span><system-label label="LBL_ADD_ITEM"></system-label></span>
                        </div>
                    </button>
                </div>
            </td>
        </tbody>
        <tfoot *ngIf="itemcount > 0">
            <tr salesdocs-item-footer [editing]="editing" (addItem)="salesdocrecord.addItem()"></tr>
        </tfoot>
    </table>
</system-collapsable-tab>
