<system-modal size="small">
    <system-modal-header (close)="close()">{{language.getLabel('LBL_SALESDOC')}}</system-modal-header>
    <system-modal-content>
        <object-record-fieldset [fieldset]="fieldset" direction="vertical"></object-record-fieldset>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()">{{language.getLabel('LBL_CANCEL')}}</button>
        <button class="slds-button slds-button--brand" [disabled]="!canContinue" (click)="next()">{{language.getLabel('LBL_CONTINUE')}}</button>
    </system-modal-footer>
</system-modal>
