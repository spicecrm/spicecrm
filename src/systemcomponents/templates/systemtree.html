<div  #treeDropBoundary role="listbox">
    <ul  class="slds-tree" role="tree" aria-labelledby="treeheading">
            <system-tree-item
                    [items]="tree"
                    [config]="config"
                    [selectedItem]="selectedItem"
                    (addItem$)="handleAddEvent($event)"
                    (selectedItem$)="handleSelectItemEvent($event)"
                    (changeItemPosition_item$)="changeItemPosition($event)"></system-tree-item>
    </ul>
</div>
<div *ngIf="config.canadd" class="slds-grid slds-align-content-center slds-border--top slds-m-top--x-small slds-p-top--x-small">
    <button class="slds-button slds-button--icon slds-button--icon-border slds-p-around--xx-small" (click)="handleAddEvent(null)">
        <system-button-icon [icon]="'add'" [size]="'small'"></system-button-icon>
    </button>
</div>
