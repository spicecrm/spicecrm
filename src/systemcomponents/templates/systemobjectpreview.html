@if(!blobUrl) {
    <div  style="height: 50vh;" class="slds-align--absolute-center">
        <system-spinner *ngIf="!loadingerror"/>
        <system-illustration-page-not-available *ngIf="loadingerror">
            <system-label label="MSG_ERROR_LOADING_FILE"/>
        </system-illustration-page-not-available>
    </div>
} @else {
    @switch (objecttype) {
        @case('audio') {
            <div class="slds-p-around--small slds-text-align--center">
                <audio controls style="width:100%">
                    <source [src]="blobUrl" [type]="type">
                </audio>
            </div>
        }
        @case('video') {
            <div class="slds-p-around--small slds-text-align--center">
                <video style="max-height:80%; max-width:80%" controls>
                    <source [src]="blobUrl" [type]="type">
                </video>
            </div>
        }
        @case('text') {
            @if (type=="text/html") {
                <div [ngStyle]="objectContainerStyle">
                    <object [data]="blobUrl" [type]="type" width="100%" height="100%"></object>
                </div>
            } @else {
                <div class="slds-p-around--small slds-text-align--center">
                    <pre>{{rawData}}</pre>
                </div>
            }
        }
        @default {
            <div [ngStyle]="objectContainerStyle">
                <object [data]="blobUrl" [type]="type" width="100%" height="100%"></object>
            </div>
        }
    }
    <a *ngIf="downloadTrigger$ && downloadReady" #downloadlink [href]="this.blobUrl" [download]="name" style="display:none"></a>
}
