<div class="slds-form-element">
    @if(strict) {
        <system-select system-select-id-only [(ngModel)]="value" [disabled]="disabled">
            <system-select-option *ngFor="let c of countries" [value]="c.cc" [display]="language.getLabel(c.label)"/>
        </system-select>
    } @else {
        <div class="slds-form-element__control">
            <input type="text" class="slds-input" [(ngModel)]="value" [disabled]="disabled"/>
        </div>
    }
</div>
