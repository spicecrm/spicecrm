<div #area_metadata class="slds-p-horizontal--xx-small">
    <div *ngIf="!mediaBase64">&nbsp;</div><!-- mediaMetaData.mimetype -->
    <div *ngIf="mediaBase64" class="slds-grid slds-grid--align-spread"><!-- mediaMetaData.mimetype -->
        <div *ngIf="mediaMetaData.fileformat">{{this.mediaMetaData.fileformat.toUpperCase()}}</div>
        <div>{{mediaMetaData.originalWidth}} &times; {{mediaMetaData.originalHeight}} px<span *ngIf="isResized"> &#8594; {{mediaMetaData.width}} &times; {{mediaMetaData.height}} px</span></div>
    </div>
</div>
<div #area_media [ngStyle]="{height:areaMediaHeight}" style="position:relative">

    <div (drop)="onDrop($event)" (dragover)="onDragOver($event)" (dragleave)="onDragLeave()" style="height:100%">
        <div style="height:100%;width:100%;display:table">
            <div class="slds-file-selector__dropzone" [ngClass]="{'slds-has-drag-over':isDragOver}" style="display:table-cell;vertical-align:middle;position: absolute;top:0;bottom:0;right:0;left:0">
                <div class="chessbg" style="height:100%;">
                    <img #imgelement *ngIf="mediaBase64" [src]="mediaBase64" (load)="imageLoaded($event)" style="max-height:100%"/>
                </div>
            </div>
        </div>
    </div>

    <system-spinner *ngIf="isLoading" style="position: absolute; top:50%; left:50%; transform: translate(-50%, -50%);"></system-spinner>

</div>
<div #area_controls style="position:absolute;left:0;bottom:0;right:0">
    <div class="slds-grid slds-grid--vertical-align-end slds-grid--align-spread">
        <div>
            <button class="slds-button slds-button--neutral" (click)="triggerFileSelectionDialog()">{{lang.getLabel('LBL_SELECT_FILE')}}&nbsp;&hellip;</button>
        </div>
        <div *ngIf="allowCropping" class="slds-m-left--x-small">
            <button class="slds-button x-slds-button--icon slds-button--icon-border slds-button--neutral x-slds-button--icon-border-filled" (click)="removeCropping()" [disabled]="!cropper || !isCropped" title="Remove Cropping">RC<!--system-button-custom-icon icon="removecropping" size="medium"></system-button-icon--></button>
        </div>
        <div *ngIf="allowEditing" class="slds-m-left--x-small">
            <button class="slds-button x-slds-button--icon slds-button--icon-border slds-button--neutral x-slds-button--icon-border-filled" (click)="removeModifications()" [disabled]="!cropper || !isEdited" title="Remove Modifications" style="padding-left:0.5rem;padding-right:0.5rem">RM<!--system-button-custom-icon icon="removemodifications" size="medium"></system-button-icon--></button>
        </div>
        <div *ngIf="allowRotating" class="slds-m-left--x-small">
            <button class="slds-button x-slds-button--icon slds-button--icon-border slds-button--neutral x-slds-button--icon-border-filled" (click)="rotate(-90)" [disabled]="!canRotate"><system-button-custom-icon icon="rotateleft" size="medium"></system-button-custom-icon></button>
            <button class="slds-button x-slds-button--icon slds-button--icon-border slds-button--neutral x-slds-button--icon-border-filled" (click)="rotate(+90)" [disabled]="!canRotate"><system-button-custom-icon icon="rotateright" size="medium"></system-button-custom-icon></button>
        </div>
        <div *ngIf="allowMirroring" class="slds-m-left--x-small">
            <button title="mirror x horizontal" class="slds-button x-slds-button--icon slds-button--icon-border slds-button--neutral x-slds-button--icon-border-filled" (click)="mirrorX()" [disabled]="!canMirror"><system-button-custom-icon icon="mirrorhorizontal" size="medium"></system-button-custom-icon></button>
            <button title="mirror y vertical" class="slds-button x-slds-button--icon slds-button--icon-border slds-button--neutral x-slds-button--icon-border-filled" (click)="mirrorY()" [disabled]="!canMirror"><system-button-custom-icon icon="mirrorvertical" size="medium"></system-button-custom-icon></button>
        </div>
        <div *ngIf="allowResizing" class="slds-m-left--x-small slds-grid slds-grid--vertical-align-end">
            <div class="slds-form-element">
                <div class="slds-form-element__control">
                    <div class="slds-checkbox">
                        <input type="checkbox" name="options" id="{{componentId}}_cbDoResize" [(ngModel)]="doResize" (change)="calcTargetSize()" [disabled]="!canResize"/>
                        <label class="slds-checkbox__label" for="{{componentId}}_cbDoResize">
                            <span class="slds-checkbox_faux"></span>
                            <span class="slds-form-element__label">Downsize to max.&nbsp;&hellip;</span>
                        </label>
                    </div>
                </div>
                <div class="slds-form-element__control slds-p-top--xxx-small">
                    <system-input-number onlyField="true" [(ngModel)]="maxWidthInput" precision="0" min="1" placeholder="Width " [disabled]="!doResize || !canResize" size="4" (change)="maxWidthChanged()"></system-input-number>&nbsp;&times;&nbsp;<system-input-number onlyField="true" [(ngModel)]="maxHeightInput" precision="0" min="1" placeholder="Height " [disabled]="!doResize || !canResize" size="4" (change)="maxHeightChanged()"></system-input-number>
                </div>
            </div>
        </div>
    </div>
</div>
<input #fileselector style="display:none" type="file" accept="image/*" (change)="fileSelectionChange()"/><!-- accept="video/mp4"-->
