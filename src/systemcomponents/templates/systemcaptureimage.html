<section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
    <div class="slds-modal__container" style="width:1048px;max-width: 100%;">
        <header class="slds-modal__header">
            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" (click)="close()">
                <system-button-icon [icon]="'close'" [size]="'large'"></system-button-icon>
            </button>
            <h2 class="slds-text-heading_medium slds-hyphenate">capture Image</h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
            <video #video [ngClass]="{'slds-hide': imageTaken}" width="1024" height="768" autoplay></video>
            <canvas #canvas [ngClass]="{'slds-hide': !imageTaken}"  width="1024" height="768"></canvas>
        </div>
        <footer class="slds-modal__footer">
            <button class="slds-button slds-button--neutral" (click)="close()">Cancel</button>
            <button *ngIf="!imageTaken" class="slds-button slds-button--brand" (click)="capture()">Capture</button>
            <!--button *ngIf="imageTaken" class="slds-button slds-button--brand" (click)="discard()">Discard</button-->
            <button *ngIf="imageTaken" class="slds-button slds-button--brand" (click)="send()">Use</button>
        </footer>
    </div>
</section>
