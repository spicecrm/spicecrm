<system-modal size="large" >
    <system-modal-header (close)="close()">{{language.getLabel('LBL_SOURCE_EDITOR')}}</system-modal-header>
    <system-modal-content>
        <div class="slds-grid" style="height: 70vh;">
            <div class="slds-size--1-of-2 slds-p-right--xx-small" >
                <div class="slds-box slds-theme--default slds-scrollable_y" [innerHtml]="sanitizedHtml" style="height: 100%;"></div>
            </div>
            <div class="slds-size--1-of-2 slds-p-left--x-small">
                <div class="slds-box slds-theme--default slds-scrollable_y" #sourceeditor contenteditable (input)="onContentChange($event.target.innerText)" style="height: 100%;white-space: pre-line;"></div>
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()">
            {{language.getLabel('LBL_OK')}}
        </button>
    </system-modal-footer>
</system-modal>
