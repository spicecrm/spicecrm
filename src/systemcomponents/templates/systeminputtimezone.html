<div class="slds-form-element__control">
    <div class="slds-select_container">
        @if(!systemselect) {
            <select [disabled]="disabled" class="slds-select" [(ngModel)]="timezone" id="{{id}}">
                <option *ngIf="!denyEmpty" [value]="null"></option>
                <option *ngFor="let timezone of timezones; let i=index" [value]="timezone">{{ timezone }}
                    (GMT{{ offsetTimezones[i] }})
                </option>
            </select>
        } @else {
            <system-select [system-select-id-only]="true" [disabled]="disabled" [(ngModel)]="timezone" id="{{id}}">
                <system-select-option *ngFor="let timezone of timezones; let i=index" [value]="timezone" [display]="timezone + '(GMT' + offsetTimezones[i] + ')'"/>
            </system-select>
        }
    </div>
</div>
