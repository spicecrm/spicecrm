<div [ngSwitch]="variation" class="slds-grid_align-center">

    <div *ngSwitchDefault>
        <button class="slds-button slds-button_icon" [disabled]="page < 2" (click)="page = 1"><system-button-icon [icon]="'chevronleft'" title="go to first page"></system-button-icon><system-button-icon [icon]="'chevronleft'"></system-button-icon></button>

        <button class="slds-button slds-button_icon" [disabled]="page <= 1" (click)="pageDown()"><system-button-icon [icon]="'chevronleft'" title="go to previous page"></system-button-icon></button>

        <span>{{page}} {{language.getLabel('LBL_OF')}} {{max_page}} {{language.getLabel('LBL_PAGES')}} (showing up to {{limit}} {{language.getLabel('LBL_OF')}} {{total_records}} {{language.getLabel('LBL_RECORDS')}})</span>

        <button class="slds-button slds-button_icon" [disabled]="page >= max_page" (click)="pageUp()"><system-button-icon [icon]="'chevronright'" title="go to next page"></system-button-icon></button>

        <button class="slds-button slds-button_icon" [disabled]="page >= max_page-1" (click)="page = max_page"><system-button-icon [icon]="'chevronright'" title="go to last page"></system-button-icon><system-button-icon [icon]="'chevronright'"></system-button-icon></button>
    </div>

    <div *ngSwitchCase="'short'">
        <button class="slds-button slds-button_icon" [disabled]="page <= 1" (click)="pageDown()"><system-button-icon [icon]="'chevronleft'" title="go to previous page"></system-button-icon></button>

        <span>{{page}} {{language.getLabel('LBL_OF')}} {{max_page}} {{language.getLabel('LBL_PAGES')}}</span>

        <button class="slds-button slds-button_icon" [disabled]="page >= max_page" (click)="pageUp()"><system-button-icon [icon]="'chevronright'" title="go to next page"></system-button-icon></button>
    </div>
</div>
