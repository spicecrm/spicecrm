<ng-container *ngIf="currency_id"><system-display-currency-symbol class="slds-p-right--xx-small" [currencyid]="currency_id"/></ng-container>
@if (largeNumbers){
    {{largeValue}}<span style="font-size: 75%"><system-label *ngIf="largeNumberPostfix" system-label-short [label]="'LBL_NUMBER_POSTFIX_'+largeNumberPostfix"/></span>
}@else{
    {{value}}
}
