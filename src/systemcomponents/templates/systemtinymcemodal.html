<div role="dialog" class="slds-modal slds-fade-in-open slds-modal_large">
    <div class="slds-modal__container">
        <div class="slds-modal__header slds-theme--shade">
            <!--button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" (click)="closeModal()">
                <system-button-icon [icon]="'close'" [size]="'large'" [inverse]="true"></system-button-icon>
            </button-->
            <h2 class="slds-text-heading--medium">
                {{title}}
            </h2>
        </div>
        <div class="slds-modal__content slds-theme--default slds-p-around--medium slds-p-bottom--xx-small">
            <system-tinymce [(content)]="content" [stylesheetId]="stylesheetId" [height]="'80%'" (contentChange)="contentChange($event)"></system-tinymce>
        </div>
        <div class="slds-modal__footer">
            <div class="slds-col">
                <button class="slds-button slds-button--neutral" (click)="closeModal()">
                    {{language.getLabel('LBL_OK')}}
                </button>
            </div>
        </div>
    </div>
</div>
