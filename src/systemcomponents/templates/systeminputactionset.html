<div class="slds-grid">
    <div class="slds-form-element__control slds-p-right--xxx-small slds-size--1-of-3">
        <div class="slds-select_container">
            <select [disabled]="disabled"  class="slds-select" [(ngModel)]="_module">
                <option value="*">*</option>
                <option *ngFor="let thismodule of _modules" [value]="thismodule">{{thismodule}}</option>
            </select>
        </div>
    </div>
    <div class="slds-form-element__control slds-p-left--xxx-small slds-size--2-of-3">
        <div class="slds-select_container">
            <select  [disabled]="!_module || disabled" class="slds-select" [(ngModel)]="actionset">
                <option></option>
                <optgroup label="custom {{language.getLabel('LBL_FIELDSET')}}" *ngIf="_actionsets|systemmodulecustompipe:_module.length > 0">
                    <option *ngFor="let sysActionset of _actionsets|systemmodulecustompipe:module" [value]="sysActionset.id">{{sysActionset.name}}</option>
                </optgroup>
                <optgroup label="global {{language.getLabel('LBL_FIELDSET')}}"  *ngIf="_actionsets|systemmoduleglobalpipe:_module.length > 0">
                    <option *ngFor="let sysActionset of _actionsets|systemmoduleglobalpipe:_module" [value]="sysActionset.id">{{sysActionset.name}}</option>
                </optgroup>
            </select>
        </div>
    </div>
</div>
