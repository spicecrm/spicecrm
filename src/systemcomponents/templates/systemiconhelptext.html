<div  style="position: relative; display: inline; color: #eeeeee; top: 2px;">
    <a (mouseover)="showHelp=true" (mouseout)="showHelp=false">
            <span class="slds-icon_container slds-icon-utility-info">
                <system-custom-icon [ngStyle]="{color: showHelp==true  ? ghovercolor : gcolor }" [icon]="gicon" [file]="gfile" [size]="gsizeClass" [desaturate]="gdesaturate" [addclasses]="gaddClass" [divClass]="gdivClass"></system-custom-icon>
            </span>
    </a>
    <div *ngIf="showHelp" class="slds-popover slds-popover_tooltip slds-nubbin_bottom-left" role="tooltip" id="help" style="position: absolute; display: block; z-index: 50; bottom: 2.5em; left: -65%;">
        <div class="slds-popover__body">
            <span style="max-width: 250px; display: block;">{{helpText}}</span>
        </div>
    </div>
</div >
