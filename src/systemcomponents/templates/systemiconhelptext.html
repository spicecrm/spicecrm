<div [system-dropdown-trigger]="false" dropdownSelectorClass="slds-popover-container" [triggerOnHover]="true" class="slds-is-relative" style="display: inline;">
    <a system-dropdown-trigger-button>
        <span class="slds-icon_container slds-icon-utility-info">
            <system-custom-icon [ngStyle]="{'color': gcolor}" [icon]="gicon" [file]="gfile" [size]="gsizeClass" [desaturate]="gdesaturate" [addclasses]="gaddClass" [divClass]="gdivClass"></system-custom-icon>
        </span>
    </a>
    <div class="slds-popover-container">
        <div class="slds-popover slds-popover_tooltip" role="tooltip">
            <div class="slds-popover__body" style="width: 100%; line-height:1.1rem">
                <span style="display: block;white-space:pre-wrap;"><system-label [label]="helpText" length="long"/></span>
            </div>
        </div>
    </div>
</div>
