<div class="slds-form-element">
    <label class="slds-form-element__label">{{language.getLabel('LBL_FIELD')}}</label>
    <div class="slds-form-element__control">
        <div class="slds-select_container">
            <select class="slds-select" [(ngModel)]="field">
                <option *ngFor="let f of fields" [value]="f.name">{{language.getFieldDisplayName(module, f.name)}} ({{f.name}})</option>
            </select>
        </div>
    </div>
</div>
