<div class="slds-form-element__control">
    <div class="slds-select_container">
        <select [disabled]="disabled"  class="slds-select" [(ngModel)]="module">
            <option *ngIf="displayAsterisk" value="*">*</option>
            <option *ngFor="let thismodule of _modules" [value]="thismodule"><system-label-modulename [module]="thismodule"></system-label-modulename> <span *ngIf="displaytechnicalname">&nbsp;({{thismodule}})</span></option>
        </select>
    </div>
</div>
