<div class="slds-form-element">
    <label class="slds-form-element__label">Label</label>
    <div class="slds-combobox_container">

            <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click " [ngClass]="{'slds-is-open': isOpen}" role="combobox">
                <div *ngIf="label" class="slds-form-element__control">
                    <div class="slds-pill_container">
                      <span class="slds-pill slds-size--1-of-1">
                        <span class="slds-pill__label">{{language.getLabel(label)}}&nbsp;({{label}})</span>
                        <button class="slds-button slds-button--icon slds-pill__remove" (click)="clearField()">
                          <system-button-icon [icon]="'close'"></system-button-icon>
                        </button>
                      </span>
                    </div>
                </div>
                <div *ngIf="!label" class="slds-form-element__control slds-grid slds-box--border">
                    <div class="slds-input-has-icon slds-input-has-icon--right slds-grow">
                        <input type="search" class="slds-lookup__search-input slds-input--bare" [(ngModel)]="searchterm" (keyup)="keyup($event)" (blur)="onBlur()" [placeholder]="language.getLabel('LBL_SEARCH')" role="combobox"/>
                    </div>
                </div>
                <div class="slds-dropdown slds-dropdown_fluid" role="listbox">
                    <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                        <li *ngFor="let foundlabel of foundlabels" class="slds-listbox__item" role="presentation" (mousedown)="selectLabel(foundlabel.label)">
                            <div class="slds-grid slds-grid--vertical-align-center">
                                <span class="slds-p-left--medium slds-listbox__option-text slds-listbox__option-text_entity">{{foundlabel.label}}</span>
                                <span class="slds-p-left--medium slds-listbox__option-text slds-listbox__option-text_entity">[{{foundlabel.translation}}]</span>
                            </div>
                        </li>
                        <li class="slds-listbox__item slds-border_top" role="presentation" (mousedown)="addLabel()">
                            <button class="slds-button slds-button--icon slds-align_absolute-center"><system-utility-icon [icon]="'add'" [size]="'x-small'"></system-utility-icon></button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
</div>
