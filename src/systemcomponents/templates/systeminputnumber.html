<div *ngIf="!onlyField" class="slds-form-element__control">
    <div class="slds-form-element">
        <ng-template [ngTemplateOutlet]="field"></ng-template>
    </div>
</div>
<ng-template *ngIf="onlyField" [ngTemplateOutlet]="field"></ng-template>

<ng-template #field>
    @if(withCalculator){
        <div *ngIf="withCalculator" class="slds-input-has-icon slds-input-has-icon_right">
            <input #numberinput class="slds-input slds-text-align--right" type="text" [(ngModel)]="textValue" (keydown)="checkInput($event)" (input)="fieldChanged($event)" [attr.placeholder]="placeholder" [disabled]="disabled" [attr.size]="size" [ngStyle]="{'width':size?'auto':undefined}"/>
            <button class="slds-button slds-button_icon slds-input__icon slds-input__icon_right" system-calculator-trigger system-calculator-trigger-formatted>
                <system-button-icon icon="formula"/>
            </button>
        </div>
    } @else {
        <input #numberinput class="slds-input slds-text-align--right" type="text" [(ngModel)]="textValue" (keydown)="checkInput($event)" (ngModelChange)="fieldChanged($event)" [attr.placeholder]="placeholder" [disabled]="disabled" [attr.size]="size" [ngStyle]="{'width':size?'auto':undefined}"/>
    }
</ng-template>
