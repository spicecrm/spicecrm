<input type="radio" [(ngModel)]="modelValue" [value]="inputOption.value" [disabled]="disabled" [name]="inputOption.name" [id]="inputOption.id">
<label class="slds-radio_button__label slds-height_full" [for]="inputOption.id">
    <span class="slds-radio_faux" style="padding: 0 .5rem;">
        <system-label *ngIf="!!inputOption.label; else iconContainer" [label]="inputOption.label"></system-label>
        <ng-template #iconContainer>
            <system-utility-icon [icon]="inputOption.icon" size="x-small" [colorclass]="modelValue == inputOption.value ? ' ' : 'slds-icon-text-default'"></system-utility-icon>
        </ng-template>
    </span>
</label>
