<div class="slds-radio slds-truncate slds-is-relative">
    <input type="radio" [attr.id]="id" [attr.name]="name" [checked]="checked" [disabled]="disabled" (change)="setChecked($event)"/>
    <label class="slds-radio__label" [attr.for]="id" (click)="clickLabel($event)">
        <span class="slds-radio_faux slds-m-horizontal--xxx-small"></span>
        <span class="slds-form-element__label"><ng-content></ng-content></span>
    </label>
</div>
