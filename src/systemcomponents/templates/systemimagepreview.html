<div *ngIf="!imgsrc" style="height: 50vh;" class="slds-align--absolute-center">
    <system-spinner *ngIf="!loadingerror"></system-spinner>
    <system-illustration-page-not-available *ngIf="loadingerror">
        <system-label label="MSG_ERROR_LOADING_FILE"></system-label>
    </system-illustration-page-not-available>
</div>
<div *ngIf="imgsrc" class="slds-p-around--small slds-text-align--center">
    <img [src]="imgsrc" style="max-height:80vh; overflow: hidden;background: repeating-conic-gradient(#666666 90deg, #7F7F7F 90deg 180deg, #666666 180deg 270deg, #7F7F7F 270deg);background-size: 20px 20px;"/>
</div>
