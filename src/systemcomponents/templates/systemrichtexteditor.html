<div (click)="onEditorClick($event)" class="slds-rich-text-editor slds-grid slds-grid_vertical slds-nowrap slds-grid slds-grid--vertical slds-theme--default" style="  top: 0; right: 0; left: 0; bottom: 0; z-index: 9999;" [ngStyle]="richTextStyle">
    <!--system-richtext-toolbar [isActive]="isActive" #editorToolbar (execute)="executeCommand($event)"></system-richtext-toolbar-->
    <div *ngIf="!readOnly" role="toolbar" class="slds-rich-text-editor__toolbar slds-shrink-none">
        <button *ngIf="extendedmode" class="slds-button slds-button_icon slds-button_icon-border-filled slds-m-right--xx-small" tabindex="-1" [title]="language.getLabel('LBL_SAVE')" (click)="save()">
            <system-button-icon icon="save"></system-button-icon>
        </button>
        <ul *ngIf="extendedmode" class="slds-button-group-list">
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_UNDO')" (click)="executeCommand('undo')">
                    <system-button-icon icon="undo"></system-button-icon>
                    <span class="slds-assistive-text">undo</span>
                </button>
            </li>
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_REDO')" (click)="executeCommand('redo')"  >
                    <system-button-icon icon="redo"></system-button-icon>
                    <span class="slds-assistive-text">redo</span>
                </button>
            </li>
        </ul>

        <div *ngIf="extendedmode"  class="slds-grid slds-rich-text-editor__spacing-wrapper" role="group">
            <div class="slds-rich-text-editor__select">
                <div class="slds-form-element">
                    <div class="slds-form-element__control">
                        <div class="slds-select_container">
                            <select class="slds-select" [(ngModel)]="block" (change)="heading(block)" >
                                <option value="heading1"><h1>Heading 1</h1></option>
                                <option value="heading2"><h2>Heading 2</h2></option>
                                <option value="heading3"><h3>Heading 3</h3></option>
                    <!--            <option value="heading4"><h4>Heading 4</h4></option>
                                <option value="heading5"><h5>Heading 5</h5></option>
                                <option value="heading6"><h6>Heading 6</h6></option>-->
                                <option value="paragraph">Paragraph</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <ul class="slds-button-group-list">
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_BOLD')" (click)="executeCommand('bold')" [ngClass]="{'slds-active': commandIsActive('bold')}" >
                    <system-button-icon icon="bold"></system-button-icon>
                </button>
            </li>
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_ITALIC')" (click)="executeCommand('italic')" [ngClass]="{'slds-active': commandIsActive('italic')}" >
                    <system-button-icon icon="italic"></system-button-icon>
                </button>
            </li>
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_UNDERLINE')" (click)="executeCommand('underline')" [ngClass]="{'slds-active': commandIsActive('underline')}" >
                    <system-button-icon icon="underline"></system-button-icon>
                </button>
            </li>
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_STRIKETHROUGH')" (click)="executeCommand('strikethrough')" [ngClass]="{'slds-active': commandIsActive('strikethrough')}" >
                    <system-button-icon icon="strikethrough"></system-button-icon>
                </button>
            </li>
        </ul>
        <ul class="slds-button-group-list">
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_BULLETED_LIST')" (click)="executeCommand('bulletedList')" [ngClass]="{'slds-active': commandIsActive('bulletedList')}" >
                    <system-button-icon icon="richtextbulletedlist"></system-button-icon>
                </button>
            </li>
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_NUMBERED_LIST')" (click)="executeCommand('numberedList')" [ngClass]="{'slds-active': commandIsActive('numberedList')}" >
                    <system-button-icon icon="richtextnumberedlist"></system-button-icon>
                </button>
            </li>
        </ul>
        <ul class="slds-button-group-list">
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_TEXT_INDENT')" (click)="executeCommand('indent')" [ngClass]="{'slds-active': commandIsActive('indentBlock')}" >
                    <system-button-icon icon="richtextindent"></system-button-icon>
                </button>
            </li>
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_TEXT_OUTDENT')" (click)="executeCommand('outdent')" [ngClass]="{'slds-active': commandIsActive('outdentBlock')}" >
                    <system-button-icon icon="richtextoutdent"></system-button-icon>
                </button>
            </li>
        </ul>
        <ul class="slds-button-group-list">
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_LEFT_ALIGN')" (click)="alignment('left')" [ngClass]="{'slds-active': commandIsActive('justifyLeft')}" >
                    <system-button-icon icon="left_align_text"></system-button-icon>
                </button>
            </li>
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_CENTER_ALIGN')" (click)="alignment('center')" [ngClass]="{'slds-active': commandIsActive('justifyCenter')}" >
                    <system-button-icon icon="center_align_text"></system-button-icon>
                </button>
            </li>
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_RIGHT_ALIGN')" (click)="alignment('right')" [ngClass]="{'slds-active': commandIsActive('justifyRight')}" >
                    <system-button-icon icon="right_align_text"></system-button-icon>
                </button>
            </li>
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_ALIGN_TEXT')" (click)="alignment('justify')" [ngClass]="{'slds-active': commandIsActive('justifyFull')}" >
                    <system-button-icon icon="justify_text"></system-button-icon>
                </button>
            </li>
        </ul>
        <ul class="slds-button-group-list">
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_LINK')" (click)="insertLink()" >
                    <system-button-icon icon="link"></system-button-icon>
                </button>
            </li>
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_REMOVE_LINK')" (click)="executeCommand('unlink')" >
                    <system-button-icon icon="remove_link"></system-button-icon>
                </button>
            </li>
        </ul>
        <ul *ngIf="extendedmode"  class="slds-button-group-list">
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_NEW_IMAGE')" (click)="insertImage()">
                    <system-button-icon icon="image"></system-button-icon>
                </button>
            </li>
            <li *ngIf="useMedialFile">
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_NEW_IMAGE')" (click)="openMediaFilePicker()">
                    <system-button-icon icon="ad_set"></system-button-icon>
                </button>
            </li>
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_ADD_VIDEO')" (click)="addVideo()">
                    <system-button-icon icon="video"></system-button-icon>
                </button>
            </li>
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_ADD_CODE_SNIPPET')" (click)="addCodeSnippet()">
                    <system-button-icon icon="snippet"></system-button-icon>
                </button>
            </li>
        </ul>
        <ul class="slds-button-group-list">
            <li *ngIf="useTemplateVariableHelper">
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_TEMPLATE_VARIABLE_HELPER')" (click)="openTemplateVariableHelper()">
                    <system-button-icon icon="variable"></system-button-icon>
                </button>
            </li>
        </ul>
        <ul class="slds-button-group-list">
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_REMOVE_FORMATTING')" (click)="executeCommand('removeFormat')" >
                    <system-button-icon icon="remove_formatting"></system-button-icon>
                </button>
            </li>
        </ul>
        <ul *ngIf="extendedmode"  class="slds-button-group-list">
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_SOURCE_EDITOR')" (click)="openSourceEditor()">
                    <system-button-icon icon="insert_tag_field"></system-button-icon>
                </button>
            </li>
            <li>
                <button class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" [title]="language.getLabel('LBL_EXPAND')" (click)="toggleFullscreen()">
                    <system-button-icon [icon]="expandIcon"></system-button-icon>
                </button>
            </li>
        </ul>
        <ul  class="slds-button-group-list slds-grid slds-grid--align-end slds-grow">
            <ng-content></ng-content>
        </ul>
    </div>
    <div class="slds-grid slds-grow" style="min-height: 0">
        <div class="slds-text-color_weak slds-grow slds-height_full spice-richtext-editor slds-rich-text-editor__textarea">
            <system-richtext-editor-content>
                <link *ngIf="cssContent" rel="stylesheet" type="text/css" [href]="cssContent">
                <div #ckEditor></div>
            </system-richtext-editor-content>
        </div>
    </div>
</div>
