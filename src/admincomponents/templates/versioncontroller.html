<article class="slds-card slds-m-around--medium">
    <div class="slds-card__header">
        <h2>Version Control</h2>
    </div>
    <div class="slds-card__body">
        <table class="slds-table slds-table_bordered slds-table_cell-buffer">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Version</th>
                    <th>Builddate</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let m of modules">
                    <ng-container *ngVar="vms.getModule(m.module) as mv">
                        <th>{{m.module}}</th>
                        <ng-container *ngIf="mv else not_loaded">
                            <td>{{mv.version}}</td>
                            <td>{{mv.build_date}}</td>
                        </ng-container>
                        <ng-template #not_loaded>
                            <td colspan="2" class="slds-text-color--weak">not loaded...</td>
                        </ng-template>
                    </ng-container>
                </tr>
            </tbody>
        </table>
    </div>
</article>
