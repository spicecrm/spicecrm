<system-modal>
    <system-modal-header (close)="close()">{{language.getLabel('LBL_ADD_MODULE')}}</system-modal-header>
    <system-modal-content>
        <div class="slds-form-element">
            <label class="slds-form-element__label">{{language.getLabel('LBL_MODULE')}}</label>
            <div class="slds-form-element__control">
                <div class="slds-select_container">
                    <select class="slds-select" [(ngModel)]="module">
                        <option *ngFor="let newmodule of modules" [value]="newmodule">{{newmodule}} ({{language.getModuleName(newmodule)}})</option>
                    </select>
                </div>
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()">{{language.getLabel('LBL_CANCEL')}}</button>
        <button class="slds-button slds-button--brand" (click)="add()">{{language.getLabel('LBL_ADD')}}</button>
    </system-modal-footer>
</system-modal>
