<div class="slds-page-header">
    <div class="slds-media">
        <div class="slds-media__figure">
      <span class="slds-icon_container slds-icon-action-recall">
        <svg class="slds-icon slds-page-header__icon" aria-hidden="true">
          <use xmlns:xlink="http://www.w3.org/1999/xlink"
               xlink:href="./sldassets/icons/action-sprite/svg/symbols.svg#recall"/>
        </svg>
      </span>
        </div>
        <div class="slds-media__body">
            <h1 class="slds-page-header__title slds-truncate slds-align-middle">Record Recovery</h1>
            <div class="slds-text-body_small slds-line-height_reset slds-p-vertical--xx-small" (click)="reload()">
                {{loadDate}}
            </div>
        </div>
    </div>
</div>
<div>
    <div>
        <table class="slds-table slds-table_bordered slds-table_cell-buffer">
            <thead>
            <tr class="slds-text-title_caps">
                <th scope="col" colspan="2">
                    <div class="slds-truncate" title="Opportunity Name">Object</div>
                </th>
                <th scope="col">
                    <div class="slds-truncate" title="Account Name">Name</div>
                </th>
                <th scope="col">
                    <div class="slds-truncate" title="Close Date">deleted date</div>
                </th>
                <th scope="col">
                    <div class="slds-truncate" title="Stage">deleted by</div>
                </th>
                <th scope="col" style="width: 3.25rem;">
                    <div class="slds-th__action">
                        <span class="slds-assistive-text">Actions</span>
                    </div>
                </th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let record of records">
                <td role="gridcell" class="slds-cell-shrink">
                    <system-icon [module]="getModule(record.recordmodule)" size="small"></system-icon>
                </td>
                <td scope="row">
                    <div class="slds-truncate">{{record.recordmodule}}</div>
                </td>
                <td>
                    <div class="slds-truncate">{{record.recordname}}</div>
                </td>
                <td>
                    <div class="slds-truncate">{{getUserDate(record.date_deleted)}}</div>
                </td>
                <td>
                    <div class="slds-truncate">{{record.user_name}}</div>
                </td>
                <td role="gridcell">
                    <button class="slds-button slds-button_icon slds-button_icon-border-filled slds-button_icon-x-small"
                            (click)="recoverRecord(record)">
                        <system-button-icon [icon]="'undelete'"></system-button-icon>
                    </button>
                </td>
            </tr>
            </tbody>
            <tbody system-table-stencils [columns]="5" [select]="false" [tools]="true" [rows]="5" *ngIf="loading"></tbody>
        </table>
        <div *ngIf="!loading && records.length == 0" class="slds-p-around--medium slds-align--absolute-center">
            <h2 class="slds-text-heading--small">no records found</h2>
        </div>
    </div>
</div>
