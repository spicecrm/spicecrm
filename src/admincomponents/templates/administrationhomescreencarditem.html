<article class="slds-tile slds-media slds-card__tile slds-hint-parent">
    <div class="slds-media__figure">
        <system-icon [icon]="icon" size="large">
        </system-icon>
    </div>
    <div class="slds-media__body">
        <div class="slds-grid slds-grid_align-spread">
            <h3 class="slds-tile__title slds-text-heading_small">
                <a  (click)="openContent()" href="javascript:void(0);" class="slds-text-link_reset">{{language.getLabel(adminNavigationItem.admin_label)}}</a>
                <p class="slds-text-body_small ">{{language.getLabel(adminNavigationItem.admin_label, '', 'long')}}</p>
            </h3>
        </div>
    </div>
</article>
