<ul class="slds-grid slds-wrap slds-grid_pull-padded">
<li  *ngFor="let item of administration.getNavigationItems(adminNavigationBlock)"
    class="slds-p-horizontal_small slds-size_1-of-1 slds-medium-size_1-of-3">
    <article class="slds-tile slds-media slds-media_center slds-card__tile slds-hint-parent"
             (click)="openContent(adminNavigationBlock, item)">
        <div *ngIf="item.groupicon" class="slds-media__figure">
            <system-icon sprite ="{{item.groupicon.includes('custom') ? 'custom' : 'standard'}}" icon ="{{item.groupicon}}" size="large" >
            </system-icon>
        </div>
        <div class="slds-media__body">
            <div class="slds-grid slds-grid_align-spread">
                <h3 class="slds-tile__title slds-text-heading_small">
                   <a>{{item.adminaction}}</a>
                </h3>
            </div>
        </div>
    </article>
</li>
</ul>
