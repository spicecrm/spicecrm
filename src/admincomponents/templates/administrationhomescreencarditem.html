<ul class="slds-grid slds-wrap slds-grid_pull-padded">
<li  *ngFor="let item of administration.getNavigationItems(adminNavigationBlock)"
    class="slds-p-horizontal_small slds-size_1-of-1 slds-medium-size_1-of-3">
    <article class="slds-tile slds-media slds-card__tile slds-hint-parent"
             >
        <div *ngIf="item.groupicon" class="slds-media__figure">
            <system-icon icon ="{{item.groupicon}}" size="large" >
            </system-icon>
        </div>
        <div class="slds-media__body">
            <div class="slds-grid slds-grid_align-spread">
                <h3 class="slds-tile__title slds-text-heading_small">
                   <a (click)="openContent(adminNavigationBlock, item)" href="javascript:void(0);" class="slds-text-link_reset">{{language.getLabel(item.admin_label)}}</a>
                    <p class="slds-text-body_small slds-p-top_small" >{{language.getLabel(item.admin_label, '','long')}}</p>
                </h3>
            </div>
        </div>
    </article>
</li>
</ul>
