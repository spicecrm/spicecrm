<system-modal [size]="'large'">
    <system-modal-header (close)="onModalEscX()"><system-label label="LBL_IP_CLIENT_DEFINITION"></system-label></system-modal-header>
    <system-modal-content margin="none" class="slds-p-around--large slds-p-top--none">
        <administration-configurator [componentconfig]="adminComponentConfig" (closable$)="closable=$event" (dataChanged$)="dataChanged()"></administration-configurator>
    </system-modal-content>
    <system-modal-footer>
        <button [disabled]="!closable" class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CLOSE"></system-label></button>
    </system-modal-footer>
</system-modal>
