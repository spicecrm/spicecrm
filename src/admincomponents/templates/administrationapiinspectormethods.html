<div *ngFor="let apimethod of apiinspector.apiMethods" class="slds-m-around--x-small slds-box" >
    <div class="slds-grid slds-grid--vertical-align-center slds-p-bottom--small slds-border--bottom">
        <div class="slds-badge slds-m-right--x-small" [ngStyle]="getMethodStyle(apimethod.method)">
            <div class="slds-size--1-of-1 slds-text-align--center">{{apimethod.method}}</div>
        </div>
        <div class="slds-truncate slds-text-heading--small slds-grow">{{apimethod.route}}</div>
        <system-utility-icon class="slds-p-left--xx-small" *ngIf="apimethod.options.noAuth" icon="unlock" size="x-small" colorclass="slds-icon-text-success"></system-utility-icon>
        <system-utility-icon class="slds-p-left--xx-small" *ngIf="apimethod.options.adminOnly" icon="user_role" size="x-small" colorclass="slds-icon-text-warning"></system-utility-icon>
    </div>
    <div class="slds-p-vertical--small slds-text-heading--small"><system-label label="LBL_SUMMARY"></system-label></div>
    <div>{{apimethod.description}}</div>
    <administration-api-inspector-method-parameters [apimethod]="apimethod" in="path"></administration-api-inspector-method-parameters>
    <administration-api-inspector-method-parameters [apimethod]="apimethod" in="query"></administration-api-inspector-method-parameters>
