<div class="slds-grid slds-grid--align-spread slds-p-around--medium">
    <h2 class="slds-text-heading--medium ">Repair Dictionary</h2>
</div>
<div *ngIf="!loading" class="slds-p-around--small slds-theme--default">
    <div *ngIf="repairsql !=''">
        <div class="slds-form-element">
            <label class="slds-form-element__label">SQL</label>
            <div class="slds-form-element__control">
            <textarea  class="slds-textarea" style="min-height: 400px;" [(ngModel)]="repairsql"></textarea>
            </div>
        </div>
        <div class="slds-text-align_right slds-p-vertical--x-small">
            <button class="slds-button slds-button--brand" (click)="doRepair()">Execute
            </button>
        </div>
        <div>
            <div class="slds-form-element">
                <label class="slds-form-element__label">Last Error</label>
                <div class="slds-form-element__control">
                <textarea disabled class="slds-textarea" style="min-height: 400px;" [(ngModel)]="lastDBError"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div  *ngIf="repairsql ==''" class="slds-box slds-p-around--medium slds-align--absolute-center">
        no changes required
    </div>
</div>
<div *ngIf="loading" class="slds-p-around--medium">
    <system-spinner></system-spinner>
</div>
