<div class="slds-grid slds-grid--align-spread slds-p-around--medium">
    <h2 class="slds-text-heading--medium "><system-label label="LBL_REPAIR_DICTIONARY"></system-label></h2>
</div>
<div *ngIf="!loading" class="slds-p-around--small ">
    <div class="slds-text-align_center slds-p-vertical--x-small">
        <button class="slds-button slds-button--brand" (click)="doRepair()"><system-label label="LBL_EXECUTE"></system-label>
        </button>
    </div>
    <div *ngIf="sqlresult !=''">
        <div class="slds-form-element">
            <system-label label="LBL_EXECUTED_SQL"></system-label>
            <div class="slds-form-element__control">
                <textarea class="slds-textarea" style="min-height: 400px;" [ngModel]="sqlresult"></textarea>
            </div>
        </div>
    </div>

    <div *ngIf="dbErrors.length > 0" class="slds-form-element">
        <system-label label="LBL_LAST_DB_ERROR"></system-label>
        <div class="slds-form-element__control">
            <textarea *ngFor="let error of dbErrors" disabled class="slds-textarea" style="min-height: 400px;"
                      [value]="error"></textarea>
        </div>
    </div>

</div>
<div *ngIf="loading" class="slds-p-around--medium">
    <system-spinner></system-spinner>
</div>
