<div class="slds-grid slds-gutters" *ngFor="let item of adminHomeMenu[0]">
    <div class="slds-col slds-p-horizontal_medium">
    <article class="slds-card">
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <system-icon icon="{{item.icon}}" class="slds-icon slds-icon_small" aria-hidden="true">
                    </system-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-card__header-title">
                        <a href="javascript:void(0);" class="slds-card__header-link slds-truncate">
                            <span>{{language.getLabel(item.label)}}</span>
                        </a>
                    </h2>
                </div>
            </header>
        </div>
        <div class="slds-card__body slds-card__body_inner">
            <ul class="slds-grid slds-wrap slds-grid_pull-padded">
                <li class="slds-p-horizontal_small slds-size_1-of-1 slds-medium-size_1-of-3">
                    <article class="slds-tile slds-media slds-card__tile slds-hint-parent">
                        <div class="slds-media__figure">
            <span class="slds-icon_container slds-icon-standard-contact" title="Description of icon when needed">
              <svg class="slds-icon slds-icon_small" aria-hidden="true">
                <use xlink:href="/assets/icons/standard-sprite/svg/symbols.svg#contact"></use>
              </svg>
              <span class="slds-assistive-text">Contact</span>
            </span>
                        </div>
                        <div class="slds-media__body">
                            <div class="slds-grid slds-grid_align-spread slds-has-flexi-truncate">
                                <h3 class="slds-tile__title slds-truncate" title="Related Record Title 1">
                                    <a href="javascript:void(0);">Related Record Title 1</a>
                                </h3>
                            </div>
                            <div class="slds-tile__detail">
                                <dl class="slds-list_horizontal slds-wrap">
                                    <dt class="slds-item_label slds-text-color_weak slds-truncate" title="First Label">
                                        First
                                        Label:
                                    </dt>
                                    <dd class="slds-item_detail slds-truncate" title="Description for first label">
                                        Description for first label
                                    </dd>
                                </dl>
                            </div>
                        </div>
                    </article>
                </li>
            </ul>
        </div>
    </article>
    </div>
</div>
