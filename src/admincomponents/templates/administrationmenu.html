<div class="slds-grid slds-grid--vertical slds-navigation-list--vertical slds-navigation-list--vertical-inverse slds-border--right">
    <div class="slds-p-horizontal--xx-small slds-p-vertical--small slds-border--bottom slds-grid slds-grid--vertical-align-center">
        <div class="slds-p-right--small">
            <button class="slds-button slds-button_icon"  (click)="administration.navigateHome()" tabindex="-1">
                <system-button-icon icon="home"></system-button-icon>
            </button>
        </div>
        <div class="slds-grow slds-form-element__control slds-input-has-icon slds-input-has-icon_right slds-input-has-icon_group-right slds-m-vertical--xx-small">
            <input type="text" class="slds-input" [placeholder]="language.getLabel('LBL_SEARCH')" [(ngModel)]="itemfilter" />
            <system-utility-icon *ngIf="itemfilter == ''" [icon]="'search'" [addclasses]="'slds-input__icon slds-input__icon--left'"></system-utility-icon>
            <div *ngIf="itemfilter != ''" class="slds-input__icon-group slds-input__icon-group_right" style="margin-top: initial;">
                <button class="slds-input__icon slds-input__icon_right slds-button slds-button_icon"  (click)="itemfilter = ''" tabindex="-1">
                    <system-button-icon [icon]="'clear'"></system-button-icon>
                </button>
            </div>
        </div>
    </div>
    <div tobottom>
        <ng-container  *ngFor="let adminNavigationBlock of getNavigationBlocks()" >
            <h2 class="slds-text-title--caps slds-p-around--medium">{{language.getLabel(adminNavigationBlock)}}</h2>
            <ul>
                <li *ngFor="let item of getNavigationItems(adminNavigationBlock)">
                    <a href="javascript:void(0);" class="slds-navigation-list--vertical__action slds-text-link--reset" (click)="openContent(adminNavigationBlock, item)" [ngClass]="{'slds-theme_inverse': item.id == administration.opened_itemid}">
                        {{language.getLabel(item.admin_label)}}
                    </a>
                </li>
            </ul>
        </ng-container>
    </div>
</div>
