<system-section [titlelabel]="language.getLabel('LBL_JOB')">
    <div *ngIf="!view.isEditMode()">
        <system-stencil *ngIf="model.isLoading"></system-stencil>
        <div *ngIf="!model.isLoading" class="slds-grid slds-grid--align-spread slds-grid--vertical-align-center slds-p-around--small" style="min-height: 20px;">
            <div class="slds-truncate" style="width:100%">
                {{model.data['job']}}
            </div>
            <button style="float: right" class="slds-button slds-button--icon slds-m-left--xx-small" (click)="view.setEditMode()">
                <system-button-icon [icon]="'edit'"></system-button-icon>
            </button>
        </div>
    </div>
    <div *ngIf="view.isEditMode()" class="slds-form-element slds-p-around--small">
        <div class="slds-form-element__control slds-col">
            <div class="slds-select_container">
                <select id="moduleselect" class="slds-select" [(ngModel)]="model.data['job']">
                    <option value="">{{language.getLabel('LBL_SELECT')}}</option>
                    <option *ngFor="let job of jobsList; trackBy: trackByFn" [value]="job">{{job}}</option>
                </select>
            </div>
        </div>
    </div>
</system-section>
