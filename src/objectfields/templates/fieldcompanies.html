<field-label *ngIf="displayLabel" [fieldname]="fieldname" [fieldconfig]="fieldconfig"></field-label>
<field-generic-display *ngIf="!isEditMode()" [fielddisplayclass]="fielddisplayclass" [fieldconfig]="fieldconfig" [editable]="isEditable()">
    <div system-model-popover module="CompanyCodes" [id]="model.getField(this.relateIdField)">{{value}}</div>
</field-generic-display>
<div *ngIf="isEditable() && isEditMode()" class="slds-p-vertical--xx-small" [ngClass]="getFieldClass()">
    <system-input-companycodes [ngModel]="model.getField(this.relateIdField)" (ngModelChange)="onIdChange($event)"></system-input-companycodes>
    <field-messages [fieldname]="fieldname"></field-messages>
</div>
