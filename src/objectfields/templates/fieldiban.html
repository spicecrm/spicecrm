<field-label *ngIf="displayLabel" [fieldname]="fieldname" [fieldconfig]="fieldconfig"></field-label>
<field-generic-display *ngIf="!isEditMode()" [fielddisplayclass]="fielddisplayclass" [editable]="isEditable()" [fieldconfig]="fieldconfig" [title]="value" [fieldid]="fieldid">
    <div class="slds-grid slds-grid--vertical-align-center">
        <div class="slds-truncate"><span *ngIf="value">{{value}}</span></div>
    </div>
</field-generic-display>
<div *ngIf="isEditable() && isEditMode()" class="slds-form-element__control" [ngClass]="{'slds-has-error': !isValid}">
    <input class="slds-input" [(ngModel)]="value" (input)="addSpacesAndSetVariables()" (blur)="checkInputLength()" [maxlength]="max()"/>
    <div *ngIf="!isValid" class="slds-form-element__help">
        <system-label label="LBL_INPUT_INVALID"></system-label>
    </div>
</div>
