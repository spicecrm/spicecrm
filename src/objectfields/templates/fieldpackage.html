<system-select *ngIf="packages.length > 0" [(ngModel)]="package" (ngModelChange)="selectPackage($event)">
    @for (option of packages; track option.enumvalue) {
        <system-select-option [value]="option.enumvalue" [display]="option.enumvalue"/>
    }
</system-select>
<system-input-text *ngIf="packages.length == 0"/>
