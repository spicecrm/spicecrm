<div *ngIf="!isEditMode()">
    <field-label fieldname="field" [fieldconfig]="fieldconfig"></field-label>
    <field-generic-display  [fielddisplayclass]="fielddisplayclass" [fieldconfig]="fieldconfig" [editable]="isEditable()">
        {{value}}
    </field-generic-display>
</div>
<div *ngIf="isEditable() && isEditMode()" class="slds-form-element__control" [ngClass]="getFieldClass()">
    <fieldset>
        <legend class="slds-form-element__label slds-text-title--caps slds-p-bottom--x-small">{{getAddressLabel()}}</legend>
        <div class="slds-form-element__group">
                <system-googleplaces-search (address)="addressSelected($event)"></system-googleplaces-search>
                <div class="slds-form-element slds-size--1-of-1">
                    <label class="slds-form-element__label">{{language.getLabel('LBL_ATTN')}}</label>
                    <div class="slds-form-element__control">
                        <input type="text" class="slds-input" [(ngModel)]="attn"/>
                    </div>
                </div>
                <div class="slds-form-element slds-size--1-of-1">
                    <label class="slds-form-element__label">{{language.getLabel('LBL_STREET')}}</label>
                    <div class="slds-form-element__control">
                        <input type="text" class="slds-input" [(ngModel)]="street"/>
                    </div>
                </div>
            <div class="slds-grid">
                <div class="slds-form-element slds-size--1-of-2 slds-p-right--xx-small">
                    <label class="slds-form-element__label">{{language.getLabel('LBL_POSTALCODE')}}</label>
                    <div class="slds-form-element__control">
                        <input type="text" class="slds-input" [(ngModel)]="postalcode"/>
                    </div>
                </div>
                <div class="slds-form-element slds-size--1-of-2 slds-p-left--xx-small">
                    <label class="slds-form-element__label">{{language.getLabel('LBL_CITY')}}</label>
                    <div class="slds-form-element__control">
                        <input type="text" class="slds-input" [(ngModel)]="city"/>
                    </div>
                </div>
            </div>
            <div class="slds-grid">
                <div class="slds-form-element slds-size--1-of-2 slds-p-right--xx-small">
                    <label class="slds-form-element__label">{{language.getLabel('LBL_STATE')}}</label>
                    <div class="slds-form-element__control">
                        <input type="text" class="slds-input" [(ngModel)]="state"/>
                    </div>
                </div>
                <div class="slds-form-element slds-size--1-of-2 slds-p-left--xx-small">
                    <label class="slds-form-element__label">{{language.getLabel('LBL_COUNTRY')}}</label>
                    <div class="slds-form-element__control">
                        <input type="text" class="slds-input" [(ngModel)]="country"/>
                    </div>
                </div>
            </div>
        </div>
    </fieldset>
    <field-messages [fieldname]="fieldname"></field-messages>
</div>
