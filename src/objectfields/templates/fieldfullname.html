<field-generic-display *ngIf="!isEditMode()" [fielddisplayclass]="fielddisplayclass" [editable]="isEditable()" [fieldconfig]="fieldconfig" [title]="value">
    {{value}}
</field-generic-display>
<div *ngIf="isEditable() && isEditMode()">
    <div class="slds-grid slds-grid_vertical-align-center slds-wrap">
        <div class="slds-col slds-form-element__control slds-align-top" [ngClass]="getClassesForSubField(fieldsalutation)">
            <field-label [fieldname]="fieldsalutation"></field-label>
            <div class="slds-select_container">
                <select class="slds-select" [(ngModel)]="model.data[fieldsalutation]">
                    <option *ngFor="let o of getSalutations()" [value]="o.value">{{o.display}}</option>
                </select>
            </div>
            <field-messages [fieldname]="fieldsalutation"></field-messages>
        </div>
        <div class="slds-col slds-form-element__control slds-p-left--xx-small slds-align-top" [ngClass]="getClassesForSubField(fielddegree)">
            <field-label [fieldname]="fielddegree"></field-label>
            <input class="slds-input" type="text" [(ngModel)]="model.data[fielddegree]"/>
            <field-messages [fieldname]="fielddegree"></field-messages>
        </div>
        <div class="slds-col slds-form-element__control slds-align-top" [ngClass]="getClassesForSubField(fieldfirstname)">
            <field-label [fieldname]="fieldfirstname"></field-label>
            <input class="slds-input" type="text" [(ngModel)]="model.data[fieldfirstname]"/>
            <field-messages [fieldname]="fieldfirstname"></field-messages>
        </div>
        <div class="slds-col slds-form-element__control slds-p-left--xx-small slds-align-top" [ngClass]="getClassesForSubField(fieldlastname)">
            <field-label [fieldname]="fieldlastname"></field-label>
            <input class="slds-input" type="text" [(ngModel)]="model.data[fieldlastname]"/>
            <field-messages [fieldname]="fieldlastname"></field-messages>
        </div>
        <div class="slds-col slds-form-element__control slds-p-left--xx-small slds-align-top" [ngClass]="getClassesForSubField(fieldlasttitle)">
            <field-label [fieldname]="fieldlasttitle"></field-label>
            <input class="slds-input" type="text" [(ngModel)]="model.data[fieldlasttitle]"/>
            <field-messages [fieldname]="fieldlasttitle"></field-messages>
        </div>
    </div>
</div>
