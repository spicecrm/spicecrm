<field-generic-display *ngIf="!isEditMode()" [fielddisplayclass]="fielddisplayclass" [fieldconfig]="fieldconfig" [editable]="isEditable()" [title]="email">
    <div class="slds-grid slds-grid--vertical-align-center">
        <div class="slds-truncate">{{email}}</div>
        <system-icon class="slds-text-link_reset slds-p-left--x-small" *ngIf="email" [icon]="'email'" [sprite]="'action'" [size]="'x-small'" (click)="sendEmail()"></system-icon>
    </div>
</field-generic-display>
<div *ngIf="isEditable() && isEditMode()" class="slds-form-element__control" [ngClass]="getFieldClass()">
    <input class="slds-input" type="text" [(ngModel)]="value" (blur)="changed()"/>
    <field-messages [fieldname]="fieldname"></field-messages>
</div>
