<field-generic-display *ngIf="!isEditMode()" [fieldconfig]="fieldconfig" [editable]="isEditable()" [title]="value">
    <div class="slds-grid slds-grid--vertical-align-center">
        <div class="slds-truncate">{{value}}</div>
        <system-icon *ngIf="value" icon="email" sprite="action" size="x-small" class="slds-text-link_reset slds-p-left--x-small" (click)="sendEmail()"></system-icon>
    </div>
</field-generic-display>
<div *ngIf="isEditable() && isEditMode()" class="slds-form-element__control" [ngClass]="fieldClass">
    <input class="slds-input" type="text" [(ngModel)]="value" [ngModelOptions]="modelOptions">
    <field-messages [fieldname]="fieldname"></field-messages>
</div>
