<div *ngIf="!isEditMode() && getDisplay()" [ngClass]="fielddisplayclass">
    <system-stencil *ngIf="model.isLoading; else displaycontent"></system-stencil>
    <ng-template #displaycontent>
        <span>{{getValue()}}</span>
        <button *ngIf="isEditable()" style="float: right" class="slds-button slds-button--icon" (click)="setEditMode()">
            <system-button-icon [icon]="'edit'"></system-button-icon>
        </button>
    </ng-template>
</div>
<div *ngIf="isEditMode() && isEditable() && getEditDisplay()" class="slds-form-element">
    <div class="slds-form-element__control" [ngClass]="getFieldClass()">
        <div class="slds-select_container slds-m-vertical--xx-small">
            <select class="slds-select " [(ngModel)]="model.data[fieldname]">
                <ng-container *ngFor="let o of getOptions()">
                    <option [value]="o.value" >{{o.display}}</option>
                </ng-container>
            </select>
        </div>
        <field-messages [fieldname]="fieldname"></field-messages>
    </div>
</div>
