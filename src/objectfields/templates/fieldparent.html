<field-generic-display *ngIf="!isEditMode()" [fielddisplayclass]="fielddisplayclass" [editable]="isEditable()" [fieldconfig]="fieldconfig">
    <a href="javascript:void(0);"  modelPopOver [module]="this.model.data[this.parentTypeField]" [id]="this.model.data[parentIdField]">{{value}}</a>
</field-generic-display>
<div *ngIf="isEditable() && isEditMode()" class="slds-form-element__control" [ngClass]="getFieldClass()">
    <div class="slds-form-element slds-lookup">
        <div *ngIf="model.data[parentIdField]" class="slds-form-element__control slds-p-around--xx-small">
            <div class="slds-pill_container">
                  <span class="slds-pill slds-size--1-of-1">
                    <span class="slds-icon_container slds-icon-standard-account slds-pill__icon_container">
                      <system-icon [module]="model.data[parentTypeField]" [size]="'small'"></system-icon>
                    </span>
                    <span class="slds-pill__label">{{model.data[parentNameField]}}</span>
                    <button class="slds-button slds-button--icon slds-pill__remove" (click)="clearParent()">
                      <system-button-icon [icon]="'close'"></system-button-icon>
                    </button>
                  </span>
            </div>
        </div>
        <div *ngIf="!model.data[parentIdField]" class="slds-form-element__control slds-grid slds-box--border slds-m-vertical--xxx-small">
            <div class="slds-grid slds-m-vertical--xx-small slds-p-left--xx-small">
                <div class="slds-col">
                    <system-icon [module]="model.data[parentTypeField]" [size]="'small'"
                                 [divClass]="'slds-m-horizontal--xxx-small'"></system-icon>
                </div>
                <div class="slds-col">
                    <button class="slds-button slds-button--icon slds-button--icon-small" aria-haspopup="true"
                            (click)="toggleParentTypeSelect()">
                        <system-button-icon [icon]="'down'" [size]="'small'"></system-button-icon>
                    </button>
                </div>
            </div>
            <div class="slds-input-has-icon slds-input-has-icon--right slds-grow">
                <system-utility-icon [icon]="'search'" [addclasses]="'slds-input__icon'"></system-utility-icon>
                <input type="search" class="slds-lookup__search-input slds-input--bare" [(ngModel)]="parentSearchTerm"
                       (focus)="onFocus()"
                       [placeholder]="'Search ' + language.getModuleName(model.data[parentTypeField])" role="combobox"/>
            </div>
        </div>
    </div>
    <div *ngIf="parentTypeSelectOpen" class="slds-dropdown slds-dropdown--left">
        <ul class="slds-dropdown__list" role="menu">
            <li *ngFor="let parentType of parentTypes" class="slds-dropdown__item" role="presentation">
                <button class="slds-button slds-lookup__item-action slds-lookup__item-action--label"
                        (click)="setParentType(parentType)">
                    <system-icon [module]="parentType" [size]="'small'"></system-icon>
                    {{language.getModuleName(parentType)}}
                </button>
            </li>
        </ul>
    </div>
    <div *ngIf="parentSearchOpen" class="slds-lookup__menu" [ngStyle]="parentSearchStyle()">
        <field-lookup-recent *ngIf="parentSearchTerm === ''" [module]="model.data[parentTypeField]" (selectedObject)="setParent($event)"></field-lookup-recent>
        <field-lookup-search *ngIf="parentSearchTerm !== ''" [module]="model.data[parentTypeField]" (selectedObject)="setParent($event)" [fieldid]="fieldid" [(searchterm)]="parentSearchTerm"></field-lookup-search>
    </div>
    <field-messages [fieldname]="fieldname"></field-messages>
</div>
