<field-generic-display *ngIf="!isEditMode()" [fielddisplayclass]="fielddisplayclass" [fieldconfig]="fieldconfig" [editable]="isEditable()">
    <div class="slds-grid slds-grid--vertical-align-center">
        <div class="slds-truncate">{{email}}</div>
        <system-icon class="slds-text-link_reset slds-p-left--x-small" *ngIf="email" [icon]="'email'" [sprite]="'action'" [size]="'x-small'" (click)="sendEmail()"></system-icon>
    </div>
</field-generic-display>
<div *ngIf="isEditable() && isEditMode()" class="slds-form-element__control slds-grid slds-grid--align-spread"
     [ngClass]="getFieldClass()">
    <div class="slds-size--1-of-1">
        <field-email-emailaddress class="slds-size--1-of-1" *ngFor="let emailaddress of model.data.emailaddresses" [emailaddress]="emailaddress" (primaryaddress)="setprimary(emailaddress.id)"></field-email-emailaddress>
    </div>
</div>
