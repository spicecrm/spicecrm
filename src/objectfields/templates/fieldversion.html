<system-select *ngIf="versions.length > 0" [(ngModel)]="version" (ngModelChange)="selectVersion($event)">
    @for (option of versions; track option.enumvalue) {
        <system-select-option [value]="option.enumvalue" [display]="option.enumvalue"/>
    }
</system-select>
<system-input-text *ngIf="versions.length == 0"/>
