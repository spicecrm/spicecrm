<div class="slds-grid slds-grid--vertical-align-center slds-grid--align-spread">
    <div class="slds-grid slds-grow slds-grid--vertical-align-center">
        @if (displayLabel) {
            <field-label [fieldname]="fieldname" [fieldconfig]="fieldconfig" class="slds-truncate"></field-label>

            @if (isEditMode()) {
                @if (isTranslatable) {
                    <button (click)="fieldTranslatableText.openTranslationsModal(true, 'richtext')" class="slds-button slds-button--icon">
                        <system-button-icon icon="translate" size="xx-small"/>
                    </button>
                }
            } @else if ( isTranslatable && fieldTranslatableText.getTranslatedValue()) {
                <div class="slds-button slds-button--brand slds-p-around--none" style="width: 18px; height: 18px; font-size: 10px;">
                    {{language.currentFieldTranslationLanguage().slice(0, 2).toUpperCase()}}
                </div>
            }
        }
    </div>
    <button *ngIf="!isEditMode() && isEditable()"
            class="slds-button slds-button--icon slds-m-left--xx-small spice-hover-button" (click)="setEditMode()">
        <system-button-icon [icon]="'edit'"></system-button-icon>
    </button>
</div>
<field-generic-display *ngIf="!isEditMode()" [fielddisplayclass]="fielddisplayclass" [editable]="false"
                       [fieldconfig]="fieldconfig">
    <div *ngIf="!truncated; else truncateddisplay">
        <div *ngIf="!fieldconfig.asiframe" class="slds-size--1-of-1 slds-rich-text-editor__output"
             [innerHTML]="parsedHtml"
             style="white-space: normal; resize: vertical; overflow-y: auto;" (click)="$event.preventDefault()"></div>
        <iframe *ngIf="fieldconfig.asiframe" [src]="sanitizedValue" style="resize: vertical;" [ngStyle]="heightStyle"
                width="100%" frameborder="0" seamless="true" sandbox></iframe>
    </div>
    <ng-template #truncateddisplay>
        <div [title]="value" style="max-width: 200px; text-overflow: ellipsis" class="slds-truncate"
             [innerHTML]="parsedHtml"></div>
    </ng-template>
</field-generic-display>
<div *ngIf="isEditable() && isEditMode()" class="slds-form-element__control" [ngClass]="getFieldClass()">
    <system-html-editor [(ngModel)]="value" (save$)="save($event)" [extendedmode]="!fieldconfig.simplemode"
                        [innerheight]="fieldconfig.innerheight"
                        [useMedialFile]="metadata.checkModuleAcl('MediaFiles', 'list') && metadata.checkModuleAcl('MediaFiles', 'view')">
        <li *ngIf="fieldconfig?.useSignature">
            <div class="slds-form-element slds-grid">
                <label class="slds-form-element__label">
                    <system-label label="LBL_SIGNATURE"></system-label>
                    :
                </label>
                <div class="slds-form-element__control">
                    <div class="slds-select_container">
                        <select [(ngModel)]="selectedSignatureId" (ngModelChange)="renderSelectedSignature()"
                                [disabled]="signatures?.length == 0" class="slds-select">
                            <option value="">
                                <system-label label="LBL_NONE"></system-label>
                            </option>
                            <option *ngFor="let signature of signatures" [value]="signature.id">
                                <system-label [label]="signature.label"></system-label>
                            </option>
                        </select>
                    </div>
                </div>
            </div>
        </li>
        @if (!displayLabel && isTranslatable) {
            <li>
                <button (click)="fieldTranslatableText.openTranslationsModal(true, 'richtext')" class="slds-button slds-button_icon slds-button_icon-border-filled" tabindex="-1" aria-pressed=true system-title="LBL_TRANSLATE">
                    <system-button-icon icon="translate"></system-button-icon>
                </button>
            </li>
        }
    </system-html-editor>
    <field-messages [fieldname]="fieldname"></field-messages>
</div>
