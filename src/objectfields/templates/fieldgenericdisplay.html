<div [ngClass]="fielddisplayclass" (dblclick)="setEditMode()">
    <system-stencil *ngIf="model.isLoading; else displaycontent"></system-stencil>
    <ng-template #displaycontent>
        <div class="slds-grid slds-grid--vertical-align-center slds-grid--align-spread" style="min-height: 19px;">
            <div class="slds-truncate" style="width:100%">
                <ng-container *ngIf="link;else nolink">
                    <a href="javascript:void(0);" modelPopOver (click)="goRecord()"><ng-container *ngTemplateOutlet="content"></ng-container> </a>
                </ng-container>
                <ng-template #nolink>
                    <ng-container *ngTemplateOutlet="content"></ng-container>
                </ng-template>
            </div>
            <button *ngIf="editable" style="float: right" class="slds-button slds-button--icon slds-m-left--xx-small" (click)="setEditMode()">
                <system-button-icon [icon]="'edit'"></system-button-icon>
            </button>
        </div>
    </ng-template>
    <ng-template #content><ng-content></ng-content></ng-template>
</div>
