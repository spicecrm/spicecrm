<div [ngClass]="fielddisplayclass">
    <system-stencil *ngIf="model.isLoading; else displaycontent"></system-stencil>
    <ng-template #displaycontent>
        <div class="slds-grid slds-grid--vertical-align-center slds-grid--align-spread" style="min-height: 20px;">
            <div class="slds-truncate" (click)="goRecord()" [ngClass]="{'slds-text-link_faux': link}">
                <ng-content></ng-content>
            </div>
            <button *ngIf="editable" style="float: right" class="slds-button slds-button--icon slds-m-left--xx-small" (click)="setEditMode()">
                <system-button-icon [icon]="'edit'"></system-button-icon>
            </button>
        </div>
    </ng-template>
</div>
