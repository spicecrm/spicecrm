<ng-container *ngIf="!isEditMode()">
    <field-label *ngIf="displayLabel" [fieldname]="fieldname" [fieldconfig]="fieldconfig"></field-label>
    <field-generic-display  [fielddisplayclass]="fielddisplayclass" [editable]="isEditable()" [fieldconfig]="fieldconfig">
        <system-display-datetime [date]="startDate"></system-display-datetime>&nbsp;-&nbsp;<system-display-datetime [date]="endDate" [displayDate]="showToDate"></system-display-datetime>
    </field-generic-display>
</ng-container>
<div *ngIf="isEditable() && isEditMode()" class="slds-form-element__control slds-p-around--xx-small" [ngClass]="css_classes">
    @if(vertical) {
        <div class="slds-grid slds-grid--vertical">
            <div>
                <div class="slds-grid slds-gutters_xx-small">
                    <div class="slds-form-element slds-col slds-size--1-of-2">
                        <label class="slds-form-element__label"><abbr *ngIf="stati(fieldstart).editable && stati(fieldstart).required" class="slds-required">*</abbr><system-label label="LBL_DATE_START"></system-label></label>
                        <system-input-date system-input-date-hide-error [(ngModel)]="startDate" (valid)="setDateValid('start', $event)"></system-input-date>
                    </div>
                    <div class="slds-form-element slds-col slds-size--1-of-2 slds-m-top--none">
                        <label class="slds-form-element__label"><system-label label="LBL_TIME_START"></system-label></label>
                        <system-input-time system-input-time-hide-error [(ngModel)]="startDate" (valid)="setDateValid('start', $event)"></system-input-time>
                    </div>
                </div>
                <field-messages [fieldname]="fieldstart"></field-messages>
            </div>
            <div>
                <div class="slds-grid slds-gutters_xx-small">
                    <div class="slds-form-element slds-col slds-size--1-of-2">
                        <label class="slds-form-element__label"><abbr *ngIf="stati(fieldend).editable && stati(fieldend).required" class="slds-required">*</abbr>
                            <system-label label="LBL_DATE_END"></system-label>
                        </label>
                        <system-input-date system-input-date-hide-error [(ngModel)]="endDate" (valid)="setDateValid('end', $event)"></system-input-date>
                    </div>
                    <div class="slds-form-element slds-col slds-size--1-of-2 slds-m-top--none">
                        <label class="slds-form-element__label">
                            <system-label label="LBL_TIME_END"></system-label>
                        </label>
                        <system-input-time system-input-time-hide-error [(ngModel)]="endDate" (valid)="setDateValid('end', $event)"></system-input-time>
                    </div>
                </div>
                <field-messages [fieldname]="fieldend"></field-messages>
            </div>
        </div>
    } @else {
        <div class="slds-grid slds-wrap slds-gutters_xx-small">
            <div class="slds-col slds-size--1-of-1 slds-large-size--1-of-2">
                <div class="slds-grid slds-gutters_xx-small">
                    <div class="slds-form-element slds-col slds-size--1-of-2" >
                        <label class="slds-form-element__label"><abbr *ngIf="stati(fieldstart).editable && stati(fieldstart).required" class="slds-required">*</abbr><system-label label="LBL_DATE_START"></system-label></label>
                        <system-input-date system-input-date-hide-error [(ngModel)]="startDate" (valid)="setDateValid('start', $event)"></system-input-date>
                    </div>
                    <div class="slds-form-element slds-col slds-size--1-of-2 slds-m-top--none">
                        <label class="slds-form-element__label"><system-label label="LBL_TIME_START"></system-label></label>
                        <system-input-time system-input-time-hide-error [(ngModel)]="startDate" (valid)="setDateValid('start', $event)"></system-input-time>
                    </div>
                </div>
                <field-messages [fieldname]="fieldstart"></field-messages>
            </div>
            <div class="slds-col slds-size--1-of-1 slds-large-size--1-of-2">
                <div class="slds-grid slds-gutters_xx-small">
                    <div class="slds-form-element slds-col slds-size--1-of-2">
                        <label class="slds-form-element__label"><abbr *ngIf="stati(fieldend).editable && stati(fieldend).required" class="slds-required">*</abbr><system-label label="LBL_DATE_END"></system-label></label>
                        <system-input-date system-input-date-hide-error [(ngModel)]="endDate" (valid)="setDateValid('end', $event)"></system-input-date>
                    </div>
                    <div class="slds-form-element slds-col slds-size--1-of-2 slds-m-top--none">
                        <label class="slds-form-element__label"><system-label label="LBL_TIME_END"></system-label></label>
                        <system-input-time system-input-time-hide-error [(ngModel)]="endDate" (valid)="setDateValid('end', $event)"></system-input-time>
                    </div>
                </div>
                <field-messages [fieldname]="fieldend"></field-messages>
            </div>
        </div>
    }
    <field-messages [fieldname]="fieldname"></field-messages>
</div>
