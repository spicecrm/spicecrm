<field-generic-display *ngIf="!isEditMode()" [fielddisplayclass]="fielddisplayclass" [editable]="isEditable()" [fieldconfig]="fieldconfig">
    <div *ngIf="!displayLink()" class="slds-truncate">
        <span [ngClass]="{'slds-text-color_error' : highlightdate}">{{editDate}}</span>
    </div>
    <div *ngIf="displayLink()" class="slds-truncate">
        <a href="javascript:void(0);" (click)="goRecord()"><span
                [ngClass]="{'slds-text-color_error' : highlightdate}">{{editDate}}</span></a>
    </div>
</field-generic-display>
<div *ngIf="isEditable() && isEditMode()" [ngClass]="getFieldClass()">
    <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_right slds-input-has-icon_group-right slds-m-vertical--xx-small">
        <input class="slds-input" type="text" [(ngModel)]="editDate"/>
        <div class="slds-input__icon-group slds-input__icon-group_right">
            <button class="slds-input__icon slds-input__icon_right slds-button slds-button_icon" (click)="toggleDatePicker()">
                <system-button-icon icon="event"></system-button-icon>
            </button>
        </div>
    </div>
    <field-messages [fieldname]="fieldname"></field-messages>
</div>
<field-date-picker *ngIf="showDatePicker" [(setdate)]="pickerDate"></field-date-picker>
