<div class="slds-grid slds-grid--vertical-align-center slds-grid--align-spread">
    <field-label *ngIf="displayLabel" [fieldname]="fieldname" [fieldconfig]="fieldconfig"></field-label>
    <button *ngIf="!isEditMode() && isEditable()" class="slds-button slds-button--icon slds-m-left--xx-small spice-hover-button" (click)="setEditMode()">
 <system-button-icon [icon]="'edit'"></system-button-icon>
    </button>
    <button *ngIf="isEditMode() && isEditable()" class="slds-button slds-button--brand slds-m-left--xx-small slds-m-bottom--xx-small spice-hover-button" (click)="openPageBuilder()">
 <system-label label="LBL_PAGE_BUILDER"></system-label>
    </button>
</div>
<field-generic-display *ngIf="!isEditMode()" [fielddisplayclass]="fielddisplayclass" [editable]="false" [fieldconfig]="fieldconfig">
    <div *ngIf="!asiframe" class="slds-size--1-of-1 slds-rich-text-editor__output" [innerHTML]="htmlValue" style="white-space: normal; resize: vertical; overflow-y: auto;"></div>
    <iframe *ngIf="asiframe" [src]="sanitizedValue" style="resize: vertical;" [ngStyle]="heightStyle" width="100%" frameborder="0" seamless="true" sandbox></iframe>
</field-generic-display>
<div *ngIf="isEditable() && isEditMode()" class="slds-form-element__control" [ngClass]="getFieldClass()">
    <div [innerHTML]="parsedHtml"></div>
    <system-richtext-editor [(ngModel)]="value" (save$)="save($event)" [extendedmode]="extendedmode"></system-richtext-editor>
    <field-messages [fieldname]="fieldname"></field-messages>
</div>
