<div class="slds-timeline__item_expandable" [ngClass]="{'slds-is-open': isopen}">
    <div class="slds-media">
        <div class="slds-media__figure">
            <button class="slds-button slds-button_icon" (click)="toggleexpand()" [disabled]="cantexpand">
                <system-button-icon icon="switch" addclasses="slds-timeline__details-action-icon"></system-button-icon>
            </button>
            <system-icon [module]="model.module" size="small" divClass="slds-icon_container slds-timeline__icon"></system-icon>
        </div>
        <div class="slds-media__body">
            <div class="slds-grid slds-grid_align-spread slds-timeline__trigger">
                <div class="slds-grid slds-grid_vertical-align-center slds-truncate_container_75 slds-no-space slds-text-title_bold"  [viewprovider]="{displayLabels: false}">
                    <h3 class="slds-truncate">
                        <div *ngIf="headerFieldSet; else noheaderfieldset" class="slds-grid">
                            <field-container *ngFor="let fieldsetitem of headerFieldSetItems" [field]="fieldsetitem.field" [fieldconfig]="fieldsetitem.fieldconfig" fielddisplayclass="slds-p-right--small"></field-container>
                        </div>
                        <ng-template #noheaderfieldset>
                            <div modelPopOver>{{subject}}</div>
                        </ng-template>
                    </h3>
                </div>
                <div class="slds-timeline__actions slds-timeline__actions_inline">
                    <p class="slds-timeline__date">{{starttime}} | {{startdate}}</p>
                    <object-action-menu class="slds-show--medium" *ngIf="showtoolset" [buttonsize]="'x-small'" [actionset]="actionset"></object-action-menu>
                </div>
            </div>
            <div class="slds-m-horizontal_xx-small" [viewprovider]="{displayLabels: false}">
                <ul *ngIf="subheaderFieldSet" class="slds-list_horizontal slds-has-dividers_left">
                    <ng-container *ngFor="let subfieldsetitem of subheaderFieldSetItems">
                        <li *ngIf="model.getField(subfieldsetitem.field)" class="slds-item">
                            <field-container  [field]="subfieldsetitem.field" [fieldconfig]="subfieldsetitem.fieldconfig" fielddisplayclass=""></field-container>
                        </li>
                    </ng-container>
                </ul>
            </div>
            <article class="slds-box slds-timeline__item_details slds-theme_shade slds-m-top_x-small slds-m-horizontal_xx-small">
                <object-record-fieldset [fieldset]="formFieldSet" direction="vertical" fielddisplayclass="slds-truncate" fieldpadding="none"></object-record-fieldset>
            </article>
        </div>
    </div>
    <object-action-menu class="slds-hide--medium" *ngIf="showtoolset" [buttonsize]="'x-small'" [actionset]="actionset"></object-action-menu>
</div>
