<system-modal>
    <system-modal-header (close)="close()">{{language.getLabel('LBL_EXPORT_PROSPECTLIST')}} ({{itemcount}} {{language.getLabel('LBL_RECORDS')}})</system-modal-header>
    <system-modal-content>
        <div class="slds-form-element">
            <label class="slds-form-element__label" >
                <abbr class="slds-required" title="required">*</abbr>
                {{language.getLabel('LBL_PROSPECTLIST')}}
            </label>
            <div class="slds-form-element__control">
                <input type="text" class="slds-input" [(ngModel)]="targetlistname" />
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()">{{language.getLabel('LBL_CANCEL')}}</button>
        <button class="slds-button slds-button--brand" [disabled]="!targetlistname" (click)="export()">{{language.getLabel('LBL_EXPORT')}}</button>
    </system-modal-footer>
</system-modal>
