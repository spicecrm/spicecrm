<td *ngIf="rowselect" role="gridcell" class="slds-cell-shrink slds-show--medium">
    <label class="slds-checkbox">
        <input type="checkbox" [disabled]="rowselectdisabled" [(ngModel)]="listItem.selected"/>
        <span class="slds-checkbox--faux"></span>
    </label>
</td>
<td *ngFor="let item of listFields" scope="row" [attr.data-label]="language.getFieldDisplayName(model.module, item.field)">
    <field-container [field]="item.field" [fieldconfig]="item.fieldconfig" [fielddisplayclass]="'slds-truncate slds-p-horizontal--x-small'"></field-container>
</td>
<td *ngIf="showActionMenu" role="gridcell" class="slds-cell-shrink">
    <object-action-menu [buttonsize]="'small'"></object-action-menu>
</td>
