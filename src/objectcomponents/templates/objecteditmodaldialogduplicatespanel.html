<div class="slds-card">
    <div class="slds-card__header slds-p-around--small slds-theme--info slds-grid slds-grid_vertical-align-center slds-grid--align-spread">
        <h2 class="slds-text-heading--small">{{language.getLabel('LBL_DUPLICATES')}} ({{model.duplicates.length}})</h2>
        <button class="slds-button slds-button--icon slds-button--icon-border-filled" (click)="hidePanel()"><system-button-icon icon="close"></system-button-icon></button>
    </div>
    <div class="slds-card__body slds-card__body_inner">
        <ul class="slds-grid slds-wrap slds-grid_pull-padded">
            <!--object-edit-modal-dialog-duplicates-panel-item *ngFor="let duplicate of model.duplicates" [modelProvider]="{module:model.module, data:duplicate}"[fieldset]="fieldset"></object-edit-modal-dialog-duplicates-panel-item-->
                <object-related-duplicate-tile class="slds-size--1-of-1" *ngFor="let duplicate of model.duplicates" [modelProvider]="{module:model.module, data:duplicate}" [enableLink]="false"></object-related-duplicate-tile>
        </ul>
    </div>
</div>
