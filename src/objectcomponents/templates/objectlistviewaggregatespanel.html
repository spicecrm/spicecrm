<div class="slds-panel slds-grid slds-grid--vertical slds-nowrap slds-panel--filters">
    <div class="slds-form--stacked slds-grow slds-scrollable--y slds-grid slds-grid--vertical">
        <div class="slds-filters">
            <div class="slds-filters__header slds-grid slds-grid--align-spread slds-has-divider--bottom">
                <h4 class="slds-align-middle slds-text-heading--small">{{language.getLabel('LBL_AGGREGATES')}}</h4>
                <button [disabled]="!modellist.hasAggregates" class="slds-button slds-button--brand" (click)="clearAggregates()">{{language.getLabel('LBL_CLEARALL')}}</button>
            </div>
            <div class="slds-filters__body" tobottom>
                <div class="slds-grid_vertical">
                    <object-listview-tags-aggregate *ngIf="hasTags" [aggregate]="tagsaggregate"></object-listview-tags-aggregate>
                    <div class="slds-m-vertical--xx-small" *ngFor="let aggregate of getAggregates()">
                        <object-listview-aggregate [aggregate]="aggregate"></object-listview-aggregate>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
