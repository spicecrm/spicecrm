<div class="slds-dropdown-trigger slds-dropdown-trigger--click slds-m-horizontal--xxx-small" dropdowntrigger>
    <button class="slds-button slds-button--icon-more">
        <system-button-icon icon="settings"></system-button-icon>
        <system-button-icon icon="down" size="x-small"></system-button-icon>
    </button>
    <div class="slds-dropdown slds-dropdown--right">
        <ul class="slds-dropdown__list" role="menu">
            <li class="slds-dropdown__header" role="separator">
                <span class="slds-text-title--caps">{{language.getLabel('LBL_SETTINGS')}}</span>
            </li>
            <li class="slds-dropdown__item" role="presentation">
                <a role="menuitem" (click)="add()">
                    <span class="slds-truncate"><system-utility-icon class="slds-p-right--xx-small" icon="add" size="x-small"></system-utility-icon> {{language.getLabel('LBL_NEW')}}</span>
                </a>
            </li>
            <li class="slds-dropdown__item" role="presentation">
                <a role="menuitem" [attr.aria-disabled]="!modellist.checkAccess('edit')" (click)="edit()">
                    <span class="slds-truncate"><system-utility-icon class="slds-p-right--xx-small" icon="edit" size="x-small"></system-utility-icon> {{language.getLabel('LBL_EDIT')}}</span>
                </a>
            </li>
            <li class="slds-dropdown__item" role="presentation">
                <a role="menuitem" [attr.aria-disabled]="!modellist.checkAccess('edit')" (click)="save()">
                    <span class="slds-truncate"><system-utility-icon class="slds-p-right--xx-small" icon="save" size="x-small"></system-utility-icon> {{language.getLabel('LBL_SAVE')}}</span>
                </a>
            </li>
            <li class="slds-dropdown__item" role="presentation">
                <a  role="menuitem" [attr.aria-disabled]="!modellist.checkAccess('delete')" (click)="delete()">
                    <span class="slds-truncate"><system-utility-icon class="slds-p-right--xx-small" icon="delete" size="x-small"></system-utility-icon> {{language.getLabel('LBL_DELETE')}}</span>
                </a>
            </li>
        </ul>
    </div>
</div>
