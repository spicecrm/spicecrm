<div class="slds-filters__item slds-grid slds-grid--vertical-align-center">
    <fieldset class="slds-form--stacked">
        <div class="slds-form-element">
            <p class="slds-text-body--regular">{{language.getLabel(aggregate.name)}}</p>
        </div>
        <div class="slds-form-element" *ngFor="let bucketItem of aggregate.buckets">
            <div object-listview-aggregate-item [bucketitem]="bucketItem" [aggregate]="aggregate.aggregateindex" class="slds-form-element__control"></div>
        </div>
        <div *ngIf="aggregate.sum_other_doc_count">
            <p class="slds-text-body--small slds-text-color--weak">{{aggregate.sum_other_doc_count}} {{language.getLabel('LBL_ARE_NOT_INCLUDED')}}...</p>
        </div>
    </fieldset>
</div>
