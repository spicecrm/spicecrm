<div [ngClass]="containerclass" role="group">
    <button class="slds-button slds-button_neutral" [ngClass]="addclasses(actionitem)" *ngFor="let actionitem of mainactionitems" [disabled]="isDisabled(actionitem.id)" (click)="propagateclick(actionitem.id)">
        <object-action-container-item [actionitem]="actionitem" (actionemitter)="emitaction($event)"></object-action-container-item>
    </button>
    <div *ngIf="hasAddItems" class="slds-dropdown-trigger slds-dropdown-trigger_click slds-button_last" dropdowntrigger>
        <button class="slds-button slds-button_icon slds-button_icon-border-filled" aria-haspopup="true" [disabled]="opendisabled" [title]="language.getLabel('LBL_MORE')" >
            <system-button-icon icon="down"></system-button-icon>
            <span class="slds-assistive-text"><system-label label="LBL_MORE"></system-label></span>
        </button>
        <div class="slds-dropdown slds-dropdown_right slds-dropdown_actions">
            <ul class="slds-dropdown__list" role="menu">
                <li class="slds-dropdown__item" role="presentation" *ngFor="let actionitem of addactionitems" [ngClass]="{'slds-hide': isHidden(actionitem.id)}" (click)="propagateclick(actionitem.id)">
                    <a href="javascript:void(0);" role="menuitem" tabindex="0">
                        <object-action-container-item class="slds-truncate" [ngClass]="{'slds-disabled-text': isDisabled(actionitem.id)}" [actionitem]="actionitem" (actionemitter)="emitaction($event)"></object-action-container-item>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</div>
