<div class="slds-form--stacked">
    <div *ngFor="let field of firstFormField" class="slds-form-element">
        <div class="slds-grid slds-grid--align-spread">
            <field-label [fieldname]="field.field" [fieldconfig]="field.fieldconfig"></field-label>
            <button *ngIf="isExpanded" class="slds-button slds-button_icon slds-button_icon" (click)="expand()">
                <system-button-icon [icon]="'expand_alt'" [size]="'xx-small'"></system-button-icon>
            </button>
        </div>
        <div class="slds-form-element__control">
            <div class="slds-truncate" title="{{field}}">
                <input class="slds-input slds-m-vertical--xx-small" type="text" (focus)="onFocus()"
                       [(ngModel)]="model.data.name"/>
            </div>
        </div>
    </div>
    <ng-container *ngIf="isExpanded">
        <object-record-fieldset [fieldset]="formFieldSet" [direction]="'vertical'"></object-record-fieldset>
        <div class="slds-form-element">
            <button class="slds-button slds-button--neutral" (click)="cancel()">{{language.getLabel('LBL_CANCEL')}}
            </button>
            <button class="slds-button slds-button--brand .slds-button-space-left slds-float--right" (click)="save()">
                Save
            </button>
        </div>
    </ng-container>
</div>
