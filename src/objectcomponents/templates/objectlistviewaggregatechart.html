<div class="slds-grow">
    <system-chart-one-dimensional [chartType]="selectedChartType" [legend]="{position:'bottom', alignment: 'start'}">
        <system-chart-data-row *ngFor="let bucket of buckets" [label]="bucket.label" [value]="bucket.value"/>
    </system-chart-one-dimensional>

    <label class="slds-form-element__label slds-text-heading--label">
        <system-label label="LBL_CHART_TYPE"></system-label>
    </label>
    <div class="slds-select_container slds-m-bottom--small slds-m-horizontal--x-large">
        <select class="slds-select" [(ngModel)]="selectedChartType">
            <option *ngFor="let type of chartType" [value]="type">{{ type }}</option>
        </select>
    </div>
</div>
