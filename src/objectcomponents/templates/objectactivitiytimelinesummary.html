<div class="slds-page-header slds-grid slds-grid--align-spread">
    <div class="slds-col">
        <nav role="navigation" aria-label="Breadcrumbs">
            <ol class="slds-breadcrumb slds-list_horizontal slds-wrap">
                <li class="slds-breadcrumb__item slds-text-title_caps">
                    <a href="javascript:void(0);" (click)="goModule()">{{language.getModuleName(parent.module)}}</a>
                </li>
                <li class="slds-breadcrumb__item slds-text-title_caps">
                    <a href="javascript:void(0);" (click)="goModel()">{{parent.data.summary_text}}</a>
                </li>
                <li class="slds-breadcrumb__item slds-text-title_caps">
                    <span class="slds-p-horizontal--x-small">{{language.getModuleName( 'History' )}}</span>
                </li>
            </ol>
        </nav>
        <div class="slds-col slds-align-bottom">
            <p class="slds-text-body--small">Sub Header</p>
        </div>
    </div>
    <div class="slds-page-header__col-actions">
        <div class="slds-page-header__controls">
            <div class="slds-page-header__control">
                <object-activitiy-timeline-filter class="slds-align--absolute-center slds-button slds-button--icon slds-button--icon-border-filled"></object-activitiy-timeline-filter>
            </div>
        </div>
    </div>
</div>
<div class="slds-grid" >
    <div #listContainer tobottom class="slds-size--1-of-3 slds-border--right slds-scrollable" (scroll)="onScroll($event)">
        <!--div class="slds-border--bottom slds-p-vertical--small slds-grid">
            <object-activitiy-timeline-filter class="slds-col--bump-left slds-p-horizontal--xxx-small"></object-activitiy-timeline-filter>
        </div-->
        <ul class="slds-timeline">
            <li class="slds-p-around--x-small" *ngFor="let activity of activities" (click)="setActivitiy(activity)" [ngClass]="{'slds-theme--default' : activity.id == activityid}">
                <object-activitiytimeline-item-container [activity]="activity"></object-activitiytimeline-item-container>
            </li>
        </ul>
        <!-- stencils when loading -->
        <ul class="slds-timeline" *ngIf="activitiyTimeLineService.activities.History.loading">
            <li class="slds-p-around--x-small">
                <object-activitiytimeline-stencil></object-activitiytimeline-stencil>
            </li>
            <li style="opacity: 0.8" class="slds-p-around--x-small">
                <object-activitiytimeline-stencil></object-activitiytimeline-stencil>
            </li>
            <li style="opacity: 0.6" class="slds-p-around--x-small">
                <object-activitiytimeline-stencil></object-activitiytimeline-stencil>
            </li>
            <li style="opacity: 0.4" class="slds-p-around--x-small">
                <object-activitiytimeline-stencil></object-activitiytimeline-stencil>
            </li>
            <li style="opacity: 0.2" class="slds-p-around--x-small">
                <object-activitiytimeline-stencil></object-activitiytimeline-stencil>
            </li>
        </ul>
    </div>
    <div class="slds-size--2-of-3" tobottom>
        <object-activitiy-timeline-summary-item-view *ngIf="activitymodule" [module]="activitymodule" [id]="activityid" [data]="activitydata"></object-activitiy-timeline-summary-item-view>
    </div>
</div>
