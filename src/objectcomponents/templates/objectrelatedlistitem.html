<td *ngFor="let item of listfields" scope="row" [attr.data-label]="language.getFieldDisplayName(model.module, item.field)">
    <field-container [field]="item.field" [fieldconfig]="item.fieldconfig" [fielddisplayclass]="'slds-truncate'"></field-container>
</td>
<td role="gridcell" class="slds-cell-shrink">
    <object-action-menu [buttonsize]="'x-small'" [standardactions]="false" [addactions]="customActions" [standardeditactions]="false" [addeditactions]="customEditActions"(action)="handleAction($event)"></object-action-menu>
</td>
