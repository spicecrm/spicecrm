<div class="slds-form-element">
    <label class="slds-form-element__label">{{language.getLabel('LBL_VALUE')}}</label>
    <div class="slds-form-element__control">
        <select class="slds-select " [(ngModel)]="filter.filtervalue" [disabled]="valueDisabled()">
            <option value="1">{{language.getLabel('LBL_YES')}}</option>
            <option value="0">{{language.getLabel('LBL_NO')}}</option>
        </select>
    </div>
</div>
