<div class="slds-dropdown-trigger slds-dropdown-trigger--click slds-m-horizontal--xxx-small" aria-expanded="false" dropdowntrigger>
    <button class="slds-button slds-button--icon-more" aria-haspopup="true" title="Change view" [disabled]="disabled">
        <system-button-icon [icon]="currentListIcon" size="small"></system-button-icon>
        <system-button-icon icon="down" size="x-small"></system-button-icon>
    </button>
    <div class="slds-dropdown slds-dropdown--right slds-dropdown--small">
        <ul class="slds-dropdown__list" role="menu">
            <li class="slds-dropdown__header" role="separator">
                <span class="slds-text-title--caps">{{language.getLabel('LBL_DISPLAYAS')}}</span>
            </li>
            <li *ngFor="let list of componentconfig.lists" class="slds-dropdown__item slds-is-selected" role="presentation" (click)="setListtype(list.component)">
                <a href="javascript:void(0);" role="menuitemcheckbox" aria-checked="true" tabindex="0">
                    <span class="slds-truncate">{{language.getLabel(list.label)}}</span>
                    <system-utility-icon [icon]="list.icon" size="x-small"></system-utility-icon>
                </a>
            </li>
        </ul>
    </div>
</div>
