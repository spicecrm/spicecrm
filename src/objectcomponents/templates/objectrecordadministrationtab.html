<system-collapsable-tab [title]="componentconfig.name" [expanded]="expanded">
    <div *ngIf="territorymanaged" class="slds-grid">
        <div class="slds-size--1-of-2">
            <object-record-fieldset-field [fieldsetitem]="fields.spiceacl_primary_territory"></object-record-fieldset-field>
        </div>
        <div class="slds-size--1-of-2">
            <object-record-fieldset-field [fieldsetitem]="fields.spiceacl_territories_hash"></object-record-fieldset-field>
        </div>
    </div>
    <div class="slds-grid">
        <div class="slds-size--1-of-2">
            <object-record-fieldset-field [fieldsetitem]="fields.assigned_user_name"></object-record-fieldset-field>
        </div>
        <div class="slds-size--1-of-4">
            <object-record-fieldset-field [fieldsetitem]="fields.created_by_name"></object-record-fieldset-field>
        </div>
        <div class="slds-size--1-of-4">
            <object-record-fieldset-field [fieldsetitem]="fields.modified_by_name"></object-record-fieldset-field>
        </div>
    </div>
</system-collapsable-tab>
