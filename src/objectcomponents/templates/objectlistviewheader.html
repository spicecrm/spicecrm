<div class="slds-page-header slds-page-header--object-home" role="banner">
    <div class="slds-grid slds-p-bottom--xx-small">
        <div class="slds-grid slds-grid--vertical-align-center slds-no-space">
            <system-icon [module]="model.module"></system-icon>
            <object-list-types></object-list-types>
        </div>
        <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon--left slds-grow slds-p-right--small">
            <system-utility-icon [icon]="'search'" [addclasses]="'slds-input__icon'"></system-utility-icon>
            <input spiceuiautofocus style="max-width: 400px;" class="slds-input slds-lookup__search-input" type="search" [placeholder]="language.getModuleCombinedLabel('LBL_SEARCH', model.module)" [(ngModel)]="modellist.searchTerm" (keyup)="onKeyUp($event)"/>
        </div>
        <object-action-container class="slds-col--bump-left" [actionset]="actionSet"></object-action-container>
    </div>
    <div class="slds-grid slds-grid_vertical-align-center">
        <div class="slds-col slds-align-bottom">
            <object-listview-header-details></object-listview-header-details>
        </div>
        <div class="slds-col slds-no-flex slds-grid slds-align-bottom">
            <object-listview-settings class="slds-show--medium"></object-listview-settings>
            <object-listview-header-list-selector></object-listview-header-list-selector>
            <button class="slds-button slds-button--neutral slds-button--icon-border slds-m-horizontal--xxx-small" (click)="modellist.reLoadList()">
                <system-button-icon [icon]="'refresh'"></system-button-icon>
            </button>
            <object-listview-aggregates-button class="slds-show--medium"></object-listview-aggregates-button>
            <object-listview-filter-button class="slds-show--medium"></object-listview-filter-button>
        </div>
    </div>
</div>
<object-listview-filter-panel @animatepanel *ngIf="modellist.displayFilters"></object-listview-filter-panel>
<object-listview-aggregates-panel @animatepanel *ngIf="modellist.displayAggregates"></object-listview-aggregates-panel>
