<system-modal size="large">
    <system-modal-header (close)="close()">{{language.getLabel('LBL_BEANTOMAIL')}}</system-modal-header>
    <system-modal-content>
        <div class="slds-grid slds-p-around--xx-small">
            <div class="slds-size--1-of-2 slds-p-right--xxx-small">
                <div class="slds-form-element">
                    <field-label [fieldname]="'mailbox_id'" [fieldconfig]="{required: true}"></field-label>
                    <field-container [field]="'mailbox_id'"></field-container>
                </div>
            </div>
            <div class="slds-size--1-of-2 slds-p-left--xxx-small">
                <field-label [fieldname]="'parent_name'"></field-label>
                <field-container [field]="'parent_name'"></field-container>
            </div>
        </div>
        <div class="slds-grid slds-p-around--xx-small">
            <div class="slds-size--1-of-2 slds-p-right--xxx-small">
                <div class="slds-form-element">
                    <field-label [fieldname]="'to_addrs_names'" [fieldconfig]="{required: true}"></field-label>
                    <field-container field="to_addrs_names" [fieldconfig]="{fieldtype:'emailrecipients', addresstype: 'to'}"></field-container>
                </div>
            </div>
            <div class="slds-size--1-of-2 slds-p-left--xxx-small">
                <div class="slds-form-element">
                    <field-label [fieldname]="'cc_addrs_names'"></field-label>
                    <field-container field="cc_addrs_names" [fieldconfig]="{fieldtype:'emailrecipients', addresstype: 'cc'}"></field-container>
                </div>
            </div>
        </div>
        <div class="slds-grid slds-p-around--xx-small">
            <div class="slds-size--1-of-2 slds-p-right--xxx-small">
                <div class="slds-form-element">
                    <field-label [fieldname]="'name'" [fieldconfig]="{required: true}"></field-label>
                    <field-container [field]="'name'"></field-container>
                </div>
            </div>
            <div class="slds-size--1-of-2 slds-p-right--xxx-small">
                <div *ngIf="model.data.parent_type" class="slds-form-element">
                    <field-label [fieldname]="'emailtemplate_id'"></field-label>
                    <field-container field="emailtemplate_id" [fieldconfig]="{fieldtype:'emailtemplate', templatetype: 'bean2mail'}"></field-container>
                </div>
            </div>
        </div>
        <div class="slds-p-around--xx-small">
            <div class="slds-form-element">
                <field-label fieldname="body" [fieldconfig]="{required: true}"></field-label>
                <div class="slds-form-element__control">
                    <field-html fieldname="body"></field-html>
                </div>
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button" (click)="close()">{{language.getLabel('LBL_CANCEL')}}</button>
        <button [disabled]="isDisabled" class="slds-button slds-button--brand" (click)="sendEmail()">{{language.getLabel('LBL_SEND')}}</button>
    </system-modal-footer>
</system-modal>
