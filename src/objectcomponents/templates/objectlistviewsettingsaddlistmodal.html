<system-modal>
    <system-modal-header (close)="close()">
        {{language.getLabel('LBL_'+modalmode.toUpperCase()+'LIST')}}
    </system-modal-header>
    <system-modal-content>
        <div class="slds-form--stacked">
            <div class="slds-form-element">
                <label class="slds-form-element__label"><abbr class="slds-required">*</abbr>{{language.getLabel('LBL_NEWLISTNAME')}}</label>
                <div class="slds-form-element__control">
                    <input class="slds-input" type="text" [(ngModel)]="listname" autofocus/>
                </div>
            </div>
            <div class="slds-form-element">
                <div class="slds-form-element__control">
                    <system-checkbox [(ngModel)]="globallist" [disabled]="!session.authData.admin">{{language.getLabel('LBL_GLOBALVISIBLE')}}</system-checkbox>
                    <!--span class="slds-checkbox">
                      <input type="checkbox" name="options" id="visibleglobal" [(ngModel)]="globallist"/>
                      <label class="slds-checkbox__label" for="visibleglobal">
                        <span class="slds-checkbox--faux"></span>
                        <span class="slds-form-element__label">{{language.getLabel('LBL_GLOBALVISIBLE')}}</span>
                      </label>
                    </span-->
                </div>
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()">{{language.getLabel('LBL_CANCEL')}}</button>
        <button class="slds-button slds-button--brand" [disabled]="canSave()" (click)="save()">{{language.getLabel('LBL_SAVE')}}</button>
    </system-modal-footer>
</system-modal>
