<div class="">
    <!--button *ngIf="isExpanded" class="slds-button slds-button_icon slds-button_icon" (click)="expand()">
        <system-button-icon [icon]="'expand_alt'" [size]="'xx-small'"></system-button-icon>
    </button-->
    <div class="slds-p-horizontal--xx-small" (click)="onHeaderClick()">
        <object-record-fieldset [fieldset]="headerFieldSet"></object-record-fieldset>
    </div>
    <div class="slds-p-horizontal--xx-small" *ngIf="isExpanded">
        <object-record-fieldset [fieldset]="bodyFieldSet" [direction]="'vertical'"></object-record-fieldset>
        <div class="slds-p-vertical--x-small slds-grid">
            <div class="slds-button-group" role="group">
                <button class="slds-button slds-button--neutral" (click)="cancel()" [title]="language.getLabel('LBL_CANCEL')">
                    <system-button-icon icon="close"></system-button-icon>
                    <span class="slds-assistive-text">{{language.getLabel('LBL_CANCEL')}}</span>
                </button>
                <button class="slds-button slds-button--neutral" (click)="expand()" [title]="language.getLabel('LBL_EXPAND')">
                    <system-button-icon icon="expand"></system-button-icon>
                    <span class="slds-assistive-text">{{language.getLabel('LBL_EXPAND')}}</span>
                </button>
                <button class="slds-button slds-button--neutral" (click)="dock()" [title]="language.getLabel('LBL_DOCK')">
                    <system-button-icon icon="dock_panel"></system-button-icon>
                    <span class="slds-assistive-text">{{language.getLabel('LBL_DOCK')}}</span>
                </button>
            </div>
            <div class="slds-col--bump-left">
                <object-action-container [actionset]="actionset" (actionemitter)="handleaction($event)" ></object-action-container>
            </div>
        </div>
    </div>
</div>
