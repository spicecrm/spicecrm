<object-icon [module]="module" [size]="'small'"></object-icon>
<div class="slds-media__body">
    <div class="slds-grid slds-grid--align-spread slds-has-flexi-truncate">
        <h3 class="slds-truncate slds-text-heading--small slds-m-bottom--small" modelPopOver (click)="navgiateDetail()">
            <a href="javascript:void(0);">{{data.summary_text}}</a>
        </h3>
        <div class="slds-shrink-none">
            <object-action-menu [buttonsize]="'x-small'" [addactions]="addActions" (action)="handleAction($event)"></object-action-menu>
        </div>
    </div>
    <div class="slds-tile__detail slds-text-body--small">
        <dl class="slds-dl--horizontal">
            <ng-container *ngFor="let field of getFields()">
                <dt class="slds-dl--horizontal__label slds-truncate">
                    {{language.getFieldDisplayName(module, field.field)}}
                </dt>
                <dd class="slds-dl--horizontal__detail slds-tile__meta">
                    <field-container [field]="field.field" [fieldconfig]="field.fieldconfig" [fielddisplayclass]="'slds-truncate'"></field-container>
                </dd>
            </ng-container>
        </dl>
    </div>
</div>
