<div class="slds-form-element slds-dropdown-trigger slds-dropdown-trigger_click" [ngClass]="{'slds-is-open': showDialog}">
    <a class="slds-button slds-button--neutral slds-m-horizontal--xxx-small" [ngClass]="{'slds-not-selected': !hasReminder, 'slds-is-selected': hasReminder }"><!-- [disabled]="isEditing"-->
        <span class="slds-text-not-selected" (click)="toggleDatePicker()">
            <system-button-icon [icon]="'add'"></system-button-icon>{{language.getLabel('LBL_REMINDER')}}
        </span>
        <span class="slds-text-selected">
            <system-button-icon [icon]="'check'"></system-button-icon>{{getReminderDate()}}
        </span>
        <span class="slds-text-selected-focus">
            <system-button-icon [icon]="'close'" (click)="clearReminder()"></system-button-icon> <span (click)="toggleDatePicker()">{{getReminderDate()}}</span>
        </span>
    </a>
    <div class="slds-datepicker slds-dropdown slds-dropdown_right" role="dialog">
        <system-input-date-picker [setDate]="reminderDate" (datePicked)="setReminder($event)"></system-input-date-picker>
    </div>
</div>
