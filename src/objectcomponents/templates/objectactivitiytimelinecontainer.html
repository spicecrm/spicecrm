<ul *ngIf="hasActivities; else nocontent" class="slds-timeline slds-p-vertical--small">
    <li *ngFor="let activity of activities">
        <object-activitiytimeline-item-container [activity]="activity"></object-activitiytimeline-item-container>
    </li>
</ul>
<ng-template #nocontent>
    <system-illustration-no-records>{{language.getLabel('LBL_NO_ENTRIES')}}</system-illustration-no-records>
</ng-template>
<system-spinner *ngIf="loading" class="slds-p-vertical--small"></system-spinner>
