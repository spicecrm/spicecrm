<div class="slds-panel slds-grid slds-grid--vertical slds-nowrap slds-panel--filters" tobottom>
    <div class="slds-form--stacked slds-grow slds-scrollable--y slds-grid slds-grid--vertical">
        <div class="slds-filters">
            <ng-container *ngIf="!isChanged; else unchanged">
                <div  class="slds-filters__header slds-grid slds-has-divider--bottom-space">
                    <h4 class="slds-align-middle slds-text-heading--small">{{language.getLabel('LBL_FILTER')}}</h4>
                </div>
            </ng-container>
            <div class="slds-p-around--xx-small">
                <ng-template #unchanged>
                    <div class="slds-filters__header slds-grid slds-grid--align-spread slds-has-divider--bottom-space">
                        <button class="slds-button slds-button--neutral" (click)="cancel()">{{language.getLabel('LBL_CANCEL')}}</button>
                        <button class="slds-button slds-button--brand" (click)="save()">{{language.getLabel('LBL_SAVE')}}
                        </button>
                    </div>
                </ng-template>
                <object-listview-filter-panel-filter-myitems [(ngModel)]="filter.groupscope"></object-listview-filter-panel-filter-myitems>
                <div class="slds-grid slds-p-around--xx-small">
                    <label class="slds-form-element__label">{{language.getLabel('LBL_MATCHING')}}</label>
                    <system-input-radio name="operator" value="and" [(ngModel)]="filter.logicaloperator">{{language.getLabel('LBL_ALL')}}</system-input-radio>
                    <system-input-radio name="operator" value="or" [(ngModel)]="filter.logicaloperator">{{language.getLabel('LBL_ANY')}}</system-input-radio>
                </div>
                <ng-container *ngIf="filter.conditions.length > 0; else nofilter">
                    <div class="slds-grid_vertical">
                        <object-listview-filter-panel-filter-item *ngFor="let condition of filter.conditions; let i = index"  [filterexpression]="condition" (deleteItem)="deleteItem(i)"></object-listview-filter-panel-filter-item>
                    </div>
                    <div class="slds-filters__footer slds-grid slds-shrink-none">
                        <a href="javascript:void(0);" (click)="addExpression($event)">{{language.getLabel('LBL_ADDFILTER')}}</a>
                        <a href="javascript:void(0);" class="slds-col--bump-left" (click)="removeAllFilters()">{{language.getLabel('LBL_REMOVEALL')}}</a>
                    </div>
                </ng-container>
                <ng-template #nofilter>
                    <div class="slds-p-around--small slds-align--absolute-center">
                        <a href="javascript:void(0);" (click)="addExpression($event)">{{language.getLabel('LBL_ADDFILTER')}}</a>
                    </div>
                </ng-template>
            </div>
        </div>
    </div>
</div>
