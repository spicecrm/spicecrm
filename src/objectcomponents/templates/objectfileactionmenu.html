<div class="slds-dropdown-trigger slds-dropdown-trigger--click" system-dropdown-trigger>
    <button class="slds-button slds-button--icon-border-filled slds-button--icon-x-small" aria-haspopup="true">
        <system-button-icon [icon]="'down'"></system-button-icon>
    </button>
    <div class="slds-dropdown slds-dropdown--right" [ngClass]="getDropdownLocationClass()">
        <ul class="slds-dropdown__list" role="menu">
            @if (file.file_mime_type != 'folder') {
                <li class="slds-dropdown__item" role="presentation" (click)="edit()">
                    <a href="javascript:void(0);" role="menuitem" tabindex="0">
                        <span class="slds-truncate"><system-label label="LBL_EDIT"/></span>
                        <system-utility-icon icon="edit" size="xx-small"/>
                    </a>
                </li>
                <li class="slds-dropdown__item" role="presentation" (click)="downloadFile()">
                    <a href="javascript:void(0);" role="menuitem" tabindex="-1">
                        <span class="slds-truncate slds-p-right--small"><system-label label="LBL_DOWNLOAD"/></span>
                        <system-utility-icon icon="download" size="xx-small"/>
                    </a>
                </li>

                <li class="slds-dropdown__item" role="presentation" (click)="previewFile()">
                    <a href="javascript:void(0);" role="menuitem" tabindex="-3">
                        <span class="slds-truncate"><system-label label="LBL_PREVIEW"/></span>
                        <system-utility-icon icon="preview" size="xx-small"/>
                    </a>
                </li>
                <li class="slds-dropdown__item" role="presentation" (click)="moveFile()" [ngClass]="{'slds-is-disabled': modelattachments.folderTreeItems.length <= 1}">
                    <a href="javascript:void(0);" role="menuitem" tabindex="-4">
                        <span class="slds-truncate" [ngClass]="{'slds-disabled-text': modelattachments.folderTreeItems.length <= 1}"><system-label label="LBL_MOVE"/></span>
                        <system-utility-icon icon="copy" size="xx-small"/>
                    </a>
                </li>
                <li class="slds-dropdown__item" role="presentation" [hidden]="hidden" (click)="deleteFile()">
                    <a href="javascript:void(0);" role="menuitem" tabindex="-2">
                        <span class="slds-truncate"><system-label label="LBL_DELETE"/></span>
                        <system-utility-icon icon="delete" size="xx-small"/>
                    </a>
                </li>
            } @else {
                <li class="slds-dropdown__item" role="presentation"  [hidden]="hidden" (click)="renameFolder()">
                    <a href="javascript:void(0);" role="menuitem">
                        <span class="slds-truncate"><system-label label="LBL_RENAME"/></span>
                        <system-utility-icon icon="record_update" size="xx-small"/>
                    </a>
                </li>
                <li class="slds-dropdown__item" role="presentation"  [hidden]="hidden" (click)="deleteFolder()" [ngClass]="{'slds-is-disabled': modelattachments.itemsInFolder(file.id) > 0}">
                    <a href="javascript:void(0);" role="menuitem">
                        <span class="slds-truncate"><system-label label="LBL_DELETE"/></span>
                        <system-utility-icon icon="delete" size="xx-small"/>
                    </a>
                </li>
            }
        </ul>
    </div>
</div>
