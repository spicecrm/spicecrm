<div class="slds-box slds-m-around--xx-small" spiceDropFileArea (filesDrop)="fileDrop($event)">
    <div>
        <div class="slds-card__body--inner slds-grid slds-wrap slds-grid--pull-padded">
            <spice-attachment-file *ngFor="let file of modelattachments.files" [file]="file" class="slds-media slds-size--1-of-1 spicecrm-card-size"></spice-attachment-file>
        </div>
        <div *ngIf="modelattachments.loading" class="slds-p-around--large slds-align--absolute-center">
            <system-spinner></system-spinner>
        </div>
    </div>
    <div *ngIf="editing" class="slds-grid slds-grid--align-center slds-grid--vertical-align-center slds-gutters_direct-xx-small">
        <div class="slds-col">{{language.getLabel('LBL_DROP_FILES')}}</div>
        <div class="slds-col">{{language.getLabel('LBL_OR')}}</div>
        <button *ngIf="!componentconfig.disableupload" class="slds-col slds-button slds-button--neutral" (click)="selectFile()">{{language.getLabel('LBL_UPLOAD_FILES')}}</button>
        <div class="slds-col">{{language.getLabel('LBL_OR')}}</div>
        <button *ngIf="!componentconfig.disableupload" class="slds-col slds-button slds-button--neutral" (click)="addImage()">{{language.getLabel('LBL_ADD_IMAGE')}}</button>
        <input #fileupload style="display:none" type="file" multiple (change)="uploadFile()"/>
    </div>
</div>
