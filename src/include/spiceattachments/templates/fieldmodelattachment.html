<field-label *ngIf="displayLabel" [fieldname]="fieldname" [fieldconfig]="fieldconfig"></field-label>
<field-generic-display *ngIf="!isEditMode()" [fielddisplayclass]="fielddisplayclass" [editable]="isEditable()" [fieldconfig]="fieldconfig" [title]="value" [fieldid]="fieldid">
    @if(filename) {
        <div class="slds-grid slds-grid--vertical-align-center">
            <system-file-icon [filemimetype]="mime_type" [filename]="filename" divClass="slds-p-right--xx-small" size="x-small"></system-file-icon>
            <div class="slds-truncate slds-grow"><a href="javascript:void(0);" (click)="previewFile($event)">{{ filename }}</a></div>
        </div>
    }
</field-generic-display>
<div *ngIf="isEditable() && isEditMode()" class="slds-form-element__control slds-p-vertical--xxx-small" [ngClass]="getFieldClass()">
    @if(filename) {
        <div class="slds-pill_container slds-size--1-of-1 slds-m-vertical--xxx-small">
            <div class="slds-pill slds-pill_link slds-size--1-of-1">
            <span class="slds-pill__icon_container">
                <span class="slds-icon_container slds-icon-standard-account" title="Account">
                    <system-icon [icon]="helper.determineFileIcon(mime_type)" divClass="" sprite="doctype"
                                 size="x-small"></system-icon>
                </span>
            </span>
                <a href="javascript:void(0);" class="slds-pill__action">
                    <span class="slds-pill__label">{{ filename }}</span>
                </a>
                <button class="slds-button slds-button_icon slds-button_icon slds-pill__remove" title="Remove"
                        (click)="removeFile()">
                    <system-button-icon icon="close"></system-button-icon>
                </button>
            </div>
        </div>
    } @else if(uploading) {
        <!-- the progressbar if we are uploading-->
        <div class="slds-p-around--x-small slds-grid slds-grid_vertical-align-center slds-grid--align-spread slds-has-flexi-truncate">
            <div class="slds-progress-bar">
                <span class="slds-progress-bar__value" [ngStyle]="progressbarstyle"></span>
            </div>
            <div class="slds-text-align--right" style="width: 50px;">
                {{ file.uploadprogress }} %
            </div>
        </div>
    } @else {
        <!-- if we do not have a file and there is no upload in the progress -->
        <div class="slds-file-selector slds-file-selector_files">
            <div class="slds-file-selector__dropzone" (system-drop-file)="onDrop($event)">
                <input #fileupload type="file" (click)="fileupload.value = null"
                       class="slds-file-selector__input slds-assistive-text" [id]="fieldid"
                       (change)="uploadFile()">
                <label class="slds-file-selector__body" [attr.for]="fieldid">
            <span class="slds-file-selector__button slds-button slds-button_neutral">
            <system-button-icon [icon]="'upload'"></system-button-icon><system-label
                    label="LBL_UPLOAD_FILES"></system-label></span>
                    <span class="slds-file-selector__text slds-medium-show"><system-label label="LBL_OR"></system-label> <system-label
                            label="LBL_DROP_FILES"></system-label></span>
                </label>
            </div>
        </div>
    }
    <field-messages [fieldname]="fieldname"></field-messages>
</div>
