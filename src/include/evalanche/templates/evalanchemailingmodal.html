<system-modal>
    <system-modal-header (close)="close()">
        <h1>
            <system-label label="LBL_CREATE_MAILING"></system-label>
        </h1>
    </system-modal-header>
    <system-modal-content>
        <div class="slds-p-around--medium" [system-overlay-loading-spinner]="loading">
            <div class="slds-form-element slds-p-vertical--small">
                <label class="slds-form-element__label">
                    <system-label label="LBL_NAME"></system-label>
                </label>
                <div class="slds-form-element__control">
                    <input type="text" class="slds-input" [(ngModel)]="name"/>
                </div>
            </div>
            <div class="slds-form-element slds-p-vertical--small">
                <label class="slds-form-element__label">
                    <system-label label="LBL_SUBJECT"></system-label>
                </label>
                <div class="slds-form-element__control">
                    <input type="text" class="slds-input" [(ngModel)]="subjectline"/>
                </div>
            </div>
            <div class="slds-form-element slds-p-vertical--small">
                <label class="slds-form-element__label">
                    <system-label label="LBL_TEMPLATES"></system-label>
                </label>
                <div class="slds-form-element__control">
                    <div class="slds-select_container">
                        <select class="slds-select" [(ngModel)]="template">
                            <option *ngFor="let tpl of templates | keyvalue" value="{{tpl.key}}">{{tpl.value}}</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="slds-form-element slds-p-vertical--small">
                <label class="slds-form-element__label">
                    <system-label label="LBL_PROSPECTLISTS"></system-label>
                </label>
                <div *ngFor="let list of targetlists"  class="slds-form-element__control">
                    <div  class="slds-grid slds-grid--vertical-align-center slds-p-around--xx-small ">
                    <system-checkbox [(ngModel)]="list.selected"></system-checkbox>
                        <h2>{{list.name}}</h2>
                    </div>
                </div>
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CANCEL"></system-label></button>
        <button class="slds-button slds-button--brand" type="submit"
                (click)="submit()"><system-label label="LBL_SUBMIT"></system-label></button>
    </system-modal-footer>
</system-modal>
