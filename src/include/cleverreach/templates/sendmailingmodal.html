<system-modal>
    <system-modal-header (close)="close()">
        <h1>{{language.getLabel('LBL_CREATE_MAILING')}} in {{language.getLabel('LBL_CLEVERREACH')}}</h1>
    </system-modal-header>
    <system-modal-content>
        <form class="slds-form" [formGroup]="mailing" (ngSubmit)="onSubmit()">
            <div class="slds-form-element">
                <label class="slds-form-element__label">{{language.getLabel('LBL_NAME')}}:</label>
                <div class="slds-form-element__control">
                    <input type="text" placeholder="name must be unique" class="slds-input" formControlName="name">
                </div>
            </div>
            <div class="slds-form-element">
                <label class="slds-form-element__label">{{language.getLabel('LBL_SUBJECT')}}:</label>
                <div class="slds-form-element__control">
                    <input type="text" placeholder="Placeholder Text" class="slds-input" formControlName="subject">
                </div>
            </div>
            <div class="slds-form-element">
                <label class="slds-form-element__label">{{language.getLabel('LBL_CONTENT')}}:</label>
                <div class="slds-form-element__control">
                    <textarea placeholder="Placeholder Text" class="slds-textarea" formControlName="html"  rows="5"></textarea>
                </div>
            </div>
        </form>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()">{{language.getLabel('LBL_CANCEL')}}</button>
        <button class="slds-button slds-button--brand" type="submit"
                (click)="onSubmit()">{{language.getLabel('LBL_CREATE')}}</button>
    </system-modal-footer>
</system-modal>
