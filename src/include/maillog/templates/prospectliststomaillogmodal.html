<system-modal>
    <system-modal-header (close)="close()">
        {{language.getLabel('LBL_EXPORT_PROSPECTLIST')}} to {{language.getLabel('LBL_MAILLOG')}}
    </system-modal-header>
    <system-modal-content>
        <div *ngFor="let item of list">
            <p>{{item.vorname}} {{item.nachname}}</p>
            <p>{{item.email}}}</p>
            <p>{{item.gruppen}}</p>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()">{{language.getLabel('LBL_CANCEL')}}</button>
        <button class="slds-button slds-button--brand"
                (click)="transferToMailLog()">{{language.getLabel('LBL_EXPORT')}}</button>
    </system-modal-footer>
</system-modal>
