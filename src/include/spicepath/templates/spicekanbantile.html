<div class="slds-tile slds-box--border slds-theme--default">
    <div class="slds-p-around--x-small" [overlayLoadingSpinner]="model.isSaving">
        <div class="slds-grid slds-grid--align-spread">
            <ng-container *ngIf="headerFieldset; else noheaderfieldset">
                <object-record-fieldset-horizontal-list [fieldset]="headerFieldset"></object-record-fieldset-horizontal-list>
            </ng-container>
            <ng-template #noheaderfieldset>
                <h3 class="slds-truncate" (click)="goDetail()"><a href="javascript:void(0);">{{model.getField('summary_text')}}</a></h3>
            </ng-template>
            <object-action-menu buttonsize="x-small"></object-action-menu>
        </div>
        <div class="slds-tile__detail slds-text-body--small">
            <div class="slds-p-vertical--x-small">
                <field-container *ngIf="componentconfig.amount" [field]="componentconfig.amount" [fielddisplayclass]="'slds-text-heading--medium'"></field-container>
            </div>
            <div class="slds-grid" *ngFor="let componentField of componentFields">
                <field-label class="slds-truncate"  [fieldname]="componentField.field" [fieldconfig]="componentField.fieldconfig"></field-label>
                <field-container class="slds-col--bump-left slds-truncate" [field]="componentField.field" [fieldconfig]="componentField.fieldconfig" [fielddisplayclass]="'slds-truncate'"></field-container>
            </div>
        </div>
    </div>
</div>
