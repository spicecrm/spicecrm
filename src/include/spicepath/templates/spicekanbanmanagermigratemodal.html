<system-modal size="small">
    <system-modal-header (close)="close()">
        <system-label label="LBL_KANBANS_MIGRATION"></system-label>
    </system-modal-header>
    <system-modal-content>
        <div class="slds-box slds-box--border slds-m-top--x-small">
            <table class="slds-table slds-table_bordered" aria-labelledby="element-with-table-label other-element-with-table-label">
                <thead>
                <tr class="slds-line-height_reset">
                    <th scope="col">
                        <div class="slds-truncate"><system-label label="LBL_MODULE"></system-label></div>
                    </th>
                    <th scope="col">
                        <div class="slds-truncate"><system-label label="LBL_GLOBAL"></system-label></div>
                    </th>
                    <th scope="col">
                        <div class="slds-truncate"><system-label label="LBL_CUSTOM"></system-label></div>
                    </th>
                </tr>
                </thead>
                <tbody>
                <tr class="slds-hint-parent" *ngFor="let item of migrateKanbans">
                    <td>
                        <div class="slds-truncate">{{item.module}}</div>
                    </td>
                    <td>
                        <div class="slds-truncate">{{item.countGlobal}}</div>
                    </td>
                    <td>
                        <div class="slds-truncate">{{item.countCustom}}</div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CANCEL"></system-label></button>
        <button class="slds-button slds-button--brand" (click)="migrate()"><system-label label="LBL_MIGRATE"></system-label></button>
    </system-modal-footer>
</system-modal>
