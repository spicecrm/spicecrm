<div *ngIf="selectedStage">
    <system-collapsable-tab [collapsable]="true" tabtitle="LBL_DETAILS">
        <div class="slds-grid slds-wrap">
            <div class="slds-col slds-size_1-of-2 slds-p-around--x-small">
                <div class="slds-form-element">
                    <label class="slds-form-element__label"><system-label label="LBL_LABEL"></system-label></label>
                    <system-input-label [(ngModel)]="selectedStage.stage_label"></system-input-label>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-p-around--x-small">
                <div class="slds-form-element">
                    <label class="slds-form-element__label"><system-label label="LBL_STAGE_ADD_DATA"></system-label></label>
                    <system-icon-help-text [helpText]="language.getLabel('LBL_STAGE_ADD_DATA_HELP', '', 'long')"></system-icon-help-text>
                    <div class="slds-form-element__control">
                        <input type="text" class="slds-input" [(ngModel)]="selectedStage.stage_add_data">
                    </div>
                </div>
            </div>
        </div>
        <div class="slds-grid slds-wrap">
            <div class="slds-col slds-size_1-of-1 slds-p-around--x-small">
                <div class="slds-form-element">
                    <label class="slds-form-element__label"><system-label label="LBL_COMPONENTSET"></system-label></label>
                    <system-icon-help-text [helpText]="language.getLabel('LBL_STAGE_ADD_COMP_HELP', '', 'long')"></system-icon-help-text>
                    <system-input-componentset [(ngModel)]="selectedStage.stage_componentset"></system-input-componentset>
                </div>
            </div>
        </div>

        <div class="slds-grid slds-wrap slds-p-around--x-small">
            <div class="slds-col">
                <div class="slds-form-element">
                    <label class="slds-form-element__label"><system-label label="LBL_TEXT"></system-label></label>
                    <system-icon-help-text [helpText]="language.getLabel('LBL_SYSTEXT_HELP', '', 'long')"></system-icon-help-text>
                </div>
            </div>
            <div class="slds-tabs_scoped">
                <div class="slds-col">
                    <ul class="slds-tabs_scoped__nav" role="tablist">
                        <li *ngFor="let lang of systemLanguages" class="slds-tabs_scoped__item" [ngClass]="{'slds-is-active': lang.language == selectedLanguage}" (click)="switchTab(lang.language)" role="presentation">
                            <a class="slds-tabs_scoped__link" href="javascript:void(0);" role="tab" [attr.aria-selected]="lang.language == selectedLanguage" >{{lang.display_label}}</a>
                        </li>
                    </ul>
                    <div *ngFor="let lang of systemLanguages" [ngClass]="{'slds-show': lang.language == selectedLanguage,'slds-hide': lang.language != selectedLanguage}" class="slds-tabs_scoped__content" role="tabpanel">
                        <system-richtext-editor [(ngModel)]="selectedStageText.description"></system-richtext-editor>
                    </div>
                </div>
            </div>
        </div>
        <div class="slds-grid slds-wrap">
            <div class="slds-col slds-size_1-of-2 slds-p-around--x-small">
                <div class="slds-form-element">
                    <label class="slds-form-element__label"><system-label label="LBL_STAGE_BUCKET"/></label>
                    <system-icon-help-text [helpText]="language.getLabel('LBL_STAGE_BUCKET', '', 'long')"/>
                    <system-input-label [(ngModel)]="selectedStage.stage_bucket"></system-input-label>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-p-around--x-small">
                <div class="slds-form-element">
                    <label class="slds-form-element__label"><system-label label="LBL_STAGE_STATUS"/></label>
                    <system-icon-help-text [helpText]="language.getLabel('LBL_STAGE_STATUS', '', 'long')"/>
                    <system-select [(ngModel)]="selectedStage.spicebeanguide_status">
                        <system-select-option value="won" display="LBL_WON"/>
                        <system-select-option value="lost" display="LBL_LOST"/>
                    </system-select>
                </div>
            </div>
        </div>
        <div class="slds-grid slds-wrap">
            <div class="slds-col slds-size_1-of-2 slds-p-around--x-small">
                <div class="slds-form-element">
                    <label class="slds-form-element__label"><system-label label="LBL_PACKAGE"></system-label></label>
                    <system-input-package [(ngModel)]="selectedStage.package"></system-input-package>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-p-around--x-small">
                <div class="slds-form-element">
                    <label class="slds-form-element__label"><system-label label="LBL_VERSION"></system-label></label>
                    <system-input-version [(ngModel)]="selectedStage.version"></system-input-version>
                </div>
            </div>
        </div>
    </system-collapsable-tab>
    <spice-kanban-manager-checks [selectedStage]="selectedStage"></spice-kanban-manager-checks>
</div>
<div *ngIf="!selectedStage">
    <label class="slds-form-element__label"><system-label label="LBL_MAKE_SELECTION_LEFT"></system-label></label>
</div>
