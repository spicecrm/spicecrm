<div class="slds-path slds-path_has-coaching slds-p-around--small">
    <div class="slds-grid slds-path__scroller-container">
        <button class="slds-button slds-button_icon slds-button_icon-border-filled slds-path__trigger" aria-expanded="false" [@coachingicon]="coachingVisible ? 'open': 'closed'" (click)="toggleCoaching()">
            <system-button-icon icon="chevronright"></system-button-icon>
        </button>
        <spice-path-track class="slds-grow" (activeStage$)="setActiveStage($event)" ></spice-path-track>
    </div>
    <div @displaycoaching *ngIf="coachingVisible" class="slds-grid slds-grid--align-spread slds-gutters_direct-xxx-small slds-p-top--medium slds-p-horizontal--xxx-small">
        <div class="slds-col slds-size--1-of-2">
            <h2 class="slds-text-title--caps slds-p-bottom--small slds-has-divider--bottom">Checks</h2>
            <dl class="slds-dl--horizontal">
                <ng-container *ngFor="let check of checks">
                    <dt class="slds-coach__item slds-dl--horizontal__label">
                        <system-utility-icon [icon]="check.result ? 'check' : 'warning'" [size]="'x-small'"></system-utility-icon>
                    </dt>
                    <dd class="slds-coach__value slds-dl--horizontal__detail">{{check.name}}</dd>
                </ng-container>
            </dl>
        </div>
        <div class="slds-col slds-size--1-of-2" [innerHtml]="stageDescription"></div>
    </div>
</div>
