<div>
    <h2>
        <system-label label="LBL_ACTIVE"></system-label>
    </h2>
    <ul class="slds-has-dividers_around-space" cdkDropList #activeStagesList="cdkDropList"
        [cdkDropListData]="activeStages" [cdkDropListConnectedTo]="[notInKanbanList]"
        (cdkDropListDropped)="drop($event)" style="min-height: 10vh">
        <li *ngFor="let activeStage of activeStages;  let index = index" class="slds-item" cdkDrag>
            <system-utility-icon class="slds-p-right--xx-small" cdkDragHandle [icon]="'rows'" [size]="'x-small'"
                                 style="cursor:move"></system-utility-icon>
            <a href="javascript:void(0);" class="slds-text-link_reset"
               (click)="openDetails(activeStage)">{{activeStage.stage}}</a>
        </li>
    </ul>

    <h2>
        <system-label label="LBL_INACTIVE"></system-label>
    </h2>
    <ul class="slds-has-dividers_around-space" cdkDropList #notInKanbanList="cdkDropList"
        [cdkDropListData]="notInKanban" [cdkDropListConnectedTo]="[activeStagesList]"
        (cdkDropListDropped)="drop($event)" style="min-height: 10vh">
        <li *ngFor="let nik of notInKanban;  let index = index" class="slds-item" cdkDrag>

            <system-utility-icon class="slds-p-right--xx-small" cdkDragHandle [icon]="'rows'" [size]="'x-small'"
                                 style="cursor:move"></system-utility-icon>
            <a href="javascript:void(0);" class="slds-text-link_reset" (click)="openDetails(nik)">{{nik.stage}}</a>
        </li>

    </ul>
</div>
