<div #mainContainer class="slds-theme--default">
    <div #editorToolbar>
    <span class="ql-formats">
        <button class="ql-bold"></button>
        <button class="ql-italic"></button>
        <button class="ql-underline"></button>
        <button class="ql-strike"></button>
    </span>
        <span class="ql-formats">
        <button class="ql-blockquote"></button>
        <button class="ql-code-block"></button>
    </span>
        <span class="ql-formats">
        <button class="ql-header" value="1"></button>
        <button class="ql-header" value="2"></button>
    </span>
        <span class="ql-formats">
        <button class="ql-list" value="ordered"></button>
        <button class="ql-list" value="bullet"></button>
    </span>
        <span class="ql-formats">
        <button class="ql-script" value="sub"></button>
        <button class="ql-script" value="super"></button>
    </span>
        <span class="ql-formats">
        <button class="ql-indent" value="-1"></button>
        <button class="ql-indent" value="+1"></button>
    </span>
        <span class="ql-formats">
        <button class="ql-direction" value="rtl"></button>
    </span>
        <span class="ql-formats">
        <select class="ql-size">
            <option value="small"></option>
            <option selected="selected"></option>
            <option value="large"></option>
            <option value="huge"></option>
        </select>
    </span>
        <span class="ql-formats">
        <select class="ql-header">

            <option value="6"></option>
        </select>
    </span>

        <select class="ql-font">
            <option></option>
            <option value="serif"></option>
            <option value="monospace"></option>
        </select>

        <select class="ql-align">
            <option></option>
            <option value="center"></option>
            <option value="right"></option>
            <option value="justify"></option>
        </select>

        <button class="ql-clean"></button>

        <span class="ql-formats">
        <button class="ql-link"></button>
        <button (click)="openMediaFilePicker()" class="ql-image"></button>
        <button class="ql-video"></button>
    </span>
        <span class="ql-formats">
        <button (click)="openSourceEditor()">
            <system-button-icon icon="apex"></system-button-icon>
        </button>
         <button (click)="toggleFullScreen(mainContainer)" system-title="LBL_FULL_SCREEN" class="slds-button slds-button--neutral slds-button--icon-border slds-m-left--xx-small slds-m-right--xxx-small slds-col--bump-left">
            <system-button-icon [icon]="!isFullScreenOn ? 'expand' : 'contract'"></system-button-icon>
        </button>

    <div #editorContainer></div>

</div>
