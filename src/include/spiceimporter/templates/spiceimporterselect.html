<div class="slds-grid slds-wrap slds-height_full">
    <div class="slds-p-horizontal--small slds-size--1-of-4 slds-border--right slds-height_full">
        <div class="slds-text-body--regular slds-box slds-m-top--small slds-text-color--weak">
            {{ spiceImport.stepLongText }}
        </div>
        <div class="slds-form slds-size--1-of-1">
            <div class="slds-form-element slds-m-vertical--medium">
                <system-input-file [ngModel]="spiceImport.file" (ngModelChange)="loadFilePreview($event)" (onRemove)="clearFile()" accept=".csv" class="slds-size--1-of-1"></system-input-file>
                <div class="slds-grid slds-m-around--x-small">
                    <fieldset class="slds-size--1-of-2 slds-form-element slds-text-align--center">
                        <div class="slds-form-element__control">
                            <system-input-radio-button-group [(ngModel)]="separator" [inputOptions]="delimiterOptions"></system-input-radio-button-group>
                        </div>
                        <legend class="slds-form-element__legend slds-form-element__label slds-size--1-of-1 slds-text-align--center">
                            <system-label label="LBL_SEPARATOR"></system-label>
                        </legend>
                    </fieldset>
                    <fieldset class="slds-size--1-of-2 slds-form-element slds-text-align--center">
                        <div class="slds-form-element__control">
                            <system-input-radio-button-group [(ngModel)]="enclosure" [inputOptions]="enclosureOptions"></system-input-radio-button-group>
                        </div>
                        <legend class="slds-form-element__legend slds-form-element__label slds-size--1-of-1 slds-text-align--center">
                            <system-label label="LBL_ENCLOSURE"></system-label>
                        </legend>
                    </fieldset>
                </div>
            </div>

            <div class="slds-form-element slds-m-vertical--medium">
                <legend class="slds-form-element__legend slds-form-element__label">
                    <system-label label="LBL_IMPORT_ACTION"></system-label>
                </legend>
                <div class="slds-form-element__control">
                    <system-input-radio [(ngModel)]="importAction" value="new" name="options"><system-label label="LBL_LOAD_NEW_RECORDS"/></system-input-radio>
                    <system-input-radio [(ngModel)]="importAction" value="update" name="options"><system-label label="LBL_UPDATE_EXISTING_RECORDS"/></system-input-radio>
                </div>
            </div>
            <div [hidden]="!spiceImport.file" class="slds-form-element slds-m-vertical--medium">
                <legend class="slds-form-element__legend slds-form-element__label">
                    <system-label label="LBL_IMPORT_TEMPLATE"></system-label>
                </legend>
                <div class="slds-form-element__control">
                    <system-input-radio [(ngModel)]="importTemplateAction" value="none" name="template"><system-label label="LBL_NONE"/></system-input-radio>
                    <system-input-radio [(ngModel)]="importTemplateAction" value="choose" name="template"><system-label label="LBL_SELECT"/></system-input-radio>
                    <system-input-radio [(ngModel)]="importTemplateAction" value="new" name="template"><system-label label="LBL_SAVE_AS"/></system-input-radio>
                </div>
            </div>
            <div *ngIf="importTemplateAction=='choose' && spiceImport.file"
                 class="slds-form-element slds-m-vertical--medium">
                <label class="slds-form-element__label">{{language.getLabel('LBL_SELECT_TEMPLATE', '',
                    'short')}}</label>
                <div class="slds-form-element__control">
                    <div class="slds-select_container">
                        <select class="slds-select" (change)="setSavedImport($event)">
                            <option value=""></option>
                            <option *ngFor="let savedImport of spiceImport.savedImports" [value]="savedImport.id">
                                {{savedImport.name}}
                            </option>
                        </select>
                    </div>
                </div>
            </div>
            <div *ngIf="importTemplateAction=='new'" class="slds-form-element slds-m-vertical--medium">
                <div class="slds-form-element">
                    <label class="slds-form-element__label"><system-label label="LBL_TEMPLATE_NAME"></system-label></label>
                    <div class="slds-form-element__control">
                        <input type="text" class="slds-input" [(ngModel)]="templateName"/>
                    </div>
                </div>
            </div>
        </div>
        <div *ngIf="spiceImport.availableClasses.length > 0 && spiceImport.file" class="slds-grid slds-p-around--xx-small">
            <div class="slds-form-element slds-p-horizontal--xx-small slds-size--1-of-1">
                <label class="slds-form-element__label">
                    <system-label label="LBL_METHOD"></system-label>
                </label>
                <div class="slds-grid slds-grid--vertical-align-center slds-gutters_direct-xx-small">
                    <system-select [(ngModel)]="selectedClass" (ngModelChange)="getClassMethods($event.name)" class="slds-grow slds-truncate">
                        <system-select-option *ngFor="let option of spiceImport.availableClasses" [value]="option.id" [display]="option.name"/>
                    </system-select>
                    <div class="slds-col slds-size--1-of-3 slds-select_container">
                        <select class="slds-select" [disabled]="spiceImport.availableClasses.length == 0" [(ngModel)]="spiceImport.selectedMethod">
                            <option *ngFor="let o of selectedClassMethods" [value]="selectedClass.name + '->' + o">{{ o }}</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div [system-overlay-loading-spinner]="isLoading" class="slds-size--3-of-4 slds-height_full">
        <table *ngIf="spiceImport.fileHeader.length > 0"
               class="slds-table slds-table--bordered slds-table--cell-buffer">
            <thead>
            <tr class="slds-text-title--caps slds-p-vertical--small">
                <th scope="col">
                    <div style="font-weight: 600" class="slds-truncate slds-p-vertical--xx-small">
                        <system-label label="LBL_HEADER"></system-label>
                    </div>
                </th>
                <th colspan="2" scope="col">
                    <div style="font-weight: 600" class="slds-truncate slds-p-vertical--xx-small">
                        <system-label label="LBL_RECORDS"></system-label>
                        ({{spiceImport.fileRows}})
                    </div>
                </th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let row of spiceImport.fileHeader; let columnindex = index">
                <td>
                    <div class="slds-truncate">{{row}}</div>
                </td>
                <td *ngFor="let record of spiceImport.fileData">
                    <div class="slds-truncate">{{record[columnindex]}}</div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
