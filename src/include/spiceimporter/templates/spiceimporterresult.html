<div class="slds-size--1-of-1 slds-height_full">
    @switch (spiceImport.importstatus){
        @case ('i') {
            <spice-imports-view-log [importid]="spiceImport.importid" [module]="model.module"></spice-imports-view-log>
        }
        @case ('c') {
            <spice-imports-view-log [importid]="spiceImport.importid" [module]="model.module"></spice-imports-view-log>
        }
        @case ('q') {
            <div class="slds-size--1-of-1 slds-height_full slds-align--absolute-center">
                <system-illustration illustration="gonefishing"><system-label label="MSG_IMPORT_SCHEDULED"/></system-illustration>
            </div>
        }
    }
</div>
