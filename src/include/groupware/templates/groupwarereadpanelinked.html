<div *ngIf="beans.length > 0">
    <div class="slds-p-around--x-small">
        <h2 class="slds-text-heading--small slds-p-vertical--xx-small">link to:</h2>
        <groupware-pane-bean *ngFor="let bean of beans" [bean]="bean" [modelProvider]="{module: bean.module, id: bean.id, data: bean.data}"></groupware-pane-bean>
    </div>
    <div *ngIf="attachments.length > 0" class="slds-p-around--x-small">
        <h2 class="slds-text-heading--small slds-p-vertical--xx-small">attachments:</h2>
        <groupware-pane-attachment *ngFor="let attachment of attachments" [attachment]="attachment"></groupware-pane-attachment>
    </div>
</div>
<div *ngIf="beans.length == 0" class="slds-p-around--medium slds-align--absolute-center">
    {{language.getLabel('MSG_NO_ATTACHMENTS_FOUND')}}
</div>
