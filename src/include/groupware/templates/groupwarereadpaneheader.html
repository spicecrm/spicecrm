<div class="slds-page-header slds-page-header_record-home">
    <div class="slds-page-header__row">
        <div class="slds-page-header__col-title">
            <div class="slds-media">
                <system-icon module="Emails"></system-icon>
                <div class="slds-media__body">
                    <div class="slds-page-header__name">
                        <div class="slds-page-header__name-title">
                            <h1>
                                <span>{{language.getModuleName('Emails')}}</span>
                                <span *ngIf="isArchived" class="slds-page-header__title slds-truncate slds-text-heading--small">{{language.getLabel('LBL_ARCHIVED')}}</span>
                                <span *ngIf="!isArchived" class="slds-page-header__title slds-truncate slds-text-heading--small">{{language.getLabel('LBL_NOT_ARCHIVED')}}</span>
                            </h1>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="slds-page-header__col-actions">
            <div class="slds-page-header__controls">
                <div class="slds-page-header__control">
                    <ul class="slds-button-group-list">
                        <li>
                            <button class="slds-button slds-button_neutral" [disabled]="!canArchive" (click)="archive()">{{language.getLabel('LBL_ARCHIVE')}}</button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
