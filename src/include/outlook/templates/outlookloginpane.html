<div [ngClass]="{'slds-theme--error': configuration.data.startupMode == 'recovery', 'slds-theme--warning': configuration.data.startupMode == 'maintenance', 'slds-theme--default': configuration.data.startupMode != 'maintenance' && configuration.data.startupMode != 'recovery'}" class="slds-grid slds-wrap slds-is-absolute slds-size--1-of-1" style="height:100vh; top: 0px;">
    <div class="slds-align--absolute-center slds-size--1-of-1 slds-large-size--1-of-2">
        <div class="slds-size--1-of-1 slds-medium-size--2-of-3 slds-p-around--medium">
            @if (loggingIn) {
                <div class="slds-align--absolute-center slds-grid--vertical">
                    <div class="slds-text-align_center slds-is-relative slds-p-around--medium" style="height: 400px;">
                        <div class="slds-p-around--small slds-align--absolute-center loader-logo-image">
                            <img width="100%" height="auto" src="./config/loginimage"/>
                        </div>
                        <div class="loaderspinner">
                            <svg class="bag" height="400" width="400">
                                <circle cx="200" cy="200" r="100" stroke-width="5" fill="none"></circle>
                            </svg>
                            <svg class="over" height="400" width="400">
                                <circle cx="200" cy="200" r="100" stroke-width="6" fill="none"></circle>
                            </svg>
                        </div>
                    </div>
                    <div id="loadstatus" class="slds-text-align_center slds-is-relative slds-p-around--medium" style="margin-top: -80px">...loading...</div>
                    <div id="loadermessage" class="slds-text-align_center slds-is-relative slds-p-around--medium slds-text-heading--medium slds-text-color--error"></div>
                </div>
            }
            @else {
                <div class="slds-align--absolute-center slds-p-vertical--medium">
                    <img style="max-height: 150px;" src="./config/loginimage"/>
                </div>
                @if (error) {
                <div class="slds-p-horizontal--medium">
                    <div class="slds-notify slds-notify_alert slds-alert_error">
                        <system-utility-icon size="x-small" icon="error" colorclass=""/>
                        <h2 class="slds-m-left--xx-small">
                        {{error}}
                        </h2>
                    </div>
                </div>
                        }
                @else if (loginService.loggedOut) {
                    <div class="slds-p-horizontal--medium">
                        <div class="slds-notify slds-notify_alert slds-alert_success">
                            <system-utility-icon size="x-small" icon="check" colorclass=""/>
                            <h2 class="slds-m-left--xx-small">
                                Successfully logged out!
                            </h2>
                        </div>
                    </div>
                }
            }
            <div>
            </div>
            <ng-container *ngIf="loginService.session.authData.sessionId">
                <system-loader-progress></system-loader-progress>
            </ng-container>
        </div>
    </div>
    <div class="slds-is-absolute slds-size--1-of-1 slds-align--absolute-center" style="bottom: 10px;">
        <global-copyright></global-copyright>
    </div>
</div>
