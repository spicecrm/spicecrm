@if (!isEditMode) {
    <div [class.slds-is-hovered]="['section','content'].indexOf(spicePageBuilderService.isMouseIn) > -1"
         (mouseenter)="setIsMouseIn(true)" (mouseleave)="setIsMouseIn(false)" tabindex="-1" class="spice-drop-zone">
        <div class="spice-drop-zone-label spice-drop-zone-label-bottom">
            <div class="slds-media slds-media_center">
                <div class="slds-media__figure">
                    <system-icon icon="full_width_view" sprite="utility" size="x-small"
                                 divClass="slds-current-color"></system-icon>
                </div>
                <div class="slds-media__body">
                    <h2 class="slds-truncate">
                        <system-label label="LBL_SECTION"></system-label>
                    </h2>
                </div>
                <button (click)="saveAsCustom()" system-title="LBL_SAVE" class="slds-button slds-button--icon">
                    <system-button-icon icon="save" [inverse]="true"></system-button-icon>
                </button>
                <button cdkDragHandle system-title="LBL_MOVE" class="slds-button slds-button--icon slds-m-left--none">
                    <system-button-icon icon="move" [inverse]="true"></system-button-icon>
                </button>
                <button (click)="edit()" system-title="LBL_EDIT"
                        class="slds-button slds-button--icon slds-m-left--none">
                    <system-button-icon icon="edit" [inverse]="true"></system-button-icon>
                </button>
                <button (click)="delete$.emit()" system-title="LBL_DELETE"
                        class="slds-button slds-button--icon slds-m-right--xx-small slds-m-left--none">
                    <system-button-icon icon="delete" [inverse]="true"></system-button-icon>
                </button>
            </div>
        </div>
        <article [ngStyle]="style" class="spice-drop-zone-content slds-grid">
            <spice-page-builder-element-column *ngFor="let column of section.children; trackBy: trackByFn"
                                               [column]="column" [style.width]="column.attributes.width"
                                               class="spice-display-block slds-height_full"></spice-page-builder-element-column>
        </article>
    </div>
} @else {
    <div class="slds-height_full">
        <div class="slds-size--1-of-1 slds-p-horizontal--xx-small slds-p-vertical--x-small">
            <spice-page-builder-element-attributes [attributesList]="mainAttributesList" [element]="section"/>
        </div>
        @for ( column of section.children; track column; let index = $index) {
            <h3 class="slds-section__title slds-theme_shade"><system-label label="LBL_COLUMN"/>&nbsp;{{index}}</h3>
            <div class="slds-size--1-of-1 slds-grid slds-wrap">
                <spice-page-builder-element-attributes [attributesList]="columnAttributesList" [element]="column"/>
            </div>
        }
        <system-section titlelabel="LBL_STYLING" [expanded]="false">
            <div class="slds-size--1-of-1 slds-height_full slds-p-horizontal--xx-small slds-p-vertical--x-small slds-scrollable--y">
                <spice-page-builder-element-attributes [attributesList]="attributesList" [element]="section"/>
            </div>
        </system-section>
    </div>
}
