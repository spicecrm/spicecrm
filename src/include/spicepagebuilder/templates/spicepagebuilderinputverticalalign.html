<div class="slds-form-element">
    <label class="slds-form-element__label">
        <system-label [label]="label"></system-label>
    </label>
    <div class="slds-select_container slds-size--1-of-1">
        <select class="slds-select" [(ngModel)]="value" (ngModelChange)="emitValue()">
            <option value=""><system-label label="LBL_INHERITED"/></option>
            <option value="baseline"><system-label label="LBL_ALIGN_BASELINE"/></option>
            <option value="top"><system-label label="LBL_ALIGN_TOP"/></option>
            <option value="middle"><system-label label="LBL_ALIGN_MIDDLE"/></option>
            <option value="bottom"><system-label label="LBL_ALIGN_BOTTOM"/></option>
        </select>
    </div>
</div>
