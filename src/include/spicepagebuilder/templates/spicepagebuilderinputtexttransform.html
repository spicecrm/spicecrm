<div class="slds-form-element">
    <label class="slds-form-element__label">
        <system-label [label]="label"></system-label>
    </label>
    <div class="slds-select_container slds-size--1-of-1">
        <select class="slds-select" [(ngModel)]="value" (ngModelChange)="emitValue()">
            <option value=""><system-label label="LBL_NONE"/></option>
            <option value="capitalize"><system-label label="LBL_TEXTTRANSFORM_CAPITALIZE"/></option>
            <option value="uppercase"><system-label label="LBL_TEXTTRANSFORM_UPPERCASE"/></option>
            <option value="lowercase"><system-label label="LBL_TEXTTRANSFORM_LOWERCASE"/></option>
        </select>
    </div>
</div>
