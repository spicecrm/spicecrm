<div class="slds-size--1-of-1 slds-height_full slds-p-horizontal--xx-small slds-p-vertical--x-small slds-scrollable--y">
    @for (styleAttributeGroup of attributesList; track styleAttributeGroup){
    <div class="slds-size--1-of-1 slds-grid slds-wrap">
            @for (styleAttribute of styleAttributeGroup; track styleAttribute.name){
                @switch (styleAttribute.type){
                    @case ('textSuffix'){
                        <spice-page-builder-input-text [(ngModel)]="element.attributes[styleAttribute.name]" [label]="styleAttribute.name" [suffix]="spicePageBuilderService.defaultSuffix" class="slds-p-horizontal--xxx-small slds-size--1-of-2"/>
                    }
                    @case ('width'){
                        <spice-page-builder-input-width [(ngModel)]="element.attributes[styleAttribute.name]" [label]="styleAttribute.name" class="slds-p-horizontal--xxx-small slds-size--1-of-2"/>
                    }
                    @case ('sides'){
                        <spice-page-builder-input-sides [(ngModel)]="element.attributes[styleAttribute.name]" [label]="styleAttribute.name" class="slds-p-horizontal--xxx-small slds-size--1-of-2"/>
                    }
                    @case ('color'){
                        <spice-page-builder-input-color [(ngModel)]="element.attributes[styleAttribute.name]" [label]="styleAttribute.name" class="slds-p-horizontal--xxx-small slds-size--1-of-2"/>
                    }
                    @case ('halign'){
                        <spice-page-builder-input-horizontal-align [(ngModel)]="element.attributes[styleAttribute.name]" [label]="styleAttribute.name" class="slds-p-horizontal--xxx-small slds-size--1-of-2"/>
                    }
                    @default {
                        <spice-page-builder-input-text [(ngModel)]="element.attributes[styleAttribute.name]" [label]="styleAttribute.name" class="slds-p-horizontal--xxx-small slds-size--1-of-2"/>
                    }
                }
            }
    </div>
    }
</div>
