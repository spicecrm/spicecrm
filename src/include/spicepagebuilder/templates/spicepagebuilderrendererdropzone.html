<div class="slds-drop-zone__container slds-height_full slds-is-hovered" tabindex="-1">
    <div class="slds-drop-zone__label slds-drop-zone__label_container">
        <div class="slds-media slds-media_center">
            <div *ngIf="!!icon" class="slds-media__figure">
                <system-icon [icon]="icon" sprite="utility" size="x-small" divClass="slds-current-color"></system-icon>
            </div>
            <div class="slds-media__body">
                <h2>
                    <button class="slds-drop-zone__label_button slds-button_reset">
                        <span>{{label}}</span>
                    </button>
                </h2>
            </div>
        </div>
    </div>
    <article class="slds-grid slds-height_full">
        <ng-content></ng-content>
    </article>
    <div class="slds-drop-zone__actions">
        <div class="slds-button-group" role="group">
            <button cdkDragHandle class="slds-button slds-button_icon slds-button_icon-brand slds-button_icon-x-small" system-title="LBL_MOVE">
                <system-button-icon icon="move" addclasses="slds-icon"></system-button-icon>
            </button>
            <button (click)="delete$.emit()" class="slds-button slds-button_icon slds-button_icon-brand slds-button_icon-x-small" system-title="LBL_CLOSE">
                <system-button-icon icon="close" addclasses="slds-icon"></system-button-icon>
            </button>
        </div>
    </div>
</div>
