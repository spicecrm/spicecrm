<div class="slds-grid slds-scrollable--y slds-height_full slds-p-around--large">
    <div class="slds-grid slds-grow slds-height_full" [ngStyle]="spicePageBuilderService.page.style">
        <div *ngFor="let container of spicePageBuilderService.page.containers; trackBy: trackByFn" [ngStyle]="container.style" [ngClass]="'slds-size--1-of-' + spicePageBuilderService.page.containers?.length" class="slds-grid slds-height_full slds-size--1-of-1">
            <spice-page-builder-renderer-container (domRendered$)="onContainerRender(dropList)" cdkDropList #dropList="cdkDropList" (cdkDropListDropped)="onDrop(container, $event)" [cdkDropListEnterPredicate]="sectionPredicate" [cdkDropListData]="container" [container]="container" class="slds-height_full slds-size--1-of-1"></spice-page-builder-renderer-container>
        </div>
        <div *ngIf="spicePageBuilderService.page.containers?.length == 0" class="slds-align--absolute-center slds-height_full slds-size--1-of-1 slds-text-title--caps">
            Drop Container Here
        </div>
    </div>
</div>
