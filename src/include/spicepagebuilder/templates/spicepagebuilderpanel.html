<div class="slds-grid slds-grid--vertical slds-height_full slds-p-around--x-small slds-scrollable--y">
    <div style="height: 50%">
        <system-section titlelabel="Sections" [alwaysExpanded]="true" class="spice-collapsible-tab-grow">
            <div class="slds-grid slds-size--1-of-1 slds-grid--vertical slds-height_full slds-p-bottom--small">
                <div *ngFor="let section of sections; trackBy: trackByFn" cdkDropList cdkDropListSortingDisabled [cdkDropListEnterPredicate]="noReturnPredicate" [cdkDropListData]="sections" (cdkDropListExited)="onDragExit('section', $event)" class="slds-grow slds-p-around--xx-small slds-grid slds-grid--vertical">
                    <div>
                        {{section.columns?.length}} Columns
                    </div>
                    <div cdkDrag [cdkDragData]="section" class="slds-grid slds-grow slds-theme--default slds-drag--preview" style="border: 2px solid #00aaff; cursor: move">
                        <div *ngFor="let item of section.columns; trackBy: trackByFn; let last = last" [style.border-right]="!last ? '2px solid #00aaff' : 0" class="slds-grow"></div>
                    </div>
                </div>
            </div>
        </system-section>
    </div>
    <div style="height: 50%">
        <system-section titlelabel="Content Elements" [alwaysExpanded]="true" class="spice-collapsible-tab-grow">
            <div class="slds-grid slds-size--1-of-1 slds-height_full slds-p-around--xx-small">
                <div *ngFor="let contentElement of contentElements; trackBy: trackByFn" cdkDropList cdkDropListSortingDisabled [cdkDropListEnterPredicate]="noReturnPredicate" [cdkDropListData]="contentElements" (cdkDropListExited)="onDragExit('content', $event)" class="slds-p-around--xxx-small">
                    <div cdkDrag [cdkDragData]="contentElement" class="slds-drag--preview slds-p-around--x-small slds-card" style="cursor: move">
                        <system-utility-icon [icon]="contentElement.type" size="large"></system-utility-icon>
                    </div>
                </div>
            </div>
        </system-section>
    </div>
</div>
