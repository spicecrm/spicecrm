<div class="slds-form-element">
    <label class="slds-form-element__label">
        <system-label [label]="label"></system-label>
    </label>
    <div class="slds-form-element__control" [class.slds-input-has-fixed-addon]="!!suffix">
        <input [type]="!suffix ? 'text' : 'number'" [(ngModel)]="value" (ngModelChange)="emitJoinedValue()" class="slds-input">
        <span *ngIf="!!suffix" class="slds-form-element__addon">
            {{suffix}}
        </span>
    </div>
</div>
