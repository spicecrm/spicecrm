<system-modal>
    <system-modal-header (close)="close()"></system-modal-header>
    <system-modal-content margin="none">
        <table class="slds-table slds-table_bordered slds-table_header-fixed slds-theme--default">
            <thead>
            <tr class="slds-text-title_caps">
                <th scope="col">
                    <div class="slds-truncate slds-grid slds-grid_vertical-align-center slds-p-around--x-small">
                        <system-label label="LBL_CRM_FIELD"></system-label>
                    </div>
                </th>
                <th scope="col">
                    <div class="slds-truncate slds-grid slds-grid_vertical-align-center slds-p-around--x-small">
                        <system-label label="LBL_MICROSOFT_FIELD"></system-label>
                    </div>
                </th>
                <th scope="col">
                    <div class="slds-truncate slds-grid slds-grid_vertical-align-center slds-p-around--x-small">
                        <system-label label="LBL_TYPE"></system-label>
                    </div>
                </th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let keyValue of mapping | keyvalue">
                <th scope="row">
                    <div class="slds-truncate">
                        {{ mapping[keyValue.key].beanField }}
                    </div>
                </th>
                <th scope="row">
                    <div class="slds-truncate">
                        {{ mapping[keyValue.key].itemField }}
                    </div>
                </th>
                <th scope="row">
                    <div class="slds-truncate">
                        {{ mapping[keyValue.key].type || 'string' }}
                    </div>
                </th>
            </tr>
            </tbody>
        </table>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CLOSE"></system-label></button>
    </system-modal-footer>
</system-modal>
