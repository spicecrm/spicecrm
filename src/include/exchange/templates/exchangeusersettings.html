<h2 class="slds-text-heading_small">
    <system-label label="LBL_EXCHANGE_SETTINGS"></system-label>
</h2>
<div class="slds-m-vertical--x-small slds-text-body--small">
    <system-label label="LBL_MICROSOFT_LOG_IN"></system-label>
    <img [ngStyle]="!microsoftLoggedIn ? {'-webkit-filter': 'grayscale(1)','filter': 'grayscale(1)'} : {}" class="slds-m-left--x-small" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABUAAAAVCAYAAACpF6WWAAAACXBIWXMAAAsSAAALEgHS3X78AAAAVElEQVQ4jWP8//8/A7UBC8i8z4HKBE3mXX+XsWE3I0F1Da7/GZmo7kwGBoZRQ0cNpTKgXY5iXPqBoMn/owUYGXYRzlEMbqM5atTQoWEo9XMUAwMDAGSOGCOVddy/AAAAAElFTkSuQmCC" alt="microsoft logo">
</div>
<system-collapsable-tab tabtitle="LBL_MODULES" [collapsible]="false">
    <table width="100%" class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped slds-size--1-of-1 slds-table--fixed-layout">
        <thead>
            <tr class="slds-line-height_reset">
                <th class="" scope="col">
                    <div class="slds-truncate"><system-label label="LBL_MODULE"></system-label></div>
                </th>
                <th class="" scope="col">
                    <div class="slds-truncate"><system-label label="LBL_ACTIVE"></system-label></div>
                </th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let module of modules" class="slds-hint-parent">
                <td>
                    <div class="slds-truncate"><system-label-modulename [module]="module.moduleName"></system-label-modulename>
                        <span *ngIf="module.moduleName == 'Tasks' && userconfig[module.sysmodule_id]?.sync_config?.toDoList?.display" class="slds-m-left--xx-small">
                            ( {{userconfig[module.sysmodule_id].sync_config.toDoList.display}} )
                        </span>
                        <span *ngIf="!microsoftLoggedIn && module.moduleName == 'Tasks'" class="slds-m-left--xx-small slds-text-color--error">
                            <system-label label="MSG_MSGRAPH_TASK_SYNC_DISABLED"></system-label>
                        </span>
                    </div>
                </td>
                <td>
                    <div class="slds-grid">
                        <system-checkbox-toggle #checkbox [ngModel]="!!userconfig[module.sysmodule_id]" [disabled]="!microsoftLoggedIn && module.moduleName == 'Tasks'" (ngModelChange)="toggleActive(module, $event, checkbox)"></system-checkbox-toggle>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
</system-collapsable-tab>
<system-collapsable-tab tabtitle="LBL_SUBSCRIPTIONS" [collapsible]="false">
    <table width="100%" class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped slds-size--1-of-1 slds-table--fixed-layout">
        <thead>
            <tr class="slds-line-height_reset">
                <th class="" scope="col">
                    <div class="slds-truncate"><system-label label="LBL_FOLDER"></system-label></div>
                </th>
                <th class="" scope="col">
                    <div class="slds-truncate"><system-label label="LBL_LAST_ACTIVE_GMT"></system-label></div>
                </th>
                <th class="" scope="col">
                    <div class="slds-truncate"><system-label label="LBL_SUBSCRIPTION_ID"></system-label></div>
                </th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let subscription of subscriptions" class="slds-hint-parent">
                <td>
                    <div class="slds-truncate">{{subscription.folder_id}}</div>
                </td>
                <td>
                    <div class="slds-truncate slds-badge" [ngClass]="{'slds-theme--error': timedout(subscription.last_active)}">{{subscription.last_active}}</div>
                    <button *ngIf="session.authData.userId == model.id" [disabled]="isLoading == subscription.subscriptionid" (click)="refreshSubscription(subscription)" class="slds-button slds-button_icon slds-button--icon-border slds-m-left--xx-small">
                        <system-button-icon icon="refresh"></system-button-icon>
                    </button>
                </td>
                <td>
                    <div class="slds-truncate">{{subscription.subscriptionid}}</div>
                </td>
            </tr>
        </tbody>
    </table>
</system-collapsable-tab>
