<div class="slds-card slds-card_boundary">
    <div *ngIf="!loaded" [title]="language.getLabel('LBL_CHAT')" style="width:100%;" class="slds-align--absolute-center slds-p-around--xx-small">
        <system-spinner size="12"></system-spinner>
    </div>
    <div class="slds-page-header" style="display: none;">
        <label class="slds-truncate slds-float_left slds-form-element__label">Mailbox</label>
        <div class="slds-form-element ng-star-inserted">
            <div class="slds-form-element__control">
                <div class="slds-select_container slds-m-vertical--xx-small">
                    <select class="slds-select ng-untouched ng-pristine ng-valid" #mailbox_id  [value]="mailboxid" [(ngModel)]="mailboxid"><!----><!---->
                        <option *ngFor="let mailbox of mailboxes" value="{{mailbox.id}}">{{mailbox.name}}</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
    <div style="overflow-y: scroll;height:400px;" #scrollMe [scrollTop]="scrollMe.scrollHeight">
        <div *ngIf="messages.length == 0" class="slds-align--absolute-center slds-height_full"  style="height: 100%;"><system-illustration-no-records></system-illustration-no-records></div>
        <div class="slds-form-element" *ngFor="let msg of messages">
            <section role="log" class="slds-chat">
                <ul class="slds-chat-list">
                    <li class="slds-chat-listitem slds-chat-listitem_inbound">
                        <div *ngIf="msg.direction == 'i'" class="slds-chat-message">
                            <div class="slds-chat-message__body">
                                <div class="slds-chat-message__text slds-chat-message__text_inbound">
                                    <span><div [innerHTML]="msg.attachments"  [ngStyle]="{'width': msg.style=='0' ? '' : '100px'}"></div>{{msg.messages}}</span></div>
                                <div class="slds-chat-message__meta" aria-label="inbound user and time">{{msg.in_time}}</div>
                            </div>
                        </div>
                    </li>
                </ul>
            </section>
            <section role="log" class="slds-chat">
                <ul class="slds-chat-list">
                    <li class="slds-chat-listitem slds-chat-listitem_outbound">
                        <div *ngIf="msg.direction == 'o'" class="slds-chat-message">
                            <div class="slds-chat-message__body">
                                <div class="slds-chat-message__text slds-chat-message__text_outbound"><span>{{msg.messages}}</span></div>
                                <div class="slds-chat-message__meta" aria-label="outbound user and time">{{msg.out_time}}</div>
                            </div>
                        </div>
                    </li>
                </ul>
            </section>
        </div>
    </div>
    <div class="slds-form-element" style="background-color: #f3f2f2;padding: 10px;">
        <div class="slds-form-element__control" style="height: 84px;">
            <textarea #textarea_id id="textarea-id-01" (focus)="onFocus()" [rows]="multipleline" placeholder="Type here…" class="slds-textarea" style="width: 84%;" [value]="description" [(ngModel)]="description"></textarea>
            <button class="slds-button  slds-button--brand" (click)="sendMessage(textarea_id.value,mailbox_id.value)" [ngStyle]="{'margin-bottom': multipleline=='1' ? '30px' : '80px'}">Send</button>
        </div>
    </div>
</div>
