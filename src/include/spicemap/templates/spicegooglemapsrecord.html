<div style="width: 100%" class="slds-grid slds-grid--vertical" tobottomnoscroll>
    <div>
        <div class="slds-grid slds-p-bottom--x-small">
            <div class="slds-radio_button-group slds-m-right--x-small">
                <span class="slds-button slds-radio_button">
                    <input type="radio" name="useMapForOption" value="search" [(ngModel)]="useMapFor" id="spice-google-maps-record-use-map-for-search">
                    <label class="slds-radio_button__label slds-height_full" for="spice-google-maps-record-use-map-for-search">
                        <span class="slds-radio_faux" style="padding: 0 .5rem;">
                            <system-utility-icon icon="search" size="x-small" [colorclass]="useMapFor == 'search' ? ' ' : 'slds-icon-text-default'"></system-utility-icon>
                        </span>
                    </label>
                </span>
                <span class="slds-button slds-radio_button">
                    <input type="radio" name="useMapForOption" value="direction" [(ngModel)]="useMapFor" id="spice-google-maps-record-use-map-for-direction">
                    <label class="slds-radio_button__label slds-height_full" for="spice-google-maps-record-use-map-for-direction">
                        <span class="slds-radio_faux" style="padding: 0 .5rem;">
                            <system-utility-icon icon="travel_and_places" size="x-small" [colorclass]="useMapFor == 'direction' ? ' ' : 'slds-icon-text-default'"></system-utility-icon>
                        </span>
                    </label>
                </span>
            </div>
            <div *ngIf="useMapFor == 'search'; else directionToolsContainer" class="slds-form-element slds-grid slds-grid--vertical-align-center slds-grow">
                <object-list-types></object-list-types>
                <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon--right slds-grow">
                    <system-utility-icon icon="search" size="x-small" addclasses="slds-input__icon"></system-utility-icon>
                    <input type="text" class="slds-input" [(ngModel)]="listSearchTerm" autocomplete="off" (keyup.enter)="triggerSearch()" [placeholder]="language.getModuleName(modelList.module)">
                </div>
                <button class="slds-button slds-button--neutral slds-button--icon-border  slds-m-left--xx-small slds-m-right--xxx-small" (click)="modelList.reLoadList()">
                    <system-button-icon [icon]="'refresh'"></system-button-icon>
                </button>
                <object-listview-aggregates-button></object-listview-aggregates-button>
            </div>
            <ng-template #directionToolsContainer>
                <div class="slds-grid slds-grow slds-grid--vertical-align-center">
                    <div class="slds-radio_button-group slds-m-right--x-small">
                    <span class="slds-button slds-radio_button">
                        <input type="radio" value="myLocation" [(ngModel)]="directionStartType" [disabled]="isLoadingDirection" name="directionStartTypeOption" id="spice-google-maps-record-direction-start-type-my-location">
                        <label class="slds-radio_button__label slds-height_full" for="spice-google-maps-record-direction-start-type-my-location">
                            <span class="slds-radio_faux">
                                {{language.getLabel('LBL_MY_LOCATION')}}
                            </span>
                        </label>
                    </span>
                        <span class="slds-button slds-radio_button">
                        <input type="radio" value="office" [(ngModel)]="directionStartType" [disabled]="isLoadingDirection" name="directionStartTypeOption" id="spice-google-maps-record-direction-start-type-office">
                        <label class="slds-radio_button__label slds-height_full" for="spice-google-maps-record-direction-start-type-office">
                            <span class="slds-radio_faux">
                                {{language.getLabel('LBL_OFFICE')}}
                            </span>
                        </label>
                    </span>
                        <span class="slds-button slds-radio_button">
                        <input type="radio" value="address" [(ngModel)]="directionStartType" [disabled]="isLoadingDirection" name="directionStartTypeOption" id="spice-google-maps-record-direction-start-type-address">
                        <label class="slds-radio_button__label slds-height_full" for="spice-google-maps-record-direction-start-type-address">
                            <span class="slds-radio_faux">
                                {{language.getLabel('LBL_ADDRESS')}}
                            </span>
                        </label>
                    </span>
                    </div>
                    <div class="slds-grow">
                        <system-googleplaces-autocomplete [disabled]="!directionStartType || directionStartType != 'address' || isLoadingDirection" (address)="defineMapRouteFromSearchAddress($event)"></system-googleplaces-autocomplete>
                    </div>
                </div>
            </ng-template>
        </div>
        <div class="slds-grid slds-theme--shade slds-p-around--xx-small slds-border--bottom slds-border--top slds-border--left slds-border--right">
            <div *ngIf="useMapFor == 'search'; else directionInfoContainer" class="slds-grid">
                <object-listview-header-details></object-listview-header-details>
                <span class="slds-m-left--x-small slds-truncate">( {{records.length}} ) {{language.getLabel('MSG_RECORDS_FOUND_WITH_GEO_DATA')}}</span>
                <a *ngIf="canLoadMore" (click)="loadMore()" class="slds-text-link slds-m-left--x-small">
                    {{language.getLabel('LBL_MORE')}}
                </a>
            </div>
            <ng-template #directionInfoContainer>
                <system-utility-icon [icon]="(mapOptions.directionTravelMode == 'DRIVING' && !!directionResult) ? 'travel_and_places' : 'info_alt'" size="x-small" class="slds-m-right--x-small"></system-utility-icon>
                <span *ngIf="directionResult; else infoTextContainer">
                    {{directionResult.duration?.hours}} h {{directionResult.duration?.minutes}} min ( {{directionResult.distance}} m )
                </span>
                <ng-template #infoTextContainer>
                    <span class="slds-truncate">
                        {{language.getLabel('MSG_SELECT_DIRECTION_TYPE')}}
                    </span>
                </ng-template>
            </ng-template>
        </div>
    </div>
    <div class="slds-is-relative slds-grow slds-grid slds-grid--vertical" [overlayLoadingSpinner]="isLoading || isLoadingDirection">
        <spice-google-maps [options]="mapOptions" [records]="records" [routes]="routes" (radiusChange)="onRadiusChange($event)" (directionChange)="setDirectionResult($event)" style="display: block" class="slds-grow"></spice-google-maps>
        <div @animatepanel *ngIf="modelList.displayAggregates" class="slds-is-absolute slds-panel slds-panel--filters slds-filters__body slds-nowrap  slds-scrollable--y" style="width: 320px; height: 100%; top:0; right: 0;z-index: 99;" [modelProvider]="{module: modelList.module}">
            <div class="slds-filters__body slds-grid_vertical">
                <div class="slds-m-vertical--xx-small" *ngFor="let aggregate of listAggregates">
                    <object-listview-aggregate [aggregate]="aggregate"></object-listview-aggregate>
                </div>
            </div>
        </div>
    </div>
</div>
