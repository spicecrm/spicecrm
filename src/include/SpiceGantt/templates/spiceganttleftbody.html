<div *ngFor="let item of spiceGanttService.items" class="slds-scrollable--none slds-border--right">
    <div spice-gantt-tree-task-item class="slds-hint-parent"
         tabindex="0" role="row"
         *ngIf="spiceGanttService.getParent(item.id).expanded"
         [level]="item.level"
         [id]="item.id"
         [name]="item.name"
         [start]="item.start"
         [end]="item.end"
         [type]="item.type"
         [expanded]="item.expanded"
    ></div>
</div>
