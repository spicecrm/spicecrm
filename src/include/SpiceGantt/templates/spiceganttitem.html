<ng-container *ngFor="let item of items">
    <spice-gantt-item [id]="item.name" [name]="item.name" [start]="item.start" [end]="item.end" [type]="item.type"
                      [parent]="item.parent" [items]="item.items" [expanded]="item.expanded"
                      [progress]="item.progress"/>
</ng-container>
