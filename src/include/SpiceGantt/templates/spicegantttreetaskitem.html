<div class="slds-grid" style="height: 40px">
    <div class="slds-col slds-large-size--1-of-7">
        <button [style]="{'padding-left': 10 + (level * 5) + 'px'}"
                *ngIf="spiceGanttService.getChildren(id).length"
                class="slds-button slds-button--icon slds-button--icon-x-small slds-m-bottom--x-small"
                [disabled]="!isExpandable" (click)="toggleNode()">
            <system-button-icon [icon]="!expanded ? 'chevronright' : 'chevrondown'"></system-button-icon>
        </button>
    </div>
    <div class="slds-col slds-large-size--2-of-7">{{ name }}</div>
    <div class="slds-col slds-large-size--2-of-7">
        <system-display-datetime [date]="start"></system-display-datetime>
    </div>
    <div class="slds-col slds-large-size--2-of-7">
        <system-display-datetime [date]="end"></system-display-datetime>
    </div>
</div>
