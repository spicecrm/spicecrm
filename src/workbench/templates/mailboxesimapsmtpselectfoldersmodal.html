<system-modal>
    <system-modal-header (close)="cancel()">{{language.getLabel(model.module, 'LBL_MAILBOX_FOLDERS')}}</system-modal-header>
    <system-modal-content>
        <div class="slds-grid slds-wrap slds-grid--pull-padded">
            <div class="slds-col">
                <div class="slds-form-element">
                    <label class="slds-truncate slds-form-element__label">Inbox folder</label>
                    <select [disabled]="mailboxes.length == 0" [(ngModel)]="model.data.settings.imap_inbox_dir"
                            type="text" class="slds-select ng-pristine ng-valid">
                        <option *ngFor="let mailbox of mailboxes" value="{{ mailbox }}">{{ mailbox }}</option>
                    </select>
                </div>
                <div class="slds-form-element">
                    <label class="slds-truncate slds-form-element__label">Sent folder</label>
                    <select [disabled]="mailboxes.length == 0" [(ngModel)]="model.data.settings.imap_sent_dir"
                            type="text" class="slds-select ng-pristine ng-valid">
                        <option *ngFor="let mailbox of mailboxes" value="{{ mailbox }}">{{ mailbox }}</option>
                    </select>
                </div>
                <div class="slds-form-element">
                    <label class="slds-truncate slds-form-element__label">Trash folder</label>
                    <select [disabled]="mailboxes.length == 0" [(ngModel)]="model.data.settings.imap_trash_dir"
                            type="text" class="slds-select ng-pristine ng-valid">
                        <option *ngFor="let mailbox of mailboxes" value="{{ mailbox }}">{{ mailbox }}</option>
                    </select>
                </div>
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="cancel()">{{language.getLabel('LBL_CANCEL')}}</button>
        <button class="slds-button slds-button--brand" (click)="save()">{{language.getLabel('LBL_SAVE')}}</button>
    </system-modal-footer>
</system-modal>
