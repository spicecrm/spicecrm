<system-modal size="large">
    <system-modal-header (close)="closeModal()">{{line.date}} • {{line.time}} • {{username}} • {{line.route}}</system-modal-header>
    <system-modal-content style="height:100%">
        <system-spinner *ngIf="isLoading" class="slds-m-top--medium" style="display:block"></system-spinner>
        <div *ngIf="isLoaded">
            <div class="slds-m-bottom--x-small slds-m-horizontal--x-small slds-text-font_monospace" style="overflow-wrap:break-word">{{line.routeArgs}}</div>
            <div class="slds-m-bottom--x-small slds-m-horizontal--x-small slds-text-font_monospace" style="overflow-wrap:break-word">{{line.urlParams}}</div>
            <div class="slds-m-bottom--x-small slds-m-horizontal--x-small slds-text-font_monospace" style="overflow-wrap:break-word">{{line.postParams}}</div>
            <div class="slds-m-bottom--x-small slds-m-horizontal--x-small slds-text-font_monospace" style="overflow-wrap:break-word">{{line.response}}</div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="closeModal()">{{language.getLabel('LBL_CLOSE')}}</button>
    </system-modal-footer>
</system-modal>
