<div *ngIf="!!module && module != '*'" class="slds-form-element slds-m-vertical--xxx-small">
    <workbench-config-label [option]="option.option" [description]="option.description"></workbench-config-label>
    <div class="slds-grid">
        <div class="slds-form-element__control slds-p-left--xxx-small slds-size--2-of-3">
            <div class="slds-select_container">
                <select  [disabled]="!view.isEditMode()" class="slds-select" [(ngModel)]="configValues[option.option]">
                    <option></option>
                    <option *ngFor="let kanban of moduleKanbans" [value]="kanban.id">{{kanban.name}}</option>
                    <optgroup [label]="'custom ' + language.getLabel('LBL_ACTIONSET')" *ngIf="(moduleKanbans|systemmodulecustompipe:module).length > 0">
                        <option *ngFor="let sysActionset of moduleKanbans|systemmodulecustompipe:module" [value]="sysActionset.id">{{sysActionset.name}}</option>
                    </optgroup>
                    <optgroup [label]="'global '+ language.getLabel('LBL_ACTIONSET')"  *ngIf="(moduleKanbans|systemmoduleglobalpipe:module).length > 0">
                        <option *ngFor="let sysActionset of moduleKanbans|systemmoduleglobalpipe:module" [value]="sysActionset.id">{{sysActionset.name}}</option>
                    </optgroup>
                </select>
            </div>
        </div>
    </div>
</div>
