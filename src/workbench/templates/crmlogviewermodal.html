<system-modal size="large">
    <system-modal-header>{{date}} • {{time}} • {{processId}} • {{username}} • {{level}}</system-modal-header>
    <system-modal-content margin="none" style="height:100%">
        <div class="slds-p-around--small slds-text-font_monospace">{{text}}</div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()">{{language.getLabel('LBL_CLOSE')}}</button>
    </system-modal-footer>
</system-modal>
