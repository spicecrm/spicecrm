<div role="dialog" tabindex="-1" aria-labelledby="header43" class="slds-modal slds-fade-in-open">
    <div class="slds-modal__container">
        <div class="slds-modal__header slds-theme--shade">
            <button class="slds-button slds-modal__close slds-button--icon-inverse" title="Close" (click)="cancelDialog()">
                <system-button-icon [icon]="'close'" [size]="'large'"></system-button-icon>
            </button>
            <h2 id="header43" class="slds-text-heading--medium">Add Component</h2>
        </div>
        <div class="slds-modal__content slds-p-around--medium">
            <div class="slds-grid">
                <div class="slds-form-element slds-size--1-of-2 slds-p-right--xx-small">
                    <label class="slds-form-element__label" >{{language.getLabel('LBL_MODULE')}}</label>
                    <div class="slds-form-element__control">
                        <div class="slds-select_container">
                            <select  class="slds-select" [(ngModel)]="systemmodule">
                                <option *ngFor="let module of systemmodules" [value]="module.id">{{module.module}}</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="slds-form-element slds-size--1-of-2 slds-p-left--xx-small">
                    <label class="slds-form-element__label" >{{language.getLabel('LBL_COMPONENT')}}</label>
                    <div class="slds-form-element__control">
                        <div class="slds-select_container">
                            <select  class="slds-select" [(ngModel)]="component">
                                <option *ngFor="let component of components" [value]="component.component">{{component.component}}</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="slds-modal__footer">
            <button class="slds-button slds-button--neutral" (click)="cancelDialog()">{{language.getLabel('LBL_CANCEL')}}</button>
            <button class="slds-button slds-button--brand" (click)="add()">{{language.getLabel('LBL_ADD')}}</button>
        </div>
    </div>
</div>
