<system-modal>
    <system-modal-header (close)="close()"><system-label label="LBL_ADD_VALIDATION"/></system-modal-header>
    <system-modal-content>
        <div class="slds-grid">
            <div class="slds-form-element__control slds-size--2-of-4 slds-p-right--xxx-small">
                <label class="slds-form-element__label"><abbr class="slds-required">* </abbr><system-label label="LBL_NAME"/></label>
                <system-input-text [(ngModel)]="fieldValidation().name"/>
            </div>
            <div class="slds-form-element__control slds-size--1-of-4 slds-p-left--xxx-small">
                <label class="slds-form-element__label"><abbr class="slds-required">* </abbr><system-label label="LBL_SCOPE"/></label>
                <div class="slds-select_container">
                    <select class="slds-select" [(ngModel)]="fieldValidation().scope">
                        <option value="g"><system-label label="LBL_GLOBAL"/></option>
                        <option value="c"><system-label label="LBL_CUSTOM"/></option>
                    </select>
                </div>
            </div>
            <div class="slds-form-element__control slds-grid slds-size--1-of-4 slds-p-left--xxx-small">
                <div class="slds-grow">
                    <label class="slds-form-element__label"><system-label label="LBL_SORTEDBY"/></label>
                    <div class="slds-select_container">
                        <select class="slds-select" [(ngModel)]="fieldValidation().order_by">
                            <option value="sequence"><system-label label="LBL_SEQUENCE"/></option>
                            <option value="enumvalue"><system-label label="LBL_VALUE"/></option>
                            <option value="label"><system-label label="LBL_LABEL"/></option>
                        </select>
                    </div>
                </div>
                <div class="slds-m-left--xx-small">
                    <label class="slds-form-element__label"><system-label label="LBL_DIRECTION"/></label>
                    <div class="slds-select_container">
                        <select class="slds-select" [(ngModel)]="fieldValidation().sort_flag">
                            <option value="asc"><system-label label="LBL_ASCENDING"/></option>
                            <option value="desc"><system-label label="LBL_DESCENDING"/></option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="slds-grid">
            <div class="slds-large-size--1-of-2 slds-p-right--xxx-small slds-form-element__control">
                <label class="slds-form-element__label"><abbr class="slds-required">* </abbr><system-label label="LBL_TYPE"/></label>
                <div class="slds-select_container">
                    <select class="slds-select" [(ngModel)]="fieldValidation().validation_type">
                        <option value="options"><system-label label="LBL_OPTIONS"/></option>
                        <option value="range"><system-label label="LBL_RANGE"/></option>
                    </select>
                </div>
            </div>
            <div class="slds-size--1-of-4 slds-p-right--xxx-small slds-form-element__control">
                <label class="slds-form-element__label"><system-label label="LBL_PACKAGE"/></label>
                <system-input-package [(ngModel)]="fieldValidation().package"/>
            </div>
            <div class="slds-size--1-of-4 slds-p-left--xxx-small slds-form-element__control">
                <label class="slds-form-element__label"><system-label label="LBL_VERSION"/></label>
                <system-input-version [(ngModel)]="fieldValidation().version"/>
            </div>
        </div>
        <label class="slds-form-element__label"><system-label label="LBL_COMMENT"/></label>
        <textarea class="slds-textarea" [ngModel]="fieldValidation().description"></textarea>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CANCEL"/></button>
        <button class="slds-button slds-button--neutral" (click)="save()"><system-label label="LBL_SAVE"/></button>
    </system-modal-footer>
</system-modal>
