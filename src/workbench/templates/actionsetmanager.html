<workbench-header titlelabel="LBL_ACTIONSET_MANAGER"></workbench-header>
<div class="slds-p-around--small slds-border--bottom">
    <div class="slds-grid slds-grid--vertical-align-center slds-form--inline">
        <div class="slds-form-element">
            <label class="slds-form-element__label">{{language.getAppLanglabel('LBL_MODULE')}}</label>
            <div class="slds-form-element__control" style="min-width:250px;">
                <div class="slds-select_container">
                    <select class="slds-select" [(ngModel)]="currentModule" (change)="selectModule()" [disabled]="sysModules.length == 0">
                        <option value="*">*</option>
                        <option *ngFor="let sysModule of sysModules" [value]="sysModule.module">{{sysModule.module}}
                        </option>
                    </select>
                </div>
            </div>
        </div>
        <div class="slds-form-element">
            <label class="slds-form-element__label">{{language.getAppLanglabel('LBL_ACTIONSET')}}</label>
            <div class="slds-form-element__control" style="min-width:250px;">
                <div class="slds-select_container">
                    <select class="slds-select" [(ngModel)]="currentActionSet.id" (change)="selectCurrentActionset()" [disabled]="getActionSets().length == 0">
                        <option></option>
                        <optgroup label="custom {{language.getAppLanglabel('LBL_ACTIONSET')}}" *ngIf="getActionSets('custom').length > 0">
                            <option *ngFor="let sysActionset of getActionSets('custom')" [value]="sysActionset.id">{{sysActionset.name}}
                            </option>
                        </optgroup>
                        <optgroup label="global {{language.getAppLanglabel('LBL_ACTIONSET')}}"  *ngIf="getActionSets('global').length > 0">
                            <option *ngFor="let sysActionset of getActionSets('global')" [value]="sysActionset.id">{{sysActionset.name}}
                            </option>
                        </optgroup>
                    </select>
                </div>
            </div>
        </div>
        <div class="slds-form-element slds-col--bump-left">

            <button *ngIf="!checkForChanges && currentActionSet.id != ''" [disabled]="!allowBarButtons" class="slds-button slds-button--brand" (click)="copy()" >
                <span>{{language.getAppLanglabel('LBL_COPY')}}</span>
            </button>
            <button *ngIf="!checkForChanges" [disabled]="!allowBarButtons" type="button" class="slds-button slds-button_icon slds-button_icon-border-filled" (click)="addActionset()"><system-utility-icon [icon]="'add'" [size]="'x-small'"></system-utility-icon></button>

            <button *ngIf="checkForChanges && currentActionSet.id != ''" [disabled]="!view.isEditMode()" type="button" class="slds-button slds-button--brand" (click)="saveChanges()">
                {{language.getLabel('LBL_SAVE')}}
            </button>
            <button *ngIf="checkForChanges && currentActionSet.id != ''" [disabled]="!view.isEditMode()" type="button" class="slds-button slds-button--brand" (click)="deleteChanges()">
                {{language.getLabel('LBL_CANCEL')}}
            </button>
        </div>
    </div>
</div>
<div *ngIf="currentActionSet.id != ''" class="slds-theme--default">
    <div class="slds-p-around--small slds-border--bottom slds-theme--default">
        <div class="slds-grid slds-grid--vertical-align-end">
            <div class="slds-form-element slds-p-right--x-small slds-size--1-of-5">
                <label class="slds-form-element__label">{{language.getAppLanglabel('LBL_SCOPE')}}</label>
                <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_left">
                    <system-custom-icon [icon]="currentActionSet.type" size="x-small" addclasses="slds-input__icon slds-input__icon_left"></system-custom-icon>
                    <input type="text" disabled class="slds-input" [ngModel]="currentActionSet.type"/>
                </div>
            </div>
            <div class="slds-form-element slds-p-right--x-small slds-size--1-of-5">
                <label class="slds-form-element__label">{{language.getAppLanglabel('LBL_NAME')}}</label>
                <div class="slds-form-element__control">
                    <input [disabled]="!view.isEditMode()" type="text" class="slds-input" [(ngModel)]="currentActionSet.name"/>
                </div>
            </div>
            <div class="slds-form-element slds-p-right--x-small slds-size--1-of-5">
                <label class="slds-form-element__label">{{language.getAppLanglabel('LBL_PACKAGE')}}</label>
                <div class="slds-form-element__control">
                    <input [disabled]="!view.isEditMode()" type="text" class="slds-input" [(ngModel)]="currentActionSet.package"/>
                </div>
            </div>
            <div class="slds-form-element slds-p-right--x-small slds-size--1-of-5">
                <label class="slds-form-element__label">{{language.getAppLanglabel('LBL_VERSION')}}</label>
                <div class="slds-form-element__control">
                    <input [disabled]="!view.isEditMode()" type="text" class="slds-input" [(ngModel)]="currentActionSet.version"/>
                </div>
            </div>
            <div class="slds-form-element slds-p-right--x-small slds-size--1-of-5">
                <label class="slds-form-element__label">{{language.getAppLanglabel('LBL_ID')}}</label>
                <div class="slds-form-element__control">
                    <input type="text" disabled class="slds-input" [ngModel]="currentActionSet.id"/>
                </div>
            </div>
        </div>
    </div>
    <div class="slds-grid">
        <div class="slds-size--3-of-5 slds-p-horizontal--small slds-p-top--x-small slds-border--right">
            <div class="slds-tree_container" role="application" style="max-width: none;">
                <ul class="slds-tree" role="tree" aria-labelledby="treeheading">
                    <li *ngFor="let currentActionSetItem of currentActionSet.actions" role="treeitem" (click)="selectItem(currentActionSetItem)" [attr.aria-selected]="currentActionSetItem.id == selectedItemID ? true : false">
                        <div class="slds-tree__item slds-grid  slds-grid--vertical-align-center">
                            <div style="white-space:nowrap;">
                                <a href="javascript:void(0);" role="presentation" class="slds-truncate">{{getDisplayName(currentActionSetItem)}}</a>
                            </div>
                            <div class="slds-col_bump-left">
                                <button [disabled]="!view.isEditMode()" class="slds-button slds-button--icon || customModeGlobalField" title="unlink item" (click)="deleteItem(currentActionSetItem)">
                                    <system-button-icon [icon]="'delete'"></system-button-icon>
                                </button>
                                <button [disabled]="!view.isEditMode() || currentActionSetItem.sequence + 1 == currentActionSet.actions.length" class="slds-button slds-button--icon" title="move down" (click)="move(currentActionSetItem, 'down')">
                                    <system-button-icon [icon]="'down'"></system-button-icon>
                                </button>

                                <button [disabled]="!view.isEditMode() || currentActionSetItem.sequence == 0" class="slds-button slds-button--icon" title="move up" (click)="move(currentActionSetItem, 'up')">
                                    <system-button-icon [icon]="'up'"></system-button-icon>
                                </button>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
            <div class="slds-p-around--small slds-align--absolute-center slds-border--top slds-m-top--small">
                <button [disabled]="!view.isEditMode()" class="slds-button slds-button--icon" title="add item" (click)="addActionsetItem()">
                    <system-button-icon [icon]="'new'"></system-button-icon>
                </button>
            </div>
        </div>
        <div class="slds-size--2-of-5 slds-p-horizontal--small slds-p-vertical--x-small">
            <actionsetmanager-action-details [(action)]="selectedItem"></actionsetmanager-action-details>
        </div>
    </div>
    <div class="slds-text-align--right slds-p-around--small slds-border--top">

    </div>
</div>
