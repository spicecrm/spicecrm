<div *ngIf="!isEditMode();else editfield" class="slds-truncate slds-p-horizontal--small">
    {{entry[field.name]}}
</div>
<ng-template #editfield>
    <div class="slds-form-element">
        <div class="slds-form-element__control">
            <input type="text" class="slds-input" [(ngModel)]="entry[field.name]"/>
        </div>
    </div>
</ng-template>
