<div class="slds-form-element slds-m-vertical--xxx-small">
    <label class="slds-form-element__label">{{option.option}}</label>
    <div class="slds-form-element__control">
        <div class="slds-select_container">
            <select *ngIf="objtype == 'component'" [disabled]="!view.isEditMode()" class="slds-select" [(ngModel)]="component.componentconfig[option.option]">
                <option></option>
                <option *ngFor="let actionset of getActionSets()" [value]="actionset.id">{{actionset.name}}</option>
            </select>
            <select *ngIf="objtype == 'field'" [disabled]="!view.isEditMode()" class="slds-select" [(ngModel)]="component.fieldconfig[option.option]">
                <option></option>
                <option *ngFor="let actionset of getActionSets()" [value]="actionset.id">{{actionset.name}}</option>
            </select>
        </div>
    </div>
</div>
