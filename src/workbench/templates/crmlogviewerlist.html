<div class="slds-section slds-is-open slds-grid slds-grid_vertical" [ngStyle]="!isInitialLoaded?{opacity:0}:undefined" style="height:100%">

    <div class="slds-section__content slds-m-bottom_medium slds-grid slds-grid_vertical" style="padding-top:0;height:100%">

            <div [system-overlay-loading-spinner]="isLoading" system-to-bottom style="height:100%" class="slds-grid slds-grid_vertical">
                <table class="slds-table slds-table--bordered slds-table--col-bordered slds-table--striped slds-table_cell-buffer slds-table--striped" [ngStyle]="isLoading?{opacity:0.33}:undefined">
                    <thead>
                    <tr>
                        <th style="width:1%"><system-label label="LBL_DATE"></system-label></th>
                        <th style="width:1%" class="slds-text-align--right">PID</th>
                        <th style="width:1%" class="slds-text-align--right"><system-label label="LBL_TRANSACTION"></system-label></th>
                        <th style="width:1%"><system-label label="LBL_USER"></system-label></th>
                        <th style="width:1%"><system-label label="LBL_LEVEL"></system-label></th>
                        <th style="width:100%"><system-label label="LBL_TEXT"></system-label></th>
                        <th style="width:2rem;border-left:0"></th>
                        <th style="width:2rem;border-left:0"></th>
                    </tr>
                    </thead>
                    <tbody #tbody>
                    <tr *ngFor="let entry of entries">
                        <td class="slds-text-align--right"><a *ngIf="!valuesNotClickable" (click)="valueClicked$.emit({type:'date_entered',value:entry.date_entered})"><system-display-datetime [date]="entry.date_entered"></system-display-datetime></a><system-display-datetime *ngIf="valuesNotClickable" [date]="entry.date_entered"></system-display-datetime></td>
                        <td class="slds-text-align--right"><a *ngIf="!valuesNotClickable" (click)="valueClicked$.emit({type:'pid',value:entry.pid})">{{entry.pid}}</a><ng-container *ngIf="valuesNotClickable">{{entry.pid}}</ng-container></td>
                        <td class="slds-text-align--right"><a *ngIf="!valuesNotClickable" (click)="valueClicked$.emit({type:'transaction_id',value:entry.transaction_id})">{{entry.transaction_id}}</a><ng-container *ngIf="valuesNotClickable">{{entry.transaction_id}}</ng-container></td>
                        <td><a *ngIf="!valuesNotClickable" (click)="valueClicked$.emit({type:'user',value:{user_id:entry.user_id,user_name:entry.user_name}})">{{entry.user_name}}</a><ng-container *ngIf="valuesNotClickable">{{entry.user_name}}</ng-container></td>
                        <td><a *ngIf="!valuesNotClickable" (click)="valueClicked$.emit({type:'log_level',value:entry.log_level})">{{entry.log_level}}</a><ng-container *ngIf="valuesNotClickable">{{entry.log_level}}</ng-container></td>
                        <td [ngClass]="{expanded:entry.expand,collapsed:!entry.expand}">
                            <div class="slds-text-font_monospace" [ngClass]="{'slds-truncate':!entry.expand}">{{entry.description}}</div>
                        </td>
                        <td class="slds-p-left--none" style="border-left:0">
                            <button class="slds-button slds-button--icon-border slds-button_icon-small" (click)="entry.expand=true" >
                                <system-button-icon [icon]="'threedots'" [size]="'small'"></system-button-icon>
                            </button>
                        </td>
                        <td>
                            <button class="slds-button slds-button--icon-border slds-button_icon-small" (click)="showEntryInModal(entry.i)" [ngClass]="{'slds-hidden':!entry.descriptionTruncated}">
                                <system-button-icon [icon]="'expand'" [size]="'medium'"></system-button-icon>
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div *ngIf="entries.length == 0" class="slds-height_full slds-align--absolute-center">
                    <system-illustration-no-records><system-label label="LBL_NO_RECORDS_FOUND"></system-label></system-illustration-no-records>
                </div>
            </div>

    </div>

</div>
