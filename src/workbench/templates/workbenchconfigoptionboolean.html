<div class="slds-form-element slds-m-vertical--xxx-small">
    <div class="slds-form-element__control">
    <span class="slds-checkbox">
      <input *ngIf="objtype == 'component'" [disabled]="!view.isEditMode()" type="checkbox" name="options" [id]="option.option" [(ngModel)]="component.componentconfig[option.option]">
      <input *ngIf="objtype == 'field'" [disabled]="!view.isEditMode()" type="checkbox" name="options" [id]="option.option" [(ngModel)]="component.fieldconfig[option.option]">
      <label class="slds-checkbox__label" [attr.for]="option.option">
        <span class="slds-checkbox_faux"></span>
        <span class="slds-form-element__label">{{option.option}}</span>
      </label>
    </span>
    </div>
</div>
