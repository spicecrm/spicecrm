<system-modal>
    <system-modal-header (close)="close()"><system-label label="LBL_DOMAIN_USAGE"/></system-modal-header>
    <system-modal-content margin="none">
        <table class="slds-table slds-table_bordered">
            <thead>
                <tr class="slds-line-height_reset">
                    <th class="" scope="col">
                        <div class="slds-truncate"><system-label label="LBL_DEFINITION"/></div>
                    </th>
                    <th class="" scope="col">
                        <div class="slds-truncate"><system-label label="LBL_FIELD"/></div>
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let dictionaryitem of dictionaryitems" class="slds-hint-parent">
                    <td>
                        <div class="slds-truncate">{{dictionaryitem.definitionname}}</div>
                    </td>
                    <td>
                        <div class="slds-truncate">{{dictionaryitem.itemname}}</div>
                    </td>
                </tr>
            </tbody>
        </table>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CLOSE"/></button>
    </system-modal-footer>
</system-modal>
