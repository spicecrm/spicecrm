<div *ngIf="!isEditMode();else editfield" class="slds-truncate slds-p-horizontal--small">
    {{domainname}}
</div>
<ng-template #editfield>
    <div class="slds-form-element">
        <div class="slds-form-element__control">
            <div class="slds-select_container">
                <select  class="slds-select" [(ngModel)]="entry[field.name]">
                    <option *ngFor="let domain of getDomainArray()" [value]="domain.id">{{domain.name}}</option>
                </select>
            </div>
        </div>
    </div>
</ng-template>
