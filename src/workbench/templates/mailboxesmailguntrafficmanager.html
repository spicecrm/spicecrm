<div class="slds-p-horizontal--medium slds-p-vertical--small">
    <h1>{{language.getLabel('LBL_MAILGUN')}}</h1>
    <div class="slds-grid slds-p-vertical--xx-small">
        <div class="slds-form-element slds-size--1-of-2 slds-p-right--xx-small">
            <label class="slds-truncate slds-form-element__label">{{language.getLabel('LBL_DISPLAY_NAME')}}</label>
            <input type="text"
                   [(ngModel)]="model.data.settings.imap_pop3_display_name"
                   class="slds-input ng-pristine ng-valid"/>
        </div>
        <div class="slds-form-element slds-size--1-of-2 slds-p-left--xx-small">
            <label class="slds-truncate slds-form-element__label">{{language.getLabel('LBL_DOMAIN')}}</label>
            <input type="text" [(ngModel)]="model.data.settings.domain" class="slds-input ng-pristine ng-valid"/>
        </div>
    </div>
    <div class="slds-grid slds-p-vertical--xx-small">
        <div class="slds-form-element slds-size--1-of-2 slds-p-right--xx-small">
            <label class="slds-truncate slds-form-element__label">{{language.getLabel('LBL_USER_NAME')}}</label>
            <input type="text" [(ngModel)]="model.data.settings.imap_pop3_username" class="slds-input ng-pristine ng-valid"/>
        </div>
        <div class="slds-form-element slds-size--1-of-2 slds-p-left--xx-small">
            <label class="slds-truncate slds-form-element__label">{{language.getLabel('LBL_API_KEY')}}</label>
            <input type="text" [(ngModel)]="model.data.settings.api_key"  class="slds-input ng-pristine ng-valid"/>
        </div>
    </div>
    <div class="slds-grid slds-p-vertical--xx-small">
        <div class="slds-form-element slds-size--1-of-2 slds-p-left--xx-small">
            <label class="slds-truncate slds-form-element__label">{{language.getLabel('LBL_REGION')}}</label>
            <select type="text"
                    [(ngModel)]="model.data.settings.region"
                    class="slds-select ng-pristine ng-valid">
                <option value="eu">{{language.getLabel('LBL_EU')}}</option>
                <option value="us">{{language.getLabel('LBL_US')}}</option>
            </select>
        </div>
        <div class="slds-form-element slds-size--1-of-2 slds-p-right--xx-small">
            <label class="slds-truncate slds-form-element__label">{{language.getLabel('LBL_REPLY_TO')}}</label>
            <input type="text" [(ngModel)]="model.data.settings.reply_to" class="slds-input ng-pristine ng-valid"/>
        </div>
    </div>
    <div class="slds-grid slds-p-vertical--xx-small">
        <button type="button" class="slds-col--bump-left slds-button slds-button--neutral" (click)="testConnection()" [disabled]="valid_connection">
            {{language.getLabel('LBL_TEST_CONNECTION')}}
        </button>
    </div>
</div>
