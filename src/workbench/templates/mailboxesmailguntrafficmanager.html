<div class="slds-p-horizontal--medium slds-p-vertical--small">
    <h1>Mailgun</h1>
    <div class="slds-grid">
        <div class="slds-form-element slds-size--1-of-3">
            <label class="slds-truncate slds-form-element__label">Display Name</label>
            <input type="text"
                   [(ngModel)]="model.data.settings.imap_pop3_display_name"
                   class="slds-input ng-pristine ng-valid"/>
        </div>
        <div class="slds-form-element slds-size--1-of-3">
            <label class="slds-truncate slds-form-element__label">Username</label>
            <input type="text"
                   [(ngModel)]="model.data.settings.imap_pop3_username"
                   class="slds-input ng-pristine ng-valid"/>
        </div>
        <div class="slds-form-element slds-size--1-of-3">
            <label class="slds-truncate slds-form-element__label">API
                Key</label>
            <input type="text" [(ngModel)]="model.data.settings.api_key"
                   class="slds-input ng-pristine ng-valid"/>
        </div>
    </div>
    <div class="slds-grid">
        <div class="slds-form-element slds-size--1-of-3">
            <label class="slds-truncate slds-form-element__label">Domain</label>
            <input type="text" [(ngModel)]="model.data.settings.domain"
                   class="slds-input ng-pristine ng-valid"/>
        </div>
        <div class="slds-form-element slds-size--1-of-3">
            <label class="slds-truncate slds-form-element__label">TEST_EMAIL</label>
            <input type="text" [(ngModel)]="model.data.settings.test_email"
                   class="slds-input ng-pristine ng-valid"/>
        </div>
    </div>
    <div class="slds-grid">
        <button type="button"
                class="slds-col--bump-left slds-button slds-button--neutral"
                (click)="testConnection()" [disabled]="valid_connection">
            {{language.getLabel('LBL_TEST')}}
        </button>
    </div>
</div>
