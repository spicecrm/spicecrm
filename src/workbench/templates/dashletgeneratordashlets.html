<div class="slds-border--right">
    <div class="slds-p-around--x-small slds-border--bottom">
        <div class="slds-form-element slds-grid slds-grid--vertical-align-center">
            <label for="moduleselect" class="slds-form-element__label"><system-label label="LBL_MODULE"></system-label></label>
            <div class="slds-form-element__control slds-col">
                <div class="slds-select_container">
                    <select id="moduleselect" class="slds-select" [(ngModel)]="module">
                        <option value=""><system-label label="LBL_SELECT"></system-label></option>
                        <option *ngFor="let thismodule of modules" [value]="thismodule">{{thismodule}}</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
    <div system-to-bottom>
        <div *ngIf="loading" class="slds-align--absolute-center slds-height_full">
            <system-spinner></system-spinner>
        </div>
        <div *ngIf="!module && !loading" class="slds-align--absolute-center slds-height_full">
            <system-label label="LBL_MAKE_SELECTION"></system-label>
        </div>
        <div *ngIf="module && !loading" class="slds-tabs_default" style="background-color: transparent">
            <ul class="slds-tabs_default__nav" role="tablist">
                <li class="slds-tabs_default__item slds-text-title--caps" [class.slds-is-active]="activeTab == 'custom'" [title]="language.getLabel('LBL_CUSTOM')" role="presentation">
                    <a class="slds-tabs_default__link" href="javascript:void(0);" (click)="activeTab = 'custom'; checkActiveElementWhenTabChange()" role="tab" tabindex="0" aria-selected="true" aria-controls="tab-custom" id="tab-custom-item">
                        <system-label label="LBL_CUSTOM"></system-label>
                    </a>
                </li>
                <li class="slds-tabs_default__item slds-text-title--caps" [class.slds-is-active]="activeTab == 'global'" [title]="language.getLabel('LBL_GLOBAL')" role="presentation">
                    <a class="slds-tabs_default__link" href="javascript:void(0);" (click)="activeTab = 'global'; checkActiveElementWhenTabChange()" role="tab" tabindex="-1" aria-selected="false" aria-controls="tab-global" id="tab-global-item">
                        <system-label label="LBL_GLOBAL"></system-label>
                    </a>
                </li>
            </ul>
            <div id="tab-custom" class="slds-tabs_default__content slds-p-around--none" [ngClass]="activeTab == 'custom' ? 'slds-show' : 'slds-hide'" role="tabpanel" aria-labelledby="tab-custom-item">
                <div *ngIf="customModuleDashlets.length > 0 || definitionfiltertermCustom; else noEntriesCustom">
                    <div class="slds-p-around--x-small slds-grid slds-grid--vertical-align-center">
                        <system-input-text placeholder="LBL_SEARCH" class="slds-grow" [(ngModel)]="definitionfiltertermCustom" autocomplete="off" [showClear]="true"></system-input-text>
                        <div class="slds-p-around--xx-small slds-m-left--x-small">
                            <button  class="slds-align--absolute-center slds-button slds-button--icon slds-button--icon-border" style="border-radius: 50%;" (click)="add('custom')">
                                <system-button-icon icon="add" size="medium"></system-button-icon>
                            </button>
                        </div>
                    </div>
                </div>
                <ng-template #noEntriesCustom>
                    <div class="slds-p-around--x-small">
                        <button  class="slds-align--absolute-center slds-button slds-button--icon slds-button--icon-border" style="border-radius: 50%;" (click)="add('custom')">
                            <system-button-icon icon="add" size="medium"></system-button-icon>
                        </button>
                    </div>
                </ng-template>
                <ul class="slds-has-dividers_around-space slds-p-around--x-small">
                    <li *ngFor="let moduleDashlet of customModuleDashlets; trackBy: trackByItemFn" class="slds-grid slds-grid--align-spread slds-item" (click)="goDetail(moduleDashlet); activeDashletCustom = trackByItemFn(moduleDashlet);" [class.slds-theme--default]="activeDashletCustom === trackByItemFn(moduleDashlet)">
                        <a href="javascript:void(0);" class="slds-text-link_reset">{{moduleDashlet.name}}</a>
                        <div class="slds-grid">
                            <button *ngIf="moduleDashlet.componentconfig; else notSavedCustom" class="slds-button slds-button&#45;&#45;icon slds-col" (click)="remove(moduleDashlet.id);">
                                <system-button-icon icon="delete"></system-button-icon>
                            </button>
                            <ng-template #notSavedCustom>
                                <button class="slds-button slds-button--icon slds-col" (click)="remove(moduleDashlet.id); $event.stopPropagation()">
                                    <system-button-icon icon="clear"></system-button-icon>
                                </button>
                            </ng-template>
                        </div>
                    </li>
                </ul>
            </div>
            <div id="tab-global" class="slds-tabs_default__content slds-p-around--none" [ngClass]="activeTab == 'global' ? 'slds-show' : 'slds-hide'" role="tabpanel" aria-labelledby="tab-global-item">
                <div *ngIf="moduleDashlets.length > 0 || definitionfiltertermGlobal; else noEntriesGlobal">
                    <div class="slds-p-around--x-small slds-grid slds-grid--vertical-align-center">
                        <system-input-text placeholder="LBL_SEARCH" class="slds-grow" [(ngModel)]="definitionfiltertermGlobal" autocomplete="off" [showClear]="true"></system-input-text>
                        <div class="slds-p-around--xx-small slds-m-left--x-small">
                            <button  class="slds-align--absolute-center slds-button slds-button--icon slds-button--icon-border" style="border-radius: 50%;" (click)="add('global')">
                                <system-button-icon icon="add" size="medium"></system-button-icon>
                            </button>
                        </div>
                    </div>
                </div>
                <ng-template #noEntriesGlobal>
                    <div class="slds-p-around--x-small">
                        <button  class="slds-align--absolute-center slds-button slds-button--icon slds-button--icon-border" style="border-radius: 50%;" (click)="add('global')">
                            <system-button-icon icon="add" size="medium"></system-button-icon>
                        </button>
                    </div>
                </ng-template>
                <ul class="slds-has-dividers_around-space slds-p-around--x-small">
                    <li *ngFor="let moduleDashlet of moduleDashlets; trackBy: trackByItemFn" class="slds-grid slds-grid--align-spread slds-item" (click)="goDetail(moduleDashlet); activeDashletGlobal = trackByItemFn(moduleDashlet);" [class.slds-theme--default]="activeDashletGlobal === trackByItemFn(moduleDashlet)">
                        <a href="javascript:void(0);" class="slds-text-link_reset">{{moduleDashlet.name}}</a>
                        <div class="slds-grid">
                            <button *ngIf="moduleDashlet.componentconfig; else notSavedGlobal" class="slds-button slds-button&#45;&#45;icon slds-col" (click)="remove(moduleDashlet.id)">
                                <system-button-icon icon="delete"></system-button-icon>
                            </button>
                            <ng-template #notSavedGlobal>
                                <button class="slds-button slds-button--icon slds-col" (click)="remove(moduleDashlet.id); $event.stopPropagation()">
                                    <system-button-icon icon="clear"></system-button-icon>
                                </button>
                            </ng-template>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
