<system-modal size="small">
    <system-modal-header (close)="close()">
        <system-label label="LBL_ADD_RELATIONSHIP"></system-label>
    </system-modal-header>
    <system-modal-content>
        <div class="slds-p-around--small slds-text-align--center slds-grid slds-grid--vertical">
            @for (relationshipType of relationshipTypes; track relationshipType.id){
                <system-input-radio class="slds-text-align--left" name="relationshiptype" [(ngModel)]="selectedType" [value]="relationshipType.id">
                    <system-label [label]="relationshipType.label"></system-label>
                </system-input-radio>
            }
        </div>
        <div class="slds-grid slds-grid--vertical slds-grid_vertical-align-center">
            <div class="slds-form-element__control slds-p-around--xx-small slds-size--1-of-1">
                <label class="slds-form-element__label"><abbr class="slds-required">* </abbr><system-label label="LBL_SCOPE"></system-label></label>
                <div class="slds-select_container">
                    <select [disabled]="dictionarymanager.currentDictionaryScope == 'c'" class="slds-select" [(ngModel)]="scope">
                        <option *ngIf="dictionarymanager.changescope == 'all'" value="g"><system-label label="LBL_GLOBAL"></system-label></option>
                        <option value="c"><system-label label="LBL_CUSTOM"></system-label></option>
                    </select>
                </div>
            </div>
            <div class="slds-size--1-of-1 slds-p-horizontal--xxx-small slds-form-element__control">
                <label class="slds-form-element__label"><system-label label="LBL_PACKAGE"></system-label></label>
                <system-input-package [(ngModel)]="package"/>
            </div>
            <div class="slds-size--1-of-1 slds-p-left--xxx-small slds-form-element__control">
                <label class="slds-form-element__label"><system-label label="LBL_VERSION"></system-label></label>
                <system-input-version [(ngModel)]="version"/>
            </div>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()">
            <system-label label="LBL_CANCEL"></system-label>
        </button>
        <button class="slds-button slds-button--brand" [disabled]="!selectedType" (click)="add()">
            <system-label label="LBL_ADD"></system-label>
        </button>
    </system-modal-footer>
</system-modal>
