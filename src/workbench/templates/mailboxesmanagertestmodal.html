<system-modal>
    <system-modal-header (close)="close()"></system-modal-header>
    <system-modal-content>
        <div class="slds-form-element slds-size--1-of-1">
            <label class="slds-truncate slds-form-element__label">{{language.getLabel('LBL_TEST_EMAIL')}}</label>
            <input type="text" [disabled]="testing" [(ngModel)]="testemailaddress" class="slds-input"/>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <div class="slds-grid slds-grid--vertical-align-center">
            <div *ngIf="testing" class="slds-grid slds-grid--vertical-align-center">
                <system-spinner size="10"></system-spinner>
                <span class="slds-p-horizontal--xx-small">{{language.getLabel('LBL_TESTING')}}</span>
            </div>
            <div *ngIf="!testing && validConnection" class="slds-grid slds-grid--vertical-align-center">
                <system-utility-icon icon="check" size="x-small"></system-utility-icon>
                <span class="slds-p-horizontal--xx-small">{{language.getLabel('LBL_OK')}}</span>
            </div>
            <button class="slds-col--bump-left slds-button slds-button--neutral" (click)="testConnection()">{{language.getAppLanglabel('LBL_TEST')}}</button>
            <button [disabled]="!validConnection" class="slds-button slds-button--brand" (click)="close()">{{language.getAppLanglabel('LBL_OK')}}</button>
        </div>
    </system-modal-footer>
</system-modal>
