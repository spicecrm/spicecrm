<system-modal>
    <system-modal-header (close)="close()"><system-label label="LBL_ONE_TO_MANY_POLYMORPH"></system-label></system-modal-header>
    <system-modal-content>
        <dictionary-manager-relationship-container-onetomanypolymorph [relationship]="relationship" [relationshipPolymorphs]="relationshipPolymorphs"></dictionary-manager-relationship-container-onetomanypolymorph>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CANCEL"></system-label></button>
        <button [disabled]="
                !relationship.name ||
                !relationship.rhs_sysdictionaryitem_id ||
                !relationship.relationship_role_column ||
                !relationship.rhs_relatename ||
                !relationship.lhs_linkname || relationshipPolymorphs.length == 0" class="slds-button slds-button--brand" (click)="add()"><system-label label="LBL_ADD"></system-label></button>
    </system-modal-footer>
</system-modal>
