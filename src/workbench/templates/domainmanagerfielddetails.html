<div class="slds-form-element slds-m-vertical--xxx-small">
    <label class="slds-form-element__label"><system-label label="LBL_NAME"></system-label></label>
    <div class="slds-form-element__control">
        <input type="text" class="slds-input" [(ngModel)]="field.name"/>
    </div>
</div>
<div class="slds-form-element slds-m-vertical--xxx-small">
    <label class="slds-form-element__label"><system-label label="LBL_DBTYPE"></system-label></label>
    <div class="slds-form-element__control">
        <input type="text" class="slds-input" [(ngModel)]="field.dbtype"/>
    </div>
</div>
<div class="slds-form-element slds-m-vertical--xxx-small">
    <label class="slds-form-element__label"><system-label label="LBL_TYPE"></system-label></label>
    <div class="slds-form-element__control">
        <input type="text" class="slds-input" [(ngModel)]="field.fieldtype"/>
    </div>
</div>
<div class="slds-form-element slds-m-vertical--xxx-small">
    <label class="slds-form-element__label"><system-label label="LBL_LENGTH"></system-label></label>
    <div class="slds-form-element__control">
        <input type="text" class="slds-input" [(ngModel)]="field.len"/>
    </div>
</div>
<div class="slds-form-element slds-m-vertical--xxx-small">
    <label class="slds-form-element__label"><system-label label="LBL_REQUIRED"></system-label></label>
    <div class="slds-form-element__control">
        <system-checkbox [(ngModel)]="required">required</system-checkbox>
    </div>
</div>
<div class="slds-form-element slds-m-vertical--xxx-small">
    <label class="slds-form-element__label"><system-label label="LBL_COMMENT"></system-label></label>
    <div class="slds-form-element__control">
        <textarea class="slds-textarea" [(ngModel)]="field.comment"></textarea>
    </div>
</div>
