<div role="dialog" tabindex="-1" aria-labelledby="header43" class="slds-modal slds-fade-in-open">
    <div class="slds-modal__container">
        <div class="slds-modal__header slds-theme--shade">
            <button class="slds-button slds-modal__close slds-button--icon-inverse" title="Close" (click)="closeDialog()">
                <system-button-icon [icon]="'close'" [size]="'large'"></system-button-icon>
            </button>
            <h2 id="header43" class="slds-text-heading--medium">{{language.getAppLanglabel('LBL_EDIT')}}</h2>
        </div>
        <div class="slds-modal__content slds-p-around--medium">
            <div class="slds-form-element slds-m-top--small">
                <label class="slds-form-element__label">{{language.getAppLanglabel('LBL_ITEM_NAME')}}</label>
                <div class="slds-form-element__control">
                    <input type="text" class="slds-input" placeholder="name" [(ngModel)]="fieldsetname" />
                </div>
            </div>
            <div class="slds-form-element">
                <label class="slds-form-element__label">{{language.getAppLanglabel('LBL_TYPE')}}</label>
                <div class="slds-form-element__control">
                    <div class="slds-select_container">
                        <select class="slds-select" [(ngModel)]="fieldsettype" [disabled]="!adding">
                            <option value="global" *ngIf="edit_mode == 'global'">{{language.getAppLanglabel('LBL_GLOBAL')}}</option>
                            <option value="custom">{{language.getAppLanglabel('LBL_CUSTOM')}}</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="slds-modal__footer">
            <button class="slds-button slds-button--neutral" (click)="closeDialog()">{{language.getLabel('LBL_CANCEL')}}</button>
            <button class="slds-button slds-button--brand" [disabled]="fieldsetname == ''" (click)="add()">{{language.getLabel('LBL_SAVE')}}</button>
        </div>
    </div>
</div>
