<system-modal>
    <system-modal-header (close)="close()">Edit Dictionary Definition</system-modal-header>
    <system-modal-content>
        <div class="slds-grid">
            <div class="slds-form-element__control slds-size--1-of-2 slds-p-right--xxx-small">
                <label class="slds-form-element__label"><abbr class="slds-required">* </abbr><system-label label="LBL_NAME"></system-label></label>
                <system-input-text [(ngModel)]="dictionarydefinition.name" [disabled]="true"></system-input-text>
            </div>
            <div class="slds-form-element__control slds-size--1-of-2 slds-p-right--xxx-small">
                <label class="slds-form-element__label"><system-label label="LBL_TABLE"></system-label></label>
                <system-input-text [(ngModel)]="dictionarydefinition.tablename" [disabled]="true"></system-input-text>
            </div>
        </div>
        <div class="slds-grid">
            <div class="slds-form-element__control slds-size--1-of-4 slds-p-left--xxx-small">
                <label class="slds-form-element__label"><abbr class="slds-required">* </abbr><system-label label="LBL_SCOPE"></system-label></label>
                <div class="slds-select_container">
                    <select class="slds-select" [(ngModel)]="dictionarydefinition.scope" [disabled]="true">
                        <option *ngIf="dictionarymanager.changescope == 'all'" value="g"><system-label label="LBL_GLOBAL"></system-label></option>
                        <option value="c"><system-label label="LBL_CUSTOM"></system-label></option>
                    </select>
                </div>
            </div>
            <div class="slds-large-size--1-of-4 slds-p-horizontal--xxx-small slds-form-element__control">
                <label class="slds-form-element__label"><abbr class="slds-required">* </abbr><system-label label="LBL_TYPE"></system-label></label>
                <div class="slds-select_container">
                    <select class="slds-select" [(ngModel)]="dictionarydefinition.sysdictionary_type" [disabled]="true">
                        <option value="module"><system-label label="LBL_MODULE"></system-label></option>
                        <option value="metadata"><system-label label="LBL_METADATA"></system-label></option>
                        <option value="template"><system-label label="LBL_TEMPLATE"></system-label></option>
                        <option value="relationship"><system-label label="LBL_RELATIONSHIP"></system-label></option>
                        <option value="system"><system-label label="LBL_SYSTEM"></system-label></option>
                    </select>
                </div>
            </div>
            <div class="slds-size--1-of-4 slds-p-horizontal--xxx-small slds-form-element__control">
                <label class="slds-form-element__label"><system-label label="LBL_PACKAGE"></system-label></label>
                <system-input-text [(ngModel)]="dictionarydefinition.package"></system-input-text>
            </div>
            <div class="slds-size--1-of-4 slds-p-left--xxx-small slds-form-element__control">
                <label class="slds-form-element__label"><system-label label="LBL_VERSION"></system-label></label>
                <system-input-text [(ngModel)]="dictionarydefinition.version"></system-input-text>
            </div>
        </div>
        <div class="slds-p-vertical--xx-small">
            <label class="slds-form-element__label"><abbr class="slds-required">* </abbr><system-label label="LBL_CONTENT_TYPE"/></label>
            <div class="slds-select_container">
                <select class="slds-select" [(ngModel)]="dictionarydefinition.sysdictionary_contenttype">
                    <option value="masterdata"><system-label label="LBL_MASTERDATA"></system-label></option>
                    <option value="transactionaldata"><system-label label="LBL_TRANSACTIONAL_DATA"></system-label></option>
                    <option value="logs"><system-label label="LBL_LOGS"></system-label></option>
                    <option value="config"><system-label label="LBL_CONFIGURATION"></system-label></option>
                    <option value="custom_config"><system-label label="LBL_CUSTOM_CONFIG"></system-label></option>
                    <option value="local_config"><system-label label="LBL_LOCAL_CONFIG"></system-label></option>
                </select>
            </div>
        </div>
        <div class="slds-p-vertical--xx-small">
            <label class="slds-form-element__label"><system-label label="LBL_COMMENT"></system-label></label>
            <textarea class="slds-textarea" [ngModel]="dictionarydefinition.description"></textarea>
        </div>
    </system-modal-content>
    <system-modal-footer>
        <button class="slds-button slds-button--neutral" (click)="close()"><system-label label="LBL_CLOSE"></system-label> </button>
        <button class="slds-button slds-button--brand" (click)="save()"><system-label label="LBL_SAVE"></system-label> </button>
    </system-modal-footer>
</system-modal>
