<article class="slds-card slds-m-bottom--medium">
    <div class="slds-card__header slds-grid">
        <header class="spicecrm-newsfeed-item-header slds-media slds-media--center slds-has-flexi-truncate">
            <div class="slds-media__body slds-truncate">
                <h2>
                    <a target="_blank" [attr.href]="item.link">{{item.title.rendered}}</a>
                </h2>
            </div>
        </header>
    </div>
    <div class="slds-card__body">
        <div class="slds-card__body--inner slds-grid slds-wrap slds-grid--pull-padded"
             [innerHTML]="getExcerpt()"></div>
    </div>
    <div class="slds-card__footer">{{getDate()}}</div>
</article>
