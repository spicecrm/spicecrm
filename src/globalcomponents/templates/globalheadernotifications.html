<ul class="slds-global-actions">
    <li class="slds-global-actions__item slds-m-left--none">
        <div class="slds-dropdown-trigger slds-dropdown-trigger_click">
            <button (click)="toggleOpenPopover()" system-title="LBL_NOTIFICATIONS" class="slds-button slds-button_icon slds-button_icon-container slds-global-actions__notifications slds-global-actions__item-action slds-incoming-notification" aria-live="assertive" aria-atomic="true">
                <system-utility-icon icon="notification" size="x-small"></system-utility-icon>
            </button>
            <span *ngIf="unreadCount > 0" aria-hidden="true" class="slds-notification-badge slds-incoming-notification slds-show-notification">
                {{unreadCount}}
            </span>
        </div>
    </li>
</ul>
<section *ngIf="isOpen" class="slds-popover slds-popover_large slds-nubbin_top-right slds-is-absolute slds-grid slds-grid--vertical" role="dialog" style="top: 45px; right: 45px; max-height: calc(100vh - 55px); box-shadow: 0 0 15px 5px #bbb;">
    <div class="slds-grid slds-border--bottom">
        <header class="slds-popover__header slds-grow" style="border-bottom: 0;">
            <h2 class="slds-text-heading_small">
                Notifications
            </h2>
        </header>
        <button (click)="isOpen = false" system-title="LBL_CLOSE" class="slds-button slds-button_icon slds-button_icon-small slds-float_right slds-popover__close">
            <system-button-icon icon="close" size="small"></system-button-icon>
        </button>
    </div>
    <div class="slds-popover__body slds-p-around_none slds-scrollable--y">
        <ul>
            <li *ngFor="let notification of notifications" [class.slds-global-header__notification_unread]="!notification.notification_read" class="slds-global-header__notification">
                <div class="slds-media slds-has-flexi-truncate slds-p-around_x-small slds-is-relative spice-hover-display-children">
                    <div system-model-popover [id]="notification.bean_id" [module]="notification.bean_module" class="slds-media__figure">
                        <span *ngIf="notification.bean_module" class="slds-icon_container" style="width:40px;height:40px;">
                            <system-icon [module]="notification.bean_module"></system-icon>
                        </span>
                    </div>
                    <div class="slds-media__body">
                        <div class="slds-grid slds-grid_align-spread">
                            <a href="javascript:void(0);" class="slds-text-link_reset slds-has-flexi-truncate">
                                <h3 class="slds-truncate" [system-title]="notification.name">
                                    <span system-model-popover [id]="notification.bean_id" [module]="notification.bean_module" class="slds-m-right--xxx-small slds-text-title_bold" style="text-decoration: underline;">
                                        {{notification.name}}
                                    </span>
                                    <span [class.slds-text-title_bold]="!notification.notification_read">
                                        <system-label label="MSG_NOTIFICATION_ASSIGNED"></system-label>
                                    </span>
                                </h3>
                                <p class="slds-m-top_x-small slds-text-color_weak">
                                    {{notification.notification_date}}
                                    <abbr *ngIf="!notification.notification_read" system-title="LBL_UNREAD" class="slds-text-link slds-m-horizontal_xxx-small">●</abbr>
                                </p>
                            </a>
                        </div>
                    </div>
                    <div *ngIf="!notification.notification_read" (click)="markAsRead(notification)" class="slds-is-absolute slds-height_full spice-hover-child slds-grid slds-grid--vertical-align-center" style="right: 0; top: 0">
                        <button system-title="LBL_MARK_AS_READ" class="slds-button slds-button_icon slds-button_icon-small slds-float_right slds-popover__close slds-button--icon-border">
                            <system-button-icon icon="check" size="small"></system-button-icon>
                        </button>
                    </div>
                </div>
            </li>
        </ul>
    </div>
</section>
