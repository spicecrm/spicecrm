<div class="slds-global-header__item slds-global-header__item--search">
    <div class="slds-form-element slds-lookup">
        <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon--left-right">
            <system-utility-icon [icon]="'search'" [addclasses]="'slds-input__icon slds-input__icon--left'"></system-utility-icon>
            <input class="slds-input slds-lookup__search-input" type="search" [placeholder]="language.getLabel('LBL_SEARCH_SPICE')" (focus)="onFocus()" [(ngModel)]="searchTermUntrimmed" (keyup)="search($event)"/>
            <button *ngIf="searchTerm.length > 0" class="slds-input__icon slds-input__icon--right slds-button slds-button--icon" (click)="clearSearchTerm()">
                <system-button-icon [icon]="'close'"></system-button-icon>
            </button>
        </div>
        <global-header-search-recent-items *ngIf="showRecent && searchTerm === ''"></global-header-search-recent-items>
        <global-header-search-results-items *ngIf="showRecent && searchTerm !== ''" [searchTerm]="searchTerm"></global-header-search-results-items>
    </div>
</div>
