<!-- container with email address for hte user -->
<div *ngIf="display == 'email'" [system-overlay-loading-spinner]="sending">
    <div class="slds-form-element slds-m-vertical--small">
        <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon--left">
            <system-utility-icon [icon]="'email'" [addclasses]="'slds-input__icon slds-icon-text-default'"></system-utility-icon>
            <input type="email" [disabled]="sending" [(ngModel)]="emailOrUsername" class="slds-input slds-p-vertical--xx-small" system-placeholder="LBL_EMAIL_ADDRESS_OR_USER_NAME"/>
        </div>
    </div>
    <button class="slds-button slds-button--brand slds-button_stretch" [disabled]="!emailOrUsernameValid || sending" (click)="sendEmail()"><system-label label="LBL_SEND"/></button>
</div>

<div *ngIf="display == 'token'" [system-overlay-loading-spinner]="sending">
    <form autocomplete="off">
        <div class="slds-form-element slds-m-vertical--small">
            <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon--left">
                <system-utility-icon [icon]="'shield'" [addclasses]="'slds-input__icon slds-icon-text-default'"></system-utility-icon>
                <input type="text" [disabled]="sending" name="token" [(ngModel)]="token" class="slds-input slds-p-vertical--xx-small" system-placeholder="MSG_TOKEN_WAS_SENT_VIA_EMAIL"/>
            </div>
        </div>
        <div *ngIf="pwdGuideline" class="slds-m-vertical--medium">
            <system-label label="LBL_PWD_GUIDELINE" /><br>
            {{pwdGuideline}}
        </div>
    </form>
    <form autocomplete="off">
        <div class="slds-form-element slds-m-vertical--small" [ngClass]="{'slds-has-error': pwderror}">
            <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon--left">
                <system-utility-icon [icon]="'lock'" [addclasses]="'slds-input__icon slds-icon-text-default'"></system-utility-icon>
                <input type="password" [disabled]="sending" [(ngModel)]="password" name="password" class="slds-input slds-p-vertical--xx-small" system-placeholder="LBL_ENTER_NEW_PASSWORD"/>
            </div>
            <div *ngIf="password && pwderror" class="slds-form-element__help slds-text-color--error">{{pwderror}}</div>
        </div>
        <div class="slds-form-element  slds-m-vertical--small" [ngClass]="{'slds-has-error': pwdreperror}">
            <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon--left">
                <system-utility-icon [icon]="'lock'" [addclasses]="'slds-input__icon slds-icon-text-default'"></system-utility-icon>
                <input type="password" [disabled]="sending" [(ngModel)]="repeatPassword" name="resetPassword" class="slds-input slds-p-vertical--xx-small" system-placeholder="LBL_REPEAT_NEW_PASSWORD"/>
            </div>
            <div *ngIf="repeatPassword && pwdreperror" class="slds-form-element__help slds-text-color--error">{{pwdreperror}}</div>
        </div>
        <button class="slds-button slds-button--brand slds-button_stretch" [disabled]="!canSendToken || sending" (click)="resetPassword()"><system-label label="LBL_RESET_PASSWORD"/></button>
    </form>
</div>
