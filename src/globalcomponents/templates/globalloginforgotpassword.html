<div id="login-forgot-password" >

    <div class="slds-form-element slds-m-vertical--small" [ngClass]="{'slds-has-error': emailEmpty}" >
        <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon--left" *ngIf="showForgotPasswordEmail">
            <system-utility-icon [icon]="'email'" [addclasses]="'slds-input__icon slds-icon-text-default'"></system-utility-icon>
            <input type="email" [(ngModel)]="email" class="slds-input slds-p-horizontal--large slds-p-vertical--small" tabindex="3" placeholder="Email address of your user account"/>
        </div>
    </div>
    <div class="slds-button slds-button--brand" (click)="sendEmail()" *ngIf="showForgotPasswordEmail">Send</div>


    <div class="slds-form-element slds-m-vertical--small" [ngClass]="{'slds-has-error': (tokenEmpty || tokenInvalid)}" >
        <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon--left" *ngIf="showForgotPasswordToken">
            <system-utility-icon [icon]="'shield'" [addclasses]="'slds-input__icon slds-icon-text-default'"></system-utility-icon>
            <input type="text" [(ngModel)]="token" class="slds-input slds-p-horizontal--large slds-p-vertical--small" tabindex="4" placeholder="Token that was sent via email"/>
        </div>
    </div>
    <div class="slds-button slds-button--brand" (click)="sendToken()" *ngIf="showForgotPasswordToken">Confirm</div>

    <div class="spiceNewPasswordModal" *ngIf="promptNewPass">
        <div *ngIf="pwdGuideline" class="slds-m-vertical--medium">
            Password Guideline:<br>
            {{pwdGuideline}}
        </div>
        <div class="slds-form-element slds-m-vertical--small" [ngClass]="{'slds-has-error': passField.touched && passField.dirty && pwderror}">
            <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon--left">
                <system-utility-icon [icon]="'lock'" [addclasses]="'slds-input__icon slds-icon-text-default'"></system-utility-icon>
                <input #passField="ngModel" type="password" [(ngModel)]="password" class="slds-input slds-p-horizontal--large slds-p-vertical--small" tabindex="1" placeholder="enter new password"/>
            </div>
            <div *ngIf=" passField.touched && passField.dirty && pwderror" class="slds-form-element__help slds-text-color--error">{{pwderror}}</div>
        </div>
        <div class="slds-form-element  slds-m-vertical--small" [ngClass]="{'slds-has-error': repPassField.touched && repPassField.dirty && pwdreperror}">
            <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon--left">
                <system-utility-icon [icon]="'lock'" [addclasses]="'slds-input__icon slds-icon-text-default'"></system-utility-icon>
                <input type="password" #repPassField="ngModel" [(ngModel)]="repeatPassword" class="slds-input slds-p-horizontal--large slds-p-vertical--small" tabindex="2" placeholder="repeat new password"/>
            </div>
            <div *ngIf=" repPassField.touched && repPassField.dirty && pwdreperror" class="slds-form-element__help slds-text-color--error">{{pwdreperror}}</div>
        </div>
        <div class="slds-button slds-button--brand" (click)="sendNewPass()"  tabindex="3">Save</div>
    </div>

</div>
