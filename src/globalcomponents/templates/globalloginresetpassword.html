<div id="reset-password" >
    <div style="height: 640px;">
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" (click)="loginService.logout()">
                        <system-button-icon [icon]="'close'"></system-button-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">New password</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <div *ngIf="pwdGuideline" class="slds-m-vertical--medium">
                        Password Guideline:<br>
                        {{pwdGuideline}}
                    </div>
                    <div class="slds-form-element slds-m-vertical--small" [ngClass]="{'slds-has-error': passField.touched && passField.dirty && (pwderror || oldPwError)}">
                        <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon--left">
                            <system-utility-icon [icon]="'lock'" [addclasses]="'slds-input__icon slds-icon-text-default'"></system-utility-icon>
                            <input #passField="ngModel" type="password" [(ngModel)]="password" class="slds-input slds-p-horizontal--large slds-p-vertical--small" tabindex="1" placeholder="enter new password" autofocus />
                        </div>
                        <div *ngIf=" passField.touched && passField.dirty && pwderror" class="slds-form-element__help slds-text-color--error">{{pwderror}}</div>
                        <div *ngIf=" passField.touched && passField.dirty && oldPwError" class="slds-form-element__help slds-text-color--error">{{oldPwError}}</div>
                    </div>
                    <div class="slds-form-element  slds-m-vertical--small" [ngClass]="{'slds-has-error': repPassField.touched && repPassField.dirty && pwdreperror}">
                        <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon--left">
                            <system-utility-icon [icon]="'lock'" [addclasses]="'slds-input__icon slds-icon-text-default'"></system-utility-icon>
                            <input type="password" #repPassField="ngModel" [(ngModel)]="repeatPassword" class="slds-input slds-p-horizontal--large slds-p-vertical--small" tabindex="2" placeholder="repeat new password"/>
                        </div>
                        <div *ngIf=" repPassField.touched && repPassField.dirty && pwdreperror" class="slds-form-element__help slds-text-color--error">{{pwdreperror}}</div>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button--brand" (click)="sendNewPass()"  tabindex="3">Save</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </div>
</div>
