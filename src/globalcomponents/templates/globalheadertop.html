<div class="slds-global-header slds-grid slds-grid--align-spread">
    <div class="slds-global-header__item slds-large-size--1-of-3 slds-show--large">
        <img class="slds-show--large" style="max-height: 25px;" src="./config/headerimage" alt=""/>
    </div>
    <div class="slds-global-header__item slds-hide--medium">
        <global-navigation-compact></global-navigation-compact>
    </div>
    <div *ngIf="showSearch" class="slds-global-header__item slds-large-size--1-of-3">
        <global-header-search></global-header-search>
    </div>
    <div class="slds-global-header__item slds-large-size--1-of-3 slds-grid slds-grid--align-end slds-grid--vertical-align-center slds-show--medium">
        <global-header-tools></global-header-tools>
        <global-user></global-user>
    </div>
</div>
