<div class="slds-p-around--medium slds-theme--default slds-border--top">
    <div class="slds-grid">
        <div class="slds-col slds-has-flexi-truncate">
            <h1 class="slds-page-header__title slds-truncate">{{language.getModuleName(module)}}</h1>
        </div>
    </div>
    <div class="slds-grid">
        <div class="slds-col slds-align-bottom">
            <ul class="slds-list--horizontal slds-has-dividers--left">
                <li class="slds-item">{{getCount().hits}} {{language.getLabel('LBL_OF')}} {{getCount().total}} {{language.getLabel('LBL_ITEMS')}}</li>
            </ul>
        </div>
    </div>
</div>
<div>
    <table class="slds-table slds-table--bordered slds-table--fixed-layout" role="grid">
        <thead>
        <tr class="slds-text-title--caps">
            <th *ngFor="let item of listfields" scope="col">
                <div class="slds-truncate slds-p-around--x-small">{{language.getFieldDisplayName(module, item.field)}}</div>
            </th>
        </tr>
        </thead>
    </table>
    <div tobottom (scroll)="onScroll($event)">
        <table #tablecontent class="slds-table slds-table--bordered slds-table--fixed-layout" role="grid">
            <tbody>
                <tr global-search-module-item *ngFor="let item of getItems()" [module]="module" [listfields]="listfields" [listitem]="item"></tr>
            </tbody>
            <tbody system-table-stencils [columns]="listfields?.length" [select]="false" [tools]="false" [rows]="5" *ngIf="fts.runningmodulesearch"></tbody>
        </table>
    </div>
</div>
