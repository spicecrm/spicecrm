<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
    <div class="slds-modal__container">
        <header class="slds-modal__header slds-theme_shade">
            <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate"><system-label label="LBL_GDPR_DATA_AGREEMENT"></system-label></h2>
            <p class="slds-m-top_x-small"><system-label label="MSG_TO_CONTINUE_AGREE_TO_GDPR_CONSENT"></system-label>:</p>
        </header>
        <div class="slds-modal__content slds-p-around_medium slds-text-align--center" id="modal-content-id-1" [overlayLoadingSpinner]="!consentText" style="min-height:80px">
            <div *ngIf="consentText" [innerHTML]="sanitizer.bypassSecurityTrustHtml(consentText)"></div>
        </div>
        <footer class="slds-modal__footer">
            <button class="slds-button slds-button--brand" (click)="save()" [disabled]="isSaving || !consentText"><system-label label="LBL_I_AGREE"></system-label></button>
        </footer>
    </div>
</section>
<div class="slds-backdrop slds-backdrop_open"></div>
