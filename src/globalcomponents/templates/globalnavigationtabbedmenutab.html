<div class="slds-context-bar__item slds-no-hover">
    <a href="javascript:void(0);" class="slds-context-bar__label-action slds-scrollable--none" (click)="setActive()" (contextmenu)="openContextMenu($event, contextMenu);">
        <div class="slds-grid slds-grid--vertical-align-center">
            <ng-container *ngIf="tabname; else tabloading">
                <system-utility-icon *ngIf="tabicon" [icon]="tabicon" size="x-small" class="slds-p-right--x-small"></system-utility-icon>
                <system-icon *ngIf="tabmodule" [module]="tabmodule" size="x-small" divClass="slds-p-right--x-small"></system-icon>
                <div class="slds-truncate" style="white-space: nowrap; max-width: 200px;">
                    <span class="slds-indicator-container" *ngIf="isDirty">
                        <abbr class="slds-indicator_unsaved" title="Tab Not Saved" aria-label="Tab Not Saved">*</abbr>
                    </span>
                    <system-label [label]="tabname"></system-label>
                </div>
            </ng-container>
            <ng-template #tabloading>
                <system-spinner size="10" class="slds-p-right--x-small"></system-spinner>
                <div><system-label label="LBL_LOADING"></system-label></div>
            </ng-template>
        </div>
    </a>
    <div class="slds-context-bar__icon-action">
        <button class="slds-button slds-button_icon slds-button_icon-container slds-button_icon-x-small slds-m-around--none" (click)="pintab()" system-title="LBL_PIN_TAB">
            <system-button-icon [icon]="pinned ? 'pinned' : 'pin'"></system-button-icon>
        </button>
        <button class="slds-button slds-button_icon slds-button_icon-container slds-button_icon-x-small slds-m-around--none" aria-haspopup="true" (click)="closetab()" system-title="LBL_CLOSE_TAB">
            <system-button-icon icon="close"></system-button-icon>
        </button>
    </div>
    <div #contextMenu [class.slds-hide]="!showContextMenu" class="slds-popover slds-p-vertical--xx-small slds-nubbin--top-left slds-is-absolute" role="tooltip" style="top: 41px; left: 10px;">
        <ul class="slds-dropdown__list" role="menu">
            <li class="slds-dropdown__item" role="presentation">
                <a href="javascript:void(0);" role="menuitem" (click)="clonetab()">
                    <span class="slds-truncate" system-title="LBL_CLONE_TAB"><system-label label="LBL_CLONE_TAB"/></span>
                </a>
            </li>
            <li class="slds-dropdown__item" role="presentation">
                <a href="javascript:void(0);" role="menuitem" (click)="closetab()">
                    <span class="slds-truncate" system-title="LBL_CLOSE_TAB"><system-label label="LBL_CLOSE_TAB"/></span>
                </a>
            </li>
            <li *ngIf="!buttonCloseOtherTabsDisabled" class="slds-dropdown__item" role="presentation">
                <a href="javascript:void(0);" role="menuitem" (click)="closeOtherTabs()">
                    <span class="slds-truncate" system-title="LBL_CLOSE_OTHER_TABS"><system-label label="LBL_CLOSE_OTHER_TABS"/></span>
                </a>
            </li>
            <li *ngIf="!buttonCloseTabsToLeftDisabled" class="slds-dropdown__item" role="presentation">
                <a href="javascript:void(0);" role="menuitem" (click)="closeTabsLeft()">
                    <span class="slds-truncate" system-title="LBL_CLOSE_OTHER_TABS"><system-label label="LBL_CLOSE_TABS_TO_THE_LEFT"/></span>
                </a>
            </li>
            <li *ngIf="!buttonCloseTabsToRightDisabled" class="slds-dropdown__item" role="presentation">
                <a href="javascript:void(0);" role="menuitem" (click)="closeTabsRight()">
                    <span class="slds-truncate" system-title="LBL_CLOSE_TABS_TO_THE_RIGHT"><system-label label="LBL_CLOSE_TABS_TO_THE_RIGHT"/></span>
                </a>
            </li>
        </ul>
    </div>
</div>
