<div class="slds-lookup__menu" style="display:block">
    <ul class="slds-lookup__list" role="listbox">
        <li role="presentation" (click)="goRecent()">
           <span class="slds-lookup__item-action slds-media slds-media--center" role="option">
               <system-icon icon="breadcrumbs" size="small" sprite="utility"></system-icon>
               <div class="slds-media__body">
                    <div class="slds-lookup__result-text">{{language.getLabel('LBL_RECENTLYVIEWED')}}</div>
                    <!--span class="slds-lookup__result-meta slds-text-body--small">(total found {{recent.items.length}} items)</span-->
               </div>
           </span>
        </li>
        <li global-header-search-recent-item *ngFor="let item of recent.items.slice(0, 5)" [item]="item"></li>
    </ul>
</div>
