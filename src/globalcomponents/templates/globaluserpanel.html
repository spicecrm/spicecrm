<div class="userProfilePanel">
    <div class="slds-grid slds-p-around--small slds-grid--vertical-align-center">
        <global-user-panel-icon></global-user-panel-icon>
        <div class="slds-m-left--small">
            <h1 class="slds-text-heading--medium" [title]="userName">{{displayName}}</h1>
        </div>
    </div>
    <div class="slds-theme--shade slds-p-around--small slds-border--top slds-border--bottom">
        <ul class="slds-list--horizontal slds-has-dividers--left">
            <li class="slds-item"><a href="javascript:void(0);" class="slds-text-link--reset" (click)="goDetails()">{{language.getLabel('LBL_DETAILS')}}</a>
            </li>
            <li class="slds-item"><a href="javascript:void(0);" class="slds-text-link--reset" (click)="changePassword()">{{language.getLabel('LBL_CHANGE_PASSWORD')}}</a>
            </li>
        </ul>
    </div>
    <!--div class="OptionsSeparator">{{language.getLabel('LBL_OPTIONS')}}</div-->
    <div class="slds-p-around--small slds-form--stacked">
        <div class="slds-form-element">
            <label class="slds-form-element__label" for="{{compId}}-select-lang">{{language.getLabel('LBL_SELECT_LANGUAGE')}}</label>
            <div class="slds-form-element__control">
                <div class="slds-select_container">
                    <select [disabled]="getAvialableLanguages().length <= 1" class="slds-select" [(ngModel)]="currentlanguage" id="{{compId}}-select-lang">
                        <option *ngFor="let language of getAvialableLanguages()" [value]="language.language">
                            {{language.text}}
                        </option>
                    </select>
                </div>
            </div>
        </div>
        <div class="slds-p-top--x-small">
            <div class="slds-form-element">
                <label class="slds-form-element__label" for="{{compId}}-select-tz">{{language.getLabel('LBL_SELECT_TIMEZONE')}}</label>
                <system-input-timezone [(ngModel)]="currentTz" id="{{compId}}-select-tz"></system-input-timezone>
            </div>
        </div>
    </div>
    <div class="slds-theme--shade slds-p-around--x-small slds-grid">
        <div>
            {{language.getLabel('LBL_LOGGED_ON_SYSTEM')}}: {{config.data.display}}
        </div>
        <div class="slds-col--bump-left">
            <system-utility-icon icon="logout" size="x-small" [title]="language.getLabel('LBL_LOGOFF')" (click)="logoff()"></system-utility-icon>
        </div>
    </div>
</div>
